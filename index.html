ght","entryType":"","meaning":"명 가뭄","example":"Grain production has decreased because of drought.","translation":"가뭄 때문에 곡물 생산은 감소해 왔다.","sourcePage":200,"pdfPage":48},{"id":980,"source":"MAIN","day":"20","word":"nutritious","entryType":"","meaning":"형 영양가 있는, 영양분 많은 / 동 nourishing","example":"It is always important to choose enjoyable, nutritious food.","translation":"즐길 수 있고 영양가 있는 음식을 선택하는 것은 항상 중요하다.","sourcePage":200,"pdfPage":48},{"id":981,"source":"MAIN","day":"20","word":"nourish","entryType":"","meaning":"동 영양분을 공급하다, 기르다 / 동 feed, nurture","example":"Milk nourishes a baby.","translation":"우유는 아기에게 영양분을 공급한다.","sourcePage":200,"pdfPage":48},{"id":982,"source":"MAIN","day":"20","word":"nurture","entryType":"","meaning":"명 양육 / 동 기르다 / 동 raise, rear, feed, nourish","example":"The children were nurtured by loving parents.","translation":"그 아이들은 사랑 많은 부모에게 길러졌다.","sourcePage":201,"pdfPage":49},{"id":983,"source":"MAIN","day":"20","word":"foster","entryType":"","meaning":"동 ① 촉진하다, 육성하다 ② 맡아 기르다, 위탁 양육하다 / 동 encourage, promote, further, stimulate","example":"These activities are intended to foster children’s language skills.","translation":"이 활동들은 아이들의 언어 능력을 육성하기 위한 것이다.","sourcePage":201,"pdfPage":49},{"id":984,"source":"MAIN","day":"20","word":"promote","entryType":"","meaning":"동 ① 촉진하다, 장려하다 ② 승진시키다 ③ 홍보하다 / 동 raise, upgrade, elevate","example":"They are trying to promote a clash with other cultures.","translation":"그들은 다른 문화와의 충돌을 부추기려고 하고 있다.","sourcePage":201,"pdfPage":49},{"id":985,"source":"MAIN","day":"20","word":"expedite","entryType":"","meaning":"동 ① 촉진시키다 ② 신속히 처리하다 / 동 quicken, accelerate, spur, hasten, facilitate","example":"The government expedited the emergency relief plan.","translation":"정부는 긴급 구호 계획을 신속히 추진했다.","sourcePage":201,"pdfPage":49},{"id":986,"source":"MAIN","day":"20","word":"accelerate","entryType":"","meaning":"동 가속하다, 빨라지다 / 동 hasten, expedite, promote, further, facilitate","example":"Exposure to the sun can accelerate the aging process.","translation":"햇빛에 노출되면 노화 과정이 가속될 수 있다.","sourcePage":201,"pdfPage":49},{"id":987,"source":"MAIN","day":"20","word":"further","entryType":"","meaning":"부 ① 더 멀리 ② 더욱 / 형 더 먼 / 동 (일·계획을) 발전시키다","example":"They took measures to prevent further damage.","translation":"그들은 더 이상의 피해를 막기 위해 조치를 취했다.","sourcePage":201,"pdfPage":49},{"id":988,"source":"MAIN","day":"20","word":"remote","entryType":"","meaning":"형 ① 먼, 멀리 떨어진, 외딴 ② (가능성이) 희박한 ③ 원격 조정의","example":"Due to the remote location, we had limited cell phone reception.","translation":"외진 곳이라서 우리는 휴대전화 수신이 제한되어 있었다.","sourcePage":202,"pdfPage":50},{"id":989,"source":"MAIN","day":"20","word":"blunder","entryType":"","meaning":"명 큰 실수 / 동 큰 실수를 하다 / 명 mistake, error, slip, lapse","example":"His master scolded him for his blunder.","translation":"그의 주인은 그의 큰 실수를 꾸짖었다.","sourcePage":202,"pdfPage":50},{"id":990,"source":"MAIN","day":"20","word":"lapse","entryType":"","meaning":"명 ① 실수, 잘못 ② (시간의) 경과 / 동 실수하다, 벗어나다","example":"Be careful not to make a lapse of the tongue.","translation":"말실수를 하지 않도록 조심하라.","sourcePage":202,"pdfPage":50},{"id":991,"source":"MAIN","day":"20","word":"subliminal","entryType":"","meaning":"형 잠재의식의 / 동 subconscious","example":"They should think about subliminal racism.","translation":"그들은 잠재의식 속에 있는 인종차별에 대해 생각해야 한다.","sourcePage":202,"pdfPage":50},{"id":992,"source":"MAIN","day":"20","word":"hypnosis","entryType":"","meaning":"명 최면","example":"Hypnosis helped me give up smoking.","translation":"최면술이 내가 담배를 끊는 것을 도와주었다.","sourcePage":202,"pdfPage":50},{"id":993,"source":"MAIN","day":"20","word":"hypothesis","entryType":"","meaning":"명 가설, 가정, 추측 / 동 theory, thesis, proposition, premise","example":"A hypothesis that survives through testing becomes a theory.","translation":"철저한 시험에서 살아남은 가설이 이론이 된다.","sourcePage":202,"pdfPage":50},{"id":994,"source":"MAIN","day":"20","word":"stingy","entryType":"","meaning":"형 인색한 / 동 mean, miserly","example":"The man was stingy with money.","translation":"그 남자는 돈에 인색했다.","sourcePage":202,"pdfPage":50},{"id":995,"source":"MAIN","day":"20","word":"miserly","entryType":"","meaning":"형 인색한 / cf. misery 고통, 비참","example":"He was a harsh, miserly man, and loved money.","translation":"그는 가혹하고 인색한 사람이었으며 돈을 사랑했다.","sourcePage":203,"pdfPage":51},{"id":996,"source":"MAIN","day":"20","word":"humane","entryType":"","meaning":"형 자비로운, 인도적인 / 동 generous, tolerant, benevolent","example":"It’s not humane to treat people like that.","translation":"그런 식으로 사람들을 대하는 것은 인도적이지 않다.","sourcePage":203,"pdfPage":51},{"id":997,"source":"MAIN","day":"20","word":"humanity","entryType":"","meaning":"명 ① 인류 ② 인간성 ③ 인류애","example":"They are trying to bring humanity to a nuclear war.","translation":"그들은 인류를 핵전쟁으로 끌어들이려고 하고 있다.","sourcePage":203,"pdfPage":51},{"id":998,"source":"MAIN","day":"20","word":"mercy","entryType":"","meaning":"명 자비 / 동 tolerance, generosity, humanity","example":"He begged the judge to show mercy.","translation":"그는 판사에게 자비를 베풀어 달라고 간청했다.","sourcePage":203,"pdfPage":51},{"id":999,"source":"MAIN","day":"20","word":"famine","entryType":"","meaning":"명 기근, 배고픔 / 동 shortage, poverty, starvation","example":"Each year famine kills millions of people in poor countries.","translation":"매년 가난한 나라에서는 수백만 명의 사람들이 기근으로 죽는다.","sourcePage":203,"pdfPage":51},{"id":1000,"source":"MAIN","day":"20","word":"starve","entryType":"","meaning":"동 굶주리다, 굶어 죽다","example":"I would rather starve than ask him a favor.","translation":"나는 그에게 부탁하느니 차라리 굶어 죽겠다.","sourcePage":203,"pdfPage":51},{"id":1001,"source":"MAIN","day":"21","word":"subsist","entryType":"","meaning":"동 근근이 살아가다, 존속되다","example":"They subsisted by begging.","translation":"그들은 구걸로 근근이 살아갔다.","sourcePage":204,"pdfPage":52},{"id":1002,"source":"MAIN","day":"21","word":"frugal","entryType":"","meaning":"형 검소한, 절약하는","example":"He is accustomed to a frugal lifestyle.","translation":"그는 검소한 생활 방식에 익숙하다.","sourcePage":204,"pdfPage":52},{"id":1003,"source":"MAIN","day":"21","word":"thrift","entryType":"","meaning":"명 검약, 검소","example":"He overcame his poverty through industry and thrift.","translation":"그는 근면과 검약으로 가난을 극복했다.","sourcePage":204,"pdfPage":52},{"id":1004,"source":"MAIN","day":"21","word":"curb","entryType":"","meaning":"동 억제[제한]하다 / 명 억제, 연석","example":"We put a curb on the spread of AIDS.","translation":"우리는 에이즈의 확산을 억제했다.","sourcePage":204,"pdfPage":52},{"id":1005,"source":"MAIN","day":"21","word":"forbear","entryType":"","meaning":"동 억제하다, 참다","example":"I could not forbear laughing.","translation":"나는 웃음을 참을 수 없었다.","sourcePage":205,"pdfPage":53},{"id":1006,"source":"MAIN","day":"21","word":"refrain","entryType":"","meaning":"동 삼가다, 자제하다 (from)","example":"You have to refrain from smoking.","translation":"담배를 피우는 것을 삼가야 한다.","sourcePage":205,"pdfPage":53},{"id":1007,"source":"MAIN","day":"21","word":"bewilder","entryType":"","meaning":"동 당황하게 하다, 어리둥절하게 만들다","example":"She was bewildered by their continual questions.","translation":"그녀는 계속되는 그들의 질문에 당황했다.","sourcePage":205,"pdfPage":53},{"id":1008,"source":"MAIN","day":"21","word":"baffle","entryType":"","meaning":"동 당황하게 하다","example":"I was baffled about my parents’ separation.","translation":"나는 부모님의 별거에 대해 당황했다.","sourcePage":205,"pdfPage":53},{"id":1009,"source":"MAIN","day":"21","word":"perplex","entryType":"","meaning":"동 당황하게 하다, 난처하게 하다","example":"His strange silence perplexes me.","translation":"그의 이상한 침묵은 나를 당황하게 한다.","sourcePage":205,"pdfPage":53},{"id":1010,"source":"MAIN","day":"21","word":"rotate","entryType":"","meaning":"동 ① 회전하다(시키다) ② 교대하다, 순환 근무하다","example":"Horses can rotate their ears up to 180 degrees.","translation":"말은 귀를 최대 180도까지 회전시킬 수 있다.","sourcePage":205,"pdfPage":53},{"id":1011,"source":"MAIN","day":"21","word":"roll","entryType":"","meaning":"동 ① 구르다, 굴리다 ② (둥글게) 말다 / 명 ① 구르기 ② 롤, 두루마리 ③ 명부","example":"Let’s roll the dice and see what happens.","translation":"주사위를 굴려서 어떻게 되는지 보자.","sourcePage":205,"pdfPage":53},{"id":1012,"source":"MAIN","day":"21","word":"bunch","entryType":"","meaning":"명 ① 다발, 묶음 ② 많음","example":"A bunch of people showed up for the surprise party.","translation":"많은 사람들이 깜짝 파티에 나타났다.","sourcePage":206,"pdfPage":54},{"id":1013,"source":"MAIN","day":"21","word":"bundle","entryType":"","meaning":"명 다발, 묶음, 꾸러미 / 동 묶다, 싸다","example":"This software update is available as a bundle.","translation":"이 소프트웨어 업데이트는 묶음으로 제공된다.","sourcePage":206,"pdfPage":54},{"id":1014,"source":"MAIN","day":"21","word":"compile","entryType":"","meaning":"동 모으다, 편집하다 / (자료를) 편집하다, 수집하다","example":"Her recipe compiles flavors from around the world.","translation":"그녀의 요리법은 전 세계의 맛을 모은다.","sourcePage":206,"pdfPage":54},{"id":1015,"source":"MAIN","day":"21","word":"assemble","entryType":"","meaning":"동 모으다, 모이다, 조립하다","example":"The researchers decided to assemble data.","translation":"연구자들은 데이터를 모으기로 결정했다.","sourcePage":206,"pdfPage":54},{"id":1016,"source":"MAIN","day":"21","word":"congregate","entryType":"","meaning":"동 모이다, 모으다","example":"Young people often congregate in the main square in the evenings.","translation":"젊은 사람들은 저녁이면 종종 중앙 광장에 모인다.","sourcePage":206,"pdfPage":54},{"id":1017,"source":"MAIN","day":"21","word":"aggregate","entryType":"","meaning":"동 ① 합계가 되다 ② 모이다, 모으다 / 명 합계, 총합 / 형 합계의, 집합적인","example":"The five companies made an aggregate profit of $10 million.","translation":"그 다섯 회사는 총 1천만 달러의 이익을 냈다.","sourcePage":206,"pdfPage":54},{"id":1018,"source":"MAIN","day":"21","word":"accumulate","entryType":"","meaning":"동 축적하다, 모으다","example":"By investing wisely she accumulated a fortune.","translation":"현명하게 투자하여 그녀는 재산을 축적했다.","sourcePage":207,"pdfPage":55},{"id":1019,"source":"MAIN","day":"21","word":"heir","entryType":"","meaning":"명 상속인, 후계자","example":"He is the heir to a large fortune.","translation":"그는 막대한 재산의 상속인이다.","sourcePage":207,"pdfPage":55},{"id":1020,"source":"MAIN","day":"21","word":"inherit","entryType":"","meaning":"동 상속받다, 물려받다","example":"He inherited a large fortune from his father.","translation":"그는 아버지로부터 막대한 재산을 물려받았다.","sourcePage":207,"pdfPage":55},{"id":1021,"source":"MAIN","day":"21","word":"heritage","entryType":"","meaning":"명 유산","example":"The historic building is as much part of our heritage as the paintings.","translation":"그 역사적인 건물은 그림들과 마찬가지로 우리 유산의 일부이다.","sourcePage":207,"pdfPage":55},{"id":1022,"source":"MAIN","day":"21","word":"heredity","entryType":"","meaning":"명 유전, 유전 형질","example":"Heredity is not a factor in causing the cancer.","translation":"유전은 암을 일으키는 요인이 아니다.","sourcePage":207,"pdfPage":55},{"id":1023,"source":"MAIN","day":"21","word":"inherent","entryType":"","meaning":"형 타고난, 내재된, 본질적인","example":"Stress is an inherent part of dieting.","translation":"스트레스는 다이어트의 본질적인 부분이다.","sourcePage":207,"pdfPage":55},{"id":1024,"source":"MAIN","day":"21","word":"intrinsic","entryType":"","meaning":"형 내재적인, 본질적인","example":"The intrinsic value of it is priceless.","translation":"그것의 내재적 가치는 값을 매길 수 없을 만큼 귀중하다.","sourcePage":207,"pdfPage":55},{"id":1025,"source":"MAIN","day":"21","word":"hardwired","entryType":"","meaning":"형 타고나는, 선천적인 / 하드웨어에 내장된","example":"This reflex seems hardwired, not learned.","translation":"이 반사는 학습된 것이 아니라 선천적인 것 같다.","sourcePage":208,"pdfPage":56},{"id":1026,"source":"MAIN","day":"21","word":"native","entryType":"","meaning":"형 ① 출생지의 ② 타고난 / 명 원주민, 현지인","example":"Her native language is Korean.","translation":"그녀의 모국어는 한국어이다.","sourcePage":208,"pdfPage":56},{"id":1027,"source":"MAIN","day":"21","word":"innate","entryType":"","meaning":"형 ① 타고난, 선천적인 ② 고유의","example":"A great writer has an innate gift.","translation":"위대한 작가는 타고난 재능을 가지고 있다.","sourcePage":208,"pdfPage":56},{"id":1028,"source":"MAIN","day":"21","word":"naive","entryType":"","meaning":"형 순진한, 소박한","example":"His approach to life is refreshingly naive.","translation":"삶에 대한 그의 접근법은 신선할 정도로 순진하다.","sourcePage":208,"pdfPage":56},{"id":1029,"source":"MAIN","day":"21","word":"awful","entryType":"","meaning":"형 끔찍한, 지독한","example":"The weather this summer is very awful.","translation":"올여름 날씨는 정말 끔찍하다.","sourcePage":208,"pdfPage":56},{"id":1030,"source":"MAIN","day":"21","word":"formidable","entryType":"","meaning":"형 어마어마한, 가공할","example":"Formidable power dwells in your soul.","translation":"어마어마한 힘이 당신의 영혼에 머물고 있다.","sourcePage":208,"pdfPage":56},{"id":1031,"source":"MAIN","day":"21","word":"fanatic","entryType":"","meaning":"명 광신자, 열광자","example":"The fanatic fans thronged toward him.","translation":"열광적인 팬들이 그에게 몰려들었다.","sourcePage":209,"pdfPage":57},{"id":1032,"source":"MAIN","day":"21","word":"enthusiasm","entryType":"","meaning":"명 열의, 열정","example":"I really admire your enthusiasm.","translation":"나는 당신의 열정을 정말 존경한다.","sourcePage":209,"pdfPage":57},{"id":1033,"source":"MAIN","day":"21","word":"despair","entryType":"","meaning":"명 절망, 실망 / 동 절망하다","example":"In isolation, hope disappears, and despair rules.","translation":"고립된 상태에서는 희망이 사라지고 절망이 지배한다.","sourcePage":209,"pdfPage":57},{"id":1034,"source":"MAIN","day":"21","word":"desperate","entryType":"","meaning":"형 ① 필사적인 ② 자포자기한, 절망적인","example":"It was a desperate attempt to preserve the peace.","translation":"그것은 평화를 지키기 위한 필사적인 시도였다.","sourcePage":209,"pdfPage":57},{"id":1035,"source":"MAIN","day":"21","word":"chill","entryType":"","meaning":"동 냉기, 한기를 느끼게 만들다 / 명 한기","example":"It chills my blood to think of it.","translation":"그것을 생각하면 오싹하다.","sourcePage":209,"pdfPage":57},{"id":1036,"source":"MAIN","day":"21","word":"frigid","entryType":"","meaning":"형 추운, 혹한의 / 냉담한","example":"The recent frigid weather will continue until next week.","translation":"최근의 혹한은 다음 주까지 계속될 것이다.","sourcePage":209,"pdfPage":57},{"id":1037,"source":"MAIN","day":"21","word":"frost","entryType":"","meaning":"명 서리, 추운 날씨","example":"I used to think that the North Pole was the seat of frost.","translation":"나는 북극이 서리의 근원지라고 생각하곤 했다.","sourcePage":209,"pdfPage":57},{"id":1038,"source":"MAIN","day":"21","word":"hazard","entryType":"","meaning":"명 위험, 위험 요소","example":"Learn the hazards of dust in the home for children.","translation":"집안의 먼지가 아이들에게 미치는 위험을 알아두어라.","sourcePage":210,"pdfPage":58},{"id":1039,"source":"MAIN","day":"21","word":"jeopardy","entryType":"","meaning":"명 위험, 위태로움","example":"The financial crisis will put the company’s future in jeopardy.","translation":"금융 위기는 그 회사의 미래를 위태롭게 할 것이다.","sourcePage":210,"pdfPage":58},{"id":1040,"source":"MAIN","day":"21","word":"peril","entryType":"","meaning":"명 위험","example":"We are in the gravest peril.","translation":"우리는 가장 심각한 위험에 처해 있다.","sourcePage":210,"pdfPage":58},{"id":1041,"source":"MAIN","day":"21","word":"poisonous","entryType":"","meaning":"형 유독한, 독이 있는","example":"Chocolate is poisonous to dogs.","translation":"초콜릿은 개에게 유독하다.","sourcePage":210,"pdfPage":58},{"id":1042,"source":"MAIN","day":"21","word":"toxic","entryType":"","meaning":"형 유독한, 독이 있는","example":"Too much toxic waste is being dumped at sea.","translation":"너무 많은 유독성 폐기물이 바다에 버려지고 있다.","sourcePage":210,"pdfPage":58},{"id":1043,"source":"MAIN","day":"21","word":"noxious","entryType":"","meaning":"형 유독한, 유해한","example":"Noxious gas was rising from the fire.","translation":"불에서 유독 가스가 올라오고 있었다.","sourcePage":210,"pdfPage":58},{"id":1044,"source":"MAIN","day":"21","word":"detrimental","entryType":"","meaning":"형 해로운","example":"The policy will be detrimental to the peace process.","translation":"그 정책은 평화 과정에 해로울 것이다.","sourcePage":210,"pdfPage":58},{"id":1045,"source":"MAIN","day":"21","word":"doom","entryType":"","meaning":"명 운명, 비운, 파멸 / 동 (불행한) 운명에 처하게 하다","example":"Indeed, print-oriented novelists seem doomed to disappear.","translation":"실제로 인쇄 매체 중심의 소설가들은 사라질 운명인 것 같다.","sourcePage":211,"pdfPage":59},{"id":1046,"source":"MAIN","day":"21","word":"destiny","entryType":"","meaning":"명 운명, 숙명","example":"Is it destiny that brings people together, or is it an accident?","translation":"사람들을 함께하게 하는 것은 운명인가, 아니면 우연인가?","sourcePage":211,"pdfPage":59},{"id":1047,"source":"MAIN","day":"21","word":"fate","entryType":"","meaning":"명 운명, 숙명","example":"The fate of the three men is unknown.","translation":"그 세 사람의 운명은 알려지지 않았다.","sourcePage":211,"pdfPage":59},{"id":1048,"source":"MAIN","day":"21","word":"fatal","entryType":"","meaning":"형 ① 치명적인 ② 운명의","example":"The drunk driver caused a fatal accident.","translation":"음주 운전자는 치명적인 사고를 일으켰다.","sourcePage":211,"pdfPage":59},{"id":1049,"source":"MAIN","day":"21","word":"lethal","entryType":"","meaning":"형 치명적인, 치사적인","example":"The disclosure will be lethal to his reputation.","translation":"그 폭로는 그의 명성에 치명적일 것이다.","sourcePage":211,"pdfPage":59},{"id":1050,"source":"MAIN","day":"21","word":"mortal","entryType":"","meaning":"형 죽을 운명의, 치명적인 / 명 인간","example":"We are all mortal.","translation":"우리는 모두 죽을 운명이다.","sourcePage":211,"pdfPage":59},{"id":1051,"source":"MAIN","day":"22","word":"tentative","entryType":"","meaning":"형 일시적인, 잠정적인","example":"I have made tentative plans to take a trip to Canada in July.","translation":"나는 7월에 캐나다 여행을 가려고 잠정적인 계획을 세워 놓았다.","sourcePage":212,"pdfPage":60},{"id":1052,"source":"MAIN","day":"22","word":"temporary","entryType":"","meaning":"형 일시적인, 임시의","example":"Jet lag is only temporary.","translation":"시차로 인한 피로는 일시적일 뿐이다.","sourcePage":212,"pdfPage":60},{"id":1053,"source":"MAIN","day":"22","word":"chronic","entryType":"","meaning":"형 만성적인, 장기간 지속되는","example":"The illness frequently coexists with other chronic diseases.","translation":"그 질병은 흔히 다른 만성 질환과 같이 나타난다.","sourcePage":212,"pdfPage":60},{"id":1054,"source":"MAIN","day":"22","word":"eternal","entryType":"","meaning":"형 영원한, 불변의","example":"The secret of eternal youth is arrested development.","translation":"영원한 젊음의 비결은 발달의 정지이다.","sourcePage":213,"pdfPage":61},{"id":1055,"source":"MAIN","day":"22","word":"longevity","entryType":"","meaning":"명 ① 장수, 오래 지속됨 ② 수명","example":"The town is one of the most famous longevity villages in the world.","translation":"그 마을은 세계적으로 가장 유명한 장수 마을 중 하나이다.","sourcePage":213,"pdfPage":61},{"id":1056,"source":"MAIN","day":"22","word":"euthanasia","entryType":"","meaning":"명 안락사","example":"Euthanasia is only legal in the state of Oregon.","translation":"안락사는 오리건 주에서만 합법이다.","sourcePage":213,"pdfPage":61},{"id":1057,"source":"MAIN","day":"22","word":"nasty","entryType":"","meaning":"형 ① 더러운, 역겨운 ② 심술궂은 ③ 음란한, 음흉한","example":"The weather turned into a nasty storm.","translation":"날씨는 곧은 폭풍으로 변했다.","sourcePage":213,"pdfPage":61},{"id":1058,"source":"MAIN","day":"22","word":"foul","entryType":"","meaning":"형 ① 더러운, 불쾌한 ② (스포츠) 반칙, 파울, 부당한 / 명 (스포츠) 반칙, 파울","example":"She couldn’t stand the foul language used.","translation":"그녀는 욕설을 참을 수 없었다.","sourcePage":213,"pdfPage":61},{"id":1059,"source":"MAIN","day":"22","word":"stink","entryType":"","meaning":"동 악취를 풍기다 / 명 악취","example":"This room stinks to high heaven.","translation":"이 방은 지독한 악취를 풍긴다.","sourcePage":213,"pdfPage":61},{"id":1060,"source":"MAIN","day":"22","word":"sewage","entryType":"","meaning":"명 하수, 오물","example":"The raw sewage flowed into the sea.","translation":"처리되지 않은 하수가 바다로 흘러들었다.","sourcePage":214,"pdfPage":62},{"id":1061,"source":"MAIN","day":"22","word":"garbage","entryType":"","meaning":"명 쓰레기","example":"I picked the can out of the garbage and looked at the label.","translation":"나는 쓰레기에서 캔을 꺼내 라벨을 보았다.","sourcePage":214,"pdfPage":62},{"id":1062,"source":"MAIN","day":"22","word":"landfill","entryType":"","meaning":"명 쓰레기 매립지","example":"Millions of plastic bags are sent to landfills every day.","translation":"수백만 개의 비닐봉지들이 매일 쓰레기 매립지로 보내진다.","sourcePage":214,"pdfPage":62},{"id":1063,"source":"MAIN","day":"22","word":"dump","entryType":"","meaning":"동 ① 털썩 내려놓다, 내버리다 ② 팔아 치우다, 폐매하다 / 명 쓰레기 더미, 폐기장","example":"Some people secretly dump waste into the sea.","translation":"어떤 사람들은 몰래 쓰레기를 바다에 내버린다.","sourcePage":214,"pdfPage":62},{"id":1064,"source":"MAIN","day":"22","word":"sake","entryType":"","meaning":"명 위함, 이익, 목적","example":"He’s going to live in the country for the sake of his health.","translation":"그는 건강을 위해 시골에서 살 것이다.","sourcePage":214,"pdfPage":62},{"id":1065,"source":"MAIN","day":"22","word":"forsake","entryType":"","meaning":"동 ① (친구 등을) 저버리다 ② (습관 등을) 그만두다","example":"He held her close and swore never to forsake her.","translation":"그는 그녀를 꼭 껴안고 절대로 그녀를 버리지 않겠다고 맹세했다.","sourcePage":214,"pdfPage":62},{"id":1066,"source":"MAIN","day":"22","word":"abandon","entryType":"","meaning":"동 ① 포기하다, 그만두다 ② (사람을) 버리다, 떠나다","example":"Don’t force me to abandon my plan.","translation":"제가 계획을 포기하도록 강요하지 마세요.","sourcePage":214,"pdfPage":62},{"id":1067,"source":"MAIN","day":"22","word":"desert","entryType":"","meaning":"명 사막, 황야 / 동 버리다","example":"They adapted well to their life in the desert.","translation":"그들은 사막에서의 생활에 잘 적응했다.","sourcePage":215,"pdfPage":63},{"id":1068,"source":"MAIN","day":"22","word":"squander","entryType":"","meaning":"동 낭비하다","example":"He has never squandered money on flashy cars.","translation":"그는 화려한 자동차에 돈을 낭비한 적이 없다.","sourcePage":215,"pdfPage":63},{"id":1069,"source":"MAIN","day":"22","word":"available","entryType":"","meaning":"형 이용할 수 있는, 구할 수 있는","example":"There aren’t enough resources available.","translation":"이용할 수 있는 자원이 충분하지 않다.","sourcePage":215,"pdfPage":63},{"id":1070,"source":"MAIN","day":"22","word":"usage","entryType":"","meaning":"명 사용, 사용법","example":"Water usage has increased steadily over the past 100 years.","translation":"물 사용은 지난 100년 동안 꾸준히 증가해 왔다.","sourcePage":215,"pdfPage":63},{"id":1071,"source":"MAIN","day":"22","word":"gaze","entryType":"","meaning":"동 지켜보다, 응시하다 / 명 응시, 주시","example":"We all gazed at each other in blank dismay.","translation":"우리는 모두 당황한 채 서로를 응시했다.","sourcePage":215,"pdfPage":63},{"id":1072,"source":"MAIN","day":"22","word":"glimpse","entryType":"","meaning":"명 ① 잠깐(언뜻) 봄, 일별 ② 짧은 경험 / 동 잠깐(언뜻) 보다","example":"I caught a glimpse of her.","translation":"나는 그녀를 얼핏 보았다.","sourcePage":215,"pdfPage":63},{"id":1073,"source":"MAIN","day":"22","word":"skim","entryType":"","meaning":"동 ① 훑어보다 ② 스치듯 지나가다 ③ (액체 위 기름을) 걷어내다","example":"I always skim the sports section of the newspaper.","translation":"나는 항상 신문의 스포츠면을 훑어본다.","sourcePage":215,"pdfPage":63},{"id":1074,"source":"MAIN","day":"22","word":"browse","entryType":"","meaning":"동 ① 대강 훑어보다, 구경하다 ② (짐승이) 풀을 뜯어 먹다","example":"He was browsing the displays.","translation":"그는 진열품을 둘러보고 있었다.","sourcePage":216,"pdfPage":64},{"id":1075,"source":"MAIN","day":"22","word":"prose","entryType":"","meaning":"명 ① 산문 ② 단조, 단조로운 글","example":"He is a writer of incomparable prose.","translation":"그는 누구와도 견줄 수 없는 산문 작가이다.","sourcePage":216,"pdfPage":64},{"id":1076,"source":"MAIN","day":"22","word":"encyclopedia","entryType":"","meaning":"명 백과사전","example":"Most children have an encyclopedia in their room.","translation":"대부분의 아이들은 방에 백과사전을 가지고 있다.","sourcePage":216,"pdfPage":64},{"id":1077,"source":"MAIN","day":"22","word":"signify","entryType":"","meaning":"동 ① 의미하다, 나타내다 ② 중요하다","example":"She nodded to signify that she agreed.","translation":"그녀는 동의한다는 뜻으로 고개를 끄덕였다.","sourcePage":216,"pdfPage":64},{"id":1078,"source":"MAIN","day":"22","word":"mean","entryType":"","meaning":"형 ① 중간의, 보통의 ② 심술궂은, 비열한 / 동 의미하다, 의도하다","example":"His classmates didn’t like him because he was mean.","translation":"그는 비열했기 때문에 반 친구들은 그를 좋아하지 않았다.","sourcePage":216,"pdfPage":64},{"id":1079,"source":"MAIN","day":"22","word":"represent","entryType":"","meaning":"동 ① 대표하다 ② 표현하다, 나타내다","example":"The dove represents peace.","translation":"비둘기는 평화를 나타낸다.","sourcePage":216,"pdfPage":64},{"id":1080,"source":"MAIN","day":"22","word":"peer","entryType":"","meaning":"명 ① 동료 ② (영국의) 귀족 / 동 자세히 눈여겨보다, 응시하다","example":"I have many peers to help me.","translation":"나는 나를 도와줄 많은 동료들이 있다.","sourcePage":216,"pdfPage":64},{"id":1081,"source":"MAIN","day":"22","word":"foe","entryType":"","meaning":"명 적, 원수","example":"We couldn’t tell whether he was a friend or foe.","translation":"우리는 그가 친구인지 적인지 알 수 없었다.","sourcePage":217,"pdfPage":65},{"id":1082,"source":"MAIN","day":"22","word":"opponent","entryType":"","meaning":"명 상대편, 적수, 반대자","example":"I overwhelmed my opponent in the first game.","translation":"나는 첫 경기에서 내 상대를 압도했다.","sourcePage":217,"pdfPage":65},{"id":1083,"source":"MAIN","day":"22","word":"object","entryType":"","meaning":"동 반대하다 / 명 ① 물체 ② 목표","example":"Many people object to animal testing.","translation":"많은 사람들이 동물 실험에 반대한다.","sourcePage":217,"pdfPage":65},{"id":1084,"source":"MAIN","day":"22","word":"spouse","entryType":"","meaning":"명 배우자","example":"I always tell my spouse without disguise when I have a problem.","translation":"나는 문제가 있으면 언제나 배우자에게 숨김없이 말한다.","sourcePage":217,"pdfPage":65},{"id":1085,"source":"MAIN","day":"22","word":"bride","entryType":"","meaning":"명 신부","example":"She had a bride’s flower in her hair.","translation":"그녀는 머리에 신부의 꽃을 꽂고 있었다.","sourcePage":217,"pdfPage":65},{"id":1086,"source":"MAIN","day":"22","word":"bribe","entryType":"","meaning":"명 뇌물 / 동 뇌물을 주다","example":"It is illegal to offer a bribe to a policeman.","translation":"경찰관에게 뇌물을 주는 것은 불법이다.","sourcePage":217,"pdfPage":65},{"id":1087,"source":"MAIN","day":"22","word":"forfeit","entryType":"","meaning":"동 몰수당하다, 잃다 / 명 벌금, 몰수품","example":"He has forfeited his right.","translation":"그는 자신의 권리를 잃었다.","sourcePage":217,"pdfPage":65},{"id":1088,"source":"MAIN","day":"22","word":"kidnap","entryType":"","meaning":"동 유괴하다, 납치하다","example":"They want to kidnap small children.","translation":"그들은 어린아이들을 납치하려고 한다.","sourcePage":218,"pdfPage":66},{"id":1089,"source":"MAIN","day":"22","word":"plight","entryType":"","meaning":"명 곤경, 곤란","example":"She was struck by the plight of the refugees.","translation":"그녀는 난민들의 곤경에 충격을 받았다.","sourcePage":218,"pdfPage":66},{"id":1090,"source":"MAIN","day":"22","word":"deadlock","entryType":"","meaning":"명 교착 상태, 막다른 골목","example":"The two nations’ relationship was at a deadlock.","translation":"두 국가의 관계는 교착 상태에 빠졌다.","sourcePage":218,"pdfPage":66},{"id":1091,"source":"MAIN","day":"22","word":"aftermath","entryType":"","meaning":"명 결과, 여파","example":"We needed a lot of rebuilding in the aftermath of the war.","translation":"우리는 전쟁의 여파로 많은 재건이 필요했다.","sourcePage":218,"pdfPage":66},{"id":1092,"source":"MAIN","day":"22","word":"condition","entryType":"","meaning":"명 ① 상태 ② 조건 ③ 상황, 환경 / 동 ① 길들이다, 훈련시키다 ② 결정하다, 좌우하다","example":"The athlete is in peak condition for the race.","translation":"그 선수는 경기에 출전할 수 있는 최상의 상태이다.","sourcePage":218,"pdfPage":66},{"id":1093,"source":"MAIN","day":"22","word":"bind","entryType":"","meaning":"동 묶다, 매다","example":"She bound the package.","translation":"그녀는 소포를 묶었다.","sourcePage":218,"pdfPage":66},{"id":1094,"source":"MAIN","day":"22","word":"splash","entryType":"","meaning":"동 (물·흙탕물을) 튀기다, 튀다","example":"Don’t splash water.","translation":"물을 튀기지 마라.","sourcePage":218,"pdfPage":66},{"id":1095,"source":"MAIN","day":"22","word":"shed","entryType":"","meaning":"동 ① (잎 등을) 떨어뜨리다 ② 흘리다, 쏟다 / 명 창고, 헛간","example":"The trees began to shed their leaves.","translation":"나무들이 잎을 떨어뜨리기 시작했다.","sourcePage":219,"pdfPage":67},{"id":1096,"source":"MAIN","day":"22","word":"spill","entryType":"","meaning":"동 흘리다, 엎지르다","example":"My son spilled ink on a desk.","translation":"내 아들이 책상에 잉크를 엎질렀다.","sourcePage":219,"pdfPage":67},{"id":1097,"source":"MAIN","day":"22","word":"leak","entryType":"","meaning":"동 ① 새어나오게 하다 ② (비밀 등이) 누설되다, 누출하다 / 명 ① 새는 곳 ② 누출, 누설","example":"The boat started to leak after hitting the rocks.","translation":"그 배는 바위에 부딪힌 후 물이 새기 시작했다.","sourcePage":219,"pdfPage":67},{"id":1098,"source":"MAIN","day":"22","word":"drain","entryType":"","meaning":"동 ① (물을) 빼내다, 배수하다 ② 비우다 ③ 고갈시키다","example":"Their fight drains national energy.","translation":"그들의 싸움은 국가의 에너지를 고갈시킨다.","sourcePage":219,"pdfPage":67},{"id":1099,"source":"MAIN","day":"22","word":"drown","entryType":"","meaning":"동 물에 빠지다, 익사하다(시키다)","example":"She thought someone must be in the car, getting drowned.","translation":"그녀는 누군가 차 안에서 익사할 위험에 처해 있음이 분명하다고 생각했다.","sourcePage":219,"pdfPage":67},{"id":1100,"source":"MAIN","day":"22","word":"tide","entryType":"","meaning":"명 ① 조수, 조류 ② 흐름 ③ 풍조, 경향","example":"Tides result from the pull of the moon’s and the sun’s gravity on the Earth.","translation":"조수는 지구에 미치는 달의 인력과 태양의 중력 때문에 일어난다.","sourcePage":219,"pdfPage":67},{"id":1101,"source":"MAIN","day":"23","word":"contend","entryType":"","meaning":"동 ① 다투다, 경쟁하다, 싸우다 ② 주장하다","example":"Nurses often have to contend with violent or drunken patients.","translation":"간호사들은 폭력적이거나 술에 취한 환자들과도 자주 싸워야 한다.","sourcePage":220,"pdfPage":68},{"id":1102,"source":"MAIN","day":"23","word":"compete","entryType":"","meaning":"동 경쟁하다, 겨루다","example":"Young children usually compete for their mother's attention.","translation":"어린아이들은 보통 엄마의 관심을 서로 받으려고 경쟁한다.","sourcePage":220,"pdfPage":68},{"id":1103,"source":"MAIN","day":"23","word":"competent","entryType":"","meaning":"형 유능한, 능력 있는","example":"[원본 예문 확인 필요]","translation":"[원본 예문 확인 필요]","sourcePage":220,"pdfPage":68},{"id":1104,"source":"MAIN","day":"23","word":"capable","entryType":"","meaning":"형 유능한, ~할 수 있는","example":"She proved herself to be a capable business person.","translation":"그녀는 자신이 유능한 사업가임을 입증했다.","sourcePage":221,"pdfPage":69},{"id":1105,"source":"MAIN","day":"23","word":"capacity","entryType":"","meaning":"명 ① 용량, 수용력 ② 능력","example":"She has the capacity to go all the way to the top.","translation":"그녀는 정상까지 쭉 올라갈 만한 능력이 있다.","sourcePage":221,"pdfPage":69},{"id":1106,"source":"MAIN","day":"23","word":"faculty","entryType":"","meaning":"명 ① 능력 ② 학부 ③ 교수단","example":"The humanity faculty offers a wide range of courses in literature, philosophy, and cultural studies.","translation":"인문학부는 문학, 철학, 그리고 문화 연구에서의 다양한 과정을 제공한다.","sourcePage":221,"pdfPage":69},{"id":1107,"source":"MAIN","day":"23","word":"emulate","entryType":"","meaning":"동 모방하다","example":"We need to emulate his passion for his education.","translation":"우리는 그의 교육에 대한 열정을 본받을 필요가 있다.","sourcePage":221,"pdfPage":69},{"id":1108,"source":"MAIN","day":"23","word":"imitate","entryType":"","meaning":"동 모방하다","example":"[원본 예문 확인 필요]","translation":"[원본 예문 확인 필요]","sourcePage":221,"pdfPage":69},{"id":1109,"source":"MAIN","day":"23","word":"mimic","entryType":"","meaning":"동 모방하다, 흉내 내다 / 형 가짜모조의 / 명 흉내쟁이","example":"She's always mimicking her friends.","translation":"그녀는 항상 친구들을 흉내 낸다.","sourcePage":222,"pdfPage":70},{"id":1110,"source":"MAIN","day":"23","word":"plagiarize","entryType":"","meaning":"동 표절하다","example":"It's illegal to plagiarize other people's work.","translation":"다른 사람들의 작품을 표절하는 것은 불법이다.","sourcePage":222,"pdfPage":70},{"id":1111,"source":"MAIN","day":"23","word":"pirate","entryType":"","meaning":"명 ① 해적 ② 불법 복제 / 동 ① 약탈하다 ② 표절하다, 불법 복제하다","example":"In the 19th century, pirates roamed the sea.","translation":"19세기에는 해적들이 바다를 배회했다.","sourcePage":222,"pdfPage":70},{"id":1112,"source":"MAIN","day":"23","word":"camouflage","entryType":"","meaning":"명 위장 / 동 위장하다, 감추다","example":"He was dressed in camouflage for hunting.","translation":"그는 사냥을 위해 위장복을 입고 있었다.","sourcePage":222,"pdfPage":70},{"id":1113,"source":"MAIN","day":"23","word":"fabricate","entryType":"","meaning":"동 ① 만들다 ② 조작하다, 위조하다","example":"The desk was fabricated from pieces of old wood.","translation":"그 책상은 오래된 목재로 만들어졌다.","sourcePage":222,"pdfPage":70},{"id":1114,"source":"MAIN","day":"23","word":"forge","entryType":"SINGLE","meaning":"동 ① 만들다, 구축하다 ② 위조하다","example":"They tried to forge the framework for the economy.","translation":"그들은 경제의 틀을 구축하려고 노력했다.","sourcePage":223,"pdfPage":71},{"id":1115,"source":"MAIN","day":"23","word":"falsify","entryType":"SINGLE","meaning":"동 ① 속이다, 위조하다 ② 틀렸음을 입증하다","example":"Documents were altered to falsify the evidence.","translation":"증거를 위조하기 위해 문서들이 변조됐다.","sourcePage":223,"pdfPage":71},{"id":1116,"source":"MAIN","day":"23","word":"artificial","entryType":"SINGLE","meaning":"형 ① 인공의, 인위적인 ② 거짓된, 꾸민","example":"The beverage contains no artificial preservatives.","translation":"그 음료에는 인공 방부제가 전혀 들어 있지 않다.","sourcePage":223,"pdfPage":71},{"id":1117,"source":"MAIN","day":"23","word":"fake","entryType":"SINGLE","meaning":"명 ① 위조품 ② 사기꾼 / 형 가짜의, 위조의 / 동 위조하다, 꾸며내다","example":"She judged the painting to be authentic, not a fake.","translation":"그녀는 그 그림이 위조품이 아니라 진품이라고 감정했다.","sourcePage":223,"pdfPage":71},{"id":1118,"source":"MAIN","day":"23","word":"fraud","entryType":"SINGLE","meaning":"명 사기(꾼)","example":"She played a fraud to sustain her family.","translation":"그녀는 가족을 부양하기 위해 사기를 쳤다.","sourcePage":223,"pdfPage":71},{"id":1119,"source":"MAIN","day":"23","word":"courteous","entryType":"SINGLE","meaning":"형 예의 바른, 공손한","example":"The hotel staff are friendly and courteous.","translation":"그 호텔 직원들은 친절하고 예의 바르다.","sourcePage":223,"pdfPage":71},{"id":1120,"source":"MAIN","day":"23","word":"decent","entryType":"SINGLE","meaning":"형 ① 예의 바른, 품위 있는 ② 제대로 된, 괜찮은","example":"It's not a great job, but the pay is decent.","translation":"대단한 직업은 아니지만, 보수는 괜찮다.","sourcePage":223,"pdfPage":71},{"id":1121,"source":"MAIN","day":"23","word":"tidy","entryType":"SINGLE","meaning":"형 단정한, 깔끔한","example":"His room is always clear and tidy.","translation":"그의 방은 언제나 깨끗하고 깔끔하다.","sourcePage":224,"pdfPage":72},{"id":1122,"source":"MAIN","day":"23","word":"pliable","entryType":"SINGLE","meaning":"형 ① 유연한 ② 순응적인","example":"It tends to make your mind extremely pliable.","translation":"그것은 당신의 마음을 매우 유연하게 만드는 경향이 있다.","sourcePage":224,"pdfPage":72},{"id":1123,"source":"MAIN","day":"23","word":"flexible","entryType":"SINGLE","meaning":"형 ① 탄력적인, 융통성 있는 ② 유연한, 구부리기 쉬운","example":"He isn't flexible in his thinking.","translation":"그는 사고가 유연하지 않다.","sourcePage":224,"pdfPage":72},{"id":1124,"source":"MAIN","day":"23","word":"elastic","entryType":"SINGLE","meaning":"형 탄력 있는, 유연한","example":"This headband is very elastic.","translation":"이 머리띠는 매우 탄력 있다.","sourcePage":224,"pdfPage":72},{"id":1125,"source":"MAIN","day":"23","word":"resilient","entryType":"SINGLE","meaning":"형 탄력성이 있는, 잘 회복하는","example":"Rubber is more resilient than wood.","translation":"고무는 나무보다 더 탄력성이 있다.","sourcePage":225,"pdfPage":73},{"id":1126,"source":"MAIN","day":"23","word":"restore","entryType":"SINGLE","meaning":"동 ① 회복시키다 ② 되찾다, 복원[복구]하다","example":"He is restored to health.","translation":"그는 건강을 회복했다.","sourcePage":225,"pdfPage":73},{"id":1127,"source":"MAIN","day":"23","word":"recover","entryType":"SINGLE","meaning":"동 ① 회복하다 ② 되찾다, 회수하다","example":"Fortunately, its bite is not poisonous and the victim will recover.","translation":"다행히 그것은 무는 것은 독성이 없어서 희생자는 회복할 것이다.","sourcePage":225,"pdfPage":73},{"id":1128,"source":"MAIN","day":"23","word":"foolproof","entryType":"SINGLE","meaning":"형 ① 실패할[잘못될] 염려가 없는 ② 누구나 다룰 수 있는, 아주 간단한","example":"This security measure is foolproof.","translation":"이 보안 조치는 잘못될 염려가 없다.","sourcePage":225,"pdfPage":73},{"id":1129,"source":"MAIN","day":"23","word":"mature","entryType":"SINGLE","meaning":"형 익은, 성숙한","example":"They go from helpless babies to mature adults.","translation":"그들은 무력한 아기에서 성숙한 어른이 된다.","sourcePage":225,"pdfPage":73},{"id":1130,"source":"MAIN","day":"23","word":"ripen","entryType":"SINGLE","meaning":"동 익다[익히다], 숙성하다[숙성시키다]","example":"Apples turn from green to red as they ripen.","translation":"사과는 익으면서 녹색에서 빨간색으로 변한다.","sourcePage":225,"pdfPage":73},{"id":1131,"source":"MAIN","day":"23","word":"clumsy","entryType":"SINGLE","meaning":"형 어색한, 서투른, 어설픈","example":"On land, penguins are very clumsy.","translation":"육지에서 펭귄들은 아주 서투르다.","sourcePage":226,"pdfPage":74},{"id":1132,"source":"MAIN","day":"23","word":"awkward","entryType":"SINGLE","meaning":"형 어색한, 서투른, 불편한","example":"I felt awkward after tripping in public.","translation":"나는 공공장소에서 넘어진 후 어색함을 느꼈다.","sourcePage":226,"pdfPage":74},{"id":1133,"source":"MAIN","day":"23","word":"urgent","entryType":"SINGLE","meaning":"형 긴급한, 시급한","example":"The problem requires urgent attention.","translation":"그 문제는 시급한 관심을 요한다.","sourcePage":226,"pdfPage":74},{"id":1134,"source":"MAIN","day":"23","word":"pressing","entryType":"SINGLE","meaning":"형 긴급한, 절박한, 임박한","example":"There's a pressing need for blood donations.","translation":"헌혈이 절실히 필요하다.","sourcePage":226,"pdfPage":74},{"id":1135,"source":"MAIN","day":"23","word":"emergency","entryType":"SINGLE","meaning":"명 비상 (사태) / 형 비상용의, 긴급한","example":"He opened the emergency exit.","translation":"그는 비상 탈출구를 열었다.","sourcePage":226,"pdfPage":74},{"id":1136,"source":"MAIN","day":"23","word":"imperative","entryType":"SINGLE","meaning":"형 ① 필수적인, 긴급한 ② 명령적인","example":"It is imperative that they finish by next week.","translation":"그들이 다음 주까지 일을 끝내는 것은 필수적이다.","sourcePage":227,"pdfPage":75},{"id":1137,"source":"MAIN","day":"23","word":"crucial","entryType":"SINGLE","meaning":"형 중요한, 결정적인","example":"Defense of the realm is crucial.","translation":"왕국을 지키는 것은 중요하다.","sourcePage":227,"pdfPage":75},{"id":1138,"source":"MAIN","day":"23","word":"decisive","entryType":"SINGLE","meaning":"형 결정적인, 확정적인","example":"It is time to be decisive about our plans.","translation":"우리 계획을 결정할 때이다.","sourcePage":227,"pdfPage":75},{"id":1139,"source":"MAIN","day":"23","word":"profitable","entryType":"SINGLE","meaning":"형 ① 수익성이 있는 ② 유익한","example":"The oil business is a profitable one.","translation":"석유 사업은 수익성이 있다.","sourcePage":227,"pdfPage":75},{"id":1140,"source":"MAIN","day":"23","word":"staple","entryType":"SINGLE","meaning":"형 주요한 / 명 주요 산물","example":"The staple food of Koreans is rice.","translation":"한국인의 주식은 쌀이다.","sourcePage":228,"pdfPage":76},{"id":1141,"source":"MAIN","day":"23","word":"capital","entryType":"SINGLE","meaning":"명 ① 수도 ② 대문자 ③ 자본 / 형 ① 주요한 ② 자본의","example":"You will discover new streets and different views of the capital.","translation":"당신은 수도의 새로운 거리와 다양한 모습을 발견할 것이다.","sourcePage":228,"pdfPage":76},{"id":1142,"source":"MAIN","day":"23","word":"prime","entryType":"SINGLE","meaning":"형 ① 주요한, 주된 ② 최고의 / 명 ① 전성기 ② 초기","example":"My prime concern is to protect my property.","translation":"나의 주된 관심사는 내 재산을 보호하는 것이다.","sourcePage":228,"pdfPage":76},{"id":1143,"source":"MAIN","day":"23","word":"primary","entryType":"SINGLE","meaning":"형 ① 주요한 ② 최초의, 초기의","example":"The disease is still in its primary stage.","translation":"그 병은 아직 초기 단계이다.","sourcePage":228,"pdfPage":76},{"id":1144,"source":"MAIN","day":"23","word":"principal","entryType":"SINGLE","meaning":"형 주요한, 주된, 제일의 / 명 우두머리, 교장","example":"The principal knows all the students by name.","translation":"교장 선생님은 모든 학생들을 이름까지 알고 있다.","sourcePage":228,"pdfPage":76},{"id":1145,"source":"MAIN","day":"23","word":"momentous","entryType":"SINGLE","meaning":"형 중대한, 중요한","example":"Our society faced momentous decisions.","translation":"우리 사회는 중대한 결정에 직면했다.","sourcePage":228,"pdfPage":76},{"id":1146,"source":"MAIN","day":"23","word":"milestone","entryType":"SINGLE","meaning":"명 ① 이정표 ② 획기적인[중요한] 사건, 중대 시점","example":"The candlelight protests were a milestone in history.","translation":"촛불 시위는 역사상 중요한 사건이었다.","sourcePage":229,"pdfPage":77},{"id":1147,"source":"MAIN","day":"23","word":"breakthrough","entryType":"SINGLE","meaning":"명 돌파구, 획기적 발전","example":"They made a major breakthrough in cloning research.","translation":"그들은 복제 연구에서 중대한 돌파구를 마련했다.","sourcePage":229,"pdfPage":77},{"id":1148,"source":"MAIN","day":"23","word":"ignore","entryType":"SINGLE","meaning":"동 무시하다","example":"Instead of saying 'Hello,' he just ignored me.","translation":"'안녕'이라고 말하는 대신 그는 그냥 나를 무시했다.","sourcePage":229,"pdfPage":77},{"id":1149,"source":"MAIN","day":"23","word":"neglect","entryType":"SINGLE","meaning":"동 ① 무시하다 ② 방치하다, 소홀히 하다","example":"Do not neglect others' good advice.","translation":"다른 사람들의 좋은 조언을 무시하지 마라.","sourcePage":229,"pdfPage":77},{"id":1150,"source":"MAIN","day":"23","word":"marginal","entryType":"SINGLE","meaning":"형 ① 가장자리의, 중요하지 않은 ② 한계의, 미미한","example":"His YouTube channel gives us only marginal information.","translation":"그의 유튜브 채널은 우리에게 중요하지 않은 정보만 준다.","sourcePage":229,"pdfPage":77},{"id":1151,"source":"MAIN","day":"24","word":"tedious","entryType":"","meaning":"형 지루한","example":"His speech was both long and tedious.","translation":"그의 연설은 길고 지루했다.","sourcePage":230,"pdfPage":1},{"id":1152,"source":"MAIN","day":"24","word":"monotonous","entryType":"","meaning":"형 단조로운, 지루한","example":"Aircraft passed overhead with monotonous regularity.","translation":"항공기들이 단조로운 정도로 정기적으로 머리 위를 지나갔다.","sourcePage":230,"pdfPage":1},{"id":1153,"source":"MAIN","day":"24","word":"temper","entryType":"","meaning":"명 ① (화내는) 성질(성미), 기질 ② 기분","example":"She has a calm temper.","translation":"그녀는 차분한 성질을 지녔다.","sourcePage":230,"pdfPage":1},{"id":1154,"source":"MAIN","day":"24","word":"temperament","entryType":"","meaning":"명 기질, 성격, 기분","example":"He has a very even temperament.","translation":"그는 매우 온화한 기질을 지녔다.","sourcePage":230,"pdfPage":1},{"id":1155,"source":"MAIN","day":"24","word":"soothe","entryType":"","meaning":"동 달래다, 진정시키다, 완화시키다","example":"I tried to soothe the crying child.","translation":"나는 우는 아이를 진정시키려고 애썼다.","sourcePage":231,"pdfPage":2},{"id":1156,"source":"MAIN","day":"24","word":"mitigate","entryType":"","meaning":"동 누그러뜨리다, 진정시키다","example":"Soil erosion can be mitigated by the planting of trees.","translation":"토양 침식은 나무를 심음으로써 완화될 수 있다.","sourcePage":231,"pdfPage":2},{"id":1157,"source":"MAIN","day":"24","word":"relieve","entryType":"","meaning":"동 ① 완화시키다, 덜다 ② 구원하다, 구조하다","example":"This medicine will help to relieve your back pain.","translation":"이 약은 요통을 완화시켜 줄 것이다.","sourcePage":231,"pdfPage":2},{"id":1158,"source":"MAIN","day":"24","word":"alleviate","entryType":"","meaning":"동 완화시키다, 덜다","example":"This will alleviate your pain.","translation":"이것이 당신의 고통을 덜어 줄 것이다.","sourcePage":231,"pdfPage":2},{"id":1159,"source":"MAIN","day":"24","word":"plague","entryType":"","meaning":"명 전염병, 역병 / 동 괴롭히다, 재앙을 내리다","example":"The sorcerer called down a plague on the village.","translation":"마법사는 그 마을에 전염병을 내리게 했다.","sourcePage":231,"pdfPage":2},{"id":1160,"source":"MAIN","day":"24","word":"epidemic","entryType":"","meaning":"명 전염병, 유행병 / 형 유행성의, 널리 퍼져 있는","example":"Doctors are trying to keep down the epidemic.","translation":"의사들이 전염병을 막아 보려고 애쓰고 있다.","sourcePage":232,"pdfPage":3},{"id":1161,"source":"MAIN","day":"24","word":"pandemic","entryType":"","meaning":"명 전 지구적인 유행병, 전 세계적인 유행병 / 형 전국적으로 유행하는","example":"In some parts of the world malaria is still a pandemic.","translation":"세계의 몇몇 지역에서는 말라리아가 아직도 전 지구적으로 유행하는 병이다.","sourcePage":232,"pdfPage":3},{"id":1162,"source":"MAIN","day":"24","word":"endemic","entryType":"","meaning":"형 풍토성의, 한 지방에만 나타나는, 고유의","example":"Malaria is endemic in many tropical countries.","translation":"말라리아는 많은 열대 국가들의 풍토병이다.","sourcePage":232,"pdfPage":3},{"id":1163,"source":"MAIN","day":"24","word":"rampant","entryType":"","meaning":"형 만연하는, 유행하는","example":"Starvation was rampant in the country.","translation":"그 나라에는 굶주림이 만연했다.","sourcePage":232,"pdfPage":3},{"id":1164,"source":"MAIN","day":"24","word":"ubiquitous","entryType":"","meaning":"형 어디에나 있는, 아주 흔한","example":"Sand is ubiquitous throughout the universe.","translation":"모래는 우주 어디에나 존재한다.","sourcePage":233,"pdfPage":4},{"id":1165,"source":"MAIN","day":"24","word":"pervasive","entryType":"","meaning":"형 만연한, 스며드는","example":"A sense of social change is pervasive in her novels.","translation":"그녀의 소설에는 사회 변화에 대한 의식이 스며들어 있다.","sourcePage":233,"pdfPage":4},{"id":1166,"source":"MAIN","day":"24","word":"prevail","entryType":"","meaning":"동 ① 만연하다 ② 우세하다, 이기다","example":"I am sure that it will prevail.","translation":"나는 그것이 널리 퍼질 것이라고 확신한다.","sourcePage":233,"pdfPage":4},{"id":1167,"source":"MAIN","day":"24","word":"operate","entryType":"","meaning":"동 ① 일하다, 작동하다 ② 수술하다 (on)","example":"This machine operates night and day.","translation":"이 기계는 밤낮으로 작동한다.","sourcePage":233,"pdfPage":4},{"id":1168,"source":"MAIN","day":"24","word":"launch","entryType":"","meaning":"동 ① 시작[착수]하다 ② 출시하다 ③ 발사하다","example":"A missile was launched from the submarine.","translation":"미사일이 잠수함에서 발사되었다.","sourcePage":233,"pdfPage":4},{"id":1169,"source":"MAIN","day":"24","word":"onset","entryType":"","meaning":"명 시작, 개시, 발단","example":"The college entrance exam in Korea reminds me of the onset of winter.","translation":"한국의 대학 입학시험은 나에게 겨울의 시작을 떠올리게 한다.","sourcePage":233,"pdfPage":4},{"id":1170,"source":"MAIN","day":"24","word":"outset","entryType":"","meaning":"명 시작, 최초, 발단","example":"Why didn’t you say so at the outset?","translation":"왜 시작할 때 그렇게 말하지 않았나요?","sourcePage":234,"pdfPage":5},{"id":1171,"source":"MAIN","day":"24","word":"setback","entryType":"","meaning":"명 ① 방해 ② 실패, 좌절 ③ 역경, 퇴보","example":"There was a temporary setback in the peace process.","translation":"평화 협상 과정에서 일시적인 차질이 있었다.","sourcePage":234,"pdfPage":5},{"id":1172,"source":"MAIN","day":"24","word":"drawback","entryType":"","meaning":"명 결점, 문제점","example":"The only drawback to the project is the cost.","translation":"그 계획의 유일한 문제점은 비용이다.","sourcePage":234,"pdfPage":5},{"id":1173,"source":"MAIN","day":"24","word":"barrier","entryType":"","meaning":"명 장벽, 장애물, 울타리","example":"The step toward the positive direction is to identify your barriers.","translation":"긍정적인 방향으로의 첫걸음은 당신의 장애물을 파악하는 것이다.","sourcePage":234,"pdfPage":5},{"id":1174,"source":"MAIN","day":"24","word":"obstacle","entryType":"","meaning":"명 장애물, 방해물","example":"His poor sight was an obstacle to success.","translation":"그의 나쁜 시력은 성공에 장애물이 되었다.","sourcePage":234,"pdfPage":5},{"id":1175,"source":"MAIN","day":"24","word":"categorize","entryType":"","meaning":"동 분류하다, 범주에 넣다","example":"Libraries categorize books by genre and author.","translation":"도서관은 장르와 저자별로 책을 분류한다.","sourcePage":235,"pdfPage":6},{"id":1176,"source":"MAIN","day":"24","word":"label","entryType":"","meaning":"명 상표, 표시 / 동 ① 라벨(꼬리표)을 붙이다 ② 분류하다, (-라고) 부르다 (as)","example":"Stick a label on the box for recycling.","translation":"재활용을 위해 상자에 라벨을 붙여라.","sourcePage":235,"pdfPage":6},{"id":1177,"source":"MAIN","day":"24","word":"screen","entryType":"","meaning":"명 ① 화면 ② 가리개, 칸막이 ③ 차단막 / 동 ① 가리다, 차단[보호]하다 ② 상영하다 ③ 가려내다, 심사하다","example":"Is there a screen on the porch to keep bugs out?","translation":"현관에 벌레가 들어오는 것을 막기 위한 차단막이 있나요?","sourcePage":235,"pdfPage":6},{"id":1178,"source":"MAIN","day":"24","word":"invoice","entryType":"","meaning":"명 송장, 청구서 / 동 송장[청구서]를 보내다","example":"We issued an invoice for the recent repairs.","translation":"저희가 최근 수리에 대한 청구서를 발행했어요.","sourcePage":235,"pdfPage":6},{"id":1179,"source":"MAIN","day":"24","word":"rate","entryType":"","meaning":"동 평가하다, 매기다 / 명 비율, 요금, 속도","example":"This movie is highly rated on Rotten Tomatoes.","translation":"이 영화는 Rotten Tomatoes에서 높은 평가를 받았다.","sourcePage":235,"pdfPage":6},{"id":1180,"source":"MAIN","day":"24","word":"deserve","entryType":"","meaning":"동 ~를 받을 만하다, ~할 가치가 있다","example":"They also deserve your respect.","translation":"그들도 당신의 존중을 받을 만하다.","sourcePage":236,"pdfPage":7},{"id":1181,"source":"MAIN","day":"24","word":"attribute","entryType":"","meaning":"동 ~의 탓으로 돌리다 / 명 속성, 자질","example":"Patience is an essential attribute for good teachers.","translation":"인내심은 훌륭한 교사의 필수적인 자질이다.","sourcePage":236,"pdfPage":7},{"id":1182,"source":"MAIN","day":"24","word":"contribute","entryType":"","meaning":"동 ① 기부하다 ② 공헌[기여]하다 (to)","example":"Immigrants have contributed to British culture in many ways.","translation":"이민자들은 영국 문화에 많은 방식으로 기여해 왔다.","sourcePage":236,"pdfPage":7},{"id":1183,"source":"MAIN","day":"24","word":"pardon","entryType":"","meaning":"동 용서하다 / 명 용서, 사면","example":"He asked pardon for having deceived her.","translation":"그는 그녀에게 그녀를 속인 것에 대해 용서를 구했다.","sourcePage":236,"pdfPage":7},{"id":1184,"source":"MAIN","day":"24","word":"condone","entryType":"","meaning":"동 용서하다, 묵인하다, 눈감아주다","example":"Citizens couldn't condone that the government policies were going wrong.","translation":"시민들은 정부 정책이 잘못되어 가는 것을 용납할 수 없었다.","sourcePage":237,"pdfPage":8},{"id":1185,"source":"MAIN","day":"24","word":"apology","entryType":"","meaning":"명 사과","example":"You must make an apology for that hurt.","translation":"당신은 그 상처에 대해 사과해야 한다.","sourcePage":237,"pdfPage":8},{"id":1186,"source":"MAIN","day":"24","word":"condense","entryType":"","meaning":"동 ① 농축[응축]시키다 ② 요약하다","example":"Condense the soup by boiling it for ten minutes.","translation":"수프를 10분 동안 끓여 농축시켜라.","sourcePage":237,"pdfPage":8},{"id":1187,"source":"MAIN","day":"24","word":"concentrate","entryType":"","meaning":"동 ① 집중하다, 전념하다 ② 농축시키다 / 명 농축물","example":"Try to concentrate when practicing.","translation":"연습할 때 집중하려고 노력해라.","sourcePage":237,"pdfPage":8},{"id":1188,"source":"MAIN","day":"24","word":"abbreviate","entryType":"","meaning":"동 ① 요약축약하다 ② 단축하다","example":"'United Nations' is generally abbreviated to 'UN.'","translation":"'United Nations'(국제 연합)는 보통 'UN'으로 축약된다.","sourcePage":237,"pdfPage":8},{"id":1189,"source":"MAIN","day":"24","word":"abridge","entryType":"SINGLE","meaning":"동 ① 요약(축약)하다 ② 단축하다","example":"She abridged a long story.","translation":"그녀는 긴 이야기를 요약했다.","sourcePage":238,"pdfPage":86},{"id":1190,"source":"MAIN","day":"24","word":"brevity","entryType":"","meaning":"명 간결함, 순간","example":"Brevity is the soul of writing.","translation":"글은 간결함이 생명이다.","sourcePage":238,"pdfPage":9},{"id":1191,"source":"MAIN","day":"24","word":"terse","entryType":"","meaning":"형 간결한","example":"Now he is seen as a terse, disciplined novelist.","translation":"이제 그는 간결하고 절제된 소설가로 여겨진다.","sourcePage":238,"pdfPage":9},{"id":1192,"source":"MAIN","day":"24","word":"prolong","entryType":"","meaning":"동 늘이다, 연장하다","example":"The operation could prolong his life.","translation":"그 수술은 그의 생명을 연장할 수 있었다.","sourcePage":238,"pdfPage":9},{"id":1193,"source":"MAIN","day":"24","word":"elongate","entryType":"","meaning":"동 늘이다, 연장하다","example":"This helps to elongate your eyelashes.","translation":"이것은 당신의 속눈썹을 늘리는 데 도움을 준다.","sourcePage":238,"pdfPage":9},{"id":1194,"source":"MAIN","day":"24","word":"dense","entryType":"","meaning":"형 ① 빽빽한, 밀집한 ② 짙은, 자욱한","example":"A dense fog is the sailor's greatest enemy.","translation":"짙은 안개는 선원의 최대의 적이다.","sourcePage":238,"pdfPage":9},{"id":1195,"source":"MAIN","day":"24","word":"compact","entryType":"","meaning":"형 ① 빽빽한, 조밀한 ② 소형의 / 동 압축하다","example":"This is the compact car that came out recently.","translation":"이것은 최근에 나온 소형차이다.","sourcePage":239,"pdfPage":10},{"id":1196,"source":"MAIN","day":"24","word":"congestion","entryType":"","meaning":"명 ① 혼잡 ② 인구과밀, 밀집","example":"Many people live in the suburbs because of traffic congestion and pollution.","translation":"많은 사람들이 교통 혼잡과 공해 때문에 교외에 살고 있다.","sourcePage":239,"pdfPage":10},{"id":1197,"source":"MAIN","day":"24","word":"populous","entryType":"","meaning":"형 인구가 조밀한, 인구가 많은","example":"New York City is a populous metropolis.","translation":"뉴욕시는 인구가 많은 대도시이다.","sourcePage":239,"pdfPage":10},{"id":1198,"source":"MAIN","day":"24","word":"populate","entryType":"","meaning":"동 ① (~에) 살다, 거주하다 ② 거주시키다","example":"The tribe began to populate the island in the 16th century.","translation":"그 부족은 16세기에 그 섬에 살기 시작했다.","sourcePage":239,"pdfPage":10},{"id":1199,"source":"MAIN","day":"24","word":"dwell","entryType":"","meaning":"동 살다, 거주하다","example":"Wolf spiders are a group of ground-dwelling hunting spiders.","translation":"늑대 거미는 땅 위에 살며 사냥하는 거미들 무리이다.","sourcePage":239,"pdfPage":10},{"id":1200,"source":"MAIN","day":"24","word":"abide","entryType":"","meaning":"동 ① 머무르다, 살다 (in) ② 지키다, 따르다 (by) ③ 참다","example":"We abide in a small town.","translation":"우리는 소도시에서 살고 있다.","sourcePage":239,"pdfPage":10},{"id":1201,"source":"MAIN","day":"25","word":"occupy","entryType":"","meaning":"동 차지하다, 점유하다, 점령하다","example":"The army occupied the country until the war ended.","translation":"전쟁이 끝날 때까지 군대가 그 나라를 점령했다.","sourcePage":240,"pdfPage":88},{"id":1202,"source":"MAIN","day":"25","word":"occupation","entryType":"","meaning":"명 ① 직업 ② 점유, 점령","example":"The enemy's occupation of the city lasted a year.","translation":"적군의 도시 점령은 1년 동안 계속되었다.","sourcePage":240,"pdfPage":88},{"id":1203,"source":"MAIN","day":"25","word":"professional","entryType":"","meaning":"형 직업의, 전문적인 / 명 전문가","example":"He went to a lawyer to get some professional advice.","translation":"그는 전문적인 조언을 얻기 위해 변호사에게 갔다.","sourcePage":240,"pdfPage":88},{"id":1204,"source":"MAIN","day":"25","word":"adept","entryType":"","meaning":"형 정통한, 능숙한 / 명 숙련자, 달인","example":"He is pretty adept at working with computers.","translation":"그는 컴퓨터를 다루는 데 꽤 능숙하다.","sourcePage":241,"pdfPage":89},{"id":1205,"source":"MAIN","day":"25","word":"expert","entryType":"","meaning":"명 전문가, 숙련가 / 형 전문가의, 숙련된","example":"Experts point out that this is a serious problem.","translation":"전문가들은 이것이 심각한 문제라고 지적한다.","sourcePage":241,"pdfPage":89},{"id":1206,"source":"MAIN","day":"25","word":"sage","entryType":"","meaning":"명 현자 / 형 현명한","example":"Many proverbs come from the sayings of sages.","translation":"많은 속담은 현자들의 말에서 유래되었다.","sourcePage":241,"pdfPage":89},{"id":1207,"source":"MAIN","day":"25","word":"realm","entryType":"","meaning":"명 ① 영역, 범위 ② 왕국","example":"He has devoted all his life to the realm of science.","translation":"그는 과학 영역에 그의 일생을 바쳤다.","sourcePage":241,"pdfPage":89},{"id":1208,"source":"MAIN","day":"25","word":"coverage","entryType":"","meaning":"명 ① 보도, 방송 ② 보험의 보상(금)","example":"That newspaper's coverage is quite objective.","translation":"그 신문의 보도는 꽤 객관적이다.","sourcePage":241,"pdfPage":89},{"id":1209,"source":"MAIN","day":"25","word":"plow","entryType":"","meaning":"동 (경기·토지를) 갈다, 경작하다 / 명 쟁기","example":"The field plows easily.","translation":"그 밭은 쉽게 갈린다.","sourcePage":241,"pdfPage":89},{"id":1210,"source":"MAIN","day":"25","word":"grind","entryType":"","meaning":"동 ① 갈다, 빻다 ② 문지르다","example":"I grind my teeth in bed.","translation":"나는 잠잘 때 이를 간다.","sourcePage":241,"pdfPage":89},{"id":1211,"source":"MAIN","day":"25","word":"reap","entryType":"","meaning":"동 거두다, 수확하다","example":"The farmer sowed seeds and reaped what he sowed.","translation":"농부는 씨를 뿌리고 뿌린 것을 거두었다.","sourcePage":242,"pdfPage":90},{"id":1212,"source":"MAIN","day":"25","word":"leap","entryType":"","meaning":"동 껑충 뛰다 / 명 도약","example":"She leaped for joy at the news.","translation":"그녀는 그 소식을 듣고 기뻐서 껑충 뛰었다.","sourcePage":242,"pdfPage":90},{"id":1213,"source":"MAIN","day":"25","word":"cultivate","entryType":"","meaning":"동 ① 경작하다, 재배하다 ② 기르다, 양성하다","example":"Cambodians mainly cultivate rice.","translation":"캄보디아인들은 주로 쌀을 재배한다.","sourcePage":242,"pdfPage":90},{"id":1214,"source":"MAIN","day":"25","word":"rear","entryType":"","meaning":"동 ① 기르다, 양육하다 ② 일으키다, 세우다 / 명 뒤, 후미","example":"Please move to the rear of the bus!","translation":"버스의 뒤쪽으로 가 주세요!","sourcePage":242,"pdfPage":90},{"id":1215,"source":"MAIN","day":"25","word":"domesticate","entryType":"","meaning":"동 ① 길들이거나 사육하다 ② 재배하다","example":"There's a need to domesticate grains.","translation":"곡물을 재배할 필요가 있다.","sourcePage":242,"pdfPage":90},{"id":1216,"source":"MAIN","day":"25","word":"tame","entryType":"","meaning":"형 ① 길들여진 ② 온순한 / 동 길들이다","example":"It tames a lion better than anything.","translation":"그것은 어떤 것보다도 사자를 더 잘 길들인다.","sourcePage":242,"pdfPage":90},{"id":1217,"source":"MAIN","day":"25","word":"anticipate","entryType":"","meaning":"동 예상하다, 기대하다","example":"They anticipate that there will be trouble next year.","translation":"그들은 내년에 문제가 생길 것으로 예상한다.","sourcePage":242,"pdfPage":90},{"id":1218,"source":"MAIN","day":"25","word":"imagine","entryType":"","meaning":"동 ① 상상하다, 그리다 ② 생각하다, 추측하다","example":"Can you imagine without fireflies lighting up a summer night?","translation":"반딧불이 없는 여름밤을 상상할 수 있나요?","sourcePage":243,"pdfPage":91},{"id":1219,"source":"MAIN","day":"25","word":"analyze","entryType":"","meaning":"동 분석하다, 분해하다","example":"Use your experience to analyze the situation.","translation":"상황을 분석하기 위해 당신의 경험을 이용하라.","sourcePage":243,"pdfPage":91},{"id":1220,"source":"MAIN","day":"25","word":"statistics","entryType":"","meaning":"명 ① 통계학(단수 취급) ② 통계 자료, 통계 수치(복수 취급)","example":"Statistics is the discipline of collecting and analyzing data.","translation":"통계학은 데이터를 수집하고 분석하는 학문이다.","sourcePage":243,"pdfPage":91},{"id":1221,"source":"MAIN","day":"25","word":"demographics","entryType":"","meaning":"명 인구 통계 (자료)","example":"Demographics include age, income, and location.","translation":"인구 통계에는 연령, 소득, 위치가 포함된다.","sourcePage":243,"pdfPage":91},{"id":1222,"source":"MAIN","day":"25","word":"diagram","entryType":"","meaning":"명 도표, 도형","example":"He illustrated his point by using a simple diagram.","translation":"그는 간단한 도표를 사용해 요점을 설명했다.","sourcePage":243,"pdfPage":91},{"id":1223,"source":"MAIN","day":"25","word":"explore","entryType":"","meaning":"동 ① 탐험하다 ② 탐구하다, 조사하다","example":"We've almost explored the whole world.","translation":"우리는 전 세계를 거의 다 탐험했다.","sourcePage":243,"pdfPage":91},{"id":1224,"source":"MAIN","day":"25","word":"quest","entryType":"","meaning":"동 찾다, 추구하다 / 명 탐색, 탐구","example":"He traveled in quest of gold.","translation":"그는 금을 찾아 떠돌아다녔다.","sourcePage":243,"pdfPage":91},{"id":1225,"source":"MAIN","day":"25","word":"empirical","entryType":"","meaning":"형 경험적인, 경험의","example":"There's no empirical evidence to support his view.","translation":"그의 견해를 뒷받침할 경험적 증거는 없다.","sourcePage":244,"pdfPage":92},{"id":1226,"source":"MAIN","day":"25","word":"experiment","entryType":"","meaning":"명 실험 / 동 실험하다","example":"His theory has been confirmed by an experiment.","translation":"그의 이론은 실험으로 확증되었다.","sourcePage":244,"pdfPage":92},{"id":1227,"source":"MAIN","day":"25","word":"laboratory","entryType":"","meaning":"명 실험실, 연구실 (= lab)","example":"To be a mathematician, you don't need an expensive laboratory.","translation":"수학자가 되기 위해서 비싼 연구실이 필요한 것은 아니다.","sourcePage":244,"pdfPage":92},{"id":1228,"source":"MAIN","day":"25","word":"principle","entryType":"","meaning":"명 원리, 원칙","example":"The shapes of Korean kites are based on scientific principles.","translation":"한국 연의 형태는 과학적인 원리에 기초를 두고 있다.","sourcePage":244,"pdfPage":92},{"id":1229,"source":"MAIN","day":"25","word":"priority","entryType":"","meaning":"명 우선 사항, 우선권","example":"Our first priority is to improve quality.","translation":"우리의 최우선 사항은 품질을 개선시키는 것이다.","sourcePage":244,"pdfPage":92},{"id":1230,"source":"MAIN","day":"25","word":"personnel","entryType":"","meaning":"명 ① 전 직원, 인원들 ② 인사과 / 형 직원의, 인사의","example":"You should keep in touch with the personnel department manager.","translation":"당신은 인사과장과 연락을 지속해야 한다.","sourcePage":244,"pdfPage":92},{"id":1231,"source":"MAIN","day":"25","word":"recruit","entryType":"","meaning":"동 모집하다, 채용하다 / 명 신병, 신입 사원","example":"His task is to recruit new members for the club.","translation":"그의 임무는 클럽의 신입 회원을 모집하는 일이다.","sourcePage":244,"pdfPage":92},{"id":1232,"source":"MAIN","day":"25","word":"employ","entryType":"","meaning":"동 ① 고용하다, 채택하다 ② 이용하다","example":"We employ an expert to advise on contracts.","translation":"우리는 계약에 대한 자문을 해 줄 전문가를 고용한다.","sourcePage":245,"pdfPage":93},{"id":1233,"source":"MAIN","day":"25","word":"budget","entryType":"","meaning":"명 예산","example":"The boss cut the budget of this year.","translation":"사장은 올해의 예산을 삭감했다.","sourcePage":245,"pdfPage":93},{"id":1234,"source":"MAIN","day":"25","word":"fund","entryType":"","meaning":"명 기금, 자금 / 동 ~에 자금을 제공하다","example":"You will have to use your emergency fund.","translation":"당신은 비상금을 사용해야 할 것이다.","sourcePage":245,"pdfPage":93},{"id":1235,"source":"MAIN","day":"25","word":"foundation","entryType":"","meaning":"명 설립, 기초","example":"Love is a relationship built on a firm foundation.","translation":"사랑이란 단단한 토대 위에 세워진 관계이다.","sourcePage":245,"pdfPage":93},{"id":1236,"source":"MAIN","day":"25","word":"headquarters","entryType":"","meaning":"명 본부, 본사","example":"Eighty percent of large corporations have their headquarters in Seoul.","translation":"대기업의 80%가 서울에 본사를 두고 있다.","sourcePage":245,"pdfPage":93},{"id":1237,"source":"MAIN","day":"25","word":"corporate","entryType":"","meaning":"형 ① 기업의, 법인의 ② 공동의","example":"Corporate profits are on the rise.","translation":"기업 이익이 상승세에 있다.","sourcePage":245,"pdfPage":93},{"id":1238,"source":"MAIN","day":"25","word":"incorporate","entryType":"","meaning":"동 ① 포함시키다 ② 합병하다, 통합시키다 ③ 법인을 설립하다","example":"They incorporated the proposals into the plan.","translation":"그들은 그 제안들을 계획에 포함시켰다.","sourcePage":245,"pdfPage":93},{"id":1239,"source":"MAIN","day":"25","word":"enterprise","entryType":"","meaning":"명 ① 기업, 회사 ② 중요한 사업, 기획, 계획","example":"The government provided funding to support innovative enterprises.","translation":"정부는 혁신적인 기업을 지원하기 위해 자금을 제공했다.","sourcePage":246,"pdfPage":94},{"id":1240,"source":"MAIN","day":"25","word":"entrepreneur","entryType":"","meaning":"명 [진취적] 기업가","example":"The talk will inspire future entrepreneurs.","translation":"이 강연은 미래의 기업가들에게 영감을 줄 것이다.","sourcePage":246,"pdfPage":94},{"id":1241,"source":"MAIN","day":"25","word":"entrepreneurship","entryType":"","meaning":"명 기업가 정신","example":"Entrepreneurship requires dedication and hard work.","translation":"기업가 정신에는 헌신과 노력이 필요하다.","sourcePage":246,"pdfPage":94},{"id":1242,"source":"MAIN","day":"25","word":"institution","entryType":"","meaning":"명 ① 기관, 협회 ② 제도, 관습 ③ 설립, 개시","example":"Online learning is changing how institutions educate.","translation":"온라인 학습은 기관들의 교육 방식을 바꾸고 있다.","sourcePage":246,"pdfPage":94},{"id":1243,"source":"MAIN","day":"25","word":"maintenance","entryType":"","meaning":"명 ① 유지, 지속 ② (유지) 보수, 정비","example":"Proper maintenance extends appliance lifespan.","translation":"적절한 유지 보수를 하면 기기의 수명이 연장된다.","sourcePage":246,"pdfPage":94},{"id":1244,"source":"MAIN","day":"25","word":"manage","entryType":"","meaning":"동 ① 경영하다, 관리하다 ② 간신히 해내다 (to)","example":"The organization manages two camps.","translation":"그 기관은 두 개의 캠프를 운영하고 있다.","sourcePage":246,"pdfPage":94},{"id":1245,"source":"MAIN","day":"25","word":"administer","entryType":"","meaning":"동 ① 관리하다, 운영하다 ② 집행하다, 시행하다","example":"Dokdo is administered by Ulleung Island.","translation":"독도는 울릉도에 의해 관리된다.","sourcePage":247,"pdfPage":95},{"id":1246,"source":"MAIN","day":"25","word":"superintend","entryType":"","meaning":"동 관리하다, 감독하다","example":"She appointed him to superintend the work.","translation":"그녀는 그를 그 일을 감독하도록 임명했다.","sourcePage":247,"pdfPage":95},{"id":1247,"source":"MAIN","day":"25","word":"mode","entryType":"","meaning":"명 방식, 방법, 형식, 수단","example":"There are many modes of transportation available.","translation":"이용할 수 있는 교통수단이 많다.","sourcePage":247,"pdfPage":95},{"id":1248,"source":"MAIN","day":"25","word":"modify","entryType":"","meaning":"동 바꾸다, 수정하다","example":"The team leader modified the details of his plan.","translation":"팀장은 그의 계획의 세부 내용을 수정했다.","sourcePage":247,"pdfPage":95},{"id":1249,"source":"MAIN","day":"25","word":"moderate","entryType":"","meaning":"형 ① 적당한 ② 중간의, 평균의 ③ 절제하는 / 동 완화시키다","example":"The hotel is moderate in its charges.","translation":"그 호텔은 요금이 적당하다.","sourcePage":247,"pdfPage":95},{"id":1250,"source":"MAIN","day":"25","word":"modest","entryType":"","meaning":"형 ① 겸손한 ② 보통의, 적당한","example":"Really great men are modest.","translation":"정말 위대한 사람들은 겸손하다.","sourcePage":247,"pdfPage":95},{"id":1251,"source":"MAIN","day":"26","word":"instantaneous","entryType":"","meaning":"형 즉각적인","example":"Death was almost instantaneous.","translation":"죽음은 거의 즉각적이었다.","sourcePage":248,"pdfPage":96},{"id":1252,"source":"MAIN","day":"26","word":"prompt","entryType":"","meaning":"형 즉각적인, 신속한 / 동 ① 유발하다 ② 자극하다, 부추기다","example":"Prompt action was required as the fire spread.","translation":"불길이 번지자 즉각적인 조치가 요구되었다.","sourcePage":248,"pdfPage":96},{"id":1253,"source":"MAIN","day":"26","word":"immediate","entryType":"","meaning":"형 즉각적인, 당면한","example":"The spoken word is immediate but lacks permanence.","translation":"말로 하는 것은 즉각적이지만 영속성이 없다.","sourcePage":248,"pdfPage":96},{"id":1254,"source":"MAIN","day":"26","word":"current","entryType":"SINGLE","meaning":"형 현재의 / 명 ① 흐름 ② 경향","example":"The current situation is not good.","translation":"현재 상황은 좋지 않다.","sourcePage":249,"pdfPage":97},{"id":1255,"source":"MAIN","day":"26","word":"contemporary","entryType":"SINGLE","meaning":"형 ① 동시대의 ② 현대의 / 명 동년배, 동시대인","example":"There was no contemporary account of the battle.","translation":"그 전투에 대한 동시대의 기록은 없었다.","sourcePage":249,"pdfPage":97},{"id":1256,"source":"MAIN","day":"26","word":"inclined","entryType":"","meaning":"형 ① ~하고 싶어 하는 ② 경향이 있는","example":"I was inclined to trust him.","translation":"나는 그를 믿고 싶었다.","sourcePage":249,"pdfPage":97},{"id":1257,"source":"MAIN","day":"26","word":"liable","entryType":"","meaning":"형 ① 책임이 있는 ② ~하기 쉬운, 경향이 있는 ③ ~할 것 같은","example":"We're all liable to make mistakes.","translation":"우리 모두는 실수를 하기 쉽다.","sourcePage":249,"pdfPage":97},{"id":1258,"source":"MAIN","day":"26","word":"prone","entryType":"","meaning":"형 ~하기 쉬운, 영향을 받기 쉬운, 경향이 있는","example":"We become prone to feelings of nostalgia.","translation":"우리는 향수의 감정을 느끼기 쉽다.","sourcePage":249,"pdfPage":97},{"id":1259,"source":"MAIN","day":"26","word":"mourn","entryType":"","meaning":"동 슬퍼하다, 애도하다","example":"She mourned over the death of her friend.","translation":"그녀는 친구의 죽음을 슬퍼했다.","sourcePage":249,"pdfPage":97},{"id":1260,"source":"MAIN","day":"26","word":"grieve","entryType":"","meaning":"동 슬퍼하다, 애도하다","example":"We need time to grieve whenever we are sad.","translation":"우리는 슬플 때마다 슬퍼할 시간이 필요하다.","sourcePage":249,"pdfPage":97},{"id":1261,"source":"MAIN","day":"26","word":"lament","entryType":"SINGLE","meaning":"동 한탄하다, 슬퍼하다, 애도하다","example":"The whole world lamented his death.","translation":"전 세계가 그의 죽음을 애도했다.","sourcePage":250,"pdfPage":98},{"id":1262,"source":"MAIN","day":"26","word":"condolence","entryType":"","meaning":"명 애도, 조의","example":"His friends condoled with him on his wife's death.","translation":"그의 친구들은 그의 아내의 죽음에 대해 그를 위로했다.","sourcePage":250,"pdfPage":98},{"id":1263,"source":"MAIN","day":"26","word":"wail","entryType":"","meaning":"동 울부짖다, 통곡하다","example":"The women wailed over the body.","translation":"그 여자들은 시신을 보고 통곡했다.","sourcePage":250,"pdfPage":98},{"id":1264,"source":"MAIN","day":"26","word":"sob","entryType":"","meaning":"동 흐느껴 울다, 흐느끼다","example":"The movie's ending left her sobbing.","translation":"그 영화의 결말은 그녀를 흐느끼게 했다.","sourcePage":250,"pdfPage":98},{"id":1265,"source":"MAIN","day":"26","word":"sorrow","entryType":"","meaning":"명 슬픔, 비탄 / 동 슬퍼하다","example":"Time heals all sorrows.","translation":"시간은 모든 슬픔을 치유한다.","sourcePage":250,"pdfPage":98},{"id":1266,"source":"MAIN","day":"26","word":"deplore","entryType":"","meaning":"동 ① 비탄하다, 개탄하다 ② 후회하다","example":"I deplore and condemn this killing.","translation":"나는 이번 살인을 비탄하고 규탄한다.","sourcePage":250,"pdfPage":98},{"id":1267,"source":"MAIN","day":"26","word":"implore","entryType":"","meaning":"동 간청하다","example":"I implored him not to go.","translation":"나는 그에게 가지 말라고 간청했다.","sourcePage":250,"pdfPage":98},{"id":1268,"source":"MAIN","day":"26","word":"entreat","entryType":"","meaning":"동 간청하다, 간절히 원하다","example":"She entreated us not to go.","translation":"그녀는 우리에게 가지 말라고 간청했다.","sourcePage":251,"pdfPage":99},{"id":1269,"source":"MAIN","day":"26","word":"yearn","entryType":"","meaning":"동 그리워하다, 갈망하다","example":"We yearn for beauty and truth in our lives.","translation":"우리는 우리 삶에서 아름다움과 진리를 갈망한다.","sourcePage":251,"pdfPage":99},{"id":1270,"source":"MAIN","day":"26","word":"fancy","entryType":"","meaning":"동 ① 상상하다 ② 원하다 / 명 ① 화려한 것 ② 공상, 상상 / 형 화려한, 사치스러운","example":"The child fancies a world where everyone speaks the same language.","translation":"그 아이는 모든 사람이 같은 언어를 사용하는 세상을 상상한다.","sourcePage":251,"pdfPage":99},{"id":1271,"source":"MAIN","day":"26","word":"greed","entryType":"","meaning":"명 탐욕","example":"There are no limits to my greed.","translation":"인간의 탐욕에는 한계가 없다.","sourcePage":251,"pdfPage":99},{"id":1272,"source":"MAIN","day":"26","word":"lust","entryType":"","meaning":"명 욕망, 갈망","example":"He has a real lust for life.","translation":"그는 삶에 대한 진정한 열망을 가지고 있다.","sourcePage":251,"pdfPage":99},{"id":1273,"source":"MAIN","day":"26","word":"petition","entryType":"","meaning":"명 탄원, 청원 / 동 탄원하다, 청원하다","example":"They turned in a petition with 70,000 signatures.","translation":"그들은 7만 명의 서명이 담긴 탄원서를 제출했다.","sourcePage":252,"pdfPage":100},{"id":1274,"source":"MAIN","day":"26","word":"entail","entryType":"","meaning":"동 ~를 수반하다, 필요로 하다","example":"The job entails lots of hard work.","translation":"그 직업은 많은 수고를 필요로 한다.","sourcePage":252,"pdfPage":100},{"id":1275,"source":"MAIN","day":"26","word":"require","entryType":"","meaning":"동 ① 요구하다, 요청하다 ② ~을 필요로 하다","example":"The job requires a lot of care and attention.","translation":"그 일은 많은 주의와 관심을 필요로 한다.","sourcePage":252,"pdfPage":100},{"id":1276,"source":"MAIN","day":"26","word":"demand","entryType":"","meaning":"동 요구하다 / 명 ① 요구 ② 수요","example":"High demand for this product led to a shortage.","translation":"이 제품에 대한 높은 수요로 공급 부족이 발생했다.","sourcePage":252,"pdfPage":100},{"id":1277,"source":"MAIN","day":"26","word":"oblige","entryType":"","meaning":"동 강요하다, 의무를 지우다","example":"They were obliged to sell their house in order to pay their debts.","translation":"그들은 빚을 갚기 위해 집을 팔도록 강요받았다.","sourcePage":252,"pdfPage":100},{"id":1278,"source":"MAIN","day":"26","word":"convince","entryType":"","meaning":"동 설득시키다, 확신시키다","example":"She failed to convince them.","translation":"그녀는 그들을 설득하는 데 실패했다.","sourcePage":253,"pdfPage":101},{"id":1279,"source":"MAIN","day":"26","word":"confident","entryType":"","meaning":"형 확신하는, 자신 있는","example":"I am confident that everything will come out right in time.","translation":"나는 모든 것이 때가 되면 잘될 것이라고 확신한다.","sourcePage":253,"pdfPage":101},{"id":1280,"source":"MAIN","day":"26","word":"profound","entryType":"","meaning":"형 깊은, 심오한","example":"His death had a profound effect on us all.","translation":"그의 죽음은 우리 모두에게 깊은 영향을 끼쳤다.","sourcePage":253,"pdfPage":101},{"id":1281,"source":"MAIN","day":"26","word":"peculiar","entryType":"","meaning":"형 ① 독특한 ② 이상한","example":"There is something peculiar about her.","translation":"그녀에게는 뭔가 이상한 점이 있다.","sourcePage":253,"pdfPage":101},{"id":1282,"source":"MAIN","day":"26","word":"bizarre","entryType":"","meaning":"형 기이한, 특이한","example":"Some are quite bizarre, but some are good choices.","translation":"일부는 매우 기이하지만, 일부는 좋은 선택이다.","sourcePage":253,"pdfPage":101},{"id":1283,"source":"MAIN","day":"26","word":"abnormal","entryType":"","meaning":"형 비정상적인, 이상한","example":"His abnormal behavior worried his family.","translation":"그의 비정상적인 행동은 가족을 걱정시켰다.","sourcePage":253,"pdfPage":101},{"id":1284,"source":"MAIN","day":"26","word":"eccentric","entryType":"","meaning":"형 괴짜의, 별난","example":"I know it's an eccentric town.","translation":"나는 그것이 별난 마을이라는 것을 알고 있다.","sourcePage":254,"pdfPage":102},{"id":1285,"source":"MAIN","day":"26","word":"odd","entryType":"","meaning":"형 ① 이상한, 특이한 ② 홀수의","example":"It's odd this fruit has no seeds.","translation":"이 과일에 씨가 없다는 것이 이상하다.","sourcePage":254,"pdfPage":102},{"id":1286,"source":"MAIN","day":"26","word":"riddle","entryType":"","meaning":"명 수수께끼","example":"The riddle of the Sphinx was at last revealed.","translation":"스핑크스의 수수께끼는 마침내 밝혀졌다.","sourcePage":254,"pdfPage":102},{"id":1287,"source":"MAIN","day":"26","word":"decipher","entryType":"","meaning":"동 해독하다, 풀다","example":"He deciphered the hidden suggestions in the lyrics.","translation":"그는 가사에 숨겨진 암시를 해독했다.","sourcePage":254,"pdfPage":102},{"id":1288,"source":"MAIN","day":"26","word":"literal","entryType":"","meaning":"형 ① 문자 그대로의 ② 문자의(상의)","example":"Take the literal meaning of the sentence, not the figurative one.","translation":"문장의 비유적 의미가 아닌 문자 그대로의 의미를 받아들여라.","sourcePage":254,"pdfPage":102},{"id":1289,"source":"MAIN","day":"26","word":"literate","entryType":"","meaning":"형 글을 읽고 쓸 줄 아는","example":"Most of the children in his class are literate.","translation":"그의 반 아이들의 대부분이 글을 읽고 쓸 수 있다.","sourcePage":254,"pdfPage":102},{"id":1290,"source":"MAIN","day":"26","word":"illegible","entryType":"","meaning":"형 읽기 어려운, 판독하기 어려운","example":"Her handwriting is illegible.","translation":"그녀의 글씨는 알아보기 어렵다.","sourcePage":254,"pdfPage":102},{"id":1291,"source":"MAIN","day":"26","word":"literal","entryType":"","meaning":"형 ① 문자 그대로의 ② 문자(상의)의","example":"Take the literal meaning of the sentence, not the figurative one.","translation":"문장의 비유적인 의미가 아닌 문자 그대로의 의미를 받아들여라.","sourcePage":255,"pdfPage":103},{"id":1292,"source":"MAIN","day":"26","word":"literate","entryType":"","meaning":"형 글을 읽고 쓸 줄 아는","example":"Most of the children in his class are literate.","translation":"그의 반 아이들의 대부분이 글을 읽고 쓸 수 있다.","sourcePage":255,"pdfPage":103},{"id":1293,"source":"MAIN","day":"26","word":"illegible","entryType":"","meaning":"형 읽기 어려운, 판독하기 어려운","example":"Her handwriting is illegible.","translation":"그녀의 글씨는 판독하기 어렵다.","sourcePage":255,"pdfPage":103},{"id":1294,"source":"MAIN","day":"26","word":"opposite","entryType":"","meaning":"형 ① 마주 보고 있는, 맞은편의 ② 정반대의 / 명 ① 정반대의 일, 사람, 말 ② 반대편","example":"The opposite of love is indifference.","translation":"사랑의 정반대는 무관심이다.","sourcePage":255,"pdfPage":103},{"id":1295,"source":"MAIN","day":"26","word":"friction","entryType":"","meaning":"명 ① 마찰 ② 갈등, 불화","example":"Heat is produced by friction.","translation":"열은 마찰에 의해 생긴다.","sourcePage":255,"pdfPage":103},{"id":1296,"source":"MAIN","day":"26","word":"conflict","entryType":"","meaning":"명 갈등, 충돌 / 동 상충하다, 충돌하다","example":"There was a constant conflict within the party.","translation":"당내에서 끊임없는 갈등이 있었다.","sourcePage":255,"pdfPage":103},{"id":1297,"source":"MAIN","day":"26","word":"bump","entryType":"","meaning":"동 충돌하다, 부딪히다 / 명 충돌","example":"The cat bumped the vase off the shelf.","translation":"고양이가 꽃병에 부딪쳐 선반에서 떨어지게 했다.","sourcePage":255,"pdfPage":103},{"id":1298,"source":"MAIN","day":"26","word":"percussion","entryType":"","meaning":"명 타악기 ② 충돌, 충격","example":"We used a lot of percussion.","translation":"우리는 많은 타악기를 사용했다.","sourcePage":255,"pdfPage":103},{"id":1299,"source":"MAIN","day":"26","word":"futile","entryType":"","meaning":"형 헛된, 소용없는","example":"Their efforts to revive her were futile.","translation":"그녀를 소생시키려는 그들의 노력은 소용이 없었다.","sourcePage":255,"pdfPage":103},{"id":1300,"source":"MAIN","day":"26","word":"outstretch","entryType":"","meaning":"동 뻗다, 펴다","example":"Outstretch your arms towards the wall.","translation":"벽 쪽으로 팔을 쭉 뻗으세요.","sourcePage":255,"pdfPage":103},{"id":1301,"source":"MAIN","day":"27","word":"feasible","entryType":"","meaning":"형 실행할 수 있는, 실행 가능한","example":"It's not feasible to manage the business that way.","translation":"그런 방식으로 사업을 운영하는 것은 실행 가능하지 않다.","sourcePage":256,"pdfPage":104},{"id":1302,"source":"MAIN","day":"27","word":"viable","entryType":"","meaning":"형 실행 가능한, 성공할 수 있는","example":"Such projects are not financially viable without government funding.","translation":"그러한 사업들은 정부 기금이 없으면 재정적으로 실행 가능하지 않다.","sourcePage":256,"pdfPage":104},{"id":1303,"source":"MAIN","day":"27","word":"practical","entryType":"","meaning":"형 ① 현실적인 ② 실용적인","example":"I doubt if such a thing is of any practical use.","translation":"나는 그런 것이 실용적일지 의심스럽다.","sourcePage":256,"pdfPage":104},{"id":1304,"source":"MAIN","day":"27","word":"rational","entryType":"","meaning":"형 합리적인, 이성적인","example":"I merely present rational arguments.","translation":"나는 단지 합리적인 주장을 제시한다.","sourcePage":257,"pdfPage":105},{"id":1305,"source":"MAIN","day":"27","word":"sensible","entryType":"","meaning":"형 분별 있는, 현명한","example":"It was sensible of him to accept that proposal.","translation":"그 제안을 받아들인 것은 그가 분별 있게 행동한 것이었다.","sourcePage":257,"pdfPage":105},{"id":1306,"source":"MAIN","day":"27","word":"sober","entryType":"","meaning":"형 ① 술에 취하지 않은 ② 냉정한, 진지한","example":"He has been sober for three years.","translation":"그는 3년 동안 술을 마시지 않았다.","sourcePage":257,"pdfPage":105},{"id":1307,"source":"MAIN","day":"27","word":"temperate","entryType":"","meaning":"형 ① 절제된, 차분한 ② (기후가) 온화한","example":"She preferred a man of temperate habits.","translation":"그녀는 절제된 생활 습관을 가진 남자를 선호했다.","sourcePage":257,"pdfPage":105},{"id":1308,"source":"MAIN","day":"27","word":"absurd","entryType":"","meaning":"형 어리석은, 터무니없는","example":"It is absurd to call him a fanatic.","translation":"그를 광신자라고 부르는 것은 터무니없다.","sourcePage":257,"pdfPage":105},{"id":1309,"source":"MAIN","day":"27","word":"insane","entryType":"","meaning":"형 미친, 제정신이 아닌","example":"All prisoners were slowly going insane.","translation":"모든 죄수들은 서서히 미쳐가고 있었다.","sourcePage":257,"pdfPage":105},{"id":1310,"source":"MAIN","day":"27","word":"vibrate","entryType":"","meaning":"동 진동하다, 떨리다","example":"The traffic is so heavy that the bridge on the highway seems to vibrate.","translation":"교통량이 너무 많아서 고속도로의 다리가 진동하는 것처럼 보인다.","sourcePage":257,"pdfPage":105},{"id":1311,"source":"MAIN","day":"27","word":"shiver","entryType":"","meaning":"동 떨다, 전율하다","example":"I shivered from the cold.","translation":"나는 추위에 몸을 떨었다.","sourcePage":258,"pdfPage":106},{"id":1312,"source":"MAIN","day":"27","word":"tremble","entryType":"","meaning":"동 떨다, 흔들리다","example":"His legs were trembling with fear.","translation":"그의 다리는 두려움 때문에 떨리고 있었다.","sourcePage":258,"pdfPage":106},{"id":1313,"source":"MAIN","day":"27","word":"reckon","entryType":"","meaning":"동 ① 생각하다, 간주하다 ② 세다, 계산하다 ③ 추정하다","example":"I reckon him as a wise man.","translation":"나는 그를 현명한 사람이라고 생각한다.","sourcePage":258,"pdfPage":106},{"id":1314,"source":"MAIN","day":"27","word":"suppose","entryType":"","meaning":"동 생각하다, 가정하다","example":"I suppose you are one of the best players in the world.","translation":"나는 당신이 세계 최고의 선수 중 한 명이라고 생각한다.","sourcePage":258,"pdfPage":106},{"id":1315,"source":"MAIN","day":"27","word":"speculate","entryType":"","meaning":"동 사색하다, 추측하다","example":"He always speculates about what might happen.","translation":"그는 항상 무슨 일이 일어날지 추측한다.","sourcePage":258,"pdfPage":106},{"id":1316,"source":"MAIN","day":"27","word":"exert","entryType":"","meaning":"동 ① 발휘하다, 행사하다 ② 노력하다 (oneself)","example":"Sally had to exert herself to study for her exam.","translation":"Sally는 시험공부를 하려고 노력해야만 했다.","sourcePage":258,"pdfPage":106},{"id":1317,"source":"MAIN","day":"27","word":"utilize","entryType":"","meaning":"동 이용하다, 활용하다","example":"It is better to utilize public transportation because there is no parking lot.","translation":"주차장이 없기 때문에 대중교통을 이용하는 것이 더 낫다.","sourcePage":259,"pdfPage":107},{"id":1318,"source":"MAIN","day":"27","word":"harness","entryType":"","meaning":"동 이용하다, 활용하다","example":"We must harness the skill and creativity of our workforce.","translation":"우리는 우리 인력의 기술과 창의성을 활용해야 한다.","sourcePage":259,"pdfPage":107},{"id":1319,"source":"MAIN","day":"27","word":"exploit","entryType":"","meaning":"동 ① 개발하다 ② 이용(활용)하다 ③ 착취하다","example":"We should exploit our own coal resources because the price of oil has surged.","translation":"석유 가격이 급등했기 때문에 우리는 우리 자신의 석탄 자원을 개발해야 한다.","sourcePage":259,"pdfPage":107},{"id":1320,"source":"MAIN","day":"27","word":"abuse","entryType":"","meaning":"동 ① (자원·권리 등을) 남용하다 ② (사람·동물을) 학대하다 ③ 남용, 오용하다","example":"People abuse the natural resources of the earth by wasting or polluting them.","translation":"사람들은 천연자원을 낭비하거나 오염시킴으로써 지구의 천연자원을 남용한다.","sourcePage":259,"pdfPage":107},{"id":1321,"source":"MAIN","day":"27","word":"yield","entryType":"","meaning":"동 ① 생산하다, 산출하다 ② 양보하다 ③ 항복하다 / 명 수확량, 산출량","example":"The tree yields plenty of fruit.","translation":"그 나무는 많은 열매를 생산한다.","sourcePage":259,"pdfPage":107},{"id":1322,"source":"MAIN","day":"27","word":"breed","entryType":"","meaning":"동 ① 낳다, 기르다 ② 사육하다, 번식시키다 / 명 품종, 종류","example":"He breeds race horses on his farm.","translation":"그는 자신의 농장에서 경주마를 사육한다.","sourcePage":259,"pdfPage":107},{"id":1323,"source":"MAIN","day":"27","word":"hatch","entryType":"","meaning":"동 부화하다, 알에서 나오다","example":"Don't count your chickens before they are hatched.","translation":"병아리가 부화하기 전에 세지 마라.","sourcePage":260,"pdfPage":108},{"id":1324,"source":"MAIN","day":"27","word":"salvage","entryType":"",
