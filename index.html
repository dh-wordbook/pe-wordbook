 약을 처방하였다.","sourcePage":373,"pdfPage":221},{"id":2022,"source":"MAIN","day":"41","word":"physiology","entryType":"","meaning":"명 ① 생리학 ② 생리 기능","example":"Physiology explains how organs and tissues work.","translation":"생리학은 장기와 조직이 어떻게 작용하는지 설명한다.","sourcePage":373,"pdfPage":221},{"id":2023,"source":"MAIN","day":"41","word":"anatomy","entryType":"","meaning":"명 해부(학)","example":"Anatomy is the study of the structure of the bodies of people or animals.","translation":"해부학이란 인간이나 동물의 신체 구조에 관한 학문이다.","sourcePage":373,"pdfPage":221},{"id":2024,"source":"MAIN","day":"41","word":"hygiene","entryType":"","meaning":"명 ① 위생 ② 위생학, 건강법","example":"They have no sense of hygiene.","translation":"그들은 위생 관념이 없다.","sourcePage":373,"pdfPage":221},{"id":2025,"source":"MAIN","day":"41","word":"sanitary","entryType":"","meaning":"형 위생의, 위생적인","example":"The house had no sanitary cooking facilities.","translation":"그 집에는 위생적인 조리 시설이 없었다.","sourcePage":374,"pdfPage":222},{"id":2026,"source":"MAIN","day":"41","word":"fetch","entryType":"","meaning":"동 데려오다, 가져오다","example":"Fetch a doctor at once.","translation":"당장 의사를 데려오세요.","sourcePage":374,"pdfPage":222},{"id":2027,"source":"MAIN","day":"41","word":"convey","entryType":"","meaning":"동 ① 나르다, 운반하다 ② 전하다, 전달하다","example":"Her words convey no meaning to me.","translation":"그녀의 말이 무슨 뜻인지 나는 전혀 모르겠다.","sourcePage":374,"pdfPage":222},{"id":2028,"source":"MAIN","day":"41","word":"halt","entryType":"","meaning":"동 ① 멈추다, 서다, 중단하다(시키다) / 명 정지, 중단","example":"The program was halted during the vacation.","translation":"그 프로그램은 휴가 동안 중단되었다.","sourcePage":374,"pdfPage":222},{"id":2029,"source":"MAIN","day":"41","word":"cease","entryType":"","meaning":"동 그만두다, 멈추다","example":"They voted to cease strike action immediately.","translation":"그들은 파업을 즉시 중단시키기 위해 투표를 했다.","sourcePage":374,"pdfPage":222},{"id":2030,"source":"MAIN","day":"41","word":"grasp","entryType":"","meaning":"동 ① 붙잡다, 움켜쥐다 ② 이해하다, 파악하다 / 명 ① 꽉 쥐기 ② 이해, 파악","example":"I failed to grasp the sense of his words.","translation":"나는 그의 말뜻을 이해하지 못했다.","sourcePage":374,"pdfPage":222},{"id":2031,"source":"MAIN","day":"41","word":"seize","entryType":"","meaning":"동 ① 붙잡다 ② 이해하다, 파악하다","example":"David seized her by the arm.","translation":"David는 그녀의 팔을 붙잡았다.","sourcePage":374,"pdfPage":222},{"id":2032,"source":"MAIN","day":"41","word":"siege","entryType":"","meaning":"명 포위 (공격) / 동 포위하다, 둘러싸다","example":"The rebels tried to siege the capital.","translation":"반군은 수도를 포위하려고 했다.","sourcePage":375,"pdfPage":223},{"id":2033,"source":"MAIN","day":"41","word":"apprehend","entryType":"","meaning":"동 ① 체포하다 ② 파악하다 ③ 걱정하다","example":"The police were able to apprehend the suspect after a brief chase.","translation":"경찰은 짧은 추격 끝에 용의자를 체포할 수 있었다.","sourcePage":375,"pdfPage":223},{"id":2034,"source":"MAIN","day":"41","word":"comprehend","entryType":"","meaning":"동 이해하다","example":"It is difficult to comprehend others’ minds.","translation":"다른 사람들의 마음을 이해하기란 어렵다.","sourcePage":375,"pdfPage":223},{"id":2035,"source":"MAIN","day":"41","word":"digest","entryType":"","meaning":"동 ① 소화하다 ② 이해하다 / 명 요약(문)","example":"Humans cannot digest plants such as grass.","translation":"인간은 잔디와 같은 식물을 소화할 수 없다.","sourcePage":375,"pdfPage":223},{"id":2036,"source":"MAIN","day":"41","word":"ingest","entryType":"","meaning":"동 삼키다, 섭취하다","example":"The doctor advised me to ingest vitamin C from fruits.","translation":"의사는 내게 과일에서 비타민C를 섭취하라고 조언했다.","sourcePage":375,"pdfPage":223},{"id":2037,"source":"MAIN","day":"41","word":"absorb","entryType":"","meaning":"동 ① 흡수하다 ② 열중케 하다","example":"Vitamin D helps human bodies to absorb calcium.","translation":"비타민 D는 인체가 칼슘을 흡수하도록 도와준다.","sourcePage":375,"pdfPage":223},{"id":2038,"source":"MAIN","day":"41","word":"immerse","entryType":"","meaning":"동 ① 몰두시키다 ② 담그다","example":"She immersed herself in her work.","translation":"그녀는 자신의 일에 몰두했다.","sourcePage":376,"pdfPage":224},{"id":2039,"source":"MAIN","day":"41","word":"surround","entryType":"","meaning":"동 둘러싸다, 에워싸다, 포위하다","example":"The village is surrounded by magnificent views.","translation":"그 마을은 훌륭한 경치로 둘러싸여 있다.","sourcePage":376,"pdfPage":224},{"id":2040,"source":"MAIN","day":"41","word":"circumscribe","entryType":"","meaning":"동 ① 경계를 정하다, -의 둘레에 선을 긋다 ② 제한하다","example":"A prisoner’s activities are circumscribed.","translation":"죄수의 활동은 제한되어 있다.","sourcePage":376,"pdfPage":224},{"id":2041,"source":"MAIN","day":"41","word":"regulate","entryType":"","meaning":"동 ① 규정하다, 규제(통제)하다 ② 조절조정하다","example":"Government often regulates industry.","translation":"정부는 종종 산업을 통제한다.","sourcePage":376,"pdfPage":224},{"id":2042,"source":"MAIN","day":"41","word":"regime","entryType":"","meaning":"명 ① 정권 ② 제도, 체제","example":"The military regime finally collapsed.","translation":"군사 정권이 마침내 붕괴했다.","sourcePage":376,"pdfPage":224},{"id":2043,"source":"MAIN","day":"41","word":"snatch","entryType":"","meaning":"동 잡아채다, 강탈하다 / 명 잡아챔, 강탈","example":"They snatched the lady’s handbag.","translation":"그들은 그 아가씨의 손가방을 낚아챘다.","sourcePage":376,"pdfPage":224},{"id":2044,"source":"MAIN","day":"41","word":"squeeze","entryType":"","meaning":"동 ① (액체·물을) 짜내다, 꽉 쥐다 ② 압박하다","example":"She squeezed the juice from an orange.","translation":"그녀는 오렌지에서 주스를 짰다.","sourcePage":377,"pdfPage":225},{"id":2045,"source":"MAIN","day":"41","word":"solid","entryType":"","meaning":"명 고체 / 형 ① 고체의 ② 단단한, 견고한","example":"When ice melts, it passes from a solid to a liquid state.","translation":"얼음이 녹으면 고체에서 액체 상태가 된다.","sourcePage":377,"pdfPage":225},{"id":2046,"source":"MAIN","day":"41","word":"consolidate","entryType":"","meaning":"동 ① 강화하다 ② 합병하다, 통합하다","example":"The two firms consolidated to form a single company.","translation":"두 회사가 합병하여 단일 회사를 설립했다.","sourcePage":377,"pdfPage":225},{"id":2047,"source":"MAIN","day":"41","word":"determine","entryType":"","meaning":"동 ① 결정하다, 결심하다 ② 알아내다, 밝히다","example":"They determined their future course.","translation":"그들은 장래의 진로를 결정했다.","sourcePage":377,"pdfPage":225},{"id":2048,"source":"MAIN","day":"41","word":"resolve","entryType":"","meaning":"동 ① 해결하다 ② 용해하다, 녹이다 ③ 결심하다 / 명 결심, 의지","example":"She tried to resolve a conflict between labor and management.","translation":"그녀는 노사 간의 갈등을 해결하려고 했다.","sourcePage":377,"pdfPage":225},{"id":2049,"source":"MAIN","day":"41","word":"dissolve","entryType":"","meaning":"동 ① 녹다(녹이다) ② (결혼·관계·회의 등을) 끝내다, 해산시키다","example":"Heat gently until the butter dissolves.","translation":"버터가 녹을 때까지 약하게 열을 가하라.","sourcePage":377,"pdfPage":225},{"id":2050,"source":"MAIN","day":"41","word":"soluble","entryType":"","meaning":"형 녹는, 가용성이","example":"Ammonia is soluble in water.","translation":"암모니아는 물에 녹는다.","sourcePage":377,"pdfPage":225},{"id":2051,"source":"MAIN","day":"42","word":"aboriginal","entryType":"","meaning":"형 토착의, 원주민의","example":"She is passionate about the aboriginal culture.","translation":"그녀는 원주민 문화에 대해 열정적이다.","sourcePage":378,"pdfPage":226},{"id":2052,"source":"MAIN","day":"42","word":"orient","entryType":"","meaning":"동 ① 지향하게 하다 ② 적응시키다, 지도하다","example":"My daughter had to orient herself in her new school.","translation":"내 딸은 새 학교에 적응해야 했다.","sourcePage":378,"pdfPage":226},{"id":2053,"source":"MAIN","day":"42","word":"primitive","entryType":"","meaning":"형 ① 원시의, 원시 시대의 ② 원시적인, 야만의","example":"His movies are creating our expectations of a primitive society.","translation":"그의 영화들은 원시사회에 대한 우리의 기대치를 만들어 내고 있다.","sourcePage":378,"pdfPage":226},{"id":2054,"source":"MAIN","day":"42","word":"immemorial","entryType":"","meaning":"형 먼 옛날의, 태곳적부터의","example":"It is an immemorial tradition.","translation":"그것은 태곳적부터의 전통이다.","sourcePage":379,"pdfPage":227},{"id":2055,"source":"MAIN","day":"42","word":"antique","entryType":"","meaning":"형 골동품의, 고대의 / 명 골동품","example":"Antique books often have very high value.","translation":"고서적들은 종종 매우 높은 가치를 갖고 있다.","sourcePage":379,"pdfPage":227},{"id":2056,"source":"MAIN","day":"42","word":"ancient","entryType":"","meaning":"형 고대의, 옛날의","example":"The town is famous for its ancient harbor.","translation":"그 마을은 고대 항구로 유명하다.","sourcePage":379,"pdfPage":227},{"id":2057,"source":"MAIN","day":"42","word":"ancestor","entryType":"","meaning":"명 조상, 선조","example":"These species have evolved from a single ancestor.","translation":"이 종들은 단일 조상으로부터 진화했다.","sourcePage":379,"pdfPage":227},{"id":2058,"source":"MAIN","day":"42","word":"medieval","entryType":"","meaning":"형 중세의, 중세풍의","example":"The city still carries the features of a busy medieval town.","translation":"그 도시는 여전히 분주한 중세 도시의 특징들을 지니고 있다.","sourcePage":379,"pdfPage":227},{"id":2059,"source":"MAIN","day":"42","word":"monument","entryType":"","meaning":"명 기념물, 기념비(탑)","example":"The sculptor engraved some inscriptions on the monument.","translation":"그 조각가는 기념비에 비문을 새겼다.","sourcePage":379,"pdfPage":227},{"id":2060,"source":"MAIN","day":"42","word":"recollect","entryType":"","meaning":"동 회상하다, 생각해 내다","example":"I don’t recollect what she said.","translation":"그녀가 뭐라고 했는지 기억이 안 난다.","sourcePage":379,"pdfPage":227},{"id":2061,"source":"MAIN","day":"42","word":"reminiscent","entryType":"","meaning":"형 ① 연상시키는, 생각나게 하는 (of) ② 추억에 잠긴, 옛날을 회상하는","example":"It was reminiscent of my childhood.","translation":"그것은 내 어린 시절을 생각나게 했다.","sourcePage":380,"pdfPage":228},{"id":2062,"source":"MAIN","day":"42","word":"souvenir","entryType":"","meaning":"명 기념품, 선물","example":"He does a lively trade in souvenirs and gifts.","translation":"그는 기념품과 선물용품 장사를 활발히 하고 있다.","sourcePage":380,"pdfPage":228},{"id":2063,"source":"MAIN","day":"42","word":"annual","entryType":"","meaning":"형 해마다의, 연간의","example":"My annual mileage is about 10,000 miles.","translation":"나의 연간 주행 거리는 1만 마일쯤 된다.","sourcePage":380,"pdfPage":228},{"id":2064,"source":"MAIN","day":"42","word":"biennial","entryType":"","meaning":"형 격년의, 2년마다의","example":"The film festival is biennial.","translation":"그 영화제는 2년에 한 번 열린다.","sourcePage":380,"pdfPage":228},{"id":2065,"source":"MAIN","day":"42","word":"decade","entryType":"","meaning":"명 10년","example":"There have been a lot of changes during the past two decades.","translation":"지난 20년 동안 많은 변화가 있었다.","sourcePage":380,"pdfPage":228},{"id":2066,"source":"MAIN","day":"42","word":"nowadays","entryType":"","meaning":"부 현재, 요즘","example":"Children have no respect for their elders nowadays.","translation":"요즘에는 아이들이 어른들에 대한 존경심이 없다.","sourcePage":380,"pdfPage":228},{"id":2067,"source":"MAIN","day":"42","word":"era","entryType":"","meaning":"명 연대, 시대","example":"The TV era gives an artificial pleasure to us.","translation":"TV 시대는 우리에게 인공적인 즐거움을 준다.","sourcePage":380,"pdfPage":228},{"id":2068,"source":"MAIN","day":"42","word":"epoch","entryType":"","meaning":"명 신기원, 시대","example":"Einstein’s theory marked a new epoch in physics.","translation":"아인슈타인의 이론은 물리학에 신기원을 열었다.","sourcePage":380,"pdfPage":228},{"id":2069,"source":"MAIN","day":"42","word":"chronicle","entryType":"","meaning":"명 연대기, 기록 / 동 연대순으로 기록하다","example":"The vast chronicle from the Napoleonic Era will be made into a movie.","translation":"나폴레옹 시대의 방대한 연대기가 영화로 만들어질 것이다.","sourcePage":381,"pdfPage":229},{"id":2070,"source":"MAIN","day":"42","word":"archive","entryType":"","meaning":"명 문서 보관소, 자료실","example":"The diplomatic document was kept in the archive.","translation":"그 외교 문서는 기록 보관소에 보관되었다.","sourcePage":381,"pdfPage":229},{"id":2071,"source":"MAIN","day":"42","word":"semester","entryType":"","meaning":"명 학기","example":"There’s only one semester left before graduation.","translation":"졸업이 한 학기밖에 남지 않았다.","sourcePage":381,"pdfPage":229},{"id":2072,"source":"MAIN","day":"42","word":"term","entryType":"","meaning":"명 ① 용어 ② 관점, 측면 ③ 학기 ④ 기간","example":"The article is full of technical terms.","translation":"그 기사는 전문 용어들로 가득 차 있다.","sourcePage":381,"pdfPage":229},{"id":2073,"source":"MAIN","day":"42","word":"session","entryType":"","meaning":"명 ① 시간, 기간 ② (의회 등의) 회기, 개회 기간 ③ (대학의) 학기","example":"After our session was over, he teased me.","translation":"우리 세션이 끝난 후 그는 나를 놀렸다.","sourcePage":381,"pdfPage":229},{"id":2074,"source":"MAIN","day":"42","word":"diploma","entryType":"","meaning":"명 ① 졸업장 ② 공문서","example":"A diploma is no guarantee of competence.","translation":"졸업장이 유능함의 보장은 아니다.","sourcePage":381,"pdfPage":229},{"id":2075,"source":"MAIN","day":"42","word":"bachelor","entryType":"","meaning":"명 ① 미혼 남성 ② 학사(학위)","example":"She wants to find a nice bachelor to marry.","translation":"그녀는 결혼할 멋진 미혼 남성을 찾길 원한다.","sourcePage":381,"pdfPage":229},{"id":2076,"source":"MAIN","day":"42","word":"forum","entryType":"","meaning":"명 포럼, 공개 토론장, 토론회","example":"The second day of the forum will focus on international policy.","translation":"그 공개 토론의 두 번째 날에는 국제 정책에 초점을 맞출 것이다.","sourcePage":382,"pdfPage":230},{"id":2077,"source":"MAIN","day":"42","word":"farewell","entryType":"","meaning":"명 작별 (인사) / 형 이별의, 작별의","example":"He left us without a single word of farewell.","translation":"그는 작별 인사 한마디 없이 우리를 떠났다.","sourcePage":382,"pdfPage":230},{"id":2078,"source":"MAIN","day":"42","word":"apply","entryType":"","meaning":"동 ① 적용하다 ② 지원하다, 신청하다 ③ (페인트-크림 등을) 바르다","example":"Let’s apply the principles we learned.","translation":"우리가 배운 원칙을 적용해 보자.","sourcePage":382,"pdfPage":230},{"id":2079,"source":"MAIN","day":"42","word":"volunteer","entryType":"","meaning":"동 지원하다, 자원하다 / 명 지원자, 자원봉사자","example":"Many people volunteer to teach the poor how to read and write.","translation":"많은 사람들이 가난한 사람들에게 읽고 쓰는 법을 가르치겠다고 자원한다.","sourcePage":382,"pdfPage":230},{"id":2080,"source":"MAIN","day":"42","word":"register","entryType":"","meaning":"동 등록하다, 기록하다 / 명 등록부, 기록부","example":"We learned how to create and register a new web page.","translation":"우리는 새로운 웹 페이지를 만들고 등록하는 법을 배웠다.","sourcePage":382,"pdfPage":230},{"id":2081,"source":"MAIN","day":"42","word":"enroll","entryType":"","meaning":"동 명부에 올리다, 등록하다","example":"She will enroll in this course.","translation":"그녀는 이 강좌에 등록할 것이다.","sourcePage":382,"pdfPage":230},{"id":2082,"source":"MAIN","day":"42","word":"attend","entryType":"","meaning":"동 ① 출석하다, 참석하다 ② 시중들다, 수행하다","example":"Hundreds of music lovers lined up to attend the outdoor concert.","translation":"야외 음악회에 참석하기 위해 수백 명의 음악 애호가들이 줄을 섰다.","sourcePage":383,"pdfPage":231},{"id":2083,"source":"MAIN","day":"42","word":"unattended","entryType":"","meaning":"형 관심을 기울이지 않은, 방치된","example":"Small children should never be left unattended.","translation":"어린아이들은 절대 방치되어서는 안 된다.","sourcePage":383,"pdfPage":231},{"id":2084,"source":"MAIN","day":"42","word":"range","entryType":"","meaning":"동 (범위가) 이르다(다양하다) (from A to B) / 명 범위, 영역","example":"The colors of the rainbow range from red to violet.","translation":"무지개의 색상은 빨간색부터 보라색까지 다양하다.","sourcePage":383,"pdfPage":231},{"id":2085,"source":"MAIN","day":"42","word":"frontier","entryType":"","meaning":"명 ① 국경 (지방) ② 미개척 분야","example":"Opportunities awaited those brave enough to cross the frontier.","translation":"국경을 넘을 만큼 용감한 사람들에게는 기회가 기다리고 있었다.","sourcePage":383,"pdfPage":231},{"id":2086,"source":"MAIN","day":"42","word":"displace","entryType":"","meaning":"동 ① 내쫓다, 옮기다 ② 대신(대체)하다","example":"Urban development can displace indigenous communities.","translation":"도시 개발은 원주민 공동체를 몰아낼 수 있다.","sourcePage":383,"pdfPage":231},{"id":2087,"source":"MAIN","day":"42","word":"diversity","entryType":"","meaning":"명 다양성","example":"America is a country with cultural diversity.","translation":"미국은 문화적 다양성을 가진 나라이다.","sourcePage":383,"pdfPage":231},{"id":2088,"source":"MAIN","day":"42","word":"discern","entryType":"","meaning":"동 ① 구별(분별)하다, 구분하다 ② 인식하다","example":"It is often difficult to discern how widespread public support is.","translation":"흔히 대중의 지지가 얼마나 폭넓은지를 파악하기는 어렵다.","sourcePage":384,"pdfPage":232},{"id":2089,"source":"MAIN","day":"42","word":"discriminate","entryType":"","meaning":"동 ① 구별하다 ② 차별하다","example":"Employers cannot discriminate on grounds of age.","translation":"고용주는 나이를 이유로 차별할 수 없다.","sourcePage":384,"pdfPage":232},{"id":2090,"source":"MAIN","day":"42","word":"discrete","entryType":"","meaning":"형 별개의, 분리된","example":"The organisms can be divided into discrete categories.","translation":"그 유기체들은 별개의 범주들로 나뉠 수 있다.","sourcePage":384,"pdfPage":232},{"id":2091,"source":"MAIN","day":"42","word":"separate","entryType":"","meaning":"형 분리된, 별개의 / 동 분리하다, 별거하다","example":"He is the person who separates the personal affairs from business.","translation":"그는 공과 사를 구분하는 사람이다.","sourcePage":384,"pdfPage":232},{"id":2092,"source":"MAIN","day":"42","word":"divorce","entryType":"","meaning":"동 ① 이혼하다 ② 분리하다 / 명 ① 이혼 ② 분리","example":"Many couples choose to divorce amicably.","translation":"많은 부부가 원만하게 이혼하는 것을 선택한다.","sourcePage":384,"pdfPage":232},{"id":2093,"source":"MAIN","day":"42","word":"appreciate","entryType":"","meaning":"동 ① 감사하다 ② 감상하다 ③ 이해하다","example":"I really appreciate your kindness.","translation":"당신의 친절에 정말 감사합니다.","sourcePage":384,"pdfPage":232},{"id":2094,"source":"MAIN","day":"42","word":"depreciate","entryType":"","meaning":"동 가치가 떨어지다, 가치를 떨어뜨리다","example":"If you neglect this property, it will depreciate.","translation":"이 부동산을 그냥 방치해 두면, 가치가 떨어질 것이다.","sourcePage":385,"pdfPage":233},{"id":2095,"source":"MAIN","day":"42","word":"appraise","entryType":"","meaning":"동 평가하다, 감정하다","example":"Managers must appraise all employees.","translation":"관리자들은 모든 직원을 평가해야 한다.","sourcePage":385,"pdfPage":233},{"id":2096,"source":"MAIN","day":"42","word":"value","entryType":"","meaning":"동 ① 평가하다 ② 소중하게 생각하다 / 명 ① 가치, 가격 ② 평가","example":"The value of information depends on speed.","translation":"정보의 가치는 속도에 달려 있다.","sourcePage":385,"pdfPage":233},{"id":2097,"source":"MAIN","day":"42","word":"evaluate","entryType":"","meaning":"동 평가하다, 감정하다","example":"You can evaluate the problem.","translation":"당신은 그 문제를 평가할 수 있다.","sourcePage":385,"pdfPage":233},{"id":2098,"source":"MAIN","day":"42","word":"overestimate","entryType":"","meaning":"동 과대평가하다","example":"People overestimate his ability to play soccer.","translation":"사람들은 그의 축구 실력을 과대평가한다.","sourcePage":385,"pdfPage":233},{"id":2099,"source":"MAIN","day":"42","word":"grave","entryType":"","meaning":"형 ① 무거운 ② 심각한 / 명 무덤","example":"They were in grave danger.","translation":"그들은 심각한 위험에 처해 있었다.","sourcePage":385,"pdfPage":233},{"id":2100,"source":"MAIN","day":"42","word":"gravity","entryType":"","meaning":"명 ① 중력 ② 진지함, 엄숙함","example":"Gravity is a natural phenomenon.","translation":"중력은 자연현상이다.","sourcePage":385,"pdfPage":233},{"id":2101,"source":"MAIN","day":"43","word":"public official","entryType":"MULTIWORD","meaning":"명 공무원","example":"Some public officials criticized the cuts to after-school programs.","translation":"일부 공무원들은 방과 후 프로그램 삭감을 비판했다.","sourcePage":388,"pdfPage":236},{"id":2102,"source":"MAIN","day":"43","word":"civil service","entryType":"MULTIWORD","meaning":"명 ① 공무, 행정 사무, 공무원 ② 공무원 제도","example":"Teachers are dedicated members of the vital civil service.","translation":"교사는 필수 공무의 헌신적인 구성원이다.","sourcePage":388,"pdfPage":236},{"id":2103,"source":"MAIN","day":"43","word":"workforce","entryType":"SINGLE","meaning":"명 ① 노동자, 직원 ② 노동 인구","example":"Hospitals struggle to maintain adequate staffing due to a decreasing healthcare workforce.","translation":"병원은 의료 인력 감소로 인해 적절한 인력을 유지하는 데 어려움을 겪고 있다.","sourcePage":388,"pdfPage":236},{"id":2104,"source":"MAIN","day":"43","word":"workload","entryType":"SINGLE","meaning":"명 업무량, 작업량","example":"The project deadlines created a heavy workload for the team.","translation":"프로젝트 마감 기한으로 인해 팀에 과중한 업무량이 발생했다.","sourcePage":389,"pdfPage":237},{"id":2105,"source":"MAIN","day":"43","word":"quota","entryType":"SINGLE","meaning":"명 몫, 할당량","example":"The sales team exceeded their monthly quota.","translation":"영업팀이 월별 할당량을 초과했다.","sourcePage":389,"pdfPage":237},{"id":2106,"source":"MAIN","day":"43","word":"paperwork","entryType":"SINGLE","meaning":"명 서류 (작업), 문서 업무","example":"Please submit the paperwork by Friday.","translation":"금요일까지 서류를 제출해 주세요.","sourcePage":389,"pdfPage":237},{"id":2107,"source":"MAIN","day":"43","word":"spreadsheet","entryType":"SINGLE","meaning":"명 스프레드시트, 데이터 문서","example":"Create a budget using a spreadsheet.","translation":"스프레드시트를 사용하여 예산을 짜세요.","sourcePage":389,"pdfPage":237},{"id":2108,"source":"MAIN","day":"43","word":"documentation","entryType":"SINGLE","meaning":"명 ① 서류 ② 기록, 문서화","example":"You will need proper documentation to prove your eligibility for benefits.","translation":"수혜 자격을 증명할 수 있는 적절한 서류가 필요해요.","sourcePage":389,"pdfPage":237},{"id":2109,"source":"MAIN","day":"43","word":"associated materials","entryType":"MULTIWORD","meaning":"관련 자료","example":"Download the permit application and associated materials from the government website.","translation":"정부 웹사이트에서 허가 신청서 및 관련 자료를 다운로드하세요.","sourcePage":389,"pdfPage":237},{"id":2110,"source":"MAIN","day":"43","word":"directory","entryType":"SINGLE","meaning":"명 ① (이름·주소 등의 관련 정보를 보통 알파벳순으로 나열한) 안내 책자 ② (컴퓨터의) 디렉터리","example":"The website has a searchable employee directory.","translation":"그 웹사이트에는 검색 가능한 직원 디렉터리가 있다.","sourcePage":389,"pdfPage":237},{"id":2111,"source":"MAIN","day":"43","word":"brainstorm","entryType":"SINGLE","meaning":"동 아이디어를 생각해 내다","example":"They brainstormed solutions to improve the work efficiency.","translation":"그들은 업무 효율을 개선할 해결책을 위한 아이디어를 생각해 냈다.","sourcePage":390,"pdfPage":238},{"id":2112,"source":"MAIN","day":"43","word":"authorize","entryType":"SINGLE","meaning":"동 승인하다, 권한을 주다","example":"The city council authorized funding for the new park project.","translation":"시 의회는 새로운 공원 프로젝트에 대한 자금 지원을 승인했다.","sourcePage":390,"pdfPage":238},{"id":2113,"source":"MAIN","day":"43","word":"confirmation","entryType":"SINGLE","meaning":"명 확인(서), 확증","example":"We are awaiting confirmation of your attendance at the upcoming meeting.","translation":"저희는 다가오는 회의에 귀하의 참석 확인을 기다리고 있습니다.","sourcePage":390,"pdfPage":238},{"id":2114,"source":"MAIN","day":"43","word":"revision","entryType":"SINGLE","meaning":"명 수정, 개정","example":"The building plans require revision to comply with new safety regulations.","translation":"새로운 안전 규정을 준수하기 위해 건물 계획을 수정해야 한다.","sourcePage":390,"pdfPage":238},{"id":2115,"source":"MAIN","day":"43","word":"agenda","entryType":"SINGLE","meaning":"명 의제, 안건","example":"Please review the agenda for tomorrow’s meeting beforehand.","translation":"내일 회의 안건을 미리 검토해 주세요.","sourcePage":390,"pdfPage":238},{"id":2116,"source":"MAIN","day":"43","word":"commence","entryType":"SINGLE","meaning":"동 시작되다, 시작하다","example":"The new construction project commences next quarter.","translation":"새 건설 프로젝트는 다음 분기에 시작된다.","sourcePage":390,"pdfPage":238},{"id":2117,"source":"MAIN","day":"43","word":"file","entryType":"SINGLE","meaning":"동 ① (서류·신청·고소 등을 정식으로) 제기하다, 제출하다 ② (서류를) 정리하다, 철하다 / 명 서류","example":"Please file your application by the deadline to participate in the program.","translation":"프로그램에 참여하려면 마감일까지 신청서를 제출하세요.","sourcePage":390,"pdfPage":238},{"id":2118,"source":"MAIN","day":"43","word":"offset","entryType":"SINGLE","meaning":"동 상쇄하다, 보충하다","example":"Increased efficiency helps offset employee shortages.","translation":"상승된 효율성은 직원 부족을 상쇄하는 데 도움이 된다.","sourcePage":391,"pdfPage":239},{"id":2119,"source":"MAIN","day":"43","word":"audit","entryType":"SINGLE","meaning":"명 회계 감사, 심사 / 동 (회계를) 감사하다","example":"An internal audit found small differences in accounts.","translation":"내부 감사 결과, 계정에서 사소한 불일치가 발견되었다.","sourcePage":391,"pdfPage":239},{"id":2120,"source":"MAIN","day":"43","word":"overview","entryType":"SINGLE","meaning":"명 개요, 개관","example":"The presentation provides an overview of the marketing plan.","translation":"그 프레젠테이션은 마케팅 계획에 대한 개요를 제공한다.","sourcePage":391,"pdfPage":239},{"id":2121,"source":"MAIN","day":"43","word":"introductory","entryType":"SINGLE","meaning":"형 ① 서두의, 입문의 ② 출시 기념의","example":"Download the introductory chapter for free.","translation":"서두의 챕터를 무료로 다운로드하세요.","sourcePage":391,"pdfPage":239},{"id":2122,"source":"MAIN","day":"43","word":"demanding","entryType":"SINGLE","meaning":"형 ① 힘든, 버거운 ② 요구가 많은","example":"The new role is demanding, requiring strong problem-solving skills.","translation":"새로운 역할은 강력한 문제 해결 능력을 필요로 하는 힘든 자리이다.","sourcePage":391,"pdfPage":239},{"id":2123,"source":"MAIN","day":"43","word":"optimal","entryType":"SINGLE","meaning":"형 최적의, 최선의","example":"Schedule meetings for optimal team participation.","translation":"최적의 팀 참여를 위한 회의 일정을 잡으세요.","sourcePage":391,"pdfPage":239},{"id":2124,"source":"MAIN","day":"43","word":"in-depth","entryType":"MULTIWORD","meaning":"형 심층적인, 깊이 있는","example":"We offer in-depth training on the new software.","translation":"저희는 새로운 소프트웨어에 대한 심층적인 교육을 제공합니다.","sourcePage":391,"pdfPage":239},{"id":2125,"source":"MAIN","day":"43","word":"periodically","entryType":"SINGLE","meaning":"부 정기적으로, 주기적으로","example":"Backups are performed periodically to avoid data loss.","translation":"데이터 손실을 방지하기 위해 백업이 주기적으로 수행된다.","sourcePage":392,"pdfPage":240},{"id":2126,"source":"MAIN","day":"43","word":"proofread","entryType":"SINGLE","meaning":"동 교정 보다","example":"It’s essential to proofread your work carefully.","translation":"당신의 글을 꼼꼼하게 교정 보는 것은 필수이다.","sourcePage":392,"pdfPage":240},{"id":2127,"source":"MAIN","day":"43","word":"have yet to RV","entryType":"MULTIWORD","meaning":"동 아직 -하지 않다, 아직 -하고 있지 않다","example":"The library has yet to announce the reopening date after renovations.","translation":"도서관은 보수 후 재개관 날짜를 아직 발표하지 않았다.","sourcePage":392,"pdfPage":240},{"id":2128,"source":"MAIN","day":"43","word":"inventory","entryType":"SINGLE","meaning":"명 재고 조사, 재고 / 동 재고를 조사하다","example":"They conduct a physical inventory count at the end of the month.","translation":"그들은 월말에 실제 재고 조사를 실시한다.","sourcePage":392,"pdfPage":240},{"id":2129,"source":"MAIN","day":"43","word":"representative","entryType":"SINGLE","meaning":"명 대표자, (정부의) 해외 대표, 법률상의 대표자 / 형 상징하는, 대표하는","example":"Residents meet with their local representatives to discuss traffic concerns.","translation":"주민들은 지역 대표와 만나 교통 문제를 논의한다.","sourcePage":392,"pdfPage":240},{"id":2130,"source":"MAIN","day":"43","word":"setup","entryType":"SINGLE","meaning":"명 구상, 장치, 설치 / (조직 등의) 기구, 구조, 조직","example":"The setup of the online meeting platform was easy and user-friendly for all participants.","translation":"온라인 회의 플랫폼의 설치는 모든 참가자에게 쉽고 사용자 친화적이었다.","sourcePage":392,"pdfPage":240},{"id":2131,"source":"MAIN","day":"43","word":"target","entryType":"SINGLE","meaning":"동 -을 목표로 정하다 / 명 과녁, 목표","example":"The library’s new program targets children with limited access to books.","translation":"도서관의 신규 프로그램은 책에 대한 접근성이 낮은 어린이들을 대상으로 한다.","sourcePage":393,"pdfPage":241},{"id":2132,"source":"MAIN","day":"43","word":"expansion","entryType":"SINGLE","meaning":"명 확장, 확대, 증대","example":"The university announced the expansion of online learning opportunities.","translation":"대학은 온라인 학습 기회 확대를 발표했다.","sourcePage":393,"pdfPage":241},{"id":2133,"source":"MAIN","day":"43","word":"lease","entryType":"SINGLE","meaning":"동 (부동산·장비 등을) 임대[임차]하다 / 명 임대차 계약","example":"The company is considering leasing office space in a high-rise building downtown.","translation":"이 회사는 시내의 고층 빌딩에 사무실 공간을 임대하는 것을 고려하고 있다.","sourcePage":393,"pdfPage":241},{"id":2134,"source":"MAIN","day":"43","word":"timekeeping","entryType":"SINGLE","meaning":"명 시간 준수, 시간 기록","example":"Fire stations require strict timekeeping for emergency response.","translation":"소방서에서는 비상 대응을 위해 엄격한 시간 준수를 요구한다.","sourcePage":393,"pdfPage":241},{"id":2135,"source":"MAIN","day":"43","word":"track","entryType":"SINGLE","meaning":"동 추적하다 / 명 추적, 자취","example":"Project management tools help you track tasks and deadlines.","translation":"프로젝트 관리 도구는 작업과 마감일을 추적하는 데 도움이 된다.","sourcePage":393,"pdfPage":241},{"id":2136,"source":"MAIN","day":"43","word":"follow up with","entryType":"MULTIWORD","meaning":"-을 덧붙이다","example":"We’ll follow up with more details soon.","translation":"자세한 내용은 곧 덧붙여 드릴게요.","sourcePage":393,"pdfPage":241},{"id":2137,"source":"MAIN","day":"43","word":"specialize in","entryType":"MULTIWORD","meaning":"-을 전문으로 하다","example":"The doctor specializes in treating sports injuries for athletes.","translation":"그 의사는 운동선수의 스포츠 부상을 전문으로 치료한다.","sourcePage":393,"pdfPage":241},{"id":2138,"source":"MAIN","day":"43","word":"credential","entryType":"SINGLE","meaning":"명 ① 신용 증명서, 신임장, 자격 증명서 ② 업적, 경력 / 형 신용 증명이 되는","example":"A teacher’s credential is required to teach in a public school.","translation":"공립 학교에서 가르치려면 교사 자격 증명서가 필요하다.","sourcePage":394,"pdfPage":242},{"id":2139,"source":"MAIN","day":"43","word":"publicity","entryType":"SINGLE","meaning":"명 매스컴의 관심, 주목 ② 홍보","example":"The local park renovation project has received positive publicity in the news media.","translation":"지역 공원 개선 프로젝트가 언론에서 긍정적인 주목을 받았다.","sourcePage":394,"pdfPage":242},{"id":2140,"source":"MAIN","day":"43","word":"census","entryType":"SINGLE","meaning":"명 인구 조사","example":"The national census is conducted every ten years to gather population data.","translation":"인구 데이터를 수집하기 위해 10년마다 인구 조사가 실시된다.","sourcePage":394,"pdfPage":242},{"id":2141,"source":"MAIN","day":"43","word":"focus group","entryType":"MULTIWORD","meaning":"명 포커스 그룹(시장 조사나 여론 조사를 위해 각 계층을 대표하도록 뽑은 소수의 사람들)","example":"Government agency uses focus groups to understand public opinion on proposed policy.","translation":"정부 기관에서는 제안된 정책에 대한 여론을 파악하기 위해 포커스 그룹을 이용한다.","sourcePage":394,"pdfPage":242},{"id":2142,"source":"MAIN","day":"43","word":"on-site inspection","entryType":"MULTIWORD","meaning":"현장 점검","example":"The health department conducted an on-site inspection of the restaurant kitchen.","translation":"보건 당국은 식당 주방에 대한 현장 점검을 실시했다.","sourcePage":394,"pdfPage":242},{"id":2143,"source":"MAIN","day":"43","word":"resolution","entryType":"SINGLE","meaning":"명 ① 해상도 ② 해결 ③ 결심, 결정","example":"Would you be able to send the image in its original resolution?","translation":"이미지를 원본 해상도로 전송해 주실 수 있나요?","sourcePage":394,"pdfPage":242},{"id":2144,"source":"MAIN","day":"43","word":"statement","entryType":"SINGLE","meaning":"명 ① 명세서 ② 성명서","example":"The company released a statement apologizing for the product recall.","translation":"회사는 제품 리콜에 대해 사과하는 성명서를 발표했다.","sourcePage":395,"pdfPage":243},{"id":2145,"source":"MAIN","day":"43","word":"pilot test","entryType":"MULTIWORD","meaning":"시범 테스트","example":"A pilot test of the new recycling program is underway in two selected neighborhoods.","translation":"새로운 재활용 프로그램의 시범 테스트가 선별된 두 지역에서 진행 중이다.","sourcePage":395,"pdfPage":243},{"id":2146,"source":"MAIN","day":"43","word":"markedly","entryType":"SINGLE","meaning":"부 현저하게, 두드러지게","example":"Public trust in the government has markedly declined.","translation":"정부에 대한 대중의 신뢰가 현저히 떨어졌다.","sourcePage":395,"pdfPage":243},{"id":2147,"source":"MAIN","day":"43","word":"overly","entryType":"SINGLE","meaning":"부 지나치게, 너무","example":"The report highlights the need for a more overly efficient waste management system.","translation":"이 보고서는 보다 효율적인 폐기물 관리 시스템의 필요성을 지나치게 강조한다.","sourcePage":395,"pdfPage":243},{"id":2148,"source":"MAIN","day":"43","word":"persistently","entryType":"SINGLE","meaning":"부 지속적으로, 고집스럽게","example":"The community persistently protested against the proposed environmental project.","translation":"그 지역사회는 제안된 환경 프로젝트에 대해 지속적으로 항의했다.","sourcePage":395,"pdfPage":243},{"id":2149,"source":"MAIN","day":"43","word":"given","entryType":"SINGLE","meaning":"전 -을 고려해 볼 때","example":"The project remains on track, given recent developments.","translation":"최근의 상황을 고려할 때 프로젝트는 순조롭게 진행되고 있다.","sourcePage":395,"pdfPage":243},{"id":2150,"source":"MAIN","day":"43","word":"in light of","entryType":"MULTIWORD","meaning":"-에 비추어, -을 고려하여","example":"New safety protocols implemented in light of recent incidents.","translation":"최근 발생한 사건을 고려하여 새로운 안전 프로토콜이 도입되었다.","sourcePage":395,"pdfPage":243},{"id":2151,"source":"MAIN","day":"44","word":"job posting","entryType":"MULTIWORD","meaning":"명 채용 공고","example":"Review our job postings to see if any opportunities match your qualifications.","translation":"당신의 지원 자격에 맞는 기회가 있는지 확인하기 위해 채용 공고를 검토하세요.","sourcePage":396,"pdfPage":244},{"id":2152,"source":"MAIN","day":"44","word":"cover letter","entryType":"MULTIWORD","meaning":"자기소개서","example":"A strong cover letter can help your résumé stand out from the competition.","translation":"강력한 자기소개서는 당신의 이력서를 경쟁에서 돋보이게 하는 데 도움이 될 수 있다.","sourcePage":396,"pdfPage":244},{"id":2153,"source":"MAIN","day":"44","word":"portfolio","entryType":"SINGLE","meaning":"명 ① 포트폴리오 ② 투자 자산 구성","example":"The applicant submitted an impressive portfolio demonstrating his writing skills.","translation":"지원자는 자신의 글쓰기 실력을 입증하는 인상적인 포트폴리오를 제출했다.","sourcePage":396,"pdfPage":244},{"id":2154,"source":"MAIN","day":"44","word":"school transcript","entryType":"MULTIWORD","meaning":"성적 증명서","example":"Submit your official school transcript along with your college application.","translation":"대학 지원서와 함께 공식 성적 증명서를 제출하세요.","sourcePage":397,"pdfPage":245},{"id":2155,"source":"MAIN","day":"44","word":"reference letter","entryType":"MULTIWORD","meaning":"추천서","example":"A positive reference letter from your previous employer can be very helpful.","translation":"당신의 이전 고용주가 긍정적인 추천서가 큰 도움이 될 수 있다.","sourcePage":397,"pdfPage":245},{"id":2156,"source":"MAIN","day":"44","word":"background check","entryType":"MULTIWORD","meaning":"신원 조사","example":"All childcare workers are required to undergo a thorough background check for safety.","translation":"모든 보육교사는 안전을 위해 철저한 신원 조사를 거쳐야 한다.","sourcePage":397,"pdfPage":245},{"id":2157,"source":"MAIN","day":"44","word":"onboarding","entryType":"SINGLE","meaning":"명 신입사원 적응 프로그램, 신입 교육","example":"The hospital implements efficient onboarding process for new nurses.","translation":"이 병원은 신규 간호사를 위한 효율적인 신입 교육 프로세스를 시행한다.","sourcePage":397,"pdfPage":245},{"id":2158,"source":"MAIN","day":"44","word":"OJT (on-the-job training)","entryType":"MULTIWORD","meaning":"명 사내 교육, 현장 직무 교육","example":"She gained valuable experience through her OJT internship.","translation":"그녀는 사내 교육 인턴십을 통해 소중한 경험을 쌓았다.","sourcePage":397,"pdfPage":245},{"id":2159,"source":"MAIN","day":"44","word":"work ethic","entryType":"MULTIWORD","meaning":"직업 윤리","example":"This program builds a strong work ethic in future leaders.","translation":"이 프로그램은 미래의 리더에게 강력한 직업 윤리를 심어 준다.","sourcePage":397,"pdfPage":245},{"id":2160,"source":"MAIN","day":"44","word":"full-time","entryType":"MULTIWORD","meaning":"명 정규직 형 전 시간 근무의","example":"We are searching for a full-time accountant to join our growing team.","translation":"우리는 우리의 성장하는 팀에 합류할 정규직 회계사를 찾고 있다.","sourcePage":397,"pdfPage":245},{"id":2161,"source":"MAIN","day":"44","word":"paid position","entryType":"MULTIWORD","meaning":"유급직","example":"This internship is a paid position that provides valuable work experience.","translation":"이 인턴십은 귀중한 업무 경험을 제공하는 유급직이다.","sourcePage":398,"pdfPage":246},{"id":2162,"source":"MAIN","day":"44","word":"contract position","entryType":"MULTIWORD","meaning":"계약직","example":"The department is seeking to fill a contract position for a data analyst.","translation":"해당 부서에서는 계약직 데이터 분석가를 구하고 있다.","sourcePage":398,"pdfPage":246},{"id":2163,"source":"MAIN","day":"44","word":"employment agreement","entryType":"MULTIWORD","meaning":"고용 계약(서), 취업 동의서","example":"The employment agreement details the terms and conditions of the position.","translation":"고용 계약서에는 해당 직책의 조건이 자세히 설명되어 있다.","sourcePage":398,"pdfPage":246},{"id":2164,"source":"MAIN","day":"44","word":"unemployment","entryType":"SINGLE","meaning":"명 실업, 실직 (상태)","example":"The unemployment rate has been steadily decreasing over the past year.","translation":"지난 1년 동안 실업률은 꾸준히 감소하고 있다.","sourcePage":398,"pdfPage":246},{"id":2165,"source":"MAIN","day":"44","word":"turnover","entryType":"SINGLE","meaning":"명 ① 이직률 ② 총매상고 ③ 거래액","example":"The high turnover made it difficult to attract talented individuals.","translation":"높은 이직률로 인해 유능한 인재를 끌어모으기 어려웠다.","sourcePage":398,"pdfPage":246},{"id":2166,"source":"MAIN","day":"44","word":"attire","entryType":"SINGLE","meaning":"명 복장, 옷차림","example":"Business attire is preferred for interviews.","translation":"면접에는 비즈니스 복장 착용이 권장된다.","sourcePage":398,"pdfPage":246},{"id":2167,"source":"MAIN","day":"44","word":"dress code","entryType":"MULTIWORD","meaning":"복장 규정","example":"The office enforces a business casual dress code for employees.","translation":"그 사무실은 직원들을 위해 비즈니스 캐주얼 복장 규정을 시행하고 있다.","sourcePage":399,"pdfPage":247},{"id":2168,"source":"MAIN","day":"44","word":"head","entryType":"SINGLE","meaning":"명 우두머리, 책임자 동 ① 책임지다 ② 향하다","example":"She was appointed as the head of the new project team.","translation":"그녀는 새로운 프로젝트팀의 책임자로 임명되었다.","sourcePage":399,"pdfPage":247},{"id":2169,"source":"MAIN","day":"44","word":"management","entryType":"SINGLE","meaning":"명 ① 경영, 관리 ② 경영진","example":"Effective management is crucial for the success of any organization.","translation":"효과적인 관리는 모든 조직의 성공을 위해 매우 중요하다.","sourcePage":399,"pdfPage":247},{"id":2170,"source":"MAIN","day":"44","word":"administrative","entryType":"SINGLE","meaning":"형 행정의, 관리의","example":"Please submit your travel expense report through the administrative portal.","translation":"관리 포털을 통해 출장 경비 보고서를 제출하세요.","sourcePage":399,"pdfPage":247},{"id":2171,"source":"MAIN","day":"44","word":"committee","entryType":"SINGLE","meaning":"명 위원회","example":"The budget committee approved funding for the community center project.","translation":"예산 위원회는 지역 문화 센터 프로젝트에 대한 자금을 승인했다.","sourcePage":399,"pdfPage":247},{"id":2172,"source":"MAIN","day":"44","word":"monitor","entryType":"SINGLE","meaning":"동 감독하다, 감시하다, 검토하다 명 화면, 모니터","example":"In a corporate context, feedback is essential for monitoring progress.","translation":"기업에서 피드백은 진행 상황을 감독하는 데 필수적이다.","sourcePage":399,"pdfPage":247},{"id":2173,"source":"MAIN","day":"44","word":"in-house","entryType":"MULTIWORD","meaning":"형 사내의 부 사내에서","example":"The department established an in-house committee to address employee concerns.","translation":"이 부서는 직원들의 우려 사항을 해결하기 위해 사내 위원회를 설립했다.","sourcePage":399,"pdfPage":247},{"id":2174,"source":"MAIN","day":"44","word":"exemplary","entryType":"SINGLE","meaning":"형 모범적인, 본보기가 되는","example":"The employee received an exemplary performance review.","translation":"그 직원은 모범적인 성과 평가를 받았다.","sourcePage":400,"pdfPage":248},{"id":2175,"source":"MAIN","day":"44","word":"disciplinary","entryType":"SINGLE","meaning":"형 ① 훈련상의, 훈육의 ② 규율상의, 징계의","example":"Public service worker is suspended after failing a disciplinary review.","translation":"공무원은 징계 심의에 통과하지 못해 정직 처분을 받는다.","sourcePage":400,"pdfPage":248},{"id":2176,"source":"MAIN","day":"44","word":"career advancement","entryType":"MULTIWORD","meaning":"승진","example":"Taking additional courses can help with career advancement opportunities.","translation":"추가 과정을 수강하는 것은 승진 기회에 도움이 될 수 있다.","sourcePage":400,"pdfPage":248},{"id":2177,"source":"MAIN","day":"44","word":"relocate","entryType":"SINGLE","meaning":"동 이전하다, 이동하다","example":"They will relocate its headquarters to a new city.","translation":"그들은 본사를 신도시로 이전할 예정이다.","sourcePage":400,"pdfPage":248},{"id":2178,"source":"MAIN","day":"44","word":"marital status","entryType":"MULTIWORD","meaning":"결혼 여부, 배우자 관계","example":"The application does not ask about your marital status, only your qualifications.","translation":"지원서에는 결혼 여부는 묻지 않고 자격만 묻는다.","sourcePage":400,"pdfPage":248},{"id":2179,"source":"MAIN","day":"44","word":"maternity leave","entryType":"MULTIWORD","meaning":"출산 휴가, 육아 휴직","example":"She is currently on maternity leave from work to care for her newborn baby.","translation":"현재 갓 태어난 아기를 돌보기 위해 휴직 중이다.","sourcePage":400,"pdfPage":248},{"id":2180,"source":"MAIN","day":"44","word":"payroll","entryType":"SINGLE","meaning":"명 ① 임금 대장, 급료 명부 ② 급료 총액","example":"The company has to increase its total payroll as the minimum wage goes up.","translation":"그 회사는 최저임금이 인상되면서 급여 총액을 늘려야 했다.","sourcePage":400,"pdfPage":248},{"id":2181,"source":"MAIN","day":"44","word":"fiscal","entryType":"SINGLE","meaning":"형 재정의, 회계의","example":"We are holding a meeting to discuss fiscal year budget proposals.","translation":"저희는 회계연도 예산안을 논의하기 위한 회의를 열고 있어요.","sourcePage":401,"pdfPage":249},{"id":2182,"source":"MAIN","day":"44","word":"deficit","entryType":"SINGLE","meaning":"명 적자, 결손","example":"Trade deficit worsens, impacting currency value.","translation":"무역 적자가 악화되어 통화 가치에 영향을 미친다.","sourcePage":401,"pdfPage":249},{"id":2183,"source":"MAIN","day":"44","word":"by check","entryType":"MULTIWORD","meaning":"수표로","example":"Payment can be made by check, cash, or credit card.","translation":"결제는 수표, 현금, 또는 신용카드로 할 수 있어요.","sourcePage":401,"pdfPage":249},{"id":2184,"source":"MAIN","day":"44","word":"credit card statement","entryType":"MULTIWORD","meaning":"신용 카드 명세서","example":"Review credit card statements to verify purchases made with company-issued cards.","translation":"회사에서 발급한 카드로 구매한 내역을 확인하기 위해 신용카드 명세서를 검토하세요.","sourcePage":401,"pdfPage":249},{"id":2185,"source":"MAIN","day":"44","word":"installment","entryType":"SINGLE","meaning":"명 할부","example":"He paid for the furniture in monthly installments.","translation":"그는 가구를 매달 할부로 결제했다.","sourcePage":401,"pdfPage":249},{"id":2186,"source":"MAIN","day":"44","word":"balance","entryType":"SINGLE","meaning":"명 ① 잔고, 잔액 ② 균형 상태 동 균형을 잡다","example":"Call the tax office to discuss payment options for your remaining tax balance.","translation":"세무서에 전화하여 남은 세금 잔액에 대한 납부 옵션을 논의하세요.","sourcePage":401,"pdfPage":249},{"id":2187,"source":"MAIN","day":"44","word":"at no charge","entryType":"MULTIWORD","meaning":"무료","example":"We offer free shipping on all orders at no charge.","translation":"저희는 모든 주문에 대해 무료 배송 서비스를 제공합니다.","sourcePage":402,"pdfPage":250},{"id":2188,"source":"MAIN","day":"44","word":"wire transfer","entryType":"MULTIWORD","meaning":"송금","example":"You can submit your tax payment quickly and securely via wire transfer.","translation":"송금을 통해 빠르고 안전하게 세금을 납부할 수 있습니다.","sourcePage":402,"pdfPage":250},{"id":2189,"source":"MAIN","day":"44","word":"subcontract","entryType":"SINGLE","meaning":"명 하청 계약 동 하청을 주다","example":"The subcontract for the landscaping will be signed next week.","translation":"조경 하청 계약은 다음 주에 체결될 예정입니다.","sourcePage":402,"pdfPage":250},{"id":2190,"source":"MAIN","day":"44","word":"outsource","entryType":"SINGLE","meaning":"동 외부에 위탁하다","example":"The agency is considering outsourcing the maintenance of its facilities.","translation":"그 기관은 시설 유지 관리를 외부에 위탁하는 것을 고려하고 있다.","sourcePage":402,"pdfPage":250},{"id":2191,"source":"MAIN","day":"44","word":"transaction","entryType":"SINGLE","meaning":"명 ① 거래 ② 처리, 집행","example":"Purchase tickets online for a convenient, contactless transaction.","translation":"편리한 비대면 거래를 위해 온라인으로 티켓을 구매하세요.","sourcePage":402,"pdfPage":250},{"id":2192,"source":"MAIN","day":"44","word":"bid","entryType":"SINGLE","meaning":"명 입찰","example":"Several companies submitted bids for the construction project, pushing the final price down.","translation":"여러 회사가 건설 프로젝트에 입찰을 제출하여 최종 가격을 낮췄다.","sourcePage":402,"pdfPage":250},{"id":2193,"source":"MAIN","day":"44","word":"signature","entryType":"SINGLE","meaning":"명 ① 서명 ② 특징","example":"A signature may be required upon pickup of important documents from government offices.","translation":"관공서에서 중요한 서류를 수령할 때 서명이 필요할 수도 있다.","sourcePage":402,"pdfPage":250},{"id":2194,"source":"MAIN","day":"44","word":"renewal","entryType":"SINGLE","meaning":"명 갱신, 재개발","example":"Negotiations for the contract renewal are currently underway.","translation":"현재 재계약 갱신을 위한 협상이 진행 중이다.","sourcePage":403,"pdfPage":251},{"id":2195,"source":"MAIN","day":"44","word":"expiration date","entryType":"MULTIWORD","meaning":"① (계약서 등의) 만기 날짜 ② (식품의) 유효 기간","example":"The expiration date of the contract is approaching, prompting us to review renewal options.","translation":"계약 만료일이 다가오고 있어 저희는 갱신 옵션을 검토해야 합니다.","sourcePage":403,"pdfPage":251},{"id":2196,"source":"MAIN","day":"44","word":"early termination fee","entry The talented young musician is preparing for her piano recital next week.","translation":"재능 있는 젊은 음악가는 다음 주 피아노 독주회를 준비하고 있다.","sourcePage":396,"pdfPage":252},{"id":2204,"source":"MAIN","day":"45","word":"farewell gathering","entryType":"MULTIWORD","meaning":"명 환송 모임, 송별회","example":"A farewell gathering was held to honor the retiring director for his years of dedicated service.","translation":"퇴임하는 이사의 헌신적인 노고를 기리기 위한 송별회가 열렸다.","sourcePage":397,"pdfPage":253},{"id":2205,"source":"MAIN","day":"45","word":"outreach program","entryType":"MULTIWORD","meaning":"명 지원 활동, 구제 활동","example":"Public outreach programs strive to educate and connect with the community.","translation":"공공 지원 활동은 지역 사회를 교육하고 소통하기 위해 노력한다.","sourcePage":397,"pdfPage":253},{"id":2206,"source":"MAIN","day":"45","word":"reunion","entryType":"SINGLE","meaning":"명 ① 친목회, 모임, 동창회 ② 재회, 재통합","example":"Ex-colleagues planned their office reunion.","translation":"전직 동료들이 회사 모임을 계획했다.","sourcePage":397,"pdfPage":253},{"id":2207,"source":"MAIN","day":"45","word":"alumni","entryType":"SINGLE","meaning":"명 동창생들, 졸업생들","example":"The company launched a mentorship program for alumni.","translation":"그 회사는 졸업생들을 위한 멘토링 프로그램을 시작했다.","sourcePage":397,"pdfPage":253},{"id":2208,"source":"MAIN","day":"45","word":"banquet","entryType":"SINGLE","meaning":"명 연회, 만찬","example":"She delivered a moving speech at the banquet.","translation":"그녀는 연회에서 감동적인 연설을 했다.","sourcePage":397,"pdfPage":253},{"id":2209,"source":"MAIN","day":"45","word":"book","entryType":"SINGLE","meaning":"동 예약하다 / 명 책","example":"Tickets for the upcoming community event can be booked starting next Monday.","translation":"다가오는 지역사회 행사 티켓은 다음 주 월요일부터 예약할 수 있다.","sourcePage":397,"pdfPage":253},{"id":2210,"source":"MAIN","day":"45","word":"registration","entryType":"SINGLE","meaning":"명 등록, 접수","example":"To participate in the competition, complete registration online before the deadline.","translation":"대회에 참가하려면 마감일 전에 온라인으로 등록을 완료하세요.","sourcePage":39 nload the user booklet for instructions.","translation":"설명서를 보려면 사용자 책자를 다운로드하세요.","sourcePage":399,"pdfPage":255},{"id":2219,"source":"MAIN","day":"45","word":"handout","entryType":"SINGLE","meaning":"명 유인물, 배포 자료","example":"The handout included a map of the hiking trail and safety tips.","translation":"유인물에는 등산로 지도와 안전 수칙이 포함되어 있다.","sourcePage":399,"pdfPage":255},{"id":2220,"source":"MAIN","day":"45","word":"opening","entryType":"SINGLE","meaning":"명 ① 개장, 개시 ② (일자리) 공석","example":"The grand opening of the new museum will be held next week.","translation":"새로운 박물관의 개장은 다음 주에 열릴 예정이다.","sourcePage":399,"pdfPage":255},{"id":2221,"source":"MAIN","day":"45","word":"admission","entryType":"SINGLE","meaning":"명 입장, 입학","example":"The museum offers free admission on the first Friday of every month.","translation":"박물관은 매월 첫째 주 금요일에 무료 입장이 가능하다.","sourcePage":399,"pdfPage":255},{"id":2222,"source":"MAIN","day":"45","word":"entry","entryType":"SINGLE","meaning":"명 ① 가입, 참가, 입장, 들어감 ② 입장권 ③ 입구, 현관","example":"Students receive discounted entry fees with valid student identification.","translation":"유효한 학생 신분증을 제시하면 학생들은 입장료 할인 혜택을 받을 수 있다.","sourcePage":399,"pdfPage":255},{"id":2223,"source":"MAIN","day":"45","word":"attendee","entryType":"SINGLE","meaning":"명 ① 참석자 ② 출석자","example":"The keynote speaker attracted a large audience of attendees at the conference.","translation":"기조연설자는 콘퍼런스에서 많은 참석자를 끌어모았다.","sourcePage":399,"pdfPage":255},{"id":2224,"source":"MAIN","day":"45","word":"catering","entryType":"SINGLE","meaning":"명 출장 요리, 음식 공급(업)","example":"The catering menu included finger foods, appetizers, and main courses.","translation":"케이터링 메뉴에는 핑거푸드, 애피타이저, 메인 코스가 포함되어 있다.","sourcePage":399,"pdfPage":255},{"id":2225,"source":"MAIN","day":"45","word":"culinary","entryType":"SINGLE","meaning":"형 요리의","example":"This cookbook features culinary delights from various cultures.","translation":"이 요리책에는 다양한 문화권의 요리가 소개되어 있다.","sourcePage":400,"pdfPage":256},{"id":2226,"source":"MAIN","day":"45","word":"cuisine","entryType":"SINGLE","meaning":"명 요리(법)","example":"Explore the diverse cuisine of the region.","translation":"이 지역의 다양한 요리를 맛보세요.","sourcePage":400,"pdfPage":256},{"id":2227,"source":"MAIN","day":"45","word":"complimentary","entryType":"SINGLE","meaning":"형 무료의","example":"We offer a complimentary consultation.","translation":"저희는 무료 상담을 제공합니다.","sourcePage":400,"pdfPage":256},{"id":2228,"source":"MAIN","day":"45","word":"redeemable","entryType":"SINGLE","meaning":"형 (현금이나 상품과) 교환할 수 있는","example":"Check your email for a redeemable discount code.","translation":"이메일에서 교환 가능한 할인 코드를 확인하세요.","sourcePage":400,"pdfPage":256},{"id":2229,"source":"MAIN","day":"45","word":"audiovisual","entryType":"SINGLE","meaning":"형 시청각의","example":"We are looking for a technician skilled in audiovisual equipment setup.","translation":"우리는 시청각 장비 설정에 숙련된 기술자를 찾고 있다.","sourcePage":400,"pdfPage":256},{"id":2230,"source":"MAIN","day":"45","word":"sightseeing","entryType":"SINGLE","meaning":"명 관광, 유람","example":"Learn about the city’s history at the City Museum, adding to your sightseeing experience.","translation":"시립박물관에서 시의 역사에 대해 알아보고 관광 경험의 재미를 더해 보세요.","sourcePage":400,"pdfPage":256},{"id":2231,"source":"MAIN","day":"45","word":"venue","entryType":"SINGLE","meaning":"명 (콘서트·스포츠 경기·회담 등의) 장소","example":"The venue for the concert can accommodate over 10,000 attendees.","translation":"콘서트 장소는 10,000명 이상의 참석자를 수용할 수 있다.","sourcePage":400,"pdfPage":256},{"id":2232,"source":"MAIN","day":"45","word":"refreshment","entryType":"SINGLE","meaning":"명 ① 다과 ② 원기 회복","example":"Enjoy some refreshments and snacks during the break.","translation":"휴식 시간에는 다과와 간식을 즐기세요.","sourcePage":401,"pdfPage":257},{"id":2233,"source":"MAIN","day":"45","word":"picturesque","entryType":"SINGLE","meaning":"형 그림 같은","example":"They offer tours through the city’s picturesque historic district.","translation":"그들은 도시의 그림 같은 역사 지구를 둘러보는 투어를 제공한다.","sourcePage":401,"pdfPage":257},{"i
