동의했다.","sourcePage":69,"pdfPage":65},{"id":290,"source":"MAIN","day":"06","word":"dissent","entryType":"","meaning":"동 반대하다, 의견을 달리하다 / 명 반대, 의견 차이","example":"If there's no dissent, there's no room for progress.","translation":"반대 의견이 없다면 발전의 여지도 없다.","sourcePage":70,"pdfPage":66},{"id":291,"source":"MAIN","day":"06","word":"pathetic","entryType":"","meaning":"형 불쌍한, 애처로운","example":"Their efforts to win the game were pathetic.","translation":"경기에서 이기려는 그들의 노력은 애처로웠다.","sourcePage":70,"pdfPage":66},{"id":292,"source":"MAIN","day":"06","word":"sympathy","entryType":"","meaning":"명 ① 동정, 연민 ② 공감","example":"I could not restrain my sympathy at the sight.","translation":"나는 그 광경을 보고 동정을 억누를 수 없었다.","sourcePage":70,"pdfPage":66},{"id":293,"source":"MAIN","day":"06","word":"empathy","entryType":"","meaning":"명 감정 이입, 공감","example":"He loves children and has a certain empathy with them.","translation":"그는 아이들을 사랑하며 아이들에게 어느 정도 공감한다.","sourcePage":70,"pdfPage":66},{"id":294,"source":"MAIN","day":"06","word":"antipathy","entryType":"","meaning":"명 반감, 혐오","example":"Employers and employees have an antipathy to each other.","translation":"고용주와 직원들은 서로에게 반감을 가지고 있다.","sourcePage":70,"pdfPage":66},{"id":295,"source":"MAIN","day":"06","word":"apathy","entryType":"","meaning":"명 무관심, 냉담","example":"The low voter turnout reflected the widespread apathy.","translation":"낮은 투표율은 광범위한 무관심을 반영했다.","sourcePage":71,"pdfPage":67},{"id":296,"source":"MAIN","day":"06","word":"devour","entryType":"","meaning":"동 게걸스럽게 먹다, 탐식하다","example":"He devoured the entire plate of spaghetti.","translation":"그는 스파게티 한 접시를 게걸스럽게 먹었다.","sourcePage":71,"pdfPage":67},{"id":297,"source":"MAIN","day":"06","word":"herbivorous","entryType":"","meaning":"형 초식성의","example":"Most dinosaurs were herbivorous.","translation":"대부분의 공룡은 초식성이었다.","sourcePage":71,"pdfPage":67},{"id":298,"source":"MAIN","day":"06","word":"carnivorous","entryType":"","meaning":"형 육식성의","example":"Lions are typical carnivorous animals.","translation":"사자는 전형적인 육식 동물이다.","sourcePage":71,"pdfPage":67},{"id":299,"source":"MAIN","day":"06","word":"omnivorous","entryType":"","meaning":"형 잡식성의","example":"Dogs are omnivorous animals.","translation":"개는 잡식성 동물이다.","sourcePage":71,"pdfPage":67},{"id":300,"source":"MAIN","day":"06","word":"voracious","entryType":"","meaning":"형 게걸스러운, 탐욕스러운","example":"Wolves are voracious eaters.","translation":"늑대는 게걸스럽게 먹는다.","sourcePage":71,"pdfPage":67},{"id":301,"source":"MAIN","day":"07","word":"strain","entryType":"","meaning":"동 ① 잡아당기다 ② 긴장시키다 ③ (근육을) 혹사시키다, 상하게 하다 / 명 긴장, 과로","example":"When I go to see my favorite singer's performance, I feel the strain.","translation":"나는 좋아하는 가수의 공연을 보러 갈 때 긴장을 느낀다.","sourcePage":72,"pdfPage":68},{"id":302,"source":"MAIN","day":"07","word":"restrain","entryType":"","meaning":"동 ① 제지하다, 못하게 하다 ② 억제하다, 억누르다","example":"Daniel managed to restrain his anger.","translation":"Daniel은 간신히 화를 억눌렀다.","sourcePage":72,"pdfPage":68},{"id":303,"source":"MAIN","day":"07","word":"constrain","entryType":"","meaning":"동 ① 제한하다, 억제하다 ② 강요하다","example":"She believes that too much instruction constrains an artist's creativity.","translation":"그녀는 너무 많은 교육이 예술가의 창의력을 억제한다고 믿는다.","sourcePage":73,"pdfPage":69},{"id":304,"source":"MAIN","day":"07","word":"restrict","entryType":"","meaning":"동 제한하다, 한정하다","example":"Speed is restricted to 30 mph in school zones.","translation":"어린이 보호 구역에서는 속도가 시속 30마일로 제한된다.","sourcePage":73,"pdfPage":69},{"id":305,"source":"MAIN","day":"07","word":"comply","entryType":"","meaning":"동 ① 순응하다 (with) ② (법·명령 등에) 따르다, 준수하다 (with)","example":"It is important to comply with traffic laws.","translation":"교통 법규를 준수하는 것은 중요하다.","sourcePage":73,"pdfPage":69},{"id":306,"source":"MAIN","day":"07","word":"imply","entryType":"","meaning":"동 내포하다, 암시하다","example":"Silence often implies consent.","translation":"침묵은 종종 동의를 암시한다.","sourcePage":73,"pdfPage":69},{"id":307,"source":"MAIN","day":"07","word":"implication","entryType":"","meaning":"명 ① 연관, 연루 ② 함축, 암시 ③ 영향, 결과","example":"Her alibi cleared her of any implication in the robbery.","translation":"그녀의 알리바이로 인해 그녀는 강도 사건 연루 혐의를 벗었다.","sourcePage":73,"pdfPage":69},{"id":308,"source":"MAIN","day":"07","word":"complicate","entryType":"","meaning":"동 복잡하게 만들다","example":"Don't complicate the problem any further.","translation":"문제를 더 이상 복잡하게 만들지 마라.","sourcePage":74,"pdfPage":70},{"id":309,"source":"MAIN","day":"07","word":"explicate","entryType":"","meaning":"동 설명하다, 명백하게 하다","example":"The professor explicated the theory of relativity.","translation":"그 교수는 상대성이론을 설명했다.","sourcePage":74,"pdfPage":70},{"id":310,"source":"MAIN","day":"07","word":"duplicate","entryType":"","meaning":"동 복사하다, 복제하다 / 명 복사, 복제의 / 명 복사본, 복제품","example":"The materials are duplicated at no cost.","translation":"그 자료들은 무료로 복제된다.","sourcePage":74,"pdfPage":70},{"id":311,"source":"MAIN","day":"07","word":"replicate","entryType":"","meaning":"동 복제하다","example":"The artist tried to replicate the painting.","translation":"그 화가는 그 그림을 복제하려고 애썼다.","sourcePage":74,"pdfPage":70},{"id":312,"source":"MAIN","day":"07","word":"implicit","entryType":"","meaning":"형 함축적인, 암시적인","example":"It can be seen as implicit agreement.","translation":"그것은 암묵적인 동의로 보여질 수 있다.","sourcePage":74,"pdfPage":70},{"id":313,"source":"MAIN","day":"07","word":"explicit","entryType":"","meaning":"형 ① 솔직한 ② 분명한, 명백한","example":"It is explicit evidence of fraud.","translation":"그것은 명백한 사기의 증거다.","sourcePage":74,"pdfPage":70},{"id":314,"source":"MAIN","day":"07","word":"deplete","entryType":"","meaning":"동 ① 고갈시키다 ② 대폭 감소시키다","example":"Extravagant spending quickly depleted his savings.","translation":"사치스러운 지출은 그의 저축금을 빠르게 고갈시켰다.","sourcePage":75,"pdfPage":71},{"id":315,"source":"MAIN","day":"07","word":"abstract","entryType":"","meaning":"형 ① 추상적인 ② 난해한, 심오한 / 명 요약, 발췌 / 동 ① 추출하다 ② 요약하다, 발췌하다","example":"Picasso's paintings are abstract art.","translation":"Picasso의 그림은 추상 예술이다.","sourcePage":75,"pdfPage":71},{"id":316,"source":"MAIN","day":"07","word":"attract","entryType":"","meaning":"동 마음을 끌다, 매혹하다","example":"In summer the place attracts many visitors.","translation":"그곳은 여름에 많은 관광객을 끌어들인다.","sourcePage":75,"pdfPage":71},{"id":317,"source":"MAIN","day":"07","word":"extract","entryType":"","meaning":"동 ① 뽑아내다, 추출하다 ② 발췌하다 / 명 ① 추출물 ② 발췌","example":"You need to extract some compounds and mix them.","translation":"당신은 일부 화합물들을 추출해서 그것들을 혼합해야 한다.","sourcePage":75,"pdfPage":71},{"id":318,"source":"MAIN","day":"07","word":"distract","entryType":"","meaning":"동 (주의를) 딴 데로 돌리다, 산만하게 하다","example":"Her phone notifications constantly distract her from work.","translation":"휴대 전화의 알림이 끊임없이 그녀가 업무하는 데 정신을 산만하게 한다.","sourcePage":76,"pdfPage":72},{"id":319,"source":"MAIN","day":"07","word":"contract","entryType":"","meaning":"동 ① 계약하다 ② 수축하다(시키다) ③ (병에) 걸리다 / 명 계약, 계약서","example":"The cold air caused the metal to contract slightly.","translation":"차가운 공기로 인해 금속이 약간 수축했다.","sourcePage":76,"pdfPage":72},{"id":320,"source":"MAIN","day":"07","word":"subtract","entryType":"","meaning":"동 빼다, 공제하다","example":"If you subtract a negative number, the result is positive.","translation":"음수를 빼면 결과는 양수가 된다.","sourcePage":76,"pdfPage":72},{"id":321,"source":"MAIN","day":"07","word":"trace","entryType":"","meaning":"동 ① 추적하다, 찾아내다 ② (역사적으로) 거슬러 올라가다 / 명 ① 자국, 흔적 ② 극미량, 조금","example":"The criminal was traced to Chicago late at night.","translation":"범인은 늦은 밤 시카고까지 추적당했다.","sourcePage":76,"pdfPage":72},{"id":322,"source":"MAIN","day":"07","word":"trail","entryType":"","meaning":"동 ① 추적하다 ② 끌다, 끌리다 / 명 ① 자국, 흔적 ② 오솔길","example":"A shooting star usually produces a trail of light.","translation":"별똥별은 보통 빛의 흔적을 남긴다.","sourcePage":76,"pdfPage":72},{"id":323,"source":"MAIN","day":"07","word":"sequence","entryType":"","meaning":"명 ① 연속적인 사건들 ② 순서, 차례","example":"The movie is a sequence of events leading up to a climax.","translation":"영화는 클라이맥스로 이어지는 일련의 사건이다.","sourcePage":77,"pdfPage":73},{"id":324,"source":"MAIN","day":"07","word":"consequence","entryType":"","meaning":"명 ① 결과 ② 영향 ③ 중요성","example":"This is a necessary consequence of progress.","translation":"이것은 진보의 필연적인 결과이다.","sourcePage":77,"pdfPage":73},{"id":325,"source":"MAIN","day":"07","word":"subsequent","entryType":"","meaning":"형 그 다음의, 차후의","example":"Subsequent events proved her to be right.","translation":"그 이후의 사건들이 그녀가 옳았다는 것을 입증해 주었다.","sourcePage":77,"pdfPage":73},{"id":326,"source":"MAIN","day":"07","word":"consecutive","entryType":"","meaning":"형 연속적인, 계속되는","example":"It snowed for ten consecutive days.","translation":"눈이 10일 동안 계속 내렸다.","sourcePage":77,"pdfPage":73},{"id":327,"source":"MAIN","day":"07","word":"persecute","entryType":"","meaning":"동 ① 박해하다 ② 귀찮게 굴다","example":"He persecuted the followers of other religions.","translation":"그는 타종교의 신도들을 박해했다.","sourcePage":77,"pdfPage":73},{"id":328,"source":"MAIN","day":"07","word":"suit","entryType":"","meaning":"동 적합하다, 어울리다 / 명 ① 정장, 한 벌의 옷 ② (법률) 소송","example":"This food doesn't suit my taste.","translation":"이 음식은 제 입맛에 안 맞아요.","sourcePage":77,"pdfPage":73},{"id":329,"source":"MAIN","day":"07","word":"pursue","entryType":"","meaning":"동 ① 추구하다 ② 뒤쫓다, 추적하다","example":"What are you pursuing in your studies?","translation":"당신은 학업에서 무엇을 추구하고 있나요?","sourcePage":78,"pdfPage":74},{"id":330,"source":"MAIN","day":"07","word":"ensue","entryType":"","meaning":"동 잇따라 일어나다","example":"Peace will hopefully ensue after the conflict.","translation":"분쟁 이후에는 평화가 뒤따르길 바란다.","sourcePage":78,"pdfPage":74},{"id":331,"source":"MAIN","day":"07","word":"transfer","entryType":"","meaning":"동 ① 옮기다, 이동하다 ② 전학[전근] 가다 / 명 ① 이동 ② 전학, 전근","example":"We transferred to a different hospital because of the medical accident.","translation":"우리는 의료 사고 때문에 다른 병원으로 옮겼다.","sourcePage":78,"pdfPage":74},{"id":332,"source":"MAIN","day":"07","word":"translate","entryType":"","meaning":"동 ① 번역하다, 통역하다 ② (다른 형태로) 옮기다, 바꾸다","example":"This book can't translate into German.","translation":"이 책은 독일어로 번역할 수 없다.","sourcePage":78,"pdfPage":74},{"id":333,"source":"MAIN","day":"07","word":"transact","entryType":"","meaning":"동 거래하다","example":"We transact business with a large number of stores.","translation":"우리는 많은 가게들과 거래한다.","sourcePage":78,"pdfPage":74},{"id":334,"source":"MAIN","day":"07","word":"transit","entryType":"","meaning":"명 ① 통과, 통행 ② 운송, 운반","example":"Some goods got damaged in transit.","translation":"일부 상품이 운송 중에 손상되었다.","sourcePage":79,"pdfPage":75},{"id":335,"source":"MAIN","day":"07","word":"transparent","entryType":"","meaning":"형 투명한, 비치는","example":"The insect has transparent wings.","translation":"그 곤충은 투명한 날개를 가지고 있다.","sourcePage":79,"pdfPage":75},{"id":336,"source":"MAIN","day":"07","word":"transfigure","entryType":"","meaning":"동 변모시키다","example":"At this moment the moon emerges and transfigures the landscape.","translation":"이 순간 달이 떠오르며 풍경을 바꿔 놓는다.","sourcePage":79,"pdfPage":75},{"id":337,"source":"MAIN","day":"07","word":"trespass","entryType":"","meaning":"동 무단 침입하다","example":"I trespassed on private land.","translation":"나는 사유지에 무단 침입했다.","sourcePage":79,"pdfPage":75},{"id":338,"source":"MAIN","day":"07","word":"previous","entryType":"","meaning":"형 앞의, 이전의","example":"No previous experience is necessary for this work.","translation":"이 업무에는 이전의 경험이 전혀 필요 없다.","sourcePage":79,"pdfPage":75},{"id":339,"source":"MAIN","day":"07","word":"prehistoric","entryType":"","meaning":"형 선사시대의","example":"Some people lived in caves in prehistoric times.","translation":"일부 사람들은 선사시대에 동굴에서 살았다.","sourcePage":80,"pdfPage":76},{"id":340,"source":"MAIN","day":"07","word":"premature","entryType":"","meaning":"형 ① 시기상조의, 정상[예상]보다 이른 ② 조산의","example":"It is premature to carry out the plan.","translation":"그 계획을 실행하기에는 아직 시기상조이다.","sourcePage":80,"pdfPage":76},{"id":341,"source":"MAIN","day":"07","word":"precaution","entryType":"","meaning":"명 ① 조심, 경계 ② 예방 조치","example":"I'll keep the letter as a precaution.","translation":"나는 예방 조치로 그 편지를 가지고 있을 것이다.","sourcePage":80,"pdfPage":76},{"id":342,"source":"MAIN","day":"07","word":"present","entryType":"","meaning":"동 ① 주다, 제공하다 ② 보여 주다, 나타내다 / 명 ① 선물 ② 현재 / 형 ① 출석한, 존재하는 ② 현재의","example":"I was present at the meeting.","translation":"나는 그 회의에 참석했다.","sourcePage":80,"pdfPage":76},{"id":343,"source":"MAIN","day":"07","word":"president","entryType":"","meaning":"명 대통령, 장, 회장","example":"U.S. President Grover Cleveland was informed that he had cancer.","translation":"미국 대통령 Grover Cleveland는 자신이 암에 걸렸다는 것을 알게 되었다.","sourcePage":80,"pdfPage":76},{"id":344,"source":"MAIN","day":"07","word":"prejudice","entryType":"","meaning":"명 편견 / 동 편견을 갖게 하다","example":"He is completely dependent on the prejudices of his times.","translation":"그는 시대의 편견에 전적으로 의존한다.","sourcePage":80,"pdfPage":76},{"id":345,"source":"MAIN","day":"07","word":"predict","entryType":"","meaning":"동 예언하다, 예측[예상]하다","example":"The CEO predicts this year will be even better.","translation":"대표 이사는 올해는 더 좋아질 것이라고 예측한다.","sourcePage":81,"pdfPage":77},{"id":346,"source":"MAIN","day":"07","word":"prevent","entryType":"","meaning":"동 ① 막다, 방해하다 ② 예방하다","example":"These programs prevent access to many services on the Internet.","translation":"이 프로그램들은 인터넷의 많은 서비스에 접속하는 것을 막는다.","sourcePage":81,"pdfPage":77},{"id":347,"source":"MAIN","day":"07","word":"preoccupy","entryType":"","meaning":"동 ① ~의 마음을 사로잡다, 몰두시키다 ② 먼저 차지하다, 선취하다","example":"She is totally preoccupied with her work.","translation":"그녀는 완전히 자신의 일에 몰두한다.","sourcePage":81,"pdfPage":77},{"id":348,"source":"MAIN","day":"07","word":"premise","entryType":"","meaning":"명 전제","example":"The argument is wrong from the basic premise.","translation":"그 주장은 기본 전제에서부터 틀렸다.","sourcePage":81,"pdfPage":77},{"id":349,"source":"MAIN","day":"07","word":"prerequisite","entryType":"","meaning":"형 ① 필수의, 미리 필요한 ② 전제가 되는 / 명 ① 전제 조건 ② 필수 기초 과목","example":"Is Biology a prerequisite for this medical course?","translation":"생물학은 이 의학 과정의 필수 기초 과목인가요?","sourcePage":81,"pdfPage":77},{"id":350,"source":"MAIN","day":"07","word":"pretext","entryType":"","meaning":"명 구실, 핑계","example":"He made a pretext of his car engine's malfunction.","translation":"그는 자신의 차 엔진의 고장을 구실로 삼았다.","sourcePage":81,"pdfPage":77},{"id":351,"source":"MAIN","day":"08","word":"persist","entryType":"","meaning":"동 ① 고집하다, 주장하다 ② 지속되다","example":"She persisted in her opinion.","translation":"그녀는 자기 의견을 계속 고집했다.","sourcePage":82,"pdfPage":78},{"id":352,"source":"MAIN","day":"08","word":"persuade","entryType":"","meaning":"동 설득하다, 설득하여 ~하게 하다","example":"I tried to persuade him but with no effect.","translation":"나는 그를 설득하려고 애썼지만 효과가 없었다.","sourcePage":82,"pdfPage":78},{"id":353,"source":"MAIN","day":"08","word":"perform","entryType":"","meaning":"동 ① 수행하다 ② 공연(연주/연기)하다","example":"The dolphins performed well at the circus.","translation":"돌고래들이 서커스에서 공연을 잘했다.","sourcePage":82,"pdfPage":78},{"id":354,"source":"MAIN","day":"08","word":"persevere","entryType":"","meaning":"동 인내하다, 견디다, 꾸준히 노력하다","example":"If you persevere, you can learn anything.","translation":"꾸준히 노력하면 무엇이든 배울 수 있다.","sourcePage":83,"pdfPage":79},{"id":355,"source":"MAIN","day":"08","word":"perpetual","entryType":"","meaning":"형 영구적인, 끊임없는","example":"They lived for years in a perpetual state of fear.","translation":"그들은 수년간 끊임없는 공포 상태에서 살았다.","sourcePage":83,"pdfPage":79},{"id":356,"source":"MAIN","day":"08","word":"permanent","entryType":"","meaning":"형 영구적인, 불변의","example":"She was looking for a permanent job.","translation":"그녀는 영구적인 직업을 찾고 있었다.","sourcePage":83,"pdfPage":79},{"id":357,"source":"MAIN","day":"08","word":"perish","entryType":"","meaning":"동 ① 죽다 ② 사라지다, 소멸하다","example":"All his belongings perished in the fire.","translation":"그 화재로 그의 모든 소지품이 사라졌다.","sourcePage":83,"pdfPage":79},{"id":358,"source":"MAIN","day":"08","word":"permit","entryType":"","meaning":"동 허락하다 / 명 허가증","example":"Pets are not permitted in the museum.","translation":"반려동물의 미술관 입장이 허락되지 않는다.","sourcePage":83,"pdfPage":79},{"id":359,"source":"MAIN","day":"08","word":"perfume","entryType":"","meaning":"명 향기, 향수","example":"The hall smelled of his mother's perfume.","translation":"복도에서 그의 엄마의 향수 냄새가 났다.","sourcePage":83,"pdfPage":79},{"id":360,"source":"MAIN","day":"08","word":"correlate","entryType":"","meaning":"동 상호 관련시키다, 연관성이 있다","example":"The figures seem to correlate.","translation":"그 수치들은 연관성이 있어 보인다.","sourcePage":84,"pdfPage":80},{"id":361,"source":"MAIN","day":"08","word":"communicate","entryType":"","meaning":"동 의사소통하다, 전하다, 알리다","example":"Most people communicate through SNS these days.","translation":"요즘 대부분의 사람들은 SNS를 통해 의사소통한다.","sourcePage":84,"pdfPage":80},{"id":362,"source":"MAIN","day":"08","word":"companion","entryType":"","meaning":"명 친구, 동료","example":"It's wise to steer clear of bad companions.","translation":"나쁜 친구들을 피하는 것이 현명하다.","sourcePage":84,"pdfPage":80},{"id":363,"source":"MAIN","day":"08","word":"comrade","entryType":"","meaning":"명 동지, 동료, 친구","example":"Many of his comrades were killed in combat.","translation":"많은 그의 동료들이 전투에서 사망했다.","sourcePage":84,"pdfPage":80},{"id":364,"source":"MAIN","day":"08","word":"accompany","entryType":"","meaning":"동 ~와 동반하다, 동행하다","example":"I'll accompany her to the station.","translation":"나는 그녀와 역까지 동행할 것이다.","sourcePage":84,"pdfPage":80},{"id":365,"source":"MAIN","day":"08","word":"comprise","entryType":"","meaning":"동 구성하다, 포함하다","example":"This group is comprised of nine members.","translation":"이 그룹은 9명의 회원으로 구성되어 있다.","sourcePage":85,"pdfPage":81},{"id":366,"source":"MAIN","day":"08","word":"correspond","entryType":"","meaning":"동 ① 일치하다, 상응하다 (with/to) ② 서신을 주고받다, 통신하다","example":"Her phone number does not correspond with the one listed online.","translation":"그녀의 전화번호가 온라인에 기재된 전화번호와 일치하지 않는다.","sourcePage":85,"pdfPage":81},{"id":367,"source":"MAIN","day":"08","word":"consensus","entryType":"","meaning":"명 의견 일치, 합의","example":"The President is skilled at achieving consensus on sensitive issues.","translation":"대통령은 민감한 사안들에 대해 합의를 이끌어 내는 데 능숙하다.","sourcePage":85,"pdfPage":81},{"id":368,"source":"MAIN","day":"08","word":"constant","entryType":"","meaning":"형 변하지 않는, 끊임없는 / 명 상수","example":"His constant singing was beginning to annoy her.","translation":"그의 끊임없는 노랫소리가 그녀를 짜증 나게 하기 시작했다.","sourcePage":85,"pdfPage":81},{"id":369,"source":"MAIN","day":"08","word":"coherent","entryType":"","meaning":"형 일관성 있는, 논리 정연한","example":"The flow of the story was coherent.","translation":"그 이야기의 전개는 일관성이 있었다.","sourcePage":85,"pdfPage":81},{"id":370,"source":"MAIN","day":"08","word":"commodity","entryType":"","meaning":"명 상품, 생필품, 원자재","example":"Sometimes clean water becomes a precious commodity.","translation":"때때로 깨끗한 물이 귀중한 상품이 된다.","sourcePage":86,"pdfPage":82},{"id":371,"source":"MAIN","day":"08","word":"collide","entryType":"","meaning":"동 ① 충돌하다 ② (의견이) 일치하지 않다, 상충되다","example":"We regularly collide over policy decisions.","translation":"우리는 정책 결정을 두고 정기적으로 의견 충돌을 일으킨다.","sourcePage":86,"pdfPage":82},{"id":372,"source":"MAIN","day":"08","word":"compound","entryType":"","meaning":"동 혼합하다, 합성하다 / 명 ① 화합물, 혼합물 ② 합성어 / 형 혼합의, 합성의","example":"Salt is a compound of sodium and chlorine.","translation":"소금은 나트륨과 염소의 화합물이다.","sourcePage":86,"pdfPage":82},{"id":373,"source":"MAIN","day":"08","word":"confuse","entryType":"","meaning":"동 ① 혼동하다 ② 혼란스럽게 하다","example":"He was confused by the news.","translation":"그는 그 소식에 혼란스러워했다.","sourcePage":86,"pdfPage":82},{"id":374,"source":"MAIN","day":"08","word":"console","entryType":"","meaning":"동 위로하다, 위안을 주다","example":"Nothing can console me for the loss.","translation":"그 무엇도 내게 손실에 대한 위안을 줄 수 없다.","sourcePage":86,"pdfPage":82},{"id":375,"source":"MAIN","day":"08","word":"confirm","entryType":"","meaning":"동 확인해 주다, 확증[입증]하다","example":"I'd like to confirm those results.","translation":"나는 그 결과를 확증하고 싶다.","sourcePage":87,"pdfPage":83},{"id":376,"source":"MAIN","day":"08","word":"confederate","entryType":"","meaning":"명 동맹자, 연합자 / 동 동맹하다","example":"The confederate system is not working for us.","translation":"그 연합 시스템은 우리에게 제대로 작동하지 않는다.","sourcePage":87,"pdfPage":83},{"id":377,"source":"MAIN","day":"08","word":"disorder","entryType":"","meaning":"명 무질서, 혼란, 장애","example":"The whole country is in disorder.","translation":"나라 전체가 무질서하다.","sourcePage":87,"pdfPage":83},{"id":378,"source":"MAIN","day":"08","word":"disability","entryType":"","meaning":"명 장애, 무능력","example":"The benefits the nation provides depend on the degree of disability.","translation":"국가가 제공하는 혜택은 장애의 정도에 달려 있다.","sourcePage":87,"pdfPage":83},{"id":379,"source":"MAIN","day":"08","word":"discharge","entryType":"","meaning":"동 ① 내리다, 방출하다 ② 해고하다, 제대시키다 / 명 방출, 석방, 해고, 제대","example":"The pitcher received a discharge notice from the team.","translation":"그 투수는 팀으로부터 방출 통지를 받았다.","sourcePage":87,"pdfPage":83},{"id":380,"source":"MAIN","day":"08","word":"disregard","entryType":"","meaning":"동 무시하다, 묵살하다 / 명 무시, 묵살","example":"She totally disregards others' feelings.","translation":"그녀는 다른 사람들의 감정을 완전히 무시한다.","sourcePage":88,"pdfPage":84},{"id":381,"source":"MAIN","day":"08","word":"discard","entryType":"","meaning":"동 버리다, 폐기하다","example":"10% of the data were discarded as untrustworthy.","translation":"그 데이터 중 10%가 신뢰할 수 없는 것으로 폐기되었다.","sourcePage":88,"pdfPage":84},{"id":382,"source":"MAIN","day":"08","word":"distinct","entryType":"","meaning":"형 ① 뚜렷한, 분명한 ② 별개의, 다른","example":"Irish is distinct from English.","translation":"아일랜드어는 영어와는 뚜렷이 다르다.","sourcePage":88,"pdfPage":84},{"id":383,"source":"MAIN","day":"08","word":"disinterested","entryType":"","meaning":"형 사심이 없는, 객관적인, 무관심한","example":"His advice appeared to be disinterested.","translation":"그의 충고는 사심이 없는 것으로 보였다.","sourcePage":88,"pdfPage":84},{"id":384,"source":"MAIN","day":"08","word":"discordant","entryType":"","meaning":"형 조화[일치]하지 않는","example":"The artist uses discordant colors.","translation":"그 화가는 조화를 이루지 않는 색상을 사용한다.","sourcePage":88,"pdfPage":84},{"id":385,"source":"MAIN","day":"08","word":"disparity","entryType":"","meaning":"명 차이, 불균형","example":"The disparity in their ages caused controversy.","translation":"그들의 나이 차는 논쟁을 일으켰다.","sourcePage":88,"pdfPage":84},{"id":386,"source":"MAIN","day":"08","word":"disguise","entryType":"","meaning":"동 변장[위장]하다, 속이다","example":"The Trojan horse was disguised as a gift.","translation":"트로이 목마는 선물로 위장되어 있었다.","sourcePage":89,"pdfPage":85},{"id":387,"source":"MAIN","day":"08","word":"dilute","entryType":"","meaning":"동 희석하다, 약화시키다 / 형 희석된","example":"Large classes dilute the quality of education.","translation":"대규모 학급은 교육의 질을 약화시킨다.","sourcePage":89,"pdfPage":85},{"id":388,"source":"MAIN","day":"08","word":"disseminate","entryType":"","meaning":"동 퍼뜨리다, 전파하다","example":"That information has been widely disseminated.","translation":"그 정보는 널리 전파되었다.","sourcePage":89,"pdfPage":85},{"id":389,"source":"MAIN","day":"08","word":"antisocial","entryType":"","meaning":"형 반사회적인, 비사교적인","example":"Our classmates will think you're being antisocial if you don't go.","translation":"네가 안 가면 반 친구들이 너를 비사교적이라고 생각할 거야.","sourcePage":89,"pdfPage":85},{"id":390,"source":"MAIN","day":"08","word":"antarctic","entryType":"","meaning":"형 (the A-) 남극(지방)의 / 명 남극","example":"The Antarctic is the coldest place on Earth.","translation":"남극은 지구에서 가장 추운 곳이다.","sourcePage":89,"pdfPage":85},{"id":391,"source":"MAIN","day":"08","word":"antibody","entryType":"","meaning":"명 항체","example":"Vaccines help your body produce antibodies.","translation":"백신은 우리 몸이 항체를 생성하도록 도와준다.","sourcePage":90,"pdfPage":86},{"id":392,"source":"MAIN","day":"08","word":"antibiotic","entryType":"","meaning":"명 항생제","example":"Some types of antibiotics are used to promote growth in livestock.","translation":"어떤 종류의 항생제는 가축의 성장을 촉진하기 위해 사용된다.","sourcePage":90,"pdfPage":86},{"id":393,"source":"MAIN","day":"08","word":"antioxidant","entryType":"","meaning":"명 ① 산화(노화) 방지제 ② 방부제","example":"Vitamins C and E are both an antioxidant.","translation":"비타민 C와 E는 모두 산화 방지제이다.","sourcePage":90,"pdfPage":86},{"id":394,"source":"MAIN","day":"08","word":"antagonist","entryType":"","meaning":"명 적대자","example":"He faced his antagonist on the bridge.","translation":"그는 다리 위에서 자신의 적대자와 대치했다.","sourcePage":90,"pdfPage":86},{"id":395,"source":"MAIN","day":"08","word":"contrary","entryType":"","meaning":"형 반대의, 상반[모순]되는 / 명 반대되는 것","example":"On the contrary, other star players disagree.","translation":"반면에, 다른 스타급 선수들은 동의하지 않는다.","sourcePage":90,"pdfPage":86},{"id":396,"source":"MAIN","day":"08","word":"contrast","entryType":"","meaning":"명 대조, 대비 / 동 대조하다","example":"In contrast to their neighbors, they live modestly.","translation":"이웃들과는 달리, 그들은 검소하게 산다.","sourcePage":91,"pdfPage":87},{"id":397,"source":"MAIN","day":"08","word":"counterproductive","entryType":"","meaning":"형 비생산적인, 역효과를 내는","example":"Such measures are counterproductive in a crisis.","translation":"그러한 조치는 위기 상황에서 역효과를 낸다.","sourcePage":91,"pdfPage":87},{"id":398,"source":"MAIN","day":"08","word":"encounter","entryType":"","meaning":"동 ① 우연히 만나다, 마주치다 ② (위험·곤란 등에) 맞닥뜨리다 / 명 만남, 조우","example":"We encountered a number of difficulties.","translation":"우리는 많은 어려움에 맞닥뜨렸다.","sourcePage":91,"pdfPage":87},{"id":399,"source":"MAIN","day":"08","word":"counteract","entryType":"","meaning":"동 ① 대응하다, 거스르다, 방해하다 ② (효력을) 없애다, 중화시키다","example":"He liked to counteract a person's plan.","translation":"그는 남의 계획을 방해하는 것을 좋아했다.","sourcePage":91,"pdfPage":87},{"id":400,"source":"MAIN","day":"08","word":"counterfeit","entryType":"","meaning":"동 위조하다 / 명 위조품 / 형 가짜의","example":"The brothers counterfeited bills.","translation":"그 형제는 지폐를 위조했다.","sourcePage":91,"pdfPage":87},{"id":401,"source":"MAIN","day":"09","word":"reproduce","entryType":"","meaning":"동 ① 다시 만들어 내다, 재생[재현]하다 ② (생물·동물이) 번식하다","example":"Plants can reproduce through seeds or spores.","translation":"식물은 씨앗이나 포자를 통해 번식할 수 있다.","sourcePage":92,"pdfPage":88},{"id":402,"source":"MAIN","day":"09","word":"respond","entryType":"","meaning":"동 반응하다, 응답하다 (to)","example":"They still haven't responded to my letter.","translation":"그들은 아직 내 편지에 답하지 않았다.","sourcePage":92,"pdfPage":88},{"id":403,"source":"MAIN","day":"09","word":"recall","entryType":"","meaning":"동 ① 기억해 내다, 상기하다 ② 소환하다, 회수하다","example":"I don't recall his name.","translation":"나는 그의 이름이 기억나지 않는다.","sourcePage":93,"pdfPage":89},{"id":404,"source":"MAIN","day":"09","word":"regain","entryType":"","meaning":"동 되찾다, 회복하다","example":"Regaining a lost friendship can be difficult.","translation":"잃어버린 우정을 되찾는 것은 어려울 수 있다.","sourcePage":93,"pdfPage":89},{"id":405,"source":"MAIN","day":"09","word":"replace","entryType":"","meaning":"동 대신하다, 대체하다","example":"Can you replace this document with a digital copy?","translation":"이 문서를 디지털 사본으로 대체할 수 있나요?","sourcePage":93,"pdfPage":89},{"id":406,"source":"MAIN","day":"09","word":"remove","entryType":"","meaning":"동 제거하다","example":"Remove all unnecessary items from your backpack.","translation":"배낭에서 불필요한 물건들을 모두 제거하라.","sourcePage":93,"pdfPage":89},{"id":407,"source":"MAIN","day":"09","word":"react","entryType":"","meaning":"동 반응하다, 반응을 보이다","example":"It's not easy to react calmly to criticism.","translation":"비판에 침착하게 반응하는 것은 쉽지 않다.","sourcePage":93,"pdfPage":89},{"id":408,"source":"MAIN","day":"09","word":"reassure","entryType":"","meaning":"동 안심시키다","example":"The doctor reassured the patient.","translation":"의사는 환자를 안심시켰다.","sourcePage":93,"pdfPage":89},{"id":409,"source":"MAIN","day":"09","word":"rejoice","entryType":"","meaning":"동 크게 기뻐하다","example":"We rejoice at the good news.","translation":"우리는 좋은 소식에 크게 기뻐한다.","sourcePage":94,"pdfPage":90},{"id":410,"source":"MAIN","day":"09","word":"retrieve","entryType":"","meaning":"동 되찾다, 회수하다","example":"You cannot retrieve the data from the damaged hard disk.","translation":"손상된 하드 디스크에서 데이터를 되찾을 수 없다.","sourcePage":94,"pdfPage":90},{"id":411,"source":"MAIN","day":"09","word":"retail","entryType":"","meaning":"명 소매, 소매상 / 형 소매의, 소매상의 / 동 소매하다","example":"Retail sales grew just 3.8 percent this year.","translation":"올해 소매 판매는 3.8% 증가했다.","sourcePage":94,"pdfPage":90},{"id":412,"source":"MAIN","day":"09","word":"retire","entryType":"","meaning":"동 물러나다, 은퇴하다","example":"He retired from professional tennis at his peak.","translation":"그는 전성기에 프로 테니스에서 은퇴했다.","sourcePage":94,"pdfPage":90},{"id":413,"source":"MAIN","day":"09","word":"retreat","entryType":"","meaning":"동 물러나다, 후퇴하다 / 명 후퇴, 피난처","example":"Those ill-fated children had no idea what the sea's strange retreat meant.","translation":"그 불운한 아이들은 바다의 이상한 후퇴가 무엇을 의미하는지 몰랐다.","sourcePage":94,"pdfPage":90},{"id":414,"source":"MAIN","day":"09","word":"reciprocal","entryType":"","meaning":"형 상호 간의","example":"We need a reciprocal agreement to allow student exchanges.","translation":"학생 교환을 허용하기 위해서는 상호 협정이 필요하다.","sourcePage":94,"pdfPage":90},{"id":415,"source":"MAIN","day":"09","word":"reimburse","entryType":"","meaning":"동 ~에게 변상하다, 갚다","example":"We can’t reimburse you for the parking fee.","translation":"주차 요금에 대해서는 변제해 드릴 수 없습니다.","sourcePage":95,"pdfPage":91},{"id":416,"source":"MAIN","day":"09","word":"resurrection","entryType":"","meaning":"명 부활, 소생","example":"Easter celebrates the resurrection of Jesus Christ.","translation":"부활절은 예수 그리스도의 부활을 기념하는 날이다.","sourcePage":95,"pdfPage":91},{"id":417,"source":"MAIN","day":"09","word":"amoral","entryType":"","meaning":"형 도덕관념이 없는, 선악 판단이 없는","example":"The character in the story is amoral.","translation":"그 이야기의 등장인물은 도덕관념이 없다.","sourcePage":95,"pdfPage":91},{"id":418,"source":"MAIN","day":"09","word":"anarchy","entryType":"","meaning":"명 무정부 상태, (정치·사회적) 혼란","example":"Anarchy is the absence of government and law.","translation":"무정부 상태는 정부와 법이 없는 상태이다.","sourcePage":95,"pdfPage":91},{"id":419,"source":"MAIN","day":"09","word":"amnesia","entryType":"","meaning":"명 기억 상실(증), 건망증","example":"She suffers from amnesia since the car accident.","translation":"그녀는 교통사고 이후 기억 상실증을 앓고 있다.","sourcePage":95,"pdfPage":91},{"id":420,"source":"MAIN","day":"09","word":"aesthetic","entryType":"","meaning":"형 미학적인, 심미적인 / 명 미학, 미적 감각","example":"The building has a pleasing aesthetic.","translation":"그 건물은 보기 좋은 미적 감각을 가지고 있다.","sourcePage":95,"pdfPage":91},{"id":421,"source":"MAIN","day":"09","word":"appoint","entryType":"","meaning":"동 ① 임명[지명]하다 ② (시간·장소 등을) 정하다","example":"They will appoint her as their new manager.","translation":"그들은 그녀를 새 관리자로 임명할 것이다.","sourcePage":96,"pdfPage":92},{"id":422,"source":"MAIN","day":"09","word":"adhere","entryType":"","meaning":"동 ① 들러붙다, 부착하다 (to) ② 고수하다 (to)","example":"The glue does not adhere to the wall.","translation":"그 접착제는 벽에 붙지 않는다.","sourcePage":96,"pdfPage":92},{"id":423,"source":"MAIN","day":"09","word":"adjust","entryType":"","meaning":"동 ① 맞추다, 조정[조절]하다 ② 적응하다","example":"He will quickly adjust himself to student life.","translation":"그는 학생으로서의 생활에 빠르게 적응할 것이다.","sourcePage":96,"pdfPage":92},{"id":424,"source":"MAIN","day":"09","word":"adapt","entryType":"","meaning":"동 ① 적응하다[시키다] ② 맞추다, 조정하다 ③ 각색하다, 개작하다","example":"The movie business must adapt to changing conditions in the marketplace.","translation":"영화 산업은 변화하는 시장 상황에 적응해야 한다.","sourcePage":96,"pdfPage":92},{"id":425,"source":"MAIN","day":"09","word":"adopt","entryType":"","meaning":"동 ① 채택하다 ② 입양하다","example":"The textbook was adopted in several schools.","translation":"그 교과서는 여러 학교에서 채택되었다.","sourcePage":97,"pdfPage":93},{"id":426,"source":"MAIN","day":"09","word":"accord","entryType":"","meaning":"동 ① 일치하다 (with) ② 부여하다 / 명 일치, 합의","example":"The results accord with our predictions.","translation":"그 결과는 우리의 예상과 일치한다.","sourcePage":97,"pdfPage":93},{"id":427,"source":"MAIN","day":"09","word":"affirm","entryType":"","meaning":"동 확인하다, 단언하다, 주장하다","example":"The reporter affirmed that the news was true.","translation":"그 기자는 그 뉴스가 사실이라고 단언했다.","sourcePage":97,"pdfPage":93},{"id":428,"source":"MAIN","day":"09","word":"acknowledge","entryType":"","meaning":"동 ① 인정하다, 시인하다 ② 감사를 표현하다","example":"She acknowledged that she had made a mistake.","translation":"그녀는 자신이 실수를 했다는 것을 인정했다.","sourcePage":97,"pdfPage":93},{"id":429,"source":"MAIN","day":"09","word":"attach","entryType":"","meaning":"동 붙이다, 첨부하다","example":"A price tag was attached to each article.","translation":"각 물품에 가격표가 붙어 있었다.","sourcePage":97,"pdfPage":93},{"id":430,"source":"MAIN","day":"09","word":"assure","entryType":"","meaning":"동 보장[보증]하다, 장담하다","example":"I assure you of his innocence.","translation":"나는 그의 결백을 보증한다.","sourcePage":97,"pdfPage":93},{"id":431,"source":"MAIN","day":"09","word":"admire","entryType":"","meaning":"동 존경하다, 감탄하며 바라보다","example":"I admire people who can work in such difficult conditions.","translation":"나는 그런 어려운 환경에서 일할 수 있는 사람들을 존경한다.","sourcePage":98,"pdfPage":94},{"id":432,"source":"MAIN","day":"09","word":"affiliate","entryType":"","meaning":"동 ① 가입시키다 ② 합병시키다","example":"The company was affiliated with another big one.","translation":"그 회사는 다른 대기업과 합병되었다.","sourcePage":98,"pdfPage":94},{"id":433,"source":"MAIN","day":"09","word":"appease","entryType":"","meaning":"동 진정시키다, 달래다","example":"Nothing could appease the crying baby.","translation":"아무것도 우는 아기를 달랠 수 없었다.","sourcePage":98,"pdfPage":94},{"id":434,"source":"MAIN","day":"09","word":"acquiesce","entryType":"","meaning":"동 묵인하다, (마지못해) 따르다 (in)","example":"The police acquiesced in our proposal.","translation":"경찰은 우리의 제안을 묵인했다.","sourcePage":98,"pdfPage":94},{"id":435,"source":"MAIN","day":"09","word":"assert","entryType":"","meaning":"동 ① 분명히 말하다 ② 주장하다","example":"He asserted that he was innocent.","translation":"그는 자신이 무죄라고 주장했다.","sourcePage":99,"pdfPage":95},{"id":436,"source":"MAIN","day":"09","word":"assort","entryType":"","meaning":"동 ① 분류하다 ② 구색을 갖추다","example":"He assorted the products into three kinds.","translation":"그는 상품들을 세 종류로 분류했다.","sourcePage":99,"pdfPage":95},{"id":437,"source":"MAIN","day":"09","word":"uneasy","entryType":"","meaning":"형 불편한, 불안한, 불안정한","example":"The feeling of uneasiness in the unfamiliar surroundings.","translation":"낯선 환경에서의 불안한 느낌.","sourcePage":99,"pdfPage":95},{"id":438,"source":"MAIN","day":"09","word":"uncommon","entryType":"","meaning":"형 드문, 흔하지 않은","example":"Breast cancer in young men is uncommon.","translation":"젊은 남성의 유방암은 드물다.","sourcePage":99,"pdfPage":95},{"id":439,"source":"MAIN","day":"09","word":"unfavorable","entryType":"","meaning":"형 ① 호의적이지 않은 ② 비판적인 ③ 불리한","example":"The decision was unfavorable to us all.","translation":"그 결정은 우리 모두에게 불리했다.","sourcePage":99,"pdfPage":95},{"id":440,"source":"MAIN","day":"09","word":"unbearable","entryType":"","meaning":"형 견딜 수 없는, 참을 수 없는","example":"The heat was almost unbearable.","translation":"더위는 거의 견딜 수 없을 정도였다.","sourcePage":100,"pdfPage":96},{"id":441,"source":"MAIN","day":"09","word":"unconscious","entryType":"","meaning":"형 ① 의식이 없는 ② 무의식적인","example":"He has been unconscious for a week.","translation":"그는 일주일 동안 의식이 없었다.","sourcePage":100,"pdfPage":96},{"id":442,"source":"MAIN","day":"09","word":"unconditional","entryType":"","meaning":"형 무조건적인, 절대적인","example":"The fans gave her unconditional love.","translation":"팬들은 그녀에게 무조건적인 사랑을 주었다.","sourcePage":100,"pdfPage":96},{"id":443,"source":"MAIN","day":"09","word":"unwillingly","entryType":"","meaning":"부 마지못해서, 본의 아니게","example":"He unwillingly accepted the offer.","translation":"그는 마지못해 그 제안을 받아들였다.","sourcePage":100,"pdfPage":96},{"id":444,"source":"MAIN","day":"09","word":"unbiased","entryType":"","meaning":"형 선입견 없는, 공평한","example":"He is unbiased about the subject.","translation":"그는 그 주제에 대해 선입견이 없다.","sourcePage":100,"pdfPage":96},{"id":445,"source":"MAIN","day":"09","word":"uneven","entryType":"","meaning":"형 ① 불규칙한, 평평하지 않은 ② 공정하지 않은","example":"The surface felt uneven under his feet.","translation":"그의 발밑으로 표면이 울퉁불퉁하게 느껴졌다.","sourcePage":100,"pdfPage":96},{"id":446,"source":"MAIN","day":"09","word":"uninterested","entryType":"","meaning":"형 관심 없는, 무관심한","example":"He seemed uninterested in the discussion.","translation":"그는 그 토론에 관심이 없어 보였다.","sourcePage":101,"pdfPage":97},{"id":447,"source":"MAIN","day":"09","word":"unfold","entryType":"","meaning":"동 ① (접힌 것을) 펴다, 펼치다 ② (내용 등을) 펼치다[전개되다]","example":"The audience listened in fascination as the story unfolded.","translation":"이야기가 전개되는 동안 관객들은 매료된 채 귀를 기울였다.","sourcePage":101,"pdfPage":97},{"id":448,"source":"MAIN","day":"09","word":"unsettle","entryType":"","meaning":"동 ① 뒤흔들다, 동요시키다 ② 불안하게 하다","example":"Changing rules might unsettle the players.","translation":"규칙을 바꾸는 것은 선수들을 불안하게 할 수 있다.","sourcePage":101,"pdfPage":97},{"id":449,"source":"MAIN","day":"09","word":"unearth","entryType":"","meaning":"동 파내다, 발굴하다","example":"The scientists unearthed buried fossils.","translation":"과학자들이 묻혀 있던 화석을 발굴했다.","sourcePage":101,"pdfPage":97},{"id":450,"source":"MAIN","day":"09","word":"undo","entryType":"","meaning":"동 ① 무효로 만들다, 원상태로 돌리다 ② 풀다, 풀어놓다","example":"What is done cannot be undone.","translation":"이미 저질러진 일은 되돌릴 수 없다.","sourcePage":101,"pdfPage":97},{"id":451,"source":"MAIN","day":"10","word":"misunderstand","entryType":"","meaning":"동 오해하다","example":"I think she misunderstood what I meant.","translation":"그녀가 내 말을 오해한 것 같다.","sourcePage":102,"pdfPage":98},{"id":452,"source":"MAIN","day":"10","word":"misuse","entryType":"","meaning":"명 오용, 남용 / 동 오용하다, 남용하다","example":"Some people misuse credit cards and end up in debt.","translation":"어떤 사람들은 신용카드를 오용하여 빚을 지게 된다.","sourcePage":102,"pdfPage":98},{"id":453,"source":"MAIN","day":"10","word":"mislead","entryType":"","meaning":"동 ① 잘못 인도하다, 오도하다 ② 속이다, 현혹하다","example":"Fake news articles can mislead people.","translation":"가짜 뉴스 기사는 사람들을 오도할 수 있다.","sourcePage":103,"pdfPage":99},{"id":454,"source":"MAIN","day":"10","word":"misplace","entryType":"","meaning":"동 잘못 두다, 놓은 곳을 잊다","example":"I've misplaced my car key.","translation":"나는 자동차 열쇠를 잘못 둬서 잃어버렸다.","sourcePage":103,"pdfPage":99},{"id":455,"source":"MAIN","day":"10","word":"miscarry","entryType":"","meaning":"동 ① 실패하다 ② 유산하다","example":"You can even miscarry without knowing you're pregnant.","translation":"당신은 임신한 줄도 모르고 유산할 수도 있다.","sourcePage":103,"pdfPage":99},{"id":456,"source":"MAIN","day":"10","word":"misbehave","entryType":"","meaning":"동 못된 짓을 하다, 비행을 저지르다","example":"Can boredom cause a child to misbehave?","translation":"지루함이 아이의 잘못된 행동을 유발할 수 있나요?","sourcePage":103,"pdfPage":99},{"id":457,"source":"MAIN","day":"10","word":"misdeed","entryType":"","meaning":"명 악행, 범죄","example":"Stealing is a serious misdeed with legal consequences.","translation":"도둑질은 법적 처벌을 받을 수 있는 심각한 악행이다.","sourcePage":103,"pdfPage":99},{"id":458,"source":"MAIN","day":"10","word":"mischief","entryType":"","meaning":"명 ① (심각하지 않은) 나쁜 짓, 장난기 ② 손해","example":"Raccoons are known for their mischief.","translation":"너구리는 장난을 잘 치기로 유명하다.","sourcePage":103,"pdfPage":99},{"id":459,"source":"MAIN","day":"10","word":"malnutrition","entryType":"","meaning":"명 영양실조, 영양결핍","example":"A balanced diet is essential to prevent malnutrition.","translation":"영양실조를 예방하려면 균형 잡힌 식단이 필수적이다.","sourcePage":104,"pdfPage":100},{"id":460,"source":"MAIN","day":"10","word":"malfunction","entryType":"","meaning":"명 기능 불량, 오작동 / 동 제대로 작동하지 않다","example":"The flight has been canceled due to the engine malfunction.","translation":"엔진 고장으로 비행이 취소되었다.","sourcePage":104,"pdfPage":100},{"id":461,"source":"MAIN","day":"10","word":"malady","entryType":"","meaning":"명 병, (사회의) 병폐","example":"She suffers from a mysterious malady.","translation":"그녀는 알 수 없는 병으로 고통받고 있다.","sourcePage":104,"pdfPage":100},{"id":462,"source":"MAIN","day":"10","word":"malice","entryType":"","meaning":"명 악의, 적의","example":"The anonymous comment was filled with malice.","translation":"그 익명의 댓글에는 악의가 가득했다.","sourcePage":104,"pdfPage":100},{"id":463,"source":"MAIN","day":"10","word":"beneficial","entryType":"","meaning":"형 유익한, 이로운","example":"Those plants that we call weeds are often beneficial.","translation":"우리가 잡초라고 부르는 식물들이 종종 유익하다.","sourcePage":104,"pdfPage":100},{"id":464,"source":"MAIN","day":"10","word":"beneficent","entryType":"","meaning":"형 도움을 주는, 선행을 베푸는, 친절한","example":"She carries on a beneficent work.","translation":"그녀는 자선 사업을 한다.","sourcePage":105,"pdfPage":101},{"id":465,"source":"MAIN","day":"10","word":"benevolent","entryType":"","meaning":"형 인정 많은, 자비로운","example":"She acted as if she was so benevolent.","translation":"그녀는 마치 자신이 상당히 자비로운 듯 행동했다.","sourcePage":105,"pdfPage":101},{"id":466,"source":"MAIN","day":"10","word":"symphony","entryType":"","meaning":"명 ① 교향곡, 교향악단 ② 조화","example":"She plays the viola in a symphony orchestra.","translation":"그녀는 교향악단에서 비올라를 연주한다.","sourcePage":105,"pdfPage":101},{"id":467,"source":"MAIN","day":"10","word":"synchronize","entryType":"","meaning":"동 동시에 발생하다[움직이다], 동시에 발생하게[움직이게] 하다","example":"The cloud storage service keeps all your devices synchronized.","translation":"클라우드 스토리지 서비스는 모든 장치를 동기화 상태로 유지한다.","sourcePage":105,"pdfPage":101},{"id":468,"source":"MAIN","day":"10","word":"symbiosis","entryType":"","meaning":"명 공생(共生)","example":"Her ideas are focused on symbiosis.","translation":"그녀의 생각은 공생에 초점이 맞추어져 있다.","sourcePage":105,"pdfPage":101},{"id":469,"source":"MAIN","day":"10","word":"synthetic","entryType":"","meaning":"형 합성의, 인조의","example":"Nylon is a synthetic fiber.","translation":"나일론은 합성 섬유이다.","sourcePage":106,"pdfPage":102},{"id":470,"source":"MAIN","day":"10","word":"enable","entryType":"","meaning":"동 ~할 수 있게 하다","example":"Money enables you to do everything.","translation":"돈은 당신이 모든 것을 할 수 있게 한다.","sourcePage":106,"pdfPage":102},{"id":471,"source":"MAIN","day":"10","word":"enlarge","entryType":"","meaning":"동 확대하다, 확장하다","example":"Magnifiers can enlarge part of the screen.","translation":"돋보기는 화면의 일부를 확대할 수 있다.","sourcePage":106,"pdfPage":102},{"id":472,"source":"MAIN","day":"10","word":"endanger","entryType":"","meaning":"동 위험에 빠뜨리다, 위험하게 하다","example":"Deforestation endangers wildlife habitats.","translation":"삼림 벌채는 야생 동물의 서식지를 위험에 빠뜨린다.","sourcePage":106,"pdfPage":102},{"id":473,"source":"MAIN","day":"10","word":"encourage","entryType":"","meaning":"동 ① 용기를 북돋우다, 격려하다 ② 장려하다","example":"People have been encouraged to use credit cards for various reasons.","translation":"사람들은 여러 가지 이유로 신용카드를 사용하도록 장려되어 왔다.","sourcePage":106,"pdfPage":102},{"id":474,"source":"MAIN","day":"10","word":"enrich","entryType":"","meaning":"동 풍부하게 하다, 질을 높이다","example":"Dams hold back silt which enriches the soil.","translation":"댐은 토양을 풍부하게 하는 미사를 가둔다.","sourcePage":107,"pdfPage":103},{"id":475,"source":"MAIN","day":"10","word":"ensure","entryType":"","meaning":"동 확실하게 하다, 보장[보증]하다","example":"Proofread your work to ensure there are no mistakes.","translation":"실수가 없는지 확실하게 하기 위해 작업물을 교정하라.","sourcePage":107,"pdfPage":103},{"id":476,"source":"MAIN","day":"10","word":"entrust","entryType":"","meaning":"동 위임하다, 맡기다","example":"Passengers entrust their safety to the bus driver.","translation":"승객들은 자신의 안전을 버스 운전기사에게 맡긴다.","sourcePage":107,"pdfPage":103},{"id":477,"source":"MAIN","day":"10","word":"enlist","entryType":"","meaning":"동 병적에 넣다, 입대시키다, 징집하다","example":"The author was enlisted into the US Navy.","translation":"그 작가는 미 해군에 입대했다.","sourcePage":107,"pdfPage":103},{"id":478,"source":"MAIN","day":"10","word":"enact","entryType":"","meaning":"동 제정하다","example":"France enacted a new law against illegal immigrants.","translation":"프랑스는 불법 이민자들에 대한 새로운 법을 제정했다.","sourcePage":107,"pdfPage":103},{"id":479,"source":"MAIN","day":"10","word":"entitle","entryType":"","meaning":"동 ~에게 권리를 주다, 자격을 주다","example":"Senior citizens are often entitled to discounts on public transportation.","translation":"노인들은 종종 대중교통 요금을 할인받을 자격이 있다.","sourcePage":108,"pdfPage":104},{"id":480,"source":"MAIN","day":"10","word":"empower","entryType":"","meaning":"동 권한을 주다, 자격을 주다","example":"The movement started to empower women to vote.","translation":"그 운동은 여성에게 투표할 권한을 주는 것에서 시작되었다.","sourcePage":108,"pdfPage":104},{"id":481,"source":"MAIN","day":"10","word":"embody","entryType":"","meaning":"동 구체화하다, 구현하다","example":"This painting embodies the beauty of the Italian countryside.","translation":"이 그림은 이탈리아 시골의 아름다움을 구현한다.","sourcePage":108,"pdfPage":104},{"id":482,"source":"MAIN","day":"10","word":"embed","entryType":"","meaning":"동 (보통 수동태로) 깊숙이 박다, 파묻다","example":"A piece of glass was embedded in his leg.","translation":"유리 조각이 그의 다리에 깊숙이 박혔다.","sourcePage":108,"pdfPage":104},{"id":483,"source":"MAIN","day":"10","word":"enliven","entryType":"","meaning":"동 활기 있게 하다, 더 생동감 있게 만들다","example":"The children's arrival enlivened a boring evening.","translation":"아이들의 도착은 지루한 저녁을 활기 있게 만들었다.","sourcePage":108,"pdfPage":104},{"id":484,"source":"MAIN","day":"10","word":"enlighten","entryType":"","meaning":"동 이해시키다, 계몽하다","example":"The author published books to enlighten the public.","translation":"그 작가는 대중을 계몽하기 위해 책을 출판했다.","sourcePage":108,"pdfPage":104},{"id":485,"source":"MAIN","day":"10","word":"encompass","entryType":"","meaning":"동 둘러싸다, 포함하다, 아우르다","example":"Our group encompasses all ages.","translation":"우리 그룹은 모든 연령대를 아우른다.","sourcePage":109,"pdfPage":105},{"id":486,"source":"MAIN","day":"10","word":"encode","entryType":"","meaning":"동 암호화하다, 부호화하다","example":"DNA encodes the genetic information.","translation":"DNA는 유전 정보를 암호화한다.","sourcePage":109,"pdfPage":105},{"id":487,"source":"MAIN","day":"10","word":"entice","entryType":"","meaning":"동 꾀다, 유혹하다","example":"She enticed me into a trap.","translation":"그녀는 나를 함정으로 유인했다.","sourcePage":109,"pdfPage":105},{"id":488,"source":"MAIN","day":"10","word":"engross","entryType":"","meaning":"동 몰두시키다, 열중하게 만들다","example":"He engrossed himself in his writing.","translation":"그는 글쓰기에 몰두했다.","sourcePage":109,"pdfPage":105},{"id":489,"source":"MAIN","day":"10","word":"forecast","entryType":"","meaning":"명 예측, 예보 / 동 예상[예측]하다, 예보하다","example":"The weather forecast calls for sunshine all week.","translation":"일기 예보는 일주일 내내 맑을 것으로 예보한다.","sourcePage":109,"pdfPage":105},{"id":490,"source":"MAIN","day":"10","word":"foresee","entryType":"","meaning":"동 예견하다","example":"It's difficult to foresee the future with complete accuracy.","translation":"완벽하게 정확하게 미래를 예견하는 것은 어렵다.","sourcePage":110,"pdfPage":106},{"id":491,"source":"MAIN","day":"10","word":"foretell","entryType":"","meaning":"동 예언하다","example":"The palm reader foretold a long and happy life.","translation":"손금 보는 사람은 길고 행복한 삶을 예언했다.","sourcePage":110,"pdfPage":106},{"id":492,"source":"MAIN","day":"10","word":"forearm","entryType":"","meaning":"명 팔뚝 / 동 앞팔을 무장시키다","example":"She was born without her left forearm.","translation":"그녀는 왼쪽 팔뚝 없이 태어났다.","sourcePage":110,"pdfPage":106},{"id":493,"source":"MAIN","day":"10","word":"foremost","entryType":"","meaning":"형 ① 선두의, 맨 앞에 위치한 ② 가장 중요한","example":"She was one of the foremost scientists.","translation":"그녀는 가장 뛰어난 과학자들 중 한 명이었다.","sourcePage":110,"pdfPage":106},{"id":494,"source":"MAIN","day":"10","word":"forerunner","entryType":"","meaning":"명 선구자, 전신","example":"The silent film era was a forerunner of modern cinema.","translation":"무성 영화 시대는 현대 영화의 선구자였다.","sourcePage":110,"pdfPage":106},{"id":495,"source":"MAIN","day":"10","word":"forehead","entryType":"","meaning":"명 이마","example":"She wrinkled her forehead in concentration.","translation":"그녀는 집중해서 이마를 찌푸렸다.","sourcePage":110,"pdfPage":106},{"id":496,"source":"MAIN","day":"10","word":"progress","entryType":"","meaning":"명 진전, 진보 / 동 진전하다, 발전하다","example":"Innovation is essential for continued progress.","translation":"혁신은 지속적인 발전에 필수적이다.","sourcePage":111,"pdfPage":107},{"id":497,"source":"MAIN","day":"10","word":"procedure","entryType":"","meaning":"명 순서, 절차","example":"Are blood tests part of the procedure?","translation":"혈액 검사가 그 절차의 일부인가요?","sourcePage":111,"pdfPage":107},{"id":498,"source":"MAIN","day":"10","word":"prospect","entryType":"","meaning":"명 ① 가능성 ② 전망, 예상 ③ 조망, 경치","example":"The prospect of the shipbuilding industry is not very hopeful.","translation":"조선 산업의 전망은 그다지 밝지 않다.","sourcePage":111,"pdfPage":107},{"id":499,"source":"MAIN","day":"10","word":"prophecy","entryType":"","meaning":"명 예언","example":"The prophecy that Oedipus feared has actually come true.","translation":"오이디푸스가 두려워했던 예언이 실제로 이루어졌다.","sourcePage":111,"pdfPage":107},{"id":500,"source":"MAIN","day":"10","word":"provision","entryType":"","meaning":"명 ① 공급, 준비 ② 조항, 규정, 조치","example":"He made no provision for extra attendees.","translation":"그는 추가 참석자들을 위한 준비를 전혀 하지 않았다.","sourcePage":111,"pdfPage":107},{"id":501,"source":"MAIN","day":"11","word":"incredible","entryType":"","meaning":"형 믿을 수 없는, 엄청난","example":"The movie I saw today was incredible.","translation":"오늘 본 영화는 엄청났다.","sourcePage":112,"pdfPage":108},{"id":502,"source":"MAIN","day":"11","word":"impatient","entryType":"","meaning":"형 참을성 없는, 성급한","example":"I blamed myself for being so impatient with the children.","translation":"나는 아이들에게 너무 참을성 없었던 것을 자책했다.","sourcePage":112,"pdfPage":108},{"id":503,"source":"MAIN","day":"11","word":"impolite","entryType":"","meaning":"형 불손한, 무례한","example":"His impolite behavior caused a serious ethical debate.","translation":"그의 무례한 행동은 심각한 윤리적 논쟁을 불러일으켰다.","sourcePage":112,"pdfPage":108},{"id":504,"source":"MAIN","day":"11","word":"immoral","entryType":"","meaning":"형 부도덕한","example":"Capital punishment was regarded as immoral.","translation":"사형은 부도덕한 것으로 여겨졌다.","sourcePage":113,"pdfPage":109},{"id":505,"source":"MAIN","day":"11","word":"imprudent","entryType":"","meaning":"형 경솔한, 무모한, 신중치 못한","example":"She was imprudent enough to trust him.","translation":"그녀는 경솔하게도 그를 믿었다.","sourcePage":113,"pdfPage":109},{"id":506,"source":"MAIN","day":"11","word":"independent","entryType":"","meaning":"형 독립적인, 독자적인","example":"She became financially independent of her parents.","translation":"그녀는 부모로부터 경제적으로 독립하게 되었다.","sourcePage":113,"pdfPage":109},{"id":507,"source":"MAIN","day":"11","word":"indifferent","entryType":"","meaning":"형 무관심한, 냉담한","example":"People have become indifferent to the suffering of others.","translation":"사람들은 다른 사람들의 고통에 대해 무관심해졌다.","sourcePage":113,"pdfPage":109},{"id":508,"source":"MAIN","day":"11","word":"impartial","entryType":"","meaning":"형 공정한, 공평한","example":"Referees have to make impartial judgments.","translation":"심판들은 공정한 판단을 내려야만 한다.","sourcePage":113,"pdfPage":109},{"id":509,"source":"MAIN","day":"11","word":"invaluable","entryType":"","meaning":"형 매우 귀중한","example":"In his job, patience is an invaluable asset.","translation":"그가 하는 일에서는 인내가 귀중한 자산이다.","sourcePage":114,"pdfPage":110},{"id":510,"source":"MAIN","day":"11","word":"infamous","entryType":"","meaning":"형 악명 높은","example":"The general was infamous for his brutality.","translation":"그 장군은 무자비하기로 악명 높았다.","sourcePage":114,"pdfPage":110},{"id":511,"source":"MAIN","day":"11","word":"inevitable","entryType":"","meaning":"형 피할 수 없는, 필연적인","example":"It was an inevitable consequence of the recent changes.","translation":"그것은 최근 변화의 필연적인 결과였다.","sourcePage":114,"pdfPage":110},{"id":512,"source":"MAIN","day":"11","word":"indispensable","entryType":"","meaning":"형 필수 불가결한, 없어서는 안 될","example":"A compass is indispensable for any hiker.","translation":"나침반은 등산객에게 없어서는 안 될 필수품이다.","sourcePage":114,"pdfPage":110},{"id":513,"source":"MAIN","day":"11","word":"irreversible","entryType":"","meaning":"형 변경할 수 없는, 되돌릴 수 없는","example":"Damage done to the environment is irreversible.","translation":"환경에 입혀진 피해는 되돌리기 어렵다.","sourcePage":114,"pdfPage":110},{"id":514,"source":"MAIN","day":"11","word":"irreparable","entryType":"","meaning":"형 ① 수리할 수 없는 ② 회복할 수 없는","example":"The actor's death is an irreparable loss.","translation":"그 배우의 죽음은 회복할 수 없는 손실이다.","sourcePage":115,"pdfPage":111},{"id":515,"source":"MAIN","day":"11","word":"inaudible","entryType":"","meaning":"형 알아들을 수 없는, 들리지 않는","example":"She whispered something inaudible in his ear.","translation":"그녀는 그의 귀에 들리지 않는 말을 속삭였다.","sourcePage":115,"pdfPage":111},{"id":516,"source":"MAIN","day":"11","word":"incessant","entryType":"","meaning":"형 끊임없는, 쉴 새 없는","example":"They were tired of the incessant work.","translation":"그들은 끊임없는 일에 지쳤다.","sourcePage":115,"pdfPage":111},{"id":517,"source":"MAIN","day":"11","word":"indiscriminate","entryType":"","meaning":"형 ① 무분별한, 무차별적인 ② 신중하지 못한","example":"We are indiscriminate in collecting stamps.","translation":"우리는 닥치는 대로 우표를 모은다.","sourcePage":115,"pdfPage":111},{"id":518,"source":"MAIN","day":"11","word":"inarticulate","entryType":"","meaning":"형 불분명한","example":"Their demands are often inarticulate.","translation":"그들의 요구는 종종 불분명하다.","sourcePage":115,"pdfPage":111},{"id":519,"source":"MAIN","day":"11","word":"illicit","entryType":"","meaning":"형 위법[불법]의, 금지된","example":"He was accused of the illicit sale of drugs.","translation":"그는 불법 마약 판매로 기소되었다.","sourcePage":115,"pdfPage":111},{"id":520,"source":"MAIN","day":"11","word":"inborn","entryType":"","meaning":"형 타고난, 선천적인","example":"Children seem to have an inborn love for music.","translation":"아이들은 음악에 대해서 선천적인 애정을 가진 것처럼 보인다.","sourcePage":116,"pdfPage":112},{"id":521,"source":"MAIN","day":"11","word":"insight","entryType":"","meaning":"명 통찰력","example":"You will have the insight you need to sort it all out.","translation":"당신은 그것을 모두 정리하는 데 필요한 통찰력을 갖게 될 것이다.","sourcePage":116,"pdfPage":112},{"id":522,"source":"MAIN","day":"11","word":"income","entryType":"","meaning":"명 수입, 소득","example":"My wife has some income besides her salary.","translation":"내 아내는 월급 외에 부수입이 있다.","sourcePage":116,"pdfPage":112},{"id":523,"source":"MAIN","day":"11","word":"instinct","entryType":"","meaning":"명 ① 본능, 직감 ② (타고난) 재능, 소질","example":"Do humans still rely on their basic instincts for survival?","translation":"인간은 여전히 생존을 위해 기본 본능에 의존하나요?","sourcePage":116,"pdfPage":112},{"id":524,"source":"MAIN","day":"11","word":"intuition","entryType":"","meaning":"명 직관(력), 직감","example":"His intuition tells him that she is telling a lie.","translation":"그의 직감상 그녀는 거짓말을 하고 있다.","sourcePage":116,"pdfPage":112},{"id":525,"source":"MAIN","day":"11","word":"inject","entryType":"","meaning":"동 주입하다, 주사하다","example":"Farmers feed or inject the animals with antibiotics.","translation":"농부들은 동물들에게 항생제를 먹이거나 주사한다.","sourcePage":117,"pdfPage":113},{"id":526,"source":"MAIN","day":"11","word":"instill","entryType":"","meaning":"동 (사상·감정 등을) 주입하다, 불어넣다","example":"The professor tried to instill his philosophy into his students.","translation":"그 교수는 자신의 철학을 학생들에게 주입시키려 했다.","sourcePage":117,"pdfPage":113},{"id":527,"source":"MAIN","day":"11","word":"input","entryType":"","meaning":"명 ① 투입(량), 조언[시간]의 제공 ② 입력 / 동 (정보 등을) 입력하다","example":"A mouse is one of the input devices.","translation":"마우스는 입력 장치 중의 하나이다.","sourcePage":117,"pdfPage":113},{"id":528,"source":"MAIN","day":"11","word":"install","entryType":"","meaning":"동 설치하다","example":"The game won't run unless you install the latest patch.","translation":"최신 패치를 설치하지 않으면 게임이 실행되지 않을 것이다.","sourcePage":117,"pdfPage":113},{"id":529,"source":"MAIN","day":"11","word":"infuriate","entryType":"","meaning":"동 격분하게 하다","example":"The hollow words of the President infuriated me.","translation":"대통령의 공허한 말들이 나를 격분시켰다.","sourcePage":117,"pdfPage":113},{"id":530,"source":"MAIN","day":"11","word":"impoverish","entryType":"","meaning":"동 ① 가난하게 하다 ② (질을) 저하시키다","example":"The acid rain impoverishes the soil.","translation":"산성비는 토양의 질을 저하시킨다.","sourcePage":118,"pdfPage":114},{"id":531,"source":"MAIN","day":"11","word":"intimidate","entryType":"","meaning":"동 위협하다, 협박하다","example":"They intimidated people into voting for them.","translation":"그들은 사람들이 자신들에게 투표하도록 위협했다.","sourcePage":118,"pdfPage":114},{"id":532,"source":"MAIN","day":"11","word":"inhale","entryType":"","meaning":"동 들이쉬다, 들이마시다","example":"I closed my eyes and inhaled deeply.","translation":"나는 눈을 감고 숨을 깊이 들이마셨다.","sourcePage":118,"pdfPage":114},{"id":533,"source":"MAIN","day":"11","word":"imprison","entryType":"","meaning":"동 투옥하다, 감금하다","example":"The bank robber was imprisoned for 20 years.","translation":"그 은행 강도는 20년 동안 수감되었다.","sourcePage":118,"pdfPage":114},{"id":534,"source":"MAIN","day":"11","word":"inmate","entryType":"","meaning":"명 ① 수감자 ② (정신병원) 입원자","example":"The two inmates busted out of their cell.","translation":"두 명의 수감자가 감옥에서 탈출했다.","sourcePage":118,"pdfPage":114},{"id":535,"source":"MAIN","day":"11","word":"impart","entryType":"","meaning":"동 ① 전하다 ② 나누어 주다","example":"I have disappointing news to impart to you.","translation":"너에게 전해 줄 실망스러운 소식이 있다.","sourcePage":118,"pdfPage":114},{"id":536,"source":"MAIN","day":"11","word":"express","entryType":"","meaning":"동 표현하다, 나타내다 / 형 급행의 / 명 급행, 속달","example":"The purpose of your letter is to express love and gratitude.","translation":"당신 편지의 목적은 사랑과 감사를 표현하는 것이다.","sourcePage":119,"pdfPage":115},{"id":537,"source":"MAIN","day":"11","word":"extinct","entryType":"","meaning":"형 멸종된, 사라진","example":"The species couldn't adapt to the climate and became extinct.","translation":"그 종은 기후에 적응하지 못하고 멸종되었다.","sourcePage":119,"pdfPage":115},{"id":538,"source":"MAIN","day":"11","word":"exhaust","entryType":"","meaning":"동 ① 기진맥진하게 하다 ② 다 써 버리다","example":"He didn't want to exhaust himself anymore.","translation":"그는 더 이상 자신을 기진맥진하게 하고 싶지 않았다.","sourcePage":119,"pdfPage":115},{"id":539,"source":"MAIN","day":"11","word":"eradicate","entryType":"","meaning":"동 근절하다, 뿌리 뽑다","example":"It is her mission to eradicate illegalities and corruption.","translation":"불법행위를 근절하는 것이 그녀의 임무이다.","sourcePage":119,"pdfPage":115},{"id":540,"source":"MAIN","day":"11","word":"efface","entryType":"","meaning":"동 삭제하다, 지우다","example":"Kate effaced some lines in a book.","translation":"Kate는 책에서 몇 줄을 지웠다.","sourcePage":119,"pdfPage":115},{"id":541,"source":"MAIN","day":"11","word":"excel","entryType":"","meaning":"동 능가하다, (~보다) 뛰어나다","example":"Tom excelled among his classmates in mathematics.","translation":"Tom은 같은 반 친구들 중에서도 수학에 뛰어났다.","sourcePage":120,"pdfPage":116},{"id":542,"source":"MAIN","day":"11","word":"exotic","entryType":"","meaning":"형 이국적인, 외국의","example":"She likes exotic flowers.","translation":"그녀는 이국적인 꽃들을 좋아한다.","sourcePage":120,"pdfPage":116},{"id":543,"source":"MAIN","day":"11","word":"exile","entryType":"","meaning":"동 추방하다 / 명 추방자, 망명자","example":"The opposition leader returned after 40 years of exile.","translation":"그 야당 지도자는 40년간의 망명 생활에서 돌아왔다.","sourcePage":120,"pdfPage":116},{"id":544,"source":"MAIN","day":"11","word":"exorcise","entryType":"","meaning":"동 내쫓다","example":"The priest exorcised evil spirits.","translation":"그 사제는 악한 귀신을 내쫓았다.","sourcePage":120,"pdfPage":116},{"id":545,"source":"MAIN","day":"11","word":"elicit","entryType":"","meaning":"동 끌어내다, 유도해 내다","example":"I could elicit no response from the client.","translation":"나는 그 고객으로부터 아무 반응도 끌어낼 수 없었다.","sourcePage":120,"pdfPage":116},{"id":546,"source":"MAIN","day":"11","word":"exorbitant","entryType":"","meaning":"형 과도한, 지나친","example":"This luxurious car costs an exorbitant amount of maintenance.","translation":"이 호화로운 차는 과도한 유지비가 든다.","sourcePage":121,"pdfPage":117},{"id":547,"source":"MAIN","day":"11","word":"extracurricular","entryType":"","meaning":"형 과외의, 정규 과목 이외의","example":"Many schools offer a variety of extracurricular programs.","translation":"많은 학교에서 다양한 과외 프로그램을 제공한다.","sourcePage":121,"pdfPage":117},{"id":548,"source":"MAIN","day":"11","word":"extraordinary","entryType":"","meaning":"형 ① 놀라운, 기이한 ② 비범한, 대단한","example":"The critic was a truly extraordinary woman.","translation":"그 평론가는 참으로 비범한 여성이었다.","sourcePage":121,"pdfPage":117},{"id":549,"source":"MAIN","day":"11","word":"extravagant","entryType":"","meaning":"형 낭비하는, 사치스러운","example":"Her family was enraged at her extravagant lifestyle.","translation":"그녀의 가족은 그녀의 사치스러운 생활 방식에 격분했다.","sourcePage":121,"pdfPage":117},{"id":550,"source":"MAIN","day":"11","word":"extrinsic","entryType":"","meaning":"형 비본질적인, 외부의, 관련 없는","example":"They had to consider extrinsic factors.","translation":"그들은 외부적 요인들을 고려해야 했다.","sourcePage":121,"pdfPage":117},{"id":551,"source":"MAIN","day":"12","word":"interval","entryType":"","meaning":"명 ① 간격, 사이 ② 중간 휴식 시간 ③ 간격","example":"They call at regular intervals.","translation":"그들은 정기적인 간격으로 전화한다.","sourcePage":122,"pdfPage":118},{"id":552,"source":"MAIN","day":"12","word":"intermediate","entryType":"","meaning":"형 중간의, 중급의, 중간자, 중개자","example":"Liquid crystals are considered to be intermediate between liquid and solid.","translation":"액정은 액체와 고체의 중간으로 여겨진다.","sourcePage":122,"pdfPage":118},{"id":553,"source":"MAIN","day":"12","word":"interdependent","entryType":"","meaning":"형 상호 의존적인","example":"Plants and animals are interdependent in an ecosystem.","translation":"생태계에서 식물과 동물은 상호 의존적이다.","sourcePage":122,"pdfPage":118},{"id":554,"source":"MAIN","day":"12","word":"intersection","entryType":"","meaning":"명 교차로, 교차점","example":"The accident caused traffic at the intersection.","translation":"그 사고로 교차로에 교통 체증이 발생했다.","sourcePage":123,"pdfPage":119},{"id":555,"source":"MAIN","day":"12","word":"interpret","entryType":"","meaning":"동 ① 해석하다, 이해하다 ② 통역하다","example":"He interpreted for the Norwegian tourist.","translation":"그는 노르웨이 관광객을 위해 통역했다.","sourcePage":123,"pdfPage":119},{"id":556,"source":"MAIN","day":"12","word":"intervene","entryType":"","meaning":"동 ① 간섭하다, 개입하다 ② 중재하다, 방해하다","example":"Will anyone intervene if they see injustice?","translation":"누군가 부당한 일을 본다면 개입할까?","sourcePage":123,"pdfPage":119},{"id":557,"source":"MAIN","day":"12","word":"interact","entryType":"","meaning":"동 상호 작용하다 (with)","example":"Animals in zoos rarely interact with each other.","translation":"동물원에 있는 동물들은 서로 상호 작용하는 경우가 드물다.","sourcePage":123,"pdfPage":119},{"id":558,"source":"MAIN","day":"12","word":"intertwine","entryType":"","meaning":"동 ① 뒤엉키다, 휘다 ② (주로 복수로) 밀접하게 관련되다","example":"The girl intertwined flowers in a garland.","translation":"그 소녀는 꽃들을 화환으로 엮었다.","sourcePage":123,"pdfPage":119},{"id":559,"source":"MAIN","day":"12","word":"postwar","entryType":"","meaning":"형 전후의, 전후 시대의","example":"The postwar era saw a baby boom.","translation":"전후 시대에는 베이비붐이 일어났다.","sourcePage":124,"pdfPage":120},{"id":560,"source":"MAIN","day":"12","word":"postpone","entryType":"","meaning":"동 연기하다, 미루다","example":"We postponed the launch due to technical issues.","translation":"우리는 기술적인 문제로 출시를 연기했다.","sourcePage":124,"pdfPage":120},{"id":561,"source":"MAIN","day":"12","word":"preposterous","entryType":"","meaning":"형 ① 터무니없는, 불합리한 ② 앞뒤가 뒤바뀐","example":"Don't suggest such preposterous solutions!","translation":"그런 터무니없는 해결책을 제안하지 마라!","sourcePage":124,"pdfPage":120},{"id":562,"source":"MAIN","day":"12","word":"outcome","entryType":"","meaning":"명 결과, 성과","example":"The board expected a successful outcome from the project.","translation":"이사회는 그 프로젝트에서 성공적인 결과를 기대했다.","sourcePage":124,"pdfPage":120},{"id":563,"source":"MAIN","day":"12","word":"outline","entryType":"","meaning":"명 ① 윤곽을 그리다 ② 개요를 서술하다 / 명 ① 윤곽, 외형 ② 개요","example":"Briefly outline your ideas for the upcoming campaign.","translation":"다가오는 캠페인에 대한 아이디어를 간단히 설명해라.","sourcePage":124,"pdfPage":120},{"id":564,"source":"MAIN","day":"12","word":"outstanding","entryType":"","meaning":"형 ① 뛰어난, 걸출한 ② 미지불된, 미해결된","example":"She is known to be an outstanding scholar.","translation":"그녀는 뛰어난 학자로 알려져 있다.","sourcePage":125,"pdfPage":121},{"id":565,"source":"MAIN","day":"12","word":"outspoken","entryType":"","meaning":"형 거리낌 없는, 솔직한","example":"His outspoken expressions sometimes offend me.","translation":"그의 거침없는 표현이 때때로 나를 불쾌하게 한다.","sourcePage":125,"pdfPage":121},{"id":566,"source":"MAIN","day":"12","word":"outbreak","entryType":"","meaning":"명 발생, 발발","example":"People were in a panic due to the outbreak of war.","translation":"사람들은 전쟁 발발로 공포에 빠졌다.","sourcePage":125,"pdfPage":121},{"id":567,"source":"MAIN","day":"12","word":"outfit","entryType":"","meaning":"명 의상 한 벌, 복장, 차림","example":"She picked a stylish outfit for the party.","translation":"그녀는 파티에 입을 멋진 의상을 골랐다.","sourcePage":125,"pdfPage":121},{"id":568,"source":"MAIN","day":"12","word":"outrage","entryType":"","meaning":"명 ① 격분, 격노 ② 폭행, 폭력 행위 / 동 격분하게 만들다","example":"The accused expressed outrage at the judgment.","translation":"피고인은 그 판결에 격분을 표했다.","sourcePage":125,"pdfPage":121},{"id":569,"source":"MAIN","day":"12","word":"outlaw","entryType":"","meaning":"동 불법화하다, 금하다 / 명 범법자, 도망자","example":"Smoking is outlawed in this building.","translation":"이 건물에서는 흡연이 금지되어 있다.","sourcePage":125,"pdfPage":121},{"id":570,"source":"MAIN","day":"12","word":"outdated","entryType":"","meaning":"형 시대에 뒤떨어진, 구식의","example":"The office computer system is hopelessly outdated.","translation":"사무실 컴퓨터 시스템은 완전히 구식이다.","sourcePage":126,"pdfPage":122},{"id":571,"source":"MAIN","day":"12","word":"outweigh","entryType":"","meaning":"동 ~보다 더 중요하다, 능가하다","example":"The risks related to social media outweigh the rewards.","translation":"소셜 미디어와 관련된 위험이 보상보다 더 크다.","sourcePage":126,"pdfPage":122},{"id":572,"source":"MAIN","day":"12","word":"outlive","entryType":"","meaning":"동 ~보다 더 오래 살다","example":"Turtles can outlive humans.","translation":"거북이는 인간보다 오래 살 수 있다.","sourcePage":126,"pdfPage":122},{"id":573,"source":"MAIN","day":"12","word":"decline","entryType":"","meaning":"동 감소[하락]하다, 쇠퇴하다 / 명 감소, 쇠퇴","example":"The value of the dollar on the world market has declined in recent years.","translation":"최근 몇 년간 세계 시장에서 달러의 가치가 하락했다.","sourcePage":126,"pdfPage":122},{"id":574,"source":"MAIN","day":"12","word":"defect","entryType":"","meaning":"명 ① 결함[결점] ② 부적[불량] / 동 망명하다, 배반하다","example":"The car was recalled due to a safety defect.","translation":"그 자동차는 안전 결함 때문에 리콜되었다.","sourcePage":126,"pdfPage":122},{"id":575,"source":"MAIN","day":"12","word":"detach","entryType":"","meaning":"동 분리하다, 떼어내다","example":"You also can detach and carry it.","translation":"그것을 분리해서 가지고 다닐 수도 있다.","sourcePage":127,"pdfPage":123},{"id":576,"source":"MAIN","day":"12","word":"declare","entryType":"","meaning":"동 ① 선언하다, 발표하다 ② (세관에) 신고하다","example":"The prince was declared the rightful heir to the throne.","translation":"그 왕자는 왕위의 정당한 후계자로 선언되었다.","sourcePage":127,"pdfPage":123},{"id":577,"source":"MAIN","day":"12","word":"deceased","entryType":"","meaning":"형 사망한 / 명 고인","example":"They honored the memory of the deceased.","translation":"그들은 고인을 추모했다.","sourcePage":127,"pdfPage":123},{"id":578,"source":"MAIN","day":"12","word":"debate","entryType":"","meaning":"명 토론, 논쟁 / 동 토론하다, 논쟁하다","example":"The party also devoted a large part of its conference to a debate on education.","translation":"그 정당은 또한 회의의 상당 부분을 교육에 관한 토론에 할애했다.","sourcePage":127,"pdfPage":123},{"id":579,"source":"MAIN","day":"12","word":"devote","entryType":"","meaning":"동 바치다, 헌신하다, 전념하다","example":"We must devote a lot of time to this project.","translation":"우리는 이 프로젝트에 많은 시간을 바쳐야 한다.","sourcePage":127,"pdfPage":123},{"id":580,"source":"MAIN","day":"12","word":"depart","entryType":"","meaning":"동 출발하다, 떠나다","example":"Flights for Paris depart from Terminal 3.","translation":"파리행 항공편은 3번 터미널에서 출발한다.","sourcePage":128,"pdfPage":124},{"id":581,"source":"MAIN","day":"12","word":"degrade","entryType":"","meaning":"동 ① (가치·품질 등을) 저하시키다 ② 강등(좌천)시키다 ③ (화학적으로) 분해하다","example":"Medicinal effects can degrade over time.","translation":"약효는 시간이 지나면서 저하될 수 있다.","sourcePage":128,"pdfPage":124},{"id":582,"source":"MAIN","day":"12","word":"biodegrade","entryType":"","meaning":"동 (생물학적으로) 자연 분해되다","example":"Choose eco-friendly products that biodegrade easily.","translation":"쉽게 자연 분해되는 친환경 제품을 선택하라.","sourcePage":128,"pdfPage":124},{"id":583,"source":"MAIN","day":"12","word":"debase","entryType":"","meaning":"동 (가치·품질 등을) 저하시키다, 떨어뜨리다","example":"Sports are debased by commercial sponsorship.","translation":"스포츠는 상업적 후원으로 가치가 떨어진다.","sourcePage":128,"pdfPage":124},{"id":584,"source":"MAIN","day":"12","word":"depict","entryType":"","meaning":"동 그리다, 묘사하다","example":"They depicted the situation to us in great detail.","translation":"그들은 우리에게 그 상황을 매우 상세하게 묘사했다.","sourcePage":128,"pdfPage":124},{"id":585,"source":"MAIN","day":"12","word":"deprive","entryType":"","meaning":"동 빼앗다, 박탈하다","example":"The fire deprived them of their home.","translation":"화재가 그들에게서 집을 빼앗았다.","sourcePage":129,"pdfPage":125},{"id":586,"source":"MAIN","day":"12","word":"deliberate","entryType":"","meaning":"형 고의적인, 신중한 / 동 심사숙고하다, 숙고하다","example":"The mistake seemed deliberate, not accidental.","translation":"그 실수는 우연이 아니라 고의적인 것처럼 보였다.","sourcePage":129,"pdfPage":125},{"id":587,"source":"MAIN","day":"12","word":"decay","entryType":"","meaning":"동 썩다, 부패하다, 쇠퇴하다 / 명 부패, 쇠퇴","example":"Leaves that fall from trees decay and turn into soil eventually.","translation":"나무에서 떨어진 잎은 썩어서 결국 흙으로 변한다.","sourcePage":129,"pdfPage":125},{"id":588,"source":"MAIN","day":"12","word":"decompose","entryType":"","meaning":"동 ① 부패하다[시키다] ② (성분·물질 등을) 분해하다","example":"Bacteria decompose dead things.","translation":"박테리아는 죽은 것들을 분해한다.","sourcePage":129,"pdfPage":125},{"id":589,"source":"MAIN","day":"12","word":"dehydrate","entryType":"","meaning":"동 (식품을) 건조시키다, 탈수 상태가 되다","example":"Hot weather can quickly dehydrate you.","translation":"더운 날씨는 당신을 빠르게 탈수시킬 수 있다.","sourcePage":129,"pdfPage":125},{"id":590,"source":"MAIN","day":"12","word":"defunct","entryType":"","meaning":"형 현존하지 않는, 폐지된","example":"Videotapes became defunct due to digital devices.","translation":"비디오테이프는 디지털 기기 때문에 사라졌다.","sourcePage":130,"pdfPage":126},{"id":591,"source":"MAIN","day":"12","word":"default","entryType":"","meaning":"명 채무 불이행, 불이행 / 동 채무를 이행하지 않다","example":"The auto company is in default on the loan.","translation":"그 자동차 회사는 대출금을 상환하지 못하고 있다.","sourcePage":130,"pdfPage":126},{"id":592,"source":"MAIN","day":"12","word":"superior","entryType":"","meaning":"형 ① ~보다 우수한 ② 상급의 / 명 윗사람, 상급자","example":"My daughter is definitely superior to other children.","translation":"내 딸은 다른 아이들보다 확실히 우수하다.","sourcePage":130,"pdfPage":126},{"id":593,"source":"MAIN","day":"12","word":"superb","entryType":"","meaning":"형 최고의, 뛰어난","example":"He displayed a superb batting performance at the last game.","translation":"그는 지난 경기에서 뛰어난 타격 실력을 보여 주었다.","sourcePage":130,"pdfPage":126},{"id":594,"source":"MAIN","day":"12","word":"supreme","entryType":"","meaning":"형 ① 최고의, 대단한 ② 최고 권위의 / 명 최고, 최대","example":"They danced in a state of supreme joy.","translation":"그들은 최고의 기쁨 속에서 춤을 추었다.","sourcePage":130,"pdfPage":126},{"id":595,"source":"MAIN","day":"12","word":"superficial","entryType":"","meaning":"형 피상적인, 깊이가 없는","example":"The book shows only a superficial understanding of the theory.","translation":"그 책은 그 이론에 대해 피상적인 이해만 보여준다.","sourcePage":131,"pdfPage":127},{"id":596,"source":"MAIN","day":"12","word":"supernatural","entryType":"","meaning":"형 초자연적인, 불가사의한","example":"The ritual involved supernatural forces, they said.","translation":"그들은 그 의식에 초자연적인 힘이 관련되어 있다고 말했다.","sourcePage":131,"pdfPage":127},{"id":597,"source":"MAIN","day":"12","word":"superstition","entryType":"","meaning":"명 미신","example":"Breaking a mirror is a well-known superstition.","translation":"거울을 깨는 것은 잘 알려진 미신이다.","sourcePage":131,"pdfPage":127},{"id":598,"source":"MAIN","day":"12","word":"superfluous","entryType":"","meaning":"형 여분의, 남아도는","example":"It was his superfluous wealth that ruined him.","translation":"그를 파멸시킨 것은 그의 지나치게 많은 재산이었다.","sourcePage":131,"pdfPage":127},{"id":599,"source":"MAIN","day":"12","word":"surplus","entryType":"","meaning":"명 잉여, 과잉 / 형 잉여의, 과잉의","example":"Just omit the surplus words.","translation":"그냥 잉여 단어는 빼라.","sourcePage":131,"pdfPage":127},{"id":600,"source":"MAIN","day":"12","word":"surveillance","entryType":"","meaning":"명 감시, 망보기, 감독","example":"The parking lot is kept under video surveillance.","translation":"주차장은 비디오 감시를 받고 있다.","sourcePage":131,"pdfPage":127},{"id":601,"source":"MAIN","day":"13","word":"underlying","entryType":"","meaning":"형 ① 근본적인 ② 밑에 있는","example":"They will talk about the underlying cause of the rising crime rate.","translation":"그들은 증가하는 범죄율의 근본적인 원인에 대해 이야기할 것이다.","sourcePage":132,"pdfPage":128},{"id":602,"source":"MAIN","day":"13","word":"underline","entryType":"","meaning":"동 ① 밑줄을 긋다 ② 강조하다","example":"Translate the underlined parts into English.","translation":"밑줄 친 부분을 영어로 번역하세요.","sourcePage":132,"pdfPage":128},{"id":603,"source":"MAIN","day":"13","word":"undertake","entryType":"","meaning":"동 ① 떠맡다 ② 착수하다, 시작하다","example":"Our team undertook research on aging.","translation":"우리 팀은 노화에 대한 연구에 착수했다.","sourcePage":132,"pdfPage":128},{"id":604,"source":"MAIN","day":"13","word":"undercover","entryType":"","meaning":"형 비밀리에 하는, 첩보 활동의, 위장 근무의","example":"The arms dealer was arrested by the undercover cop.","translation":"무기 거래상이 위장 근무 중인 경찰에게 체포되었다.","sourcePage":133,"pdfPage":129},{"id":605,"source":"MAIN","day":"13","word":"undermine","entryType":"","meaning":"동 ① 손상시키다, 약화시키다 ② 몰래 파다","example":"This crisis has undermined my position.","translation":"이런 위기가 내 지위를 약화시켜 왔다.","sourcePage":133,"pdfPage":129},{"id":606,"source":"MAIN","day":"13","word":"subconscious","entryType":"","meaning":"형 잠재의식의 / 명 잠재의식","example":"Surrealism explores the subconscious elements of the human mind.","translation":"초현실주의는 인간 내면의 잠재의식적 요소를 탐구한다.","sourcePage":133,"pdfPage":129},{"id":607,"source":"MAIN","day":"13","word":"subject","entryType":"","meaning":"형 ① 지배를 받는, ~에 영향을 받기 쉬운 (to) ② 복종시키다 / 명 ① 과목 ② 주제 ③ 백성 ④ 피실험자","example":"All human beings are subject to death.","translation":"모든 인간은 죽음의 지배를 받는다.","sourcePage":133,"pdfPage":129},{"id":608,"source":"MAIN","day":"13","word":"subtle","entryType":"","meaning":"형 ① 미묘한 ② 섬세한","example":"There are subtle differences between them.","translation":"그것들 사이에는 미묘한 차이가 있다.","sourcePage":133,"pdfPage":129},{"id":609,"source":"MAIN","day":"13","word":"suburb","entryType":"","meaning":"명 교외","example":"They moved from the city to the suburbs.","translation":"그들은 도시에서 교외로 이사
