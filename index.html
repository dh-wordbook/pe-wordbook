"meaning":"동 구조하다, 구출하다, 건지다","example":"We salvaged several paintings from the fire.","translation":"우리는 화재에서 몇 점의 그림을 구해냈다.","sourcePage":260,"pdfPage":108},{"id":1325,"source":"MAIN","day":"27","word":"tow","entryType":"","meaning":"동 끌다, 견인하다","example":"My car broke down, and a truck towed it to the garage.","translation":"내 차가 고장 나서 트럭이 그것을 차고로 견인했다.","sourcePage":260,"pdfPage":108},{"id":1326,"source":"MAIN","day":"27","word":"drag","entryType":"","meaning":"동 끌다, 잡아당기다","example":"The strong current dragged the boat downstream.","translation":"강한 물살이 배를 하류로 끌고 갔다.","sourcePage":260,"pdfPage":108},{"id":1327,"source":"MAIN","day":"27","word":"haul","entryType":"","meaning":"동 잡아끌다, 세게 당기다","example":"He was hauled along to the police station.","translation":"그는 경찰서까지 끌려갔다.","sourcePage":260,"pdfPage":108},{"id":1328,"source":"MAIN","day":"27","word":"bestow","entryType":"","meaning":"동 수여하다, 주다, 부여하다","example":"The king bestowed knighthood on his loyal subject.","translation":"왕은 충성스러운 신하에게 기사 작위를 수여했다.","sourcePage":260,"pdfPage":108},{"id":1329,"source":"MAIN","day":"27","word":"donate","entryType":"","meaning":"동 기부하다, 기증하다","example":"Some libraries have agreed to donate books to schools.","translation":"일부 도서관은 학교에 책을 기부하기로 동의했다.","sourcePage":260,"pdfPage":108},{"id":1330,"source":"MAIN","day":"27","word":"endow","entryType":"","meaning":"동 ① 기부하다 ② 주다, 부여하다","example":"The queen endowed him with the power to enforce the law.","translation":"여왕은 그에게 법을 집행할 권한을 부여했다.","sourcePage":261,"pdfPage":109},{"id":1331,"source":"MAIN","day":"27","word":"grant","entryType":"","meaning":"동 ① 승인하다 ② 주다, 수여하다 / 명 보조금","example":"The boys were granted an extra day of vacation.","translation":"소년들은 휴가를 하루 더 받았다.","sourcePage":261,"pdfPage":109},{"id":1332,"source":"MAIN","day":"27","word":"award","entryType":"","meaning":"동 주다, 수여하다 / 명 상","example":"They were awarded the Nobel Prize for Physics.","translation":"그들은 노벨 물리학상을 받았다.","sourcePage":261,"pdfPage":109},{"id":1333,"source":"MAIN","day":"27","word":"reward","entryType":"","meaning":"명 보상(금), 보답 / 동 보상하다, 보답하다","example":"A reward was offered for the child's safe return.","translation":"그 아이의 무사 귀환을 위해 보상금이 제시되었다.","sourcePage":261,"pdfPage":109},{"id":1334,"source":"MAIN","day":"27","word":"compensate","entryType":"","meaning":"동 ① 보상하다, 배상하다 ② 보충하다","example":"Nothing can compensate for the loss of a loved one.","translation":"사랑하는 사람을 잃은 것은 그 무엇으로도 보상할 수 없다.","sourcePage":261,"pdfPage":109},{"id":1335,"source":"MAIN","day":"27","word":"render","entryType":"","meaning":"동 ① ~이 되게 하다 ② (대가로) 주다, 제공하다","example":"Depression can render one hopeless.","translation":"우울증은 사람을 절망적으로 만들 수 있다.","sourcePage":261,"pdfPage":109},{"id":1336,"source":"MAIN","day":"27","word":"qualify","entryType":"","meaning":"동 ~에게 자격(권한)을 주다","example":"Paying a fee doesn’t qualify you for membership.","translation":"회비를 내는 것이 당신에게 회원 자격을 주는 것은 아니다.","sourcePage":261,"pdfPage":109},{"id":1337,"source":"MAIN","day":"27","word":"eligible","entryType":"","meaning":"형 자격이 있는, 적격의","example":"There weren't any eligible candidates in this election.","translation":"이번 선거에는 자격이 있는 후보자가 없었다.","sourcePage":262,"pdfPage":110},{"id":1338,"source":"MAIN","day":"27","word":"suitable","entryType":"","meaning":"형 적합한, 적절한","example":"He is suitable for the post.","translation":"그는 그 직책에 적합하다.","sourcePage":262,"pdfPage":110},{"id":1339,"source":"MAIN","day":"27","word":"proper","entryType":"","meaning":"형 적절한, 적당한","example":"He is the proper person for the work.","translation":"그는 그 일에 적합한 사람이다.","sourcePage":262,"pdfPage":110},{"id":1340,"source":"MAIN","day":"27","word":"appropriate","entryType":"","meaning":"형 적절한, 알맞은 / 동 도용하다, 무단 사용하다 ③ 충당하다","example":"Jeans are not appropriate for a formal party.","translation":"청바지는 격식 있는 파티에 적절하지 않다.","sourcePage":262,"pdfPage":110},{"id":1341,"source":"MAIN","day":"27","word":"relevant","entryType":"","meaning":"형 적절한, 관련된","example":"Does he have the relevant experience?","translation":"그는 관련된 경험을 가지고 있는가?","sourcePage":262,"pdfPage":110},{"id":1342,"source":"MAIN","day":"27","word":"immune","entryType":"","meaning":"형 ① 면역의, 면역성이 있는 ② ~이 면제된","example":"Stress has weakened his immune system.","translation":"스트레스는 그의 면역 체계를 약화시켰다.","sourcePage":262,"pdfPage":110},{"id":1343,"source":"MAIN","day":"27","word":"exempt","entryType":"","meaning":"형 (의무·책임을) 면제된 / 동 면제하다","example":"Some students are exempt from certain exams.","translation":"일부 학생들은 특정 시험이 면제된다.","sourcePage":262,"pdfPage":110},{"id":1344,"source":"MAIN","day":"27","word":"craft","entryType":"","meaning":"명 ① 기술, 솜씨, 공예 ② 선박, 비행기","example":"You taught us through crafts and pictures.","translation":"당신은 공예와 그림을 통해 우리에게 가르쳐 주었다.","sourcePage":263,"pdfPage":111},{"id":1345,"source":"MAIN","day":"27","word":"draft","entryType":"","meaning":"명 ① 도안, 초안, 설계 ② 징병 / 동 ① 초안을 작성하다, 설계하다 ② 징병하다","example":"He showed me the draft of an article he was writing.","translation":"그는 자신이 쓰고 있던 기사의 초안을 나에게 보여주었다.","sourcePage":263,"pdfPage":111},{"id":1346,"source":"MAIN","day":"27","word":"profile","entryType":"","meaning":"명 ① 윤곽 ② 개요 ③ (얼굴의) 옆모습","example":"You have a great profile.","translation":"당신은 옆모습이 아주 멋지다.","sourcePage":263,"pdfPage":111},{"id":1347,"source":"MAIN","day":"27","word":"blueprint","entryType":"","meaning":"명 ① 청사진, 설계도 ② 계획 / 동 청사진을 만들다, 계획하다","example":"The architect drafted the blueprints for the building.","translation":"그 건축가는 건물의 청사진 초안을 작성했다.","sourcePage":263,"pdfPage":111},{"id":1348,"source":"MAIN","day":"27","word":"scheme","entryType":"","meaning":"명 계획 / 동 계획하다","example":"They schemed to overthrow the Cabinet.","translation":"그들은 내각을 전복할 계획을 꾸몄다.","sourcePage":263,"pdfPage":111},{"id":1349,"source":"MAIN","day":"27","word":"project","entryType":"","meaning":"명 계획 / 동 ① 계획하다 ② 투영하다","example":"They set up a project to computerize the library system.","translation":"그들은 도서관 체계를 전산화할 계획을 세웠다.","sourcePage":263,"pdfPage":111},{"id":1350,"source":"MAIN","day":"27","word":"streamline","entryType":"","meaning":"동 ① 효율화하다, 간소화하다 ② 유선형으로 하다","example":"We hope to streamline the laborious process.","translation":"우리는 그 힘든 과정을 간소화하기를 희망한다.","sourcePage":263,"pdfPage":111},{"id":1351,"source":"MAIN","day":"28","word":"muse","entryType":"","meaning":"동 명상하다, 곰곰이 생각하다 / 명 ① (영감을 주는) 작품 ② 명상","example":"He mused on the mystery of death.","translation":"그는 죽음의 신비를 곰곰이 생각했다.","sourcePage":264,"pdfPage":112},{"id":1352,"source":"MAIN","day":"28","word":"contemplate","entryType":"","meaning":"동 심사숙고하다, 고려하다","example":"You're too young to contemplate retirement.","translation":"당신은 은퇴를 고려하기에는 너무 젊다.","sourcePage":264,"pdfPage":112},{"id":1353,"source":"MAIN","day":"28","word":"ponder","entryType":"","meaning":"동 숙고하다, 곰곰이 생각하다","example":"Ponder the error of your thought.","translation":"당신 생각의 오류를 곰곰이 생각하라.","sourcePage":264,"pdfPage":112},{"id":1354,"source":"MAIN","day":"28","word":"irrespective","entryType":"","meaning":"형 ~와 상관없는 (of)","example":"I will buy the clothes irrespective of the price.","translation":"나는 가격에 상관없이 그 옷을 살 것이다.","sourcePage":265,"pdfPage":113},{"id":1355,"source":"MAIN","day":"28","word":"tolerate","entryType":"","meaning":"동 참다, 견디다","example":"I can just about tolerate it at the moment.","translation":"나는 지금은 그것을 그럭저럭 참을 수 있다.","sourcePage":265,"pdfPage":113},{"id":1356,"source":"MAIN","day":"28","word":"undergo","entryType":"","meaning":"동 ① 겪다, 경험하다 ② 참다, 견디다","example":"She had to undergo many hardships in her life.","translation":"그녀는 삶에서 많은 고충을 겪어야만 했다.","sourcePage":265,"pdfPage":113},{"id":1357,"source":"MAIN","day":"28","word":"endure","entryType":"","meaning":"동 ① 참다, 견디다 ② 지속되다","example":"They endure day after day.","translation":"그들은 매일매일 견딘다.","sourcePage":265,"pdfPage":113},{"id":1358,"source":"MAIN","day":"28","word":"durable","entryType":"","meaning":"형 내구성이 있는, 오래가는, 튼튼한","example":"This desk was made with durable wood.","translation":"이 책상은 튼튼한 나무로 만들어졌다.","sourcePage":265,"pdfPage":113},{"id":1359,"source":"MAIN","day":"28","word":"sturdy","entryType":"","meaning":"형 튼튼한, 건강한","example":"My grandfather still remains hale and sturdy.","translation":"나의 할아버지는 여전히 건강하고 튼튼하시다.","sourcePage":265,"pdfPage":113},{"id":1360,"source":"MAIN","day":"28","word":"robust","entryType":"","meaning":"형 건강한, 튼튼한","example":"The company has a robust security system.","translation":"그 회사는 튼튼한 보안 시스템을 갖추고 있다.","sourcePage":265,"pdfPage":113},{"id":1361,"source":"MAIN","day":"28","word":"patient","entryType":"","meaning":"명 환자 / 형 인내심 있는, 참을성 있는","example":"She's very patient with young children.","translation":"그녀는 어린 아이들에게 매우 인내심 있다.","sourcePage":266,"pdfPage":114},{"id":1362,"source":"MAIN","day":"28","word":"liberal","entryType":"","meaning":"형 ① 자유주의의, 자유로운 ② 관대한, 후한 / 명 자유주의자","example":"His parents are very liberal, and they respect his spirit of independence.","translation":"그의 부모는 매우 자유주의적이고 그의 자립심을 존중해 준다.","sourcePage":266,"pdfPage":114},{"id":1363,"source":"MAIN","day":"28","word":"generous","entryType":"","meaning":"형 ① 관대한, 너그러운 ② 풍부한","example":"A generous smile gives everyone a boost.","translation":"너그러운 미소는 모두에게 힘을 준다.","sourcePage":266,"pdfPage":114},{"id":1364,"source":"MAIN","day":"28","word":"tranquil","entryType":"","meaning":"형 고요한, 평온한","example":"He looked at the man with a tranquil eye.","translation":"그는 그 남자를 평온한 눈으로 바라보았다.","sourcePage":266,"pdfPage":114},{"id":1365,"source":"MAIN","day":"28","word":"serene","entryType":"","meaning":"형 조용한, 평온한","example":"The woods were reflected in the serene lake.","translation":"나무는 평온한 호수에 반사되었다.","sourcePage":266,"pdfPage":114},{"id":1366,"source":"MAIN","day":"28","word":"aesthetic","entryType":"","meaning":"형 심미적인 / 명 미학","example":"She told us her aesthetic appreciation of the music.","translation":"그녀는 우리에게 그 음악에 대한 심미적 감상을 말해 주었다.","sourcePage":266,"pdfPage":114},{"id":1367,"source":"MAIN","day":"28","word":"urban","entryType":"","meaning":"형 도시의, 도심의","example":"We can make urban drivers pay more in gasoline taxes.","translation":"우리는 도시 운전자들이 휘발유 세금을 더 많이 내도록 할 수 있다.","sourcePage":266,"pdfPage":114},{"id":1368,"source":"MAIN","day":"28","word":"municipal","entryType":"","meaning":"형 시의, 자치의","example":"They took her to the municipal hospital.","translation":"그들은 그녀를 시립병원으로 데려갔다.","sourcePage":267,"pdfPage":115},{"id":1369,"source":"MAIN","day":"28","word":"federal","entryType":"","meaning":"형 ① 연방의, 동맹(연합)의 ② (미국) 연방 정부의","example":"The FBI is a federal agency.","translation":"FBI는 연방 기관이다.","sourcePage":267,"pdfPage":115},{"id":1370,"source":"MAIN","day":"28","word":"celebrity","entryType":"","meaning":"명 유명 인사, 명성","example":"She had an interview with the celebrity.","translation":"그녀는 그 유명 인사와 인터뷰했다.","sourcePage":267,"pdfPage":115},{"id":1371,"source":"MAIN","day":"28","word":"prestige","entryType":"","meaning":"명 위신, 명성","example":"The invention brought the scientist honor and prestige.","translation":"그 발명품은 그 과학자에게 명예와 위신을 가져다주었다.","sourcePage":267,"pdfPage":115},{"id":1372,"source":"MAIN","day":"28","word":"fame","entryType":"","meaning":"명 평판, 명성","example":"Fame brought her nothing but distress.","translation":"명성은 그녀에게 고통밖에 가져다주지 않았다.","sourcePage":267,"pdfPage":115},{"id":1373,"source":"MAIN","day":"28","word":"repute","entryType":"","meaning":"명 평판, 명성 / 동 평판하다, 여기다","example":"My parents were artists of some repute.","translation":"우리 부모님은 어느 정도 명성이 있는 화가들이었다.","sourcePage":267,"pdfPage":115},{"id":1374,"source":"MAIN","day":"28","word":"renown","entryType":"","meaning":"명 명성","example":"She used to be a singer of some renown.","translation":"그녀는 명성이 좀 있는 가수였다.","sourcePage":267,"pdfPage":115},{"id":1375,"source":"MAIN","day":"28","word":"notorious","entryType":"","meaning":"형 악명 높은","example":"She is notorious for fouling others' names.","translation":"그녀는 다른 이들의 험담을 하기로 악명 높다.","sourcePage":268,"pdfPage":116},{"id":1376,"source":"MAIN","day":"28","word":"oval","entryType":"","meaning":"명 타원형 / 형 타원형의","example":"The table is oval-shaped.","translation":"그 탁자는 타원형 모양이다.","sourcePage":268,"pdfPage":116},{"id":1377,"source":"MAIN","day":"28","word":"spiral","entryType":"","meaning":"형 나선형의","example":"There was a spiral staircase in his luxurious house.","translation":"그의 호화로운 집에는 나선형 계단이 있었다.","sourcePage":268,"pdfPage":116},{"id":1378,"source":"MAIN","day":"28","word":"curl","entryType":"","meaning":"동 ① 곱슬곱슬하게 하다 ② 웅크리다, 감다 / 명 곱슬머리","example":"Dry curly hair naturally for maximum curl and shine.","translation":"곱슬거림과 윤기를 최상으로 하기 위해 곱슬머리를 자연스럽게 말리세요.","sourcePage":268,"pdfPage":116},{"id":1379,"source":"MAIN","day":"28","word":"wind","entryType":"","meaning":"명 바람, 강풍 / 동 ① (길·강이) 구부러지다, 굽이치다 ② (실·옷을) 감다, 돌리다","example":"The river winds along.","translation":"강이 굽이쳐 흐른다.","sourcePage":268,"pdfPage":116},{"id":1380,"source":"MAIN","day":"28","word":"blow","entryType":"","meaning":"동 ① (입으로) 불다 ② (바람이) 불다 / 명 강타, 타격","example":"The wind is blowing leaves everywhere.","translation":"바람이 사방에 나뭇잎을 날리고 있다.","sourcePage":268,"pdfPage":116},{"id":1381,"source":"MAIN","day":"28","word":"oral","entryType":"","meaning":"형 구두의, 구강의","example":"An oral agreement is not enough.","translation":"구두 합의만으로는 충분하지 않다.","sourcePage":269,"pdfPage":117},{"id":1382,"source":"MAIN","day":"28","word":"verbal","entryType":"","meaning":"형 언어의, 구두의","example":"Don't count on a verbal promise.","translation":"구두로 한 약속은 믿지 마라.","sourcePage":269,"pdfPage":117},{"id":1383,"source":"MAIN","day":"28","word":"linguistic","entryType":"","meaning":"형 언어(학)의","example":"His linguistic ability served him well in his career.","translation":"그의 언어 능력은 그의 경력에 큰 도움이 되었다.","sourcePage":269,"pdfPage":117},{"id":1384,"source":"MAIN","day":"28","word":"eloquent","entryType":"","meaning":"형 웅변의, 말 잘하는","example":"She is an eloquent speaker.","translation":"그녀는 웅변가이다.","sourcePage":269,"pdfPage":117},{"id":1385,"source":"MAIN","day":"28","word":"colloquial","entryType":"","meaning":"형 구어(체)의, 대화(체)의","example":"The book is written in a colloquial style.","translation":"그 책은 구어체 방식으로 쓰였다.","sourcePage":269,"pdfPage":117},{"id":1386,"source":"MAIN","day":"28","word":"dialect","entryType":"","meaning":"명 방언, 사투리","example":"The villagers speak their own dialect.","translation":"그 마을 사람들은 그들만의 방언을 사용한다.","sourcePage":269,"pdfPage":117},{"id":1387,"source":"MAIN","day":"28","word":"loquacious","entryType":"","meaning":"형 수다스러운, 말이 많은","example":"He becomes loquacious after he drinks.","translation":"그는 술을 마신 후에 말이 많아진다.","sourcePage":269,"pdfPage":117},{"id":1388,"source":"MAIN","day":"28","word":"chatter","entryType":"","meaning":"동 재잘거리다 / 명 재잘거림, 수다","example":"Stop chattering and finish your work.","translation":"그만 재잘거리고 네 일을 끝내라.","sourcePage":270,"pdfPage":118},{"id":1389,"source":"MAIN","day":"28","word":"comment","entryType":"","meaning":"동 논평하다 / 명 논평, 언급","example":"She refused to comment on the outcome of the election.","translation":"그녀는 선거 결과에 대해 논평하기를 거부했다.","sourcePage":270,"pdfPage":118},{"id":1390,"source":"MAIN","day":"28","word":"mention","entryType":"","meaning":"동 말하다, 언급하다 / 명 언급","example":"Suppose you mention the name of your new neighbor to a friend.","translation":"네가 너의 새로운 이웃의 이름을 어떤 친구에게 언급한다고 가정해 보자.","sourcePage":270,"pdfPage":118},{"id":1391,"source":"MAIN","day":"28","word":"refer","entryType":"","meaning":"동 ① 언급하다 (to), (A를 B라고) 부르다 (to A as B) ② 참고[참조]하다 ③ 가리키다","example":"They agreed never to refer to the matter again.","translation":"그들은 그 문제를 다시는 언급하지 않기로 동의했다.","sourcePage":270,"pdfPage":118},{"id":1392,"source":"MAIN","day":"28","word":"cite","entryType":"","meaning":"동 ① 인용하다, 언급하다 ② 소환하다","example":"The devil can cite Scripture for his purpose.","translation":"악마는 자신의 목적을 위해서 성경을 인용할 수도 있다.","sourcePage":270,"pdfPage":118},{"id":1393,"source":"MAIN","day":"28","word":"quote","entryType":"","meaning":"동 ① 인용하다 ② 예를 들다 ③ 견적을 내다 / 명 ① 인용 어구 ② 견적가","example":"Misusing quotes can be misleading.","translation":"인용문을 잘못 사용하면 오해의 소지가 있다.","sourcePage":270,"pdfPage":118},{"id":1394,"source":"MAIN","day":"28","word":"recite","entryType":"","meaning":"동 ① 암송하다 ② 낭독하다","example":"Each student had to recite a poem to the class.","translation":"각 학생은 학급 학생들 앞에서 시를 암송해야 했다.","sourcePage":270,"pdfPage":118},{"id":1395,"source":"MAIN","day":"28","word":"pronounce","entryType":"","meaning":"동 ① 발음하다 ② 선언하다, 발표하다","example":"He couldn't pronounce my name correctly.","translation":"그는 내 이름을 정확히 발음하지 못했다.","sourcePage":271,"pdfPage":119},{"id":1396,"source":"MAIN","day":"28","word":"homogeneous","entryType":"","meaning":"형 동종의, 동질의","example":"It was a tedious city of homogeneous buildings.","translation":"그곳은 동종의 건물들로 이루어진 따분한 도시였다.","sourcePage":271,"pdfPage":119},{"id":1397,"source":"MAIN","day":"28","word":"equivalent","entryType":"","meaning":"형 ① 동등한 ② 상당하는, 맞먹는 / 명 동등한 것","example":"His remark is equivalent to an insult.","translation":"그의 말은 모욕이나 다름없다.","sourcePage":271,"pdfPage":119},{"id":1398,"source":"MAIN","day":"28","word":"parallel","entryType":"","meaning":"형 ① 평행의 ② 유사한 / 명 ① 평행선 ② 대등한 것 / 동 ① 평행하다 ② 유사하다","example":"She drew two parallel lines on her paper.","translation":"그녀는 종이 위에 두 개의 평행선을 그렸다.","sourcePage":271,"pdfPage":119},{"id":1399,"source":"MAIN","day":"28","word":"akin","entryType":"","meaning":"형 ① 친족의 ② ~와 유사한 (to)","example":"What he felt was more akin to pity than love.","translation":"그가 느낀 감정은 사랑보다는 연민에 더 가까웠다.","sourcePage":271,"pdfPage":119},{"id":1400,"source":"MAIN","day":"28","word":"analogy","entryType":"","meaning":"명 ① 유사, 비슷함 ② 유추","example":"There is an analogy between the heart and a pump.","translation":"심장과 펌프 사이에 유사점이 있다.","sourcePage":271,"pdfPage":119},{"id":1401,"source":"MAIN","day":"29","word":"valid","entryType":"","meaning":"형 ① 유효한, 효과가 있는 ② 정당한, 타당한 / ③ legal, lawful, legitimate, justifiable","example":"The contract is still valid.","translation":"그 계약은 아직 유효하다.","sourcePage":272,"pdfPage":1},{"id":1402,"source":"MAIN","day":"29","word":"plausible","entryType":"","meaning":"형 그럴듯한, 그럴싸한 / probable","example":"His explanation sounds fairly plausible to me.","translation":"그의 설명은 내게 아주 그럴듯하게 들린다.","sourcePage":272,"pdfPage":1},{"id":1403,"source":"MAIN","day":"29","word":"reliable","entryType":"","meaning":"형 믿을 수 있는, 의지할 수 있는 / credible","example":"The news was obtained from reliable sources.","translation":"이 소식은 믿을 수 있는 소식통에서 나왔다.","sourcePage":272,"pdfPage":1},{"id":1404,"source":"MAIN","day":"29","word":"credible","entryType":"","meaning":"형 믿을 수 있는, 신뢰할 수 있는","example":"He has so many credible colleagues.","translation":"그에게는 믿을 수 있는 동료들이 아주 많다.","sourcePage":273,"pdfPage":2},{"id":1405,"source":"MAIN","day":"29","word":"accredit","entryType":"","meaning":"동 ~의 공로로 돌리다, ~에게 돌리다","example":"The discovery of penicillin is usually accredited to Alexander Fleming.","translation":"페니실린의 발견은 보통 Alexander Fleming이 한 것으로 간주된다.","sourcePage":273,"pdfPage":2},{"id":1406,"source":"MAIN","day":"29","word":"discredit","entryType":"","meaning":"동 의심하다 / 명 불신, 불명예","example":"Violent football fans bring discredit on the teams they support.","translation":"폭력적인 축구 팬들은 자신들이 응원하는 팀들에게 불명예를 안겨 준다.","sourcePage":273,"pdfPage":2},{"id":1407,"source":"MAIN","day":"29","word":"conceal","entryType":"","meaning":"동 숨기다","example":"She knew at once that he was concealing something from her.","translation":"그녀는 그가 그녀에게 뭔가를 숨기고 있다는 것을 단번에 알았다.","sourcePage":273,"pdfPage":2},{"id":1408,"source":"MAIN","day":"29","word":"reveal","entryType":"","meaning":"동 ① (비밀 등을) 드러내다, 밝히다 ② 드러내 보이다 / divulge, disclose, unveil, uncover, let slip","example":"Will the movie reveal the killer's identity?","translation":"영화에서 살인자의 정체가 밝혀질까요?","sourcePage":273,"pdfPage":2},{"id":1409,"source":"MAIN","day":"29","word":"unveil","entryType":"","meaning":"동 밝히다, 폭로하다 / reveal, disclose, divulge","example":"It is time to unveil the truth.","translation":"이제 진실을 밝힐 때이다.","sourcePage":273,"pdfPage":2},{"id":1410,"source":"MAIN","day":"29","word":"divulge","entryType":"","meaning":"동 폭로하다 / reveal, disclose, unveil","example":"I can't divulge his secret to you.","translation":"나는 너에게 그의 비밀을 폭로할 수 없다.","sourcePage":273,"pdfPage":2},{"id":1411,"source":"MAIN","day":"29","word":"congratulate","entryType":"","meaning":"동 축하하다","example":"We congratulate you on your remarkable achievements in college.","translation":"대학에서의 놀라운 성취를 축하드립니다.","sourcePage":274,"pdfPage":3},{"id":1412,"source":"MAIN","day":"29","word":"clap","entryType":"","meaning":"동 박수를 치다, 손뼉을 치다 / applaud, give a big hand","example":"It's rude to clap between movements in classical music.","translation":"클래식 음악에서 각 악장 사이에 박수를 치는 것은 실례다.","sourcePage":274,"pdfPage":3},{"id":1413,"source":"MAIN","day":"29","word":"applaud","entryType":"","meaning":"동 ① 박수를 보내다 ② 칭찬하다 / compliment, praise, acclaim, commend","example":"The audience applauded.","translation":"관객이 박수를 보냈다.","sourcePage":274,"pdfPage":3},{"id":1414,"source":"MAIN","day":"29","word":"praise","entryType":"","meaning":"동 칭찬하다 / 명 칭찬, 찬양 / compliment, applaud, acclaim, commend","example":"Reviewers praised highly on the play.","translation":"비평가들이 그 연극을 아주 칭찬했다.","sourcePage":274,"pdfPage":3},{"id":1415,"source":"MAIN","day":"29","word":"compliment","entryType":"","meaning":"동 칭찬하다 / 명 칭찬 / applaud, praise, acclaim, commend","example":"It's a great compliment to be asked to do it.","translation":"그것을 해달라는 요청을 받는 것은 대단한 찬사이다.","sourcePage":274,"pdfPage":3},{"id":1416,"source":"MAIN","day":"29","word":"complement","entryType":"","meaning":"동 보완하다, 보충하다 / 명 보충(물) / supplement, replenish","example":"The team needs players who complement each other.","translation":"그 팀에는 서로를 보완하는 선수들이 필요하다.","sourcePage":274,"pdfPage":3},{"id":1417,"source":"MAIN","day":"29","word":"supplement","entryType":"","meaning":"동 보충하다, 보완하다 / supplement, complement","example":"She supplemented her regular income with a part-time job.","translation":"그녀는 정규 수입을 아르바이트로 보충했다.","sourcePage":275,"pdfPage":4},{"id":1418,"source":"MAIN","day":"29","word":"replenish","entryType":"","meaning":"동 보충하다, 채우다 / supplement, complement","example":"Imagine being able to replenish the dying cells.","translation":"죽어가는 세포를 보충할 수 있다고 상상해 보라.","sourcePage":275,"pdfPage":4},{"id":1419,"source":"MAIN","day":"29","word":"insert","entryType":"","meaning":"동 삽입하다, 끼워 넣다 / 명 삽입물","example":"Insert coins in machine slots.","translation":"동전을 투입구에 넣으세요.","sourcePage":275,"pdfPage":4},{"id":1420,"source":"MAIN","day":"29","word":"assert","entryType":"","meaning":"동 주장하다, 단언하다 / claim, maintain, insist, affirm","example":"He continued to assert that he was innocent.","translation":"그는 계속해서 자기가 무죄라고 주장했다.","sourcePage":275,"pdfPage":4},{"id":1421,"source":"MAIN","day":"29","word":"insist","entryType":"","meaning":"동 주장하다, 고집하다 / claim, maintain, assert, affirm","example":"The president insisted that the operation be kept secret.","translation":"대통령은 그 수술이 비밀에 부쳐져야 한다고 주장했다.","sourcePage":275,"pdfPage":4},{"id":1422,"source":"MAIN","day":"29","word":"bet","entryType":"","meaning":"동 ① 내기를 하다, 돈을 걸다 ② 단언하다 / 명 ① 내기 ② 잠, 생각 / wager, stake","example":"Let's bet on who finishes first.","translation":"누가 먼저 끝내는지 내기를 해보자.","sourcePage":275,"pdfPage":4},{"id":1423,"source":"MAIN","day":"29","word":"betray","entryType":"","meaning":"동 배반하다, 배신하다","example":"The man betrayed his country.","translation":"그 남자는 조국을 배반했다.","sourcePage":275,"pdfPage":4},{"id":1424,"source":"MAIN","day":"29","word":"splendid","entryType":"","meaning":"형 훌륭한, 멋진, 화려한","example":"The hotel balcony offered a splendid view of the sea.","translation":"그 호텔 발코니는 바다의 멋진 경치를 제공했다.","sourcePage":276,"pdfPage":5},{"id":1425,"source":"MAIN","day":"29","word":"gorgeous","entryType":"","meaning":"형 아주 멋진, 근사한 / fabulous, marvelous, splendid","example":"What a gorgeous house she has!","translation":"그녀의 집은 얼마나 멋진가!","sourcePage":276,"pdfPage":5},{"id":1426,"source":"MAIN","day":"29","word":"high-end","entryType":"","meaning":"형 최고급의, 최첨단의 / 고가의","example":"The new department store carries high-end products.","translation":"새로 생긴 백화점은 최고급 상품들을 취급한다.","sourcePage":276,"pdfPage":5},{"id":1427,"source":"MAIN","day":"29","word":"esteem","entryType":"","meaning":"동 존경하다, 존중하다 / 명 존경, 존중 / respect, admire, honor, revere","example":"He was esteemed the perfect novelist.","translation":"그는 완벽한 소설가로 존경받았다.","sourcePage":276,"pdfPage":5},{"id":1428,"source":"MAIN","day":"29","word":"adore","entryType":"","meaning":"동 ① 숭배하다 ② 매우 좋아하다 / respect, admire, honor, revere, esteem","example":"The movie star adores the attention from people.","translation":"그 영화배우는 사람들에게서 관심을 받는 것을 매우 좋아한다.","sourcePage":276,"pdfPage":5},{"id":1429,"source":"MAIN","day":"29","word":"worship","entryType":"","meaning":"동 ① 숭배하다, 존경하다 ② 예배하다 / 명 숭배, 존경, 예배 / admire, honor, revere, esteem","example":"The ancient Greeks worshipped many gods.","translation":"고대 그리스인들은 여러 신들을 숭배했다.","sourcePage":276,"pdfPage":5},{"id":1430,"source":"MAIN","day":"29","word":"bless","entryType":"","meaning":"동 축복하다","example":"The children blessed the animals at the petting zoo.","translation":"아이들은 동물원에 있는 동물들을 축복했다.","sourcePage":276,"pdfPage":5},{"id":1431,"source":"MAIN","day":"29","word":"ritual","entryType":"","meaning":"명 의식, 의례, 관례 / 형 의식의","example":"He objects to the ritual of organized religion.","translation":"그는 조직화된 종교의 의식에 반대한다.","sourcePage":277,"pdfPage":6},{"id":1432,"source":"MAIN","day":"29","word":"chapel","entryType":"","meaning":"명 예배당, 작은 교회","example":"We married in the chapel of the hospital.","translation":"우리는 그 병원의 예배당에서 결혼했다.","sourcePage":277,"pdfPage":6},{"id":1433,"source":"MAIN","day":"29","word":"choir","entryType":"","meaning":"명 성가대, 합창단","example":"The school choir practises every Thursday.","translation":"학교 합창단은 매주 목요일에 연습한다.","sourcePage":277,"pdfPage":6},{"id":1434,"source":"MAIN","day":"29","word":"divine","entryType":"","meaning":"형 ① 신의, 신에 관한 ② 신성한, 신과 같은 / sacred, holy","example":"It's divine punishment for the wrong you did.","translation":"그것은 네가 저지른 잘못에 대한 신성한 벌이다.","sourcePage":277,"pdfPage":6},{"id":1435,"source":"MAIN","day":"29","word":"sacred","entryType":"","meaning":"형 ① 성스러운, 신성한 ② 종교적인 / divine, holy","example":"Cows are considered sacred in Indian religions such as Hinduism.","translation":"힌두교와 같은 인도 종교에서는 소를 신성시한다.","sourcePage":277,"pdfPage":6},{"id":1436,"source":"MAIN","day":"29","word":"sacrifice","entryType":"","meaning":"동 ① 희생하다 ② 제물로 바치다 / 명 ① 희생 ② 제물","example":"Their glory lies not in their achievements but in their sacrifices.","translation":"그들의 영광은 성취에 있는 것이 아니라 그들의 희생에 있다.","sourcePage":277,"pdfPage":6},{"id":1437,"source":"MAIN","day":"29","word":"saint","entryType":"","meaning":"명 성인, 성자","example":"He is as generous as a saint.","translation":"그는 성자처럼 인자하다.","sourcePage":277,"pdfPage":6},{"id":1438,"source":"MAIN","day":"29","word":"secular","entryType":"","meaning":"형 세속적인, 비종교적인 / profane","example":"It is very difficult to renounce secular pleasure.","translation":"세속적인 쾌락을 포기하기란 매우 어렵다.","sourcePage":277,"pdfPage":6},{"id":1439,"source":"MAIN","day":"29","word":"skeptical","entryType":"","meaning":"형 회의적인, 의심하는","example":"The reporter was skeptical about the government report.","translation":"그 기자는 정부 보고서에 대해 회의적이었다.","sourcePage":278,"pdfPage":7},{"id":1440,"source":"MAIN","day":"29","word":"beware","entryType":"","meaning":"동 조심하다","example":"You must beware of the dog.","translation":"당신은 그 개를 조심해야 한다.","sourcePage":278,"pdfPage":7},{"id":1441,"source":"MAIN","day":"29","word":"belittle","entryType":"","meaning":"동 경시하다, 과소평가하다, 헐뜯다 / disparage, downgrade, underestimate, minimize","example":"People tend to belittle other people's success.","translation":"사람들은 다른 사람의 성공을 경시하는 경향이 있다.","sourcePage":278,"pdfPage":7},{"id":1442,"source":"MAIN","day":"29","word":"befall","entryType":"","meaning":"동 (안 좋은 일이) 일어나다, 생기다, 닥치다","example":"It might be the worst fate that can befall mankind.","translation":"그것은 인류에게 닥칠 수 있는 최악의 운명일지도 모른다.","sourcePage":278,"pdfPage":7},{"id":1443,"source":"MAIN","day":"29","word":"emerge","entryType":"","meaning":"동 ① 나타나다, 출현하다 ② (문제·곤란 등이) 생기다, 발생하다","example":"A touchy question emerged.","translation":"곤란한 문제가 생겼다.","sourcePage":278,"pdfPage":7},{"id":1444,"source":"MAIN","day":"29","word":"merge","entryType":"","meaning":"동 ① 합병하다, 합치다 ② 어우러지다, 융합되다 / incorporate, integrate, consolidate","example":"A proposal to merge the two companies was voted through yesterday.","translation":"두 회사를 합병하자는 제안이 어제 가결되었다.","sourcePage":278,"pdfPage":7},{"id":1445,"source":"MAIN","day":"29","word":"patent","entryType":"","meaning":"명 특허 / 형 특허의, 특허권이 있는 / 동 특허를 얻다","example":"He took out a patent for a new potato peeler.","translation":"그는 새로운 감자 껍질 벗기는 기계의 특허를 냈다.","sourcePage":279,"pdfPage":8},{"id":1446,"source":"MAIN","day":"29","word":"apparent","entryType":"","meaning":"형 명백한, 분명한 / obvious, distinct, evident, noticeable","example":"The man attacked me for no apparent reason.","translation":"그 남자는 어떤 명백한 이유도 없이 나를 공격했다.","sourcePage":279,"pdfPage":8},{"id":1447,"source":"MAIN","day":"29","word":"plain","entryType":"","meaning":"형 ① 분명한, 명료한 ② 솔직한, 있는 그대로의 ③ 무늬가 없는 ④ 보통의, 평범한 / 명 평원, 평지","example":"He made it plain that we should leave.","translation":"그는 우리가 떠나야 한다는 것을 분명히 했다.","sourcePage":279,"pdfPage":8},{"id":1448,"source":"MAIN","day":"29","word":"clear","entryType":"","meaning":"형 ① 분명한, 확실한 ② 맑은, 깨끗한 / 동 ① 치우다 ② 밝게 하다 / obvious, evident, apparent, definite","example":"The message was clear and concise.","translation":"그 메시지는 분명하고 간결했다.","sourcePage":279,"pdfPage":8},{"id":1449,"source":"MAIN","day":"29","word":"obvious","entryType":"","meaning":"형 명백한, 분명한 / distinct, apparent, evident, noticeable","example":"It is obvious that he will succeed.","translation":"그가 성공할 것은 명백한 일이다.","sourcePage":279,"pdfPage":8},{"id":1450,"source":"MAIN","day":"29","word":"manifest","entryType":"","meaning":"동 ① 명백히 하다, 나타내다 ② 증명하다 / 형 분명한, 명확한 / obvious, distinct, apparent, evident, noticeable","example":"It is manifest to all of us.","translation":"그것은 우리 모두에게 분명한 일이다.","sourcePage":279,"pdfPage":8},{"id":1451,"source":"MAIN","day":"30","word":"feeble","entryType":"","meaning":"형 약한, 연약한","example":"A feeble body weakens the mind.","translation":"연약한 육체는 마음을 약하게 만든다.","sourcePage":280,"pdfPage":1},{"id":1452,"source":"MAIN","day":"30","word":"delicate","entryType":"","meaning":"형 ① 연약한 ② 세심한, 까다로운 ③ 섬세한, 정교한","example":"Neurons extend long and delicate branches.","translation":"뉴런은 길고 섬세한 가지를 뻗는다.","sourcePage":280,"pdfPage":1},{"id":1453,"source":"MAIN","day":"30","word":"sensitive","entryType":"","meaning":"형 ① 민감한, 예민한 ② 섬세한, 세심한","example":"Regional conflicts are a politically sensitive issue.","translation":"지역 갈등은 정치적으로 민감한 사안이다.","sourcePage":280,"pdfPage":1},{"id":1454,"source":"MAIN","day":"30","word":"infirm","entryType":"","meaning":"형 병약한, 노쇠한 / 명 병약자","example":"Her grandfather was old and infirm.","translation":"그녀의 할아버지는 늙고 병약했다.","sourcePage":280,"pdfPage":1},{"id":1455,"source":"MAIN","day":"30","word":"faint","entryType":"SINGLE","meaning":"동 기절하다, 실신하다 / 형 희미한, 어렴풋한","example":"There is still a faint hope that he may be cured.","translation":"아직 그가 치유될지도 모르는 어렴풋한 희망이 있다.","sourcePage":281,"pdfPage":129},{"id":1456,"source":"MAIN","day":"30","word":"dim","entryType":"SINGLE","meaning":"형 침침한, 어두운, 흐린","example":"They can find dim light in the distance.","translation":"그들은 멀리서 흐린 빛을 발견할 수 있다.","sourcePage":281,"pdfPage":129},{"id":1457,"source":"MAIN","day":"30","word":"overcast","entryType":"","meaning":"형 흐린, 음침한 / 동 흐리게 하다, 우울하게 만들다","example":"The overcast sky made me gloomy.","translation":"흐린 하늘은 나를 우울하게 했다.","sourcePage":281,"pdfPage":2},{"id":1458,"source":"MAIN","day":"30","word":"blurred","entryType":"","meaning":"형 흐린, 선명하지 않은","example":"The writing is blurred and difficult to read.","translation":"글자가 흐려서 읽기 어렵다.","sourcePage":281,"pdfPage":2},{"id":1459,"source":"MAIN","day":"30","word":"pale","entryType":"","meaning":"형 ① (안색이) 창백한 ② (색이) 옅은, 엷은 ③ (빛이) 약한 / 동 ① (안색이) 창백해지다 ② 색이 옅어지다 ③ (빛이) 약해지다","example":"You look pale.","translation":"너 창백해 보여.","sourcePage":281,"pdfPage":2},{"id":1460,"source":"MAIN","day":"30","word":"fade","entryType":"","meaning":"동 바래다, 희미해지다, 사라지다","example":"His smile faded.","translation":"그의 미소가 희미해졌다.","sourcePage":281,"pdfPage":2},{"id":1461,"source":"MAIN","day":"30","word":"vulnerable","entryType":"","meaning":"형 상처받기 쉬운, 취약한","example":"The law is there to protect the vulnerable.","translation":"법은 취약한 사람들을 보호하기 위해 있는 것이다.","sourcePage":281,"pdfPage":2},{"id":1462,"source":"MAIN","day":"30","word":"wither","entryType":"","meaning":"동 시들다시피 하다, 약해지다, 위축되다","example":"Their friendship withered over time.","translation":"그들의 우정은 시간이 지나면서 시들었다.","sourcePage":281,"pdfPage":2},{"id":1463,"source":"MAIN","day":"30","word":"wane","entryType":"SINGLE","meaning":"동 적어지다, 약해지다, 시들다","example":"The controversy did not look likely to wane.","translation":"그 논란은 수그러들지 않을 것처럼 보였다.","sourcePage":282,"pdfPage":130},{"id":1464,"source":"MAIN","day":"30","word":"groan","entryType":"SINGLE","meaning":"동 ① 신음하다, 괴로워하다 ② 불평하다 / 명 ① 신음(소리) ② 불평하는 소리","example":"The wounded groaned for medicine.","translation":"부상자들은 약을 달라고 신음했다.","sourcePage":282,"pdfPage":130},{"id":1465,"source":"MAIN","day":"30","word":"moan","entryType":"","meaning":"동 ① 신음하다 ② 한탄하다, 불평하다 / 명 ① 신음(소리) ② 불평","example":"The crowd moaned in disappointment at the team's loss.","translation":"군중들은 팀의 패배에 실망하여 신음했다.","sourcePage":282,"pdfPage":3},{"id":1466,"source":"MAIN","day":"30","word":"weary","entryType":"","meaning":"형 ① 피로한, 지친 ② 싫증 난 / 동 지치다, 지치게 만들다, 싫증 나게 만들다","example":"I am weary out with his long talk.","translation":"나는 그가 길게 말하는 것에 싫증 났다.","sourcePage":282,"pdfPage":3},{"id":1467,"source":"MAIN","day":"30","word":"fatigue","entryType":"","meaning":"명 피로 / 동 피로하게 하다, 약화시키다","example":"He was so fatigued that he slept for twelve hours.","translation":"그는 너무 지쳐서 12시간 동안 잠을 잤다.","sourcePage":282,"pdfPage":3},{"id":1468,"source":"MAIN","day":"30","word":"ache","entryType":"","meaning":"동 아프다 / 명 아픔, 통증","example":"My back aches after a long day.","translation":"나는 하루 종일 일하고 나면 허리가 아프다.","sourcePage":282,"pdfPage":3},{"id":1469,"source":"MAIN","day":"30","word":"suffer","entryType":"","meaning":"동 ① (고통 등을) 겪다 ② 괴로워하다, 시달리다 (from)","example":"They suffer from the heat of the sun all the year round.","translation":"그들은 일 년 내내 태양의 열기에 괴로워한다.","sourcePage":282,"pdfPage":3},{"id":1470,"source":"MAIN","day":"30","word":"weigh","entryType":"SINGLE","meaning":"동 ① 무게를 달다 ② 무게가 -이다 ③ 숙고하다, 비교 검토하다 ④ 중요시되다","example":"She weighed the pros and cons of quitting her job one last time.","translation":"그녀는 마지막으로 직장을 그만두는 것에 대한 장단점을 저울질했다.","sourcePage":283,"pdfPage":131},{"id":1471,"source":"MAIN","day":"30","word":"gauge","entryType":"","meaning":"동 ① (기구로) 측정하다 ② (사람·행동 등을) 평가[판단]하다 / 명 ① 표준 치수, 규격 ② (평가·판단 등의) 기준(방법, 수단)","example":"It was difficult to gauge whether she was angry or not.","translation":"그녀가 화가 난 건지 아닌지를 판단하기가 어려웠다.","sourcePage":283,"pdfPage":4},{"id":1472,"source":"MAIN","day":"30","word":"measure","entryType":"","meaning":"동 ① 재다, 측정하다 ② 판단하다, 평가하다 / 명 ① 조치(주로 pl.) ② 척도 ③ 치수","example":"Don't measure others by only one standard.","translation":"단 한 가지 기준으로 남들을 평가하지 마세요.","sourcePage":283,"pdfPage":4},{"id":1473,"source":"MAIN","day":"30","word":"dimension","entryType":"","meaning":"명 ① 치수, 크기, 규모 ② 차원","example":"Time has been referred to as the fourth dimension.","translation":"시간은 네 번째 차원이라고 일컬어져 왔다.","sourcePage":283,"pdfPage":4},{"id":1474,"source":"MAIN","day":"30","word":"magnitude","entryType":"","meaning":"명 ① (엄청난) 규모, 중요도 ② (지진의) 진도","example":"We didn't know the magnitude of the problem.","translation":"우리는 그 문제의 규모를 몰랐다.","sourcePage":283,"pdfPage":4},{"id":1475,"source":"MAIN","day":"30","word":"diameter","entryType":"","meaning":"명 지름","example":"The cake was about 30 centimeters in diameter.","translation":"그 케이크는 지름이 약 30cm였다.","sourcePage":283,"pdfPage":4},{"id":1476,"source":"MAIN","day":"30","word":"thermometer","entryType":"SINGLE","meaning":"명 온도계","example":"The thermometer reads 82 degrees Fahrenheit.","translation":"온도계는 화씨 82도를 가리킨다.","sourcePage":284,"pdfPage":132},{"id":1477,"source":"MAIN","day":"30","word":"barometer","entryType":"","meaning":"명 기압계 ② 척도","example":"A barometer is used to measure the pressure of the atmosphere.","translation":"기압계는 대기의 압력을 재는 데 사용된다.","sourcePage":284,"pdfPage":5},{"id":1478,"source":"MAIN","day":"30","word":"fairy","entryType":"","meaning":"명 요정","example":"The story tells of a kind fairy.","translation":"이 이야기는 친절한 요정에 대한 내용이다.","sourcePage":284,"pdfPage":5},{"id":1479,"source":"MAIN","day":"30","word":"fable","entryType":"","meaning":"명 우화, 전설, 꾸며낸 이야기","example":"She told me a fable about a dog.","translation":"그녀는 나에게 개에 관한 우화를 말했다.","sourcePage":284,"pdfPage":5},{"id":1480,"source":"MAIN","day":"30","word":"occult","entryType":"","meaning":"형 불가사의한, 주술적인 / 명 주술","example":"He began to believe he had occult powers.","translation":"그는 자신이 주술적인 힘을 가졌다고 믿기 시작했다.","sourcePage":284,"pdfPage":5},{"id":1481,"source":"MAIN","day":"30","word":"wonder","entryType":"","meaning":"동 ① 궁금해하다 ② 놀라다 / 명 경이, 불가사의","example":"I wonder who she is.","translation":"나는 그녀가 누군지 궁금하다.","sourcePage":284,"pdfPage":5},{"id":1482,"source":"MAIN","day":"30","word":"breathtaking","entryType":"","meaning":"형 놀랄 만한, 아슬아슬한","example":"It was a breathtaking performance.","translation":"숨이 막힐 정도로 멋진 공연이었다.","sourcePage":284,"pdfPage":5},{"id":1483,"source":"MAIN","day":"30","word":"remarkable","entryType":"SINGLE","meaning":"형 놀라운, 주목할 만한","example":"She was a truly remarkable woman.","translation":"그녀는 정말 놀라운 여성이었다.","sourcePage":285,"pdfPage":133},{"id":1484,"source":"MAIN","day":"30","word":"exceptional","entryType":"","meaning":"형 ① 뛰어난, 이례적인 ② 예외적인","example":"This cold weather is exceptional for March.","translation":"이 추운 날씨는 3월로서는 예외적이다.","sourcePage":285,"pdfPage":6},{"id":1485,"source":"MAIN","day":"30","word":"prodigious","entryType":"","meaning":"형 ① 비범한, 놀라운 ② 거대한, 엄청난","example":"His prodigious memory helped him pass every test.","translation":"그의 놀라운 기억력은 그가 모든 시험을 통과하도록 도와주었다.","sourcePage":285,"pdfPage":6},{"id":1486,"source":"MAIN","day":"30","word":"salient","entryType":"","meaning":"형 눈에 띄는, 두드러진","example":"She pointed out the salient features of the new design.","translation":"그녀는 그 새 디자인의 두드러진 특징들을 지적했다.","sourcePage":285,"pdfPage":6},{"id":1487,"source":"MAIN","day":"30","word":"striking","entryType":"","meaning":"형 현저한, 두드러진, 인상적인","example":"This building presents a striking contrast to its surroundings.","translation":"이 건물은 주변과 현저한 대조를 이루고 있다.","sourcePage":285,"pdfPage":6},{"id":1488,"source":"MAIN","day":"30","word":"eminent","entryType":"","meaning":"형 저명한, 탁월한","example":"He is an eminent architect.","translation":"그는 저명한 건축가이다.","sourcePage":285,"pdfPage":6},{"id":1489,"source":"MAIN","day":"30","word":"preeminent","entryType":"SINGLE","meaning":"형 탁월한, 우수한","example":"He is a preeminent soccer player.","translation":"그는 우수한 축구 선수이다.","sourcePage":286,"pdfPage":134},{"id":1490,"source":"MAIN","day":"30","word":"prominent","entryType":"","meaning":"형 두드러진, 중요한, 저명한","example":"She is the most prominent woman in technology.","translation":"그녀는 기술 분야에서 가장 저명한 여성이다.","sourcePage":286,"pdfPage":7},{"id":1491,"source":"MAIN","day":"30","word":"noticeable","entryType":"","meaning":"형 눈에 띄는, 뚜렷한, 현저한","example":"There is a noticeable distinction between the rich and the poor.","translation":"부유한 사람과 가난한 사람 사이에는 눈에 띄는 차이가 있다.","sourcePage":286,"pdfPage":7},{"id":1492,"source":"MAIN","day":"30","word":"tackle","entryType":"","meaning":"동 ① (일 등을) 부딪치다, (문제 등을) 다루다 ② 태클하다 / 명 태클","example":"I can tackle any role with ease.","translation":"나는 어떤 역할이든 쉽게 다룰 수 있다.","sourcePage":286,"pdfPage":7},{"id":1493,"source":"MAIN","day":"30","word":"address","entryType":"","meaning":"명 ① 주소 ② 연설 / 동 ① 연설하다 ② 말을 걸다 ③ (문제 등을) 다루다, 해결하다","example":"The news report addressed the ongoing political crisis.","translation":"그 뉴스 보도는 현재 진행 중인 정치적 위기를 다뤘다.","sourcePage":286,"pdfPage":7},{"id":1494,"source":"MAIN","day":"30","word":"content","entryType":"","meaning":"형 만족하는 (with) / 동 만족시키다 / 명 내용(물)","example":"The committee members seemed quite content with their decision.","translation":"위원들은 자신들의 결정에 상당히 만족하는 것 같았다.","sourcePage":286,"pdfPage":7},{"id":1495,"source":"MAIN","day":"30","word":"interfere","entryType":"SINGLE","meaning":"동 ① 방해하다 (with) ② 간섭하다 (in)","example":"This stress can interfere with our memories.","translation":"이 스트레스가 우리의 기억을 방해할 수 있다.","sourcePage":287,"pdfPage":135},{"id":1496,"source":"MAIN","day":"30","word":"hamper","entryType":"","meaning":"동 방해하다","example":"The heavy snowfall hampered our progress.","translation":"폭설이 우리의 전진을 방해했다.","sourcePage":287,"pdfPage":8},{"id":1497,"source":"MAIN","day":"30","word":"hinder","entryType":"","meaning":"동 방해하다, 막다","example":"Nothing will hinder me.","translation":"아무것도 나를 방해하지 못할 거야.","sourcePage":287,"pdfPage":8},{"id":1498,"source":"MAIN","day":"30","word":"impede","entryType":"","meaning":"동 방해하다, 지연시키다","example":"The noise impeded the flow of the work.","translation":"그 소음은 일의 흐름을 방해했다.","sourcePage":287,"pdfPage":8},{"id":1499,"source":"MAIN","day":"30","word":"disturb","entryType":"","meaning":"동 방해하다, 어지럽히다","example":"Don't disturb Katie.","translation":"Katie를 방해하지 마라.","sourcePage":287,"pdfPage":8},{"id":1500,"source":"MAIN","day":"30","word":"turbulent","entryType":"","meaning":"형 ① 휘몰아치는, 격동의 ② 사나운","example":"The seventies were a turbulent period in Korean history.","translation":"70년대는 한국 역사에서 격동의 시기였다.","sourcePage":287,"pdfPage":8},{"id":1501,"source":"MAIN","day":"31","word":"aisle","entryType":"","meaning":"명 통로, 복도","example":"Sir, would you prefer a window seat or an aisle seat?","translation":"손님, 창가 쪽 좌석으로 드릴까요, 아니면 통로 쪽 좌석으로 드릴까요?","sourcePage":288,"pdfPage":136},{"id":1502,"source":"MAIN","day":"31","word":"route","entryType":"","meaning":"명 ① 길, 항로, 노선 ② 방법, 수단","example":"His best route of escape was the freeway.","translation":"그의 최상의 탈출 경로는 고속도로였다.","sourcePage":288,"pdfPage":136},{"id":1503,"source":"MAIN","day":"31","word":"routine","entryType":"","meaning":"명 판에 박힌 일, 일상적인 일(일과) / 형 일상적인, 정기적인","example":"We follow the same routine every morning and evening.","translation":"우리는 매일 아침저녁으로 똑같은 일과를 따른다.","sourcePage":288,"pdfPage":136},{"id":1504,"source":"MAIN","day":"31","word":"regular","entryType":"","meaning":"형 ① 규칙적인, 정기적인, 고정적인 ② 보통의, 표준적인 ③ 정규의","example":"The value of regular exercise should not be underestimated.","translation":"규칙적인 운동의 가치는 과소평가하면 안 된다.","sourcePage":289,"pdfPage":137},{"id":1505,"source":"MAIN","day":"31","word":"shortcut","entryType":"","meaning":"명 지름길","example":"The kids take a shortcut through the parking lot to get to school.","translation":"아이들은 주차장을 통과하는 지름길로 학교에 간다.","sourcePage":289,"pdfPage":137},{"id":1506,"source":"MAIN","day":"31","word":"stray","entryType":"","meaning":"동 길을 잃다, 길을 잘못 들다 / 형 길을 잃은, 빗나간","example":"The puppy has strayed off from the house.","translation":"강아지가 집을 나가 길을 잃었다.","sourcePage":289,"pdfPage":137},{"id":1507,"source":"MAIN","day":"31","word":"deviate","entryType":"","meaning":"동 (일상·예상 등을) 벗어나다 (from)","example":"The bus deviated from its scheduled route.","translation":"버스가 정해진 경로를 벗어났다.","sourcePage":289,"pdfPage":137},{"id":1508,"source":"MAIN","day":"31","word":"deflect","entryType":"","meaning":"동 ① (특히 무엇에 맞고 난 뒤) 방향을 바꾸다 ② (비난 등을) 모면하다(피하다)","example":"The ball deflected off his head, straight into the goal.","translation":"공이 그의 머리에 맞고 그대로 골인되었다.","sourcePage":289,"pdfPage":137},{"id":1509,"source":"MAIN","day":"31","word":"scorn","entryType":"","meaning":"명 경멸 / 동 경멸하다, 비웃다","example":"She felt scorn for his political views.","translation":"그녀는 그의 정치적 견해에 대한 경멸을 느꼈다.","sourcePage":289,"pdfPage":137},{"id":1510,"source":"MAIN","day":"31","word":"contempt","entryType":"","meaning":"명 ① 경멸, 멸시 ② 무시","example":"I feel nothing but contempt for people who treat children so cruelly.","translation":"나는 아이들을 매우 잔인하게 대하는 사람들에 대해 경멸밖에 느끼지 않는다.","sourcePage":289,"pdfPage":137},{"id":1511,"source":"MAIN","day":"31","word":"guard","entryType":"","meaning":"동 ① 보호하다, 지키다 ② 감시하다 / 명 ① 수위, 경호원 ② 보초, 감시","example":"The goalkeeper guarded the net with impressive agility.","translation":"그 골키퍼는 민첩하게 골문을 지켰다.","sourcePage":290,"pdfPage":138},{"id":1512,"source":"MAIN","day":"31","word":"shield","entryType":"","meaning":"동 보호하다 / 명 방패, 보호물","example":"The ozone layer shields us from the sun’s harmful ultraviolet radiation.","translation":"오존층은 태양의 해로운 자외선으로부터 우리를 보호한다.","sourcePage":290,"pdfPage":138},{"id":1513,"source":"MAIN","day":"31","word":"shelter","entryType":"","meaning":"명 ① 주거지 ② 피난처, 은신처 ③ 보호 시설 / 동 ① 피하다 ② 보호하다","example":"There was no shelter from the gunfire.","translation":"총격을 피할 피난처가 없었다.","sourcePage":290,"pdfPage":138},{"id":1514,"source":"MAIN","day":"31","word":"refuge","entryType":"","meaning":"명 피난, 피난처, 은신처","example":"They took refuge in a mountain hut.","translation":"그들은 산속 오두막으로 피난했다.","sourcePage":290,"pdfPage":138},{"id":1515,"source":"MAIN","day":"31","word":"spontaneous","entryType":"","meaning":"형 ① 자발적인 ② 자연 발생적인","example":"There is no spontaneous brain activity.","translation":"자발적인 뇌 활동은 없다.","sourcePage":290,"pdfPage":138},{"id":1516,"source":"MAIN","day":"31","word":"impromptu","entryType":"","meaning":"형 즉석의, 즉흥의","example":"She delivered an impromptu speech.","translation":"그녀는 즉흥 연설을 했다.","sourcePage":290,"pdfPage":138},{"id":1517,"source":"MAIN","day":"31","word":"casual","entryType":"","meaning":"형 ① 평상시의, 격식을 차리지 않는 ② 우연한 ③ 무심결의","example":"Don't take my casual remark seriously.","translation":"내가 무심코 한 말을 진지하게 받아들이지 마세요.","sourcePage":291,"pdfPage":139},{"id":1518,"source":"MAIN","day":"31","word":"causal","entryType":"","meaning":"형 인과 관계의","example":"There’s no causal relationship between mobile phone use and bad grades.","translation":"휴대 전화 사용과 나쁜 성적 사이에는 인과 관계가 없다.","sourcePage":291,"pdfPage":139},{"id":1519,"source":"MAIN","day":"31","word":"stem","entryType":"","meaning":"동 유래하다, 생기다 (from) / 명 줄기","example":"Their disagreement stemmed from a misunderstanding.","translation":"그들의 불일치는 오해에서 비롯되었다.","sourcePage":291,"pdfPage":139},{"id":1520,"source":"MAIN","day":"31","word":"derive","entryType":"","meaning":"동 ① 이끌어내다, 얻다 ② 유래하다, 파생되다 (from)","example":"We derive knowledge from reading books.","translation":"우리는 독서를 통해 지식을 얻는다.","sourcePage":291,"pdfPage":139},{"id":1521,"source":"MAIN","day":"31","word":"factor","entryType":"","meaning":"명 요인, 요소","example":"Our psychology is another factor in the consumption of calories.","translation":"우리의 심리 상태는 칼로리 소비의 또 다른 요인이다.","sourcePage":291,"pdfPage":139},{"id":1522,"source":"MAIN","day":"31","word":"component","entryType":"","meaning":"명 구성 요소, 성분, 부품 / 형 구성하는","example":"Laughter is a key component of a happy life.","translation":"웃음은 행복한 삶의 핵심 요소이다.","sourcePage":291,"pdfPage":139},{"id":1523,"source":"MAIN","day":"31","word":"local","entryType":"","meaning":"형 ① 지역의, 현지의 ② 일부에 대한","example":"Many local markets are no longer opening.","translation":"대부분의 현지 시장들은 더 이상 문을 열지 않고 있다.","sourcePage":292,"pdfPage":140},{"id":1524,"source":"MAIN","day":"31","word":"locate","entryType":"","meaning":"동 ① ~의 위치를 찾아내다 ② 두다, 위치시키다","example":"Rescue planes are trying to locate the missing sailors.","translation":"구조에 나선 항공기들이 실종된 선원들의 위치를 찾아내기 위해 애쓰고 있다.","sourcePage":292,"pdfPage":140},{"id":1525,"source":"MAIN","day":"31","word":"deploy","entryType":"","meaning":"동 배치하다","example":"The country decided to deploy troops.","translation":"그 나라는 병력을 배치하기로 결정했다.","sourcePage":292,"pdfPage":140},{"id":1526,"source":"MAIN","day":"31","word":"approximate","entryType":"","meaning":"동 근접하다, ~에 가깝다 / 형 근사치의, 대략적인","example":"The approximate cost will be about $1,200.","translation":"대략적인 비용은 1,200달러 정도 될 것이다.","sourcePage":292,"pdfPage":140},{"id":1527,"source":"MAIN","day":"31","word":"approach","entryType":"","meaning":"동 다가가다, 접근하다 / 명 접근, 접근법","example":"We need to adopt a different approach to the problem.","translation":"우리는 문제에 대한 다른 접근법을 취해야 한다.","sourcePage":292,"pdfPage":140},{"id":1528,"source":"MAIN","day":"31","word":"landscape","entryType":"","meaning":"명 풍경, 경치","example":"The landscape is beautiful but you’re not in the mood to enjoy anything.","translation":"경치는 아름답지만, 당신은 어떤 것도 즐길 기분이 아니군요.","sourcePage":292,"pdfPage":140},{"id":1529,"source":"MAIN","day":"31","word":"outlook","entryType":"","meaning":"명 ① 경치, 조망 ② 관점, 시야 ③ 전망, 예측","example":"This year’s economic outlook remains uncertain.","translation":"올해 경제 전망은 불확실하다.","sourcePage":292,"pdfPage":140},{"id":1530,"source":"MAIN","day":"31","word":"standpoint","entryType":"","meaning":"명 입장, 견지, 관점","example":"Let’s consider it from a different standpoint.","translation":"다른 관점에서 생각해 보자.","sourcePage":293,"pdfPage":141},{"id":1531,"source":"MAIN","day":"31","word":"notion","entryType":"","meaning":"명 생각, 개념","example":"He has a notion that life is a voyage.","translation":"그는 인생은 항해와 같다는 생각을 갖고 있다.","sourcePage":293,"pdfPage":141},{"id":1532,"source":"MAIN","day":"31","word":"noble","entryType":"","meaning":"형 ① 고결한, 숭고한 ② 귀족의","example":"His noble manners deeply impressed her.","translation":"그의 고결한 태도는 그녀에게 깊은 인상을 주었다.","sourcePage":293,"pdfPage":141},{"id":1533,"source":"MAIN","day":"31","word":"doctrine","entryType":"","meaning":"명 ① 교리, 신조 ② 정책, 주의","example":"He studied the Christian doctrine.","translation":"그는 기독교 교리를 연구했다.","sourcePage":293,"pdfPage":141},{"id":1534,"source":"MAIN","day":"31","word":"docile","entryType":"","meaning":"형 유순한, 고분고분한","example":"She is an intelligent and docile pupil.","translation":"그녀는 총명하고 유순한 학생이다.","sourcePage":293,"pdfPage":141},{"id":1535,"source":"MAIN","day":"31","word":"holistic","entryType":"","meaning":"형 전체론의, 전체론적인","example":"This problem needs a holistic approach, not a quick fix.","translation":"이 문제는 빠른 해결이 아닌 전체론적인 접근이 필요하다.","sourcePage":293,"pdfPage":141},{"id":1536,"source":"MAIN","day":"31","word":"ecosystem","entryType":"","meaning":"명 생태계","example":"Reckless development is destroying the ecosystem.","translation":"무분별한 개발이 생태계를 파괴하고 있다.","sourcePage":293,"pdfPage":141},{"id":1537,"source":"MAIN","day":"31","word":"organism","entryType":"","meaning":"명 생물, 유기체","example":"Human is an organism composed of countless cells.","translation":"인간은 셀 수 없이 많은 세포로 구성된 유기체이다.","sourcePage":294,"pdfPage":142},{"id":1538,"source":"MAIN","day":"31","word":"salmon","entryType":"","meaning":"명 연어","example":"Today’s special is a splendid lunch of smoked salmon.","translation":"오늘의 특별 요리는 훈제 연어로 점심이다.","sourcePage":294,"pdfPage":142},{"id":1539,"source":"MAIN","day":"31","word":"parasite","entryType":"","meaning":"명 기생충","example":"The lazy man was a parasite on his family.","translation":"그 게으른 남자는 그의 가족의 기생충이었다.","sourcePage":294,"pdfPage":142},{"id":1540,"source":"MAIN","day":"31","word":"mist","entryType":"","meaning":"명 ① 엷은 안개 ② 분무 / 동 안개가 끼다, 흐려지다","example":"The night grew darker and the mist began to spread around him.","translation":"밤은 점차 어두워졌고 그의 주변에는 안개가 퍼지기 시작했다.","sourcePage":294,"pdfPage":142},{"id":1541,"source":"MAIN","day":"31","word":"moist","entryType":"","meaning":"형 습기 있는, 촉촉한","example":"The plant grows best in direct sunlight and with rich, moist soil.","translation":"식물은 직사광선과 기름지고 촉촉한 토양에서 가장 잘 자란다.","sourcePage":294,"pdfPage":142},{"id":1542,"source":"MAIN","day":"31","word":"meadow","entryType":"","meaning":"명 목초지, 초원","example":"Cattle were grazing in the meadow.","translation":"소들이 초원에서 풀을 뜯어 먹고 있었다.","sourcePage":294,"pdfPage":142},{"id":1543,"source":"MAIN","day":"31","word":"pasture","entryType":"","meaning":"명 ① 목장 ② 목초지","example":"The ox arrives at the pasture.","translation":"그 황소가 목장에 도착한다.","sourcePage":294,"pdfPage":142},{"id":1544,"source":"MAIN","day":"31","word":"prairie","entryType":"","meaning":"명 대초원","example":"Prairies stretch as far as the eyes can see.","translation":"대초원이 끝 베란다","example":"The old church has a porch with a bench.","translation":"그 오래된 교회에는 벤치가 있는 현관이 있다.","sourcePage":296,"pdfPage":144},{"id":1554,"source":"MAIN","day":"32","word":"sphere","entryType":"","meaning":"명 ① 구(체) ② 영역, 범위","example":"The sun is the most perfect sphere ever observed in nature.","translation":"태양은 자연에서 관찰된 것 중 가장 완벽한 구체이다.","sourcePage":296,"pdfPage":144},{"id":1555,"source":"MAIN","day":"32","word":"hemisphere","entryType":"","meaning":"명 반구(半球)","example":"Unexpected bitter cold swept the entire Southern Hemisphere in 2007.","translation":"2007년 예상치 못한 혹한이 남반구 전체를 휩쓸었다.","sourcePage":297,"pdfPage":145},{"id":1556,"source":"MAIN","day":"32","word":"orbit","entryType":"","meaning":"명 궤도, 공전 / 동 궤도를 돌다","example":"How much does it cost to put a satellite into orbit?","translation":"위성 하나를 궤도에 올리는 데 비용이 얼마나 드나요?","sourcePage":297,"pdfPage":145},{"id":1557,"source":"MAIN","day":"32","word":"satellite","entryType":"","meaning":"명 인공위성","example":"The moon is a satellite of the Earth.","translation":"달은 지구의 위성이다.","sourcePage":297,"pdfPage":145},{"id":1558,"source":"MAIN","day":"32","word":"celestial","entryType":"","meaning":"형 하늘의, 천체의","example":"A total solar eclipse is a rare celestial event that always generates excitement.","translation":"개기 일식은 항상 흥분을 불러일으키는 드문 천체 현상이다.","sourcePage":297,"pdfPage":145},{"id":1559,"source":"MAIN","day":"32","word":"lunar","entryType":"","meaning":"형 달의","example":"Those of us who watched the lunar voyage of Apollo 11 were thrilled.","translation":"아폴로 11호의 달 탐사를 지켜본 우리는 매우 감격했다.","sourcePage":297,"pdfPage":145},{"id":1560,"source":"MAIN","day":"32","word":"telescope","entryType":"","meaning":"명 망원경","example":"She loved watching the skies through her father's telescope.","translation":"그녀는 아버지의 망원경을 통해 하늘을 보는 것을 좋아했다.","sourcePage":297,"pdfPage":145},{"id":1561,"source":"MAIN","day":"32","word":"equator","entryType":"","meaning":"명 적도","example":"The capital of the country is on the equator.","translation":"그 나라의 수도는 적도에 있다.","sourcePage":297,"pdfPage":145},{"id":1562,"source":"MAIN","day":"32","word":"latitude","entryType":"","meaning":"명 위도 / latitude and longitude 경도와 위도","example":"We measured the longitude and latitude to determine its absolute location.","translation":"우리는 정확한 위치를 알아내기 위해 경도와 위도를 측정했다.","sourcePage":297,"pdfPage":145},{"id":1563,"source":"MAIN","day":"32","word":"vertical","entryType":"","meaning":"형 수직의, 세로의","example":"Floors are horizontal and walls are vertical.","translation":"바닥은 수평이고 벽은 수직이다.","sourcePage":298,"pdfPage":146},{"id":1564,"source":"MAIN","day":"32","word":"terrestrial","entryType":"","meaning":"형 지구의, 육지의","example":"Newton investigated terrestrial motion.","translation":"Newton은 지구의 운동을 연구했다.","sourcePage":298,"pdfPage":146},{"id":1565,"source":"MAIN","day":"32","word":"earthquake","entryType":"","meaning":"명 지진","example":"Damage from the earthquakes was not immediately reported.","translation":"지진으로 인한 피해는 즉시 보고되지 않았다.","sourcePage":298,"pdfPage":146},{"id":1566,"source":"MAIN","day":"32","word":"alert","entryType":"","meaning":"형 ① 경계하는, 주의성 있는 ② 민첩한 / 동 알리다, 경보를 발하다","example":"The governor alerted island residents that a hurricane was coming.","translation":"주지사는 허리케인이 오고 있다고 섬 주민들에게 알렸다.","sourcePage":298,"pdfPage":146},{"id":1567,"source":"MAIN","day":"32","word":"vice","entryType":"","meaning":"명 악덕, 악행","example":"Virtue triumphs over vice in the end.","translation":"결국 미덕은 악덕을 이긴다.","sourcePage":298,"pdfPage":146},{"id":1568,"source":"MAIN","day":"32","word":"vicious","entryType":"","meaning":"형 ① 잔인한, 포악한 ② 사나운, 공격적인 ③ 악의적인","example":"Wolves are not naturally cruel or vicious.","translation":"늑대는 본래 잔인하거나 사납지 않다.","sourcePage":298,"pdfPage":146},{"id":1569,"source":"MAIN","day":"32","word":"sinister","entryType":"","meaning":"형 ① 사악한, 해로운 ② 불길한","example":"These incidents began to take on a more sinister aspect.","translation":"이 사건들은 더욱 불길한 양상을 띠기 시작했다.","sourcePage":298,"pdfPage":146},{"id":1570,"source":"MAIN","day":"32","word":"savage","entryType":"","meaning":"형 야만적인, 난폭한 / 명 야만인","example":"Savage tribes still live in some parts of the world.","translation":"야만적인 부족들이 아직도 세계 일부 지역에 살고 있다.","sourcePage":299,"pdfPage":147},{"id":1571,"source":"MAIN","day":"32","word":"brutal","entryType":"","meaning":"형 잔혹한, 잔인한","example":"The brutal dictator is universally abhorred.","translation":"그 잔혹한 독재자는 모든 사람에게 미움을 받는다.","sourcePage":299,"pdfPage":147},{"id":1572,"source":"MAIN","day":"32","word":"relentless","entryType":"","meaning":"형 ① 잔인한, 가차 없는 ② 수그러들지 않는","example":"We all jumped in the pool to escape the relentless heat of the sun.","translation":"우리는 수그러들지 않는 태양의 열기를 피하기 위해 모두 수영장으로 뛰어들었다.","sourcePage":299,"pdfPage":147},{"id":1573,"source":"MAIN","day":"32","word":"virtue","entryType":"","meaning":"명 ① 덕, 미덕 ② 장점","example":"Our main virtue is respect for others.","translation":"우리의 주요 미덕은 다른 사람에 대한 존중이다.","sourcePage":299,"pdfPage":147},{"id":1574,"source":"MAIN","day":"32","word":"blink","entryType":"","meaning":"동 눈을 깜빡이다 / 명 눈의 깜박거림","example":"She blinked at the sudden light.","translation":"그녀는 갑작스러운 빛에 눈을 깜빡였다.","sourcePage":299,"pdfPage":147},{"id":1575,"source":"MAIN","day":"32","word":"gleam","entryType":"","meaning":"명 번쩍임, 반짝임 / 동 번쩍이다, 빛나다","example":"He polished the silver spoon until it gleamed.","translation":"그는 은수저가 번쩍일 때까지 닦았다.","sourcePage":299,"pdfPage":147},{"id":1576,"source":"MAIN","day":"32","word":"twinkle","entryType":"","meaning":"동 반짝이다, 빛나다","example":"He watched the twinkling farmhouse lights below.","translation":"그는 아래에서 반짝이는 농가의 불빛을 바라보았다.","sourcePage":299,"pdfPage":147},{"id":1577,"source":"MAIN","day":"32","word":"radiate","entryType":"","meaning":"동 (빛·열 등을) 발산하다, 방출하다","example":"Streets radiate from the city in every direction.","translation":"거리들이 도시에서 사방으로 뻗어 있다.","sourcePage":300,"pdfPage":148},{"id":1578,"source":"MAIN","day":"32","word":"blaze","entryType":"","meaning":"동 ① 활활 타다 ② (눈부시게) 빛나다 / 명 불꽃","example":"The campfire blazed brightly all night.","translation":"모닥불은 밤새 밝게 타올랐다.","sourcePage":300,"pdfPage":148},{"id":1579,"source":"MAIN","day":"32","word":"flame","entryType":"","meaning":"명 ① 불꽃 ② 화염 / 동 활활 타오르다","example":"The Olympic torch carries an eternal flame.","translation":"올림픽 성화는 영원한 불꽃을 지닌다.","sourcePage":300,"pdfPage":148},{"id":1580,"source":"MAIN","day":"32","word":"spur","entryType":"","meaning":"동 ① 박차를 가하다 ② 자극하다, 격려하다 / 명 박차, 자극","example":"This book spurs imagination.","translation":"이 책은 상상력을 자극한다.","sourcePage":300,"pdfPage":148},{"id":1581,"source":"MAIN","day":"32","word":"stimulate","entryType":"","meaning":"동 ① 자극하다, 활발하게 하다 ② 격려하다, 고무하다","example":"Reading books stimulates your imagination.","translation":"독서는 당신의 상상력을 자극한다.","sourcePage":300,"pdfPage":148},{"id":1582,"source":"MAIN","day":"32","word":"arouse","entryType":"","meaning":"동 불러일으키다, 자극하다","example":"This incident aroused his anger.","translation":"이 사건은 그의 분노를 불러일으켰다.","sourcePage":300,"pdfPage":148},{"id":1583,"source":"MAIN","day":"32","word":"animate","entryType":"","meaning":"동 생기를 주다, 활기를 불어넣다, 살아 있게 만들다","example":"Her gaiety animated the entire group.","translation":"그녀의 쾌활함은 전체 그룹에 활기를 불어넣었다.","sourcePage":301,"pdfPage":149},{"id":1584,"source":"MAIN","day":"32","word":"vital","entryType":"","meaning":"형 ① 생명의, 생명에 필수적인 ② 필수적인, 중요한","example":"The kidneys play a vital role in removing waste from the blood.","translation":"신장은 혈액에서 노폐물을 제거하는 데 필수적인 역할을 한다.","sourcePage":301,"pdfPage":149},{"id":1585,"source":"MAIN","day":"32","word":"vivid","entryType":"","meaning":"형 생생한, 선명한, 활기찬","example":"In spring everything is fresh and vivid.","translation":"봄에는 모든 것이 신선하고 생생하다.","sourcePage":301,"pdfPage":149},{"id":1586,"source":"MAIN","day":"32","word":"revive","entryType":"","meaning":"동 ① 회복시키다/되살리다 ② 부활시키다, 재생산시키다","example":"We tried to revive the old customs.","translation":"우리는 옛 관습을 되살리려고 노력했다.","sourcePage":301,"pdfPage":149},{"id":1587,"source":"MAIN","day":"32","word":"revitalize","entryType":"","meaning":"동 새로운 활력을 주다, 재활성화시키다","example":"A good night's sleep will revitalize you.","translation":"숙면은 당신에게 새로운 활력을 줄 것이다.","sourcePage":301,"pdfPage":149},{"id":1588,"source":"MAIN","day":"32","word":"stir","entryType":"","meaning":"동 ① 휘젓다, 뒤섞다 ② (감정을) 유발하다, 자극하다","example":"The thought of conquering the mountain stirs me with anticipation.","translation":"산을 정복한다는 생각은 나를 기대감으로 들뜨게 한다.","sourcePage":301,"pdfPage":149},{"id":1589,"source":"MAIN","day":"32","word":"mingle","entryType":"","meaning":"동 ① 섞이다, 어우러지다 ② 섞다, 결합하다","example":"I mingled feelings over the matter.","translation":"나는 그 문제에 대해 복잡한 감정을 느꼈다.","sourcePage":302,"pdfPage":150},{"id":1590,"source":"MAIN","day":"32","word":"trigger","entryType":"","meaning":"동 ① 방아쇠를 당기다 ② 촉발하다, 유발하다 / 명 방아쇠","example":"This incident triggered a major conflict.","translation":"이 사건은 큰 갈등을 촉발했다.","sourcePage":302,"pdfPage":150},{"id":1591,"source":"MAIN","day":"32","word":"blast","entryType":"","meaning":"명 폭발하다 / 동 ① 폭발 ② 폭발음, 폭풍","example":"Several were wounded in the blast.","translation":"폭발로 여러 명이 다쳤다.","sourcePage":302,"pdfPage":150},{"id":1592,"source":"MAIN","day":"32","word":"burst","entryType":"","meaning":"동 ① 터지다(터뜨리다, 파열하다) ② 갑자기 ~하다 (into, out) / 명 폭발, 파열","example":"The dam burst after years of neglect.","translation":"그 댐은 수년간 방치된 후 터졌다.","sourcePage":302,"pdfPage":150},{"id":1593,"source":"MAIN","day":"32","word":"catalyst","entryType":"","meaning":"명 ① 기폭제, 촉매 ② 자극, 장려","example":"His sad expression served as a catalyst to her anger.","translation":"그의 슬픈 표정은 그녀의 분노를 촉발하는 기폭제가 되었다.","sourcePage":302,"pdfPage":150},{"id":1594,"source":"MAIN","day":"32","word":"incentive","entryType":"","meaning":"명 자극, 동기 ① 장려책, 장려금","example":"They have no incentive to work harder.","translation":"그들은 더 열심히 일할 동기가 없다.","sourcePage":302,"pdfPage":150},{"id":1595,"source":"MAIN","day":"32","word":"motive","entryType":"","meaning":"명 동기, 자극 / 동 움직이게 하다, 원동력이 되다","example":"Her motives were disclosed.","translation":"그녀의 동기가 폭로되었다.","sourcePage":303,"pdfPage":151},{"id":1596,"source":"MAIN","day":"32","word":"impetus","entryType":"","meaning":"명 ① 자극, 충동 ② 추진력","example":"The event gave impetus to numerous people.","translation":"그 사건은 많은 사람들에게 자극을 주었다.","sourcePage":303,"pdfPage":151},{"id":1597,"source":"MAIN","day":"32","word":"illuminate","entryType":"","meaning":"동 ① (불을) 비추다, 밝게 하다 ② 설명하다, 분명히 하다","example":"The sun illuminates the earth.","translation":"태양은 지구에 빛을 비춘다.","sourcePage":303,"pdfPage":151},{"id":1598,"source":"MAIN","day":"32","word":"illustrate","entryType":"","meaning":"동 ① 설명하다, 예시를 보여주다 ② 삽화를 넣다","example":"Try to illustrate the topic with examples.","translation":"그 주제를 예시로 설명해 보라.","sourcePage":303,"pdfPage":151},{"id":1599,"source":"MAIN","day":"32","word":"demonstrate","entryType":"","meaning":"동 ① 증명하다 ② 시범을 보이다, 설명하다 ③ 시위하다","example":"He demonstrated that the earth is round.","translation":"그는 지구가 둥글다는 것을 증명했다.","sourcePage":303,"pdfPage":151},{"id":1600,"source":"MAIN","day":"32","word":"reflect","entryType":"","meaning":"동 ① 반사하다, 비치다 ② 심사숙고하다 ③ 반영하다","example":"His face was reflected in the mirror.","translation":"그의 얼굴이 거울에 비쳤다.","sourcePage":303,"pdfPage":151},{"id":1601,"source":"MAIN","day":"33","word":"stagnant","entryType":"","meaning":"형 고여 있는, 침체해 있는","example":"There is a stagnant pool at the bottom of the park.","translation":"공원 아래쪽에 물이 고여 있는 웅덩이가 있다.","sourcePage":304,"pdfPage":152},{"id":1602,"source":"MAIN","day":"33","word":"stubborn","entryType":"","meaning":"형 고집 센, 완고한","example":"I don't know why he’s so stubborn about it.","translation":"그 사람이 그 일에 왜 그렇게 고집을 부리는지 모르겠어.","sourcePage":304,"pdfPage":152},{"id":1603,"source":"MAIN","day":"33","word":"stiff","entryType":"","meaning":"형 ① 뻣뻣한, 빳빳한 ② (사람·행동 등이) 경직된, 딱딱한 ③ (근육이) 뻐근한 ④ 거센, 격렬한","example":"The speech he made was stiff and formal.","translation":"그가 한 연설은 딱딱하고 격식적이었다.","sourcePage":304,"pdfPage":152},{"id":1604,"source":"MAIN","day":"33","word":"rigid","entryType":"","meaning":"형 ① 엄격한, 융통성 없는 ② (사물이) 단단한, 뻣뻣한","example":"The curriculum was too narrow and too rigid.","translation":"그 커리큘럼은 너무 편협하고 융통성이 없었다.","sourcePage":304,"pdfPage":152},{"id":1605,"source":"MAIN","day":"33","word":"stern","entryType":"","meaning":"형 엄격한","example":"She was brought up in a stern family.","translation":"그녀는 엄격한 가정에서 자랐다.","sourcePage":305,"pdfPage":153},{"id":1606,"source":"MAIN","day":"33","word":"strict","entryType":"","meaning":"형 ① 엄격한, 엄한 ② 정확한, 엄밀한","example":"My parents had strict rules about money.","translation":"부모님은 돈에 대해 엄격한 규칙을 가지고 계셨다.","sourcePage":305,"pdfPage":153},{"id":1607,"source":"MAIN","day":"33","word":"variable","entryType":"","meaning":"형 변하기 쉬운, 가변적인, 변덕스러운 / 명 변수","example":"There are many variables in this election.","translation":"이번 선거에는 많은 변수가 있다.","sourcePage":305,"pdfPage":153},{"id":1608,"source":"MAIN","day":"33","word":"capricious","entryType":"","meaning":"형 변덕스러운","example":"The weather has been capricious recently.","translation":"최근의 날씨는 변덕스러웠다.","sourcePage":305,"pdfPage":153},{"id":1609,"source":"MAIN","day":"33","word":"volatile","entryType":"","meaning":"형 ① 휘발성의 ② 불안정한, 변덕스러운","example":"The stock market's really volatile these days.","translation":"요즘은 주식시장이 아주 불안정하다.","sourcePage":305,"pdfPage":153},{"id":1610,"source":"MAIN","day":"33","word":"exalt","entryType":"","meaning":"동 ① 승격시키다, 높이다 ② 칭찬하다","example":"The poem was written to exalt the country.","translation":"그 시는 그 나라를 칭송하기 위해 쓰였다.","sourcePage":305,"pdfPage":153},{"id":1611,"source":"MAIN","day":"33","word":"soar","entryType":"","meaning":"동 급등하다, 날아오르다","example":"The eagle soared through the autumn sky.","translation":"독수리가 가을 하늘로 날아올랐다.","sourcePage":306,"pdfPage":154},{"id":1612,"source":"MAIN","day":"33","word":"surge","entryType":"","meaning":"동 밀어닥치다, 쇄도하다, 급등하다 / 명 큰 파도, 쇄도, 급등","example":"Flood water surged into their houses.","translation":"범람한 물이 그들의 집 안으로 밀려 들어왔다.","sourcePage":306,"pdfPage":154},{"id":1613,"source":"MAIN","day":"33","word":"surf","entryType":"","meaning":"동 파도타기를 하다 / (인터넷상에서 정보를) 찾아다니다","example":"The boy is surfing the Internet.","translation":"그 소년은 인터넷을 하고 있다.","sourcePage":306,"pdfPage":154},{"id":1614,"source":"MAIN","day":"33","word":"swamp","entryType":"","meaning":"동 빠지게 하다, 밀려들다","example":"We get swamped with homework.","translation":"우리는 숙제에 빠졌다.","sourcePage":306,"pdfPage":154},{"id":1615,"source":"MAIN","day":"33","word":"swarm","entryType":"","meaning":"명 떼, 무리 / 동 떼[무리] 지어 다니다","example":"The stadium lights attracted a swarm of moths.","translation":"경기장 조명에 나방 떼가 몰려들었다.","sourcePage":306,"pdfPage":154},{"id":1616,"source":"MAIN","day":"33","word":"troop","entryType":"","meaning":"명 군대, 부대 [보통 pl.] / 무리, 떼","example":"Federal troops were sent to the war zone.","translation":"연방군이 전쟁 지역에 파견되었다.","sourcePage":306,"pdfPage":154},{"id":1617,"source":"MAIN","day":"33","word":"flock","entryType":"","meaning":"동 무리 짓다, 모이다 / 명 무리, 떼","example":"Birds fly about in flocks.","translation":"새는 무리 지어 날아다닌다.","sourcePage":306,"pdfPage":154},{"id":1618,"source":"MAIN","day":"33","word":"herd","entryType":"","meaning":"명 (짐승의) 떼 / 동 떼 지어 가다","example":"A herd of elephants were crossing the river.","translation":"코끼리 떼가 강을 건너고 있었다.","sourcePage":307,"pdfPage":155},{"id":1619,"source":"MAIN","day":"33","word":"colony","entryType":"","meaning":"명 ① 식민지, 집단 거주지 ② (동·식물의) 군집","example":"Jamestown was the oldest colony in America.","translation":"제임스타운은 미국에서 가장 오래된 식민지였다.","sourcePage":307,"pdfPage":155},{"id":1620,"source":"MAIN","day":"33","word":"mass","entryType":"","meaning":"명 ① 덩어리 ② 집단, 다수 ③ 대중 ④ 질량 / 형 대량의, 대중적인 / 동 모이다[모으다]","example":"The protesters formed a mass in the city center.","translation":"시위자들은 도심에서 군중을 형성했다.","sourcePage":307,"pdfPage":155},{"id":1621,"source":"MAIN","day":"33","word":"multiple","entryType":"","meaning":"형 다수의, 다양한 / 명 배수","example":"We made multiple copies of the report.","translation":"우리는 보고서를 여러 부 복사했다.","sourcePage":307,"pdfPage":155},{"id":1622,"source":"MAIN","day":"33","word":"multiply","entryType":"","meaning":"동 ① 곱하다 ② 증가시키다","example":"It’s possible to multiply these bacteria in the laboratory.","translation":"이 박테리아를 실험실에서 증가시키는 것은 가능하다.","sourcePage":307,"pdfPage":155},{"id":1623,"source":"MAIN","day":"33","word":"multitude","entryType":"","meaning":"명 ① 아주 많은 수 ② 일반 대중[군중]","example":"Every day we are faced with a multitude of choices.","translation":"우리는 매일 다수의 선택에 직면한다.","sourcePage":307,"pdfPage":155},{"id":1624,"source":"MAIN","day":"33","word":"public","entryType":"","meaning":"형 공공의, 일반 대중의 / 명 대중","example":"Public libraries are handy for finding information.","translation":"공공도서관은 정보를 찾는 데 편리하다.","sourcePage":307,"pdfPage":155},{"id":1625,"source":"MAIN","day":"33","word":"patron","entryType":"","meaning":"명 후원자, 단골손님","example":"The owner allows only patrons a sale on account.","translation":"주인은 단골 고객들에게만 외상 판매를 허용한다.","sourcePage":308,"pdfPage":156},{"id":1626,"source":"MAIN","day":"33","word":"patriot","entryType":"","meaning":"명 애국자","example":"He regards himself as a patriot.","translation":"그는 스스로를 애국자라고 여긴다.","sourcePage":308,"pdfPage":156},{"id":1627,"source":"MAIN","day":"33","word":"plot","entryType":"","meaning":"명 줄거리, 음모 / 동 줄거리를 만들다, 음모하다, 몰래 계획하다","example":"In summary, the plot of the movie is boring and confusing at the same time.","translation":"요약하자면, 그 영화의 줄거리는 지루하면서 동시에 혼란스럽다.","sourcePage":308,"pdfPage":156},{"id":1628,"source":"MAIN","day":"33","word":"intrigue","entryType":"","meaning":"동 흥미를 불러일으키다, 음모를 꾸미다","example":"Economics somehow intrigues me.","translation":"경제학은 이상하게도 내 흥미를 불러일으킨다.","sourcePage":308,"pdfPage":156},{"id":1629,"source":"MAIN","day":"33","word":"contrive","entryType":"","meaning":"동 고안하다, 발명하다 / (나쁜 일을) 꾸미다","example":"He contrived a new kind of engine.","translation":"그는 새로운 종류의 엔진을 고안해 냈다.","sourcePage":308,"pdfPage":156},{"id":1630,"source":"MAIN","day":"33","word":"mold","entryType":"","meaning":"동 (틀에 넣어) 만들다, 주조하다 / 명 틀, 주형, 곰팡이","example":"He molded a rabbit out of clay.","translation":"그는 찰흙으로 토끼를 만들었다.","sourcePage":308,"pdfPage":156},{"id":1631,"source":"MAIN","day":"33","word":"paradigm","entryType":"","meaning":"명 ① 예, 모범 ② 이론적 틀, 패러다임","example":"The war was a paradigm of the destructive side of human nature.","translation":"그 전쟁은 인간 본성의 파괴적인 면을 보여주는 하나의 예였다.","sourcePage":309,"pdfPage":157},{"id":1632,"source":"MAIN","day":"33","word":"furnish","entryType":"","meaning":"동 제공하다, 비치하다","example":"She furnished him with sufficient evidence.","translation":"그녀는 그에게 충분한 증거를 제공했다.","sourcePage":309,"pdfPage":157},{"id":1633,"source":"MAIN","day":"33","word":"adorn","entryType":"","meaning":"동 꾸미다, 장식하다","example":"I bought flowers to adorn my house.","translation":"나는 집을 꾸미기 위해 꽃을 샀다.","sourcePage":309,"pdfPage":157},{"id":1634,"source":"MAIN","day":"33","word":"ornament","entryType":"","meaning":"명 장식품, 장신구 / 동 장식하다","example":"The clock is simply for ornament because it doesn't work any more.","translation":"그 시계는 더 이상 작동하지 않기 때문에 그저 장식용이다.","sourcePage":309,"pdfPage":157},{"id":1635,"source":"MAIN","day":"33","word":"garment","entryType":"","meaning":"명 의복","example":"I took six garments to the dry cleaner’s.","translation":"나는 세탁소에 여섯 벌의 의복을 맡겼다.","sourcePage":309,"pdfPage":157},{"id":1636,"source":"MAIN","day":"33","word":"tailor","entryType":"","meaning":"명 재봉사, 재단사 / 동 (요구·조건 등에) 맞추다","example":"A tailor is a person whose job is to make men's clothes.","translation":"재봉사는 남자들의 옷을 만드는 것을 직업으로 하는 사람이다.","sourcePage":309,"pdfPage":157},{"id":1637,"source":"MAIN","day":"33","word":"closet","entryType":"","meaning":"명 벽장, 옷장","example":"The children hid in the closet during hide-and-seek.","translation":"아이들은 숨바꼭질하다가 옷장에 숨었다.","sourcePage":309,"pdfPage":157},{"id":1638,"source":"MAIN","day":"33","word":"shelf","entryType":"","meaning":"명 선반, 책꽂이","example":"The vintage record player sits on a dusty shelf.","translation":"빈티지 레코드 플레이어는 먼지투성이의 선반 위에 놓여 있다.","sourcePage":310,"pdfPage":158},{"id":1639,"source":"MAIN","day":"33","word":"utensil","entryType":"","meaning":"명 도구, 기구","example":"Not all cooking utensils are provided in the kitchen.","translation":"모든 요리 도구가 주방에 갖추어져 있는 것은 아니다.","sourcePage":310,"pdfPage":158},{"id":1640,"source":"MAIN","day":"33","word":"gadget","entryType":"","meaning":"명 장치, 도구, 기계","example":"My wife bought some kitchen gadgets.","translation":"내 아내가 어떤 주방 도구를 샀다.","sourcePage":310,"pdfPage":158},{"id":1641,"source":"MAIN","day":"33","word":"apparatus","entryType":"","meaning":"명 장치, 기구, 기계","example":"We need a new piece of apparatus for the experiment.","translation":"우리는 그 실험을 위해 새로운 기구 한 개가 필요하다.","sourcePage":310,"pdfPage":158},{"id":1642,"source":"MAIN","day":"33","word":"alter","entryType":"","meaning":"동 변하다, 바꾸다 / alteration 명 변경, 변화","example":"His teacher urged him to alter his ways.","translation":"그의 선생님은 그에게 그의 방식을 바꾸도록 권고했다.","sourcePage":310,"pdfPage":158},{"id":1643,"source":"MAIN","day":"33","word":"alternative","entryType":"","meaning":"명 대안 / 형 대안적인, 대체 가능한","example":"There is no viable alternative.","translation":"실행 가능한 대안이 없다.","sourcePage":310,"pdfPage":158},{"id":1644,"source":"MAIN","day":"33","word":"alternate","entryType":"","meaning":"동 교체하다, 번갈아 하다 / 형 번갈아 일어나는","example":"We take the bus on alternate days to save gas.","translation":"우리는 기름을 아끼기 위해 격일로 버스를 탄다.","sourcePage":311,"pdfPage":159},{"id":1645,"source":"MAIN","day":"33","word":"alien","entryType":"","meaning":"형 ① 이질적인 ② 외국의 ③ 외계의 / 명 외국인, 외계인","example":"The idea is alien to our religion.","translation":"그 생각은 우리 종교와는 이질적이다.","sourcePage":311,"pdfPage":159},{"id":1646,"source":"MAIN","day":"33","word":"alienate","entryType":"","meaning":"동 소원하게 만들다","example":"His comments have alienated a lot of young voters.","translation":"그의 논평은 많은 젊은 유권자들을 소원하게 만들었다.","sourcePage":311,"pdfPage":159},{"id":1647,"source":"MAIN","day":"33","word":"altruism","entryType":"","meaning":"명 이타주의, 이타심","example":"Altruism is whether you think about others.","translation":"이타심은 타인을 생각하는 것이다.","sourcePage":311,"pdfPage":159},{"id":1648,"source":"MAIN","day":"33","word":"egocentric","entryType":"","meaning":"형 자기중심의, 이기적인","example":"He broke my trust with his egocentric behavior.","translation":"그는 자신의 이기적인 행동으로 나의 신뢰를 잃었다.","sourcePage":311,"pdfPage":159},{"id":1649,"source":"MAIN","day":"33","word":"nap","entryType":"","meaning":"명 낮잠 / 동 낮잠 자다, 졸다","example":"After lunch, he would take a nap.","translation":"점심 후에 그는 보통 낮잠을 잔다.","sourcePage":311,"pdfPage":159},{"id":1650,"source":"MAIN","day":"33","word":"doze","entryType":"","meaning":"동 졸다","example":"For a while, she dozed over her work.","translation":"잠깐 그녀는 일을 하다가 졸았다.","sourcePage":311,"pdfPage":159},{"id":1651,"source":"MAIN","day":"34","word":"nod","entryType":"","meaning":"동 ① (고개를) 끄덕이다 ② 꾸벅꾸벅 졸다","example":"All you have to do is nod your head and say “Uh-huh.”","translation":"너는 머리를 끄덕이면서 “어허”라고 말하면 된다.","sourcePage":304,"pdfPage":160},{"id":1652,"source":"MAIN","day":"34","word":"dormitory","entryType":"","meaning":"명 기숙사","example":"Our school has a dormitory attached to it.","translation":"우리 학교에는 부속된 기숙사가 있다.","sourcePage":304,"pdfPage":160},{"id":1653,"source":"MAIN","day":"34","word":"dormant","entryType":"","meaning":"형 ① 휴면[동면]기의 ② 활동을 중단한, 잠복기의","example":"Volcanoes can be active, dormant or extinct.","translation":"화산은 활화산, 휴화산 또는 사화산일 수 있다.","sourcePage":304,"pdfPage":160},{"id":1654,"source":"MAIN","day":"34","word":"nocturnal","entryType":"","meaning":"형 밤에 활동하는, 야행성의","example":"Nocturnal animals hunt by night.","translation":"야행성 동물은 밤에 사냥을 한다.","sourcePage":304,"pdfPage":160},{"id":1655,"source":"MAIN","day":"34","word":"slum","entryType":"","meaning":"명 빈민굴, 슬럼가","example":"The reporter looked into the conditions in the slums.","translation":"기자는 슬럼가의 환경을 탐방했다.","sourcePage":305,"pdfPage":161},{"id":1656,"source":"MAIN","day":"34","word":"grin","entryType":"","meaning":"동 활짝 웃다 / 명 빙긋 웃음, 활짝 웃음","example":"A broad grin comes on to a hundred and fifty faces.","translation":"150명의 얼굴에 활짝 웃음이 번진다.","sourcePage":305,"pdfPage":161},{"id":1657,"source":"MAIN","day":"34","word":"chuckle","entryType":"","meaning":"동 킬킬 웃다 / 명 킬킬 웃음","example":"Ben shook his head and chuckled.","translation":"Ben은 고개를 가로저으며 킬킬 웃었다.","sourcePage":305,"pdfPage":161},{"id":1658,"source":"MAIN","day":"34","word":"paralyze","entryType":"","meaning":"동 마비시키다, 무력하게 만들다","example":"Heavy rain paralyzed the rail transport of the whole country.","translation":"폭우가 전국의 철도 수송을 마비시켰다.","sourcePage":305,"pdfPage":161},{"id":1659,"source":"MAIN","day":"34","word":"numb","entryType":"","meaning":"형 ① 마비된, 감각이 없는 ② 멍한 / 동 -의 감각을 잃게 하다","example":"I was numb from the cold.","translation":"나는 추위에 감각이 마비되었다.","sourcePage":305,"pdfPage":161},{"id":1660,"source":"MAIN","day":"34","word":"tardy","entryType":"","meaning":"형 느린, 지체된","example":"They are always tardy in responding to my email.","translation":"그들은 내 이메일에 대한 답변이 항상 느리다.","sourcePage":305,"pdfPage":161},{"id":1661,"source":"MAIN","day":"34","word":"delay","entryType":"","meaning":"동 미루다, 연기하다 / 명 연기, 지체","example":"We must delay our decision for a day.","translation":"우리는 결정을 하루 미뤄야 한다.","sourcePage":305,"pdfPage":161},{"id":1662,"source":"MAIN","day":"34","word":"suspend","entryType":"","meaning":"동 ① 매달다 ② 연기하다 ③ 일시 중지하다","example":"He had to suspend his business because of heavy snow.","translation":"그는 폭설 때문에 영업을 일시 중지해야 했다.","sourcePage":306,"pdfPage":162},{"id":1663,"source":"MAIN","day":"34","word":"procrastinate","entryType":"","meaning":"동 질질 끌다, 미루다","example":"I don't know why I procrastinated for so long.","translation":"나도 내가 왜 이렇게 오래 질질 끌었는지 모르겠다.","sourcePage":306,"pdfPage":162},{"id":1664,"source":"MAIN","day":"34","word":"thrust","entryType":"","meaning":"동 밀다, 찌르다 / 명 ① 찌르기 ② 요점, 취지","example":"He thrust me roughly towards the door.","translation":"그는 나를 문 쪽으로 거칠게 밀어붙였다.","sourcePage":306,"pdfPage":162},{"id":1665,"source":"MAIN","day":"34","word":"paradox","entryType":"","meaning":"명 역설, 모순","example":"“More haste, less speed” is a well-known paradox.","translation":"“급할수록 돌아가라”는 잘 알려진 역설이다.","sourcePage":306,"pdfPage":162},{"id":1666,"source":"MAIN","day":"34","word":"orthodox","entryType":"","meaning":"형 정통의, 전통적인","example":"We prefer a more orthodox approach to the problem.","translation":"우리는 그 문제에 대해 좀 더 전통적인 접근법을 선호한다.","sourcePage":306,"pdfPage":162},{"id":1667,"source":"MAIN","day":"34","word":"typical","entryType":"","meaning":"형 전형적인, 일반적인","example":"There’s no such thing as a typical American.","translation":"전형적인 미국인이란 것은 없다.","sourcePage":306,"pdfPage":162},{"id":1668,"source":"MAIN","day":"34","word":"general","entryType":"","meaning":"형 일반적인, 보편적인 / 명 장군, 대장","example":"The general opinion is that the test was difficult.","translation":"그 시험이 어려웠다는 것이 일반적인 견해다.","sourcePage":306,"pdfPage":162},{"id":1669,"source":"MAIN","day":"34","word":"overall","entryType":"","meaning":"형 종합적인, 전체의","example":"The overall nutritional status of the children is good.","translation":"아이들의 영양 상태가 전반적으로 좋다.","sourcePage":307,"pdfPage":163},{"id":1670,"source":"MAIN","day":"34","word":"remedy","entryType":"","meaning":"명 ① 치료(약) ② 해결책 / 동 ① 치료하다 ② 바로잡다, 교정하다","example":"Proper exercise and diet is a sure remedy for overweight people.","translation":"적절한 운동과 식이요법은 과체중인 사람들을 위한 확실한 치료법이다.","sourcePage":307,"pdfPage":163},{"id":1671,"source":"MAIN","day":"34","word":"amend","entryType":"","meaning":"동 고치다, 수정하다, 개정하다","example":"He had to amend his opinion.","translation":"그는 자신의 의견을 수정해야만 했다.","sourcePage":307,"pdfPage":163},{"id":1672,"source":"MAIN","day":"34","word":"rectify","entryType":"","meaning":"동 고치다, 바로잡다, 교정하다","example":"We must find out what went wrong and rectify it.","translation":"우리는 무엇이 잘못되었는지 찾아내서 그것을 바로잡아야 한다.","sourcePage":307,"pdfPage":163},{"id":1673,"source":"MAIN","day":"34","word":"redress","entryType":"","meaning":"동 고치다, 바로잡다, 교정하다","example":"President made a promise to red
