<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P.E. Wordbook v1.1.33 — Mobile UX + Popup 40</title>
<style>
:root{--main:#08aec3;--red:#ff5b61;--green:#10a77a;--ink:#222;--muted:#8b8b8b;--bg:#f7f8f9;--line:#eee;--soft:#eefbfc}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;border:0;cursor:pointer}header{background:#fff;padding:18px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;margin-top:14px;overflow:auto}nav button{background:#fff;border:1px solid var(--main);color:var(--main);padding:10px 14px;border-radius:22px;white-space:nowrap}nav button.active{background:var(--main);color:#fff}
main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000008}
.btn{width:100%;padding:15px;border-radius:12px;background:var(--main);color:#fff;font-weight:700;margin-top:10px;transition:.12s ease;box-shadow:0 1px 2px #00000008}.btn.secondary{background:#fff;color:var(--main);border:1px solid var(--main)}.btn.danger{background:var(--red)}
.btn:active,.btn.selected{font-weight:900;transform:translateY(1px);filter:brightness(.88);box-shadow:inset 0 0 0 2px #00000014,0 1px 1px #00000010}
.btn.secondary:active,.btn.secondary.selected{background:var(--main);color:#fff;border-color:var(--main)}
nav button{transition:.12s ease;font-weight:700}nav button:active{font-weight:900;transform:translateY(1px);filter:brightness(.88)}nav button.active{font-weight:900;box-shadow:inset 0 0 0 2px #00000012}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center;padding:18px;background:#fff;border-radius:14px}.num{font-size:30px;font-weight:800}.label{color:var(--muted);font-size:13px}
.day{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.day:last-child{border:0}
.quizword{text-align:center;background:var(--main);color:#fff;border-radius:16px;padding:35px 16px 28px;margin-bottom:12px}.quizword .word{font-size:38px;font-weight:800}
.progress{text-align:right;font-size:13px;margin-bottom:8px}.option{width:100%;text-align:left;background:#fff;padding:18px;border-radius:14px;margin:7px 0;border:2px solid transparent;font-weight:600}@media (hover:hover) and (pointer:fine){.option:hover{border-color:var(--main)}}
.timer{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:#fff;color:var(--main);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;border:5px solid var(--main)}.timer.urgent{color:var(--red);border-color:var(--red)}
.speak{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--main);border:1px solid #fff;padding:8px 12px;border-radius:999px;margin-top:14px;font-weight:700}
.resultOverlay{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-start;justify-content:center;padding:0 22px;z-index:30}.resultPopup{position:absolute;top:22%;transform:translateY(-50%);width:min(440px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:28px;text-align:center}
.resultPopup.ok{border-top:8px solid var(--green)}.resultPopup.bad{border-top:8px solid var(--red)}.resultPopup.timeout{border-top:8px solid #f0a000}
.popupWord{font-size:22px;font-weight:800}.correctAnswer{background:#e9fff0;border:3px solid var(--green);border-radius:15px;padding:18px 14px;margin:12px 0}.correctAnswer strong{display:block;font-size:28px;color:#087b4e}
.myAnswer{background:#fff0f1;border-radius:12px;padding:12px;margin:8px 0;color:#c63d44}.timeoutMsg{background:#fff8e7;border-radius:12px;padding:12px;margin:8px 0;color:#a56600;font-weight:700}
.resultHero{background:var(--red);color:#fff;border-radius:16px;padding:28px}.resultHero .pct{font-size:64px;font-weight:900}
.wordrow{padding:14px 0;border-bottom:1px solid var(--line)}.wordrow b{font-size:20px}.wrong{color:var(--red)}.right{color:var(--green)}
.detailWord{text-align:center;font-size:34px;font-weight:850;margin:4px 0 16px}.meaningBlock{margin-top:16px}.posLine{margin:12px 0 4px;font-size:17px;font-weight:800}.posTag{display:inline-block;min-width:42px;text-align:center;padding:4px 8px;margin-right:8px;border-radius:8px;background:var(--soft);color:#087d8b;font-size:15px}.sense{margin-left:50px;line-height:1.7}.example{margin-top:18px;padding:14px;border-left:4px solid var(--main);background:#fafdfd;line-height:1.6}.translation{color:#555;margin-top:6px}.studyBox{margin-top:18px;padding:16px;background:#fafafa;border-radius:14px}.studyItem{padding:10px 0;border-bottom:1px solid var(--line)}.studyItem:last-child{border:0}.studyLabel{font-size:12px;color:var(--muted);font-weight:700}.miniBtn{padding:8px 11px;border-radius:10px;background:#fff;border:1px solid var(--main);color:var(--main);font-weight:700}
textarea,input{width:100%;font:inherit;border:1px solid #ddd;border-radius:10px;padding:10px;background:#fff}.studyActions{display:flex;gap:8px;margin-top:8px}.studyActions button{flex:1}
.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 16px;border-radius:20px;z-index:50}
@media(max-width:520px){
main{padding:10px}
header{padding:12px}
h1{font-size:22px}
.sub{font-size:12px}
nav{gap:6px;margin-top:10px}nav button{padding:8px 12px}
.resultOverlay{padding:0}.resultPopup{top:40%}
.grid{grid-template-columns:1fr 1fr}
.progress{font-size:12px;margin-bottom:5px}
.quizword{padding:24px 12px 20px;margin-bottom:8px;border-radius:14px}
.quizword .word{font-size:30px}
.timer{width:52px;height:52px;font-size:24px;border-width:4px;margin-bottom:8px}
.speak{padding:6px 10px;font-size:14px;margin-top:8px}
.option{padding:12px 14px;margin:5px 0;font-size:16px;border-radius:12px}
.detailWord{font-size:30px}
}
</style>
<style id="mobile-compact-v1-1-21">
@media (max-width: 600px) {
  .header, header { padding-top: 8px !important; padding-bottom: 8px !important; }
  .nav, .navBar, .topNav { gap: 6px !important; }
  .nav button, .nav a, .topNav button, .topNav a { padding: 8px 12px !important; font-size: 15px !important; }
  .quizCard, .questionCard, .wordCard { padding: 18px !important; }
  .quizCard .word, .questionCard .word { font-size: clamp(32px, 8vw, 48px) !important; }
  .quizCard .timer, .questionCard .timer { transform: scale(.88); }
  .quizOption, .choice, .answerChoice { padding: 14px 16px !important; margin-bottom: 8px !important; }
  .quizOption .meaning, .choice .meaning, .answerChoice .meaning { line-height: 1.25 !important; }
  .quizPage, .quizContainer, main { padding-top: 8px !important; padding-bottom: 8px !important; }
}
</style>


<style id="mobile-ux-v1-1-22">
@media (max-width:520px){
  /* 실제 퀴즈 화면(.quizword/.option)에 맞춘 초압축 레이아웃 */
  .quizword{padding:16px 10px 14px !important;margin-bottom:6px !important;border-radius:13px !important}
  .quizword .word{font-size:27px !important;line-height:1.08 !important}
  .timer{width:46px !important;height:46px !important;font-size:21px !important;border-width:4px !important;margin-bottom:5px !important}
  .speak{padding:5px 9px !important;font-size:13px !important;margin-top:5px !important}
  .option{padding:9px 12px !important;margin:4px 0 !important;font-size:14px !important;line-height:1.28 !important;border-radius:11px !important}
  .option .posTag{font-size:12px !important}
  main{padding:7px !important}
  .progress{font-size:11px !important;margin-bottom:4px !important}

  /* 팝업 액션을 상단으로 당기고 2열 배치하여 보기 영역과 시각적으로 분리 */
  .resultPopup{top:40% !important;padding:20px 18px !important}
  .resultPopup .popupActions{display:grid !important;grid-template-columns:1fr 1fr !important;gap:8px !important;margin:10px 0 12px !important}
  .resultPopup .popupActions .btn{margin-top:0 !important;padding:11px 8px !important;font-size:14px !important}
  .resultPopup .speak{margin-top:0 !important;margin-bottom:2px !important}
}
.popupActions{display:flex;gap:10px;justify-content:center;margin:10px 0 12px}
.popupActions .btn{flex:1;margin-top:0}
</style>




<style id="quiz-layout-v1-1-30">
@media (max-width:600px){
html,body{width:100%;max-width:100%;margin:0;padding:0;overflow-x:hidden}
body.quiz-active{height:100dvh;min-height:100dvh;overflow:hidden!important}
body.quiz-active main{width:100%!important;max-width:100%!important;height:calc(100dvh - var(--quiz-header-h,0px))!important;min-height:0!important;margin:0!important;padding:0 8px env(safe-area-inset-bottom)!important;box-sizing:border-box!important;overflow:hidden!important}
body.quiz-active #app{width:100%;height:100%;min-height:0;overflow:hidden}
.quizLayout30{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:5% 18% 67% 10%;gap:0;overflow:hidden}
.quizRegion30{width:100%;min-height:0;box-sizing:border-box}
.quizHeader30{display:flex;align-items:center;justify-content:center;padding:2px 0}
.quizHeader30 .progress{margin:0!important;padding:0!important;line-height:1!important}
.quizQuestion30{display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px 6px}
.quizQuestion30 .quizword{width:100%;height:100%;min-height:0!important;margin:0!important;padding:3px 6px!important;box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;overflow:hidden!important}
.quizQuestion30 .timer{width:38px!important;height:38px!important;min-height:38px!important;margin:0 0 3px!important;font-size:17px!important;flex:0 0 auto!important}
.quizQuestion30 .word{max-width:100%!important;font-size:23px!important;line-height:1.05!important;text-align:center;overflow-wrap:anywhere}
.quizQuestion30 .speak{margin-top:3px!important;padding:3px 7px!important;font-size:11px!important;flex:0 0 auto!important}
.quizOptions30{min-height:0;padding:4px 0;display:flex;align-items:stretch;overflow:hidden}
.quizOptionStack30{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.quizOption30{width:100%!important;min-height:0!important;height:auto!important;margin:0!important;padding:7px 9px!important;box-sizing:border-box!important;display:flex!important;align-items:center!important;white-space:normal!important;overflow:visible!important;font-size:13px!important;line-height:1.18!important;flex:1 1 0!important}
.quizOption30 .posTag{flex:0 0 auto!important;font-size:11px!important}
.quizFooter30{display:flex;align-items:center;justify-content:center;padding:2px 0 0;box-sizing:border-box}
.quizStop30{width:100%!important;margin:0!important;padding:6px 10px!important;box-sizing:border-box!important}
}
@media (max-width:390px) and (max-height:850px){
.quizHeader30{padding-top:2px;padding-bottom:2px}
.quizQuestion30{padding:1px 6px}
.quizQuestion30 .quizword{padding:3px 5px!important}
.quizQuestion30 .timer{width:38px!important;height:38px!important;min-height:38px!important;font-size:17px!important}
.quizQuestion30 .word{font-size:23px!important}
.quizQuestion30 .speak{margin-top:3px!important;padding:3px 7px!important;font-size:11px!important}
.quizOptions30{padding:3px 0}
.quizOptionStack30{gap:4px}
.quizOption30{padding:7px 9px!important;font-size:13px!important;line-height:1.18!important}
.quizStop30{padding-top:6px!important;padding-bottom:6px!important}
}
</style>


<style id="options-80pct-v1-1-33">
@media (max-width:600px){
  .quizOptions30 .quizOptionStack30{height:80%!important;margin-top:auto!important;margin-bottom:auto!important}
}
</style>

</head>
<body>
<header><h1>P.E. Wordbook</h1><div class="sub">개인 공부용 · v1.1.33 — Mobile UX + Popup 40 + Touch Hover Fix</div>
<nav><button id="navHome" class="active">홈</button><button id="navQuiz">퀴즈</button><button id="navWrong">틀린 단어</button><button id="navChunks">Chunk</button><button id="navRecords">학습 기록</button><button id="navStats">통계</button><button id="navSettings">설정</button></nav></header>
<main id="app"></main><div id="toast" class="toast hidden"></div>
<script>
const WORDS=[{"id":1,"source":"MAIN","day":"01","word":"spectator","entryType":"","meaning":"명 관객, 구경꾼","example":"Spectators are watching the performers.","translation":"관객들이 공연하는 사람들을 지켜보고 있다.","sourcePage":12,"pdfPage":8},{"id":2,"source":"MAIN","day":"01","word":"spectacular","entryType":"","meaning":"형 장관을 이루는, 극적인","example":"The festival ended with a spectacular laser show.","translation":"축제는 장관을 이루는 레이저쇼와 함께 폐막되었다.","sourcePage":12,"pdfPage":8},{"id":3,"source":"MAIN","day":"01","word":"respect","entryType":"","meaning":"동 존경하다 / 명 ① 존경 ② 측면","example":"They trust and respect each other.","translation":"그들은 서로를 믿고 존경한다.","sourcePage":12,"pdfPage":8},{"id":4,"source":"MAIN","day":"01","word":"inspect","entryType":"","meaning":"동 조사하다","example":"The employee should inspect what is going on.","translation":"그 직원은 일이 어떻게 되어 가는지 조사해야 한다.","sourcePage":13,"pdfPage":9},{"id":5,"source":"MAIN","day":"01","word":"suspect","entryType":"","meaning":"동 의심하다 / 명 혐의자, 용의자","example":"The policeman suspected his behavior.","translation":"경찰관은 그의 행동을 의심했다.","sourcePage":13,"pdfPage":9},{"id":6,"source":"MAIN","day":"01","word":"retrospect","entryType":"","meaning":"명 회상, 추억 / 동 회고하다, 회상하다","example":"In retrospect, I think that I was wrong.","translation":"회상해 보면, 내가 틀렸다고 생각한다.","sourcePage":13,"pdfPage":9},{"id":7,"source":"MAIN","day":"01","word":"perspective","entryType":"","meaning":"명 ① 관점, 시각 ② 원근법","example":"He saw the issue from a social perspective.","translation":"그는 그 문제를 사회적 관점에서 보았다.","sourcePage":13,"pdfPage":9},{"id":8,"source":"MAIN","day":"01","word":"introspective","entryType":"","meaning":"형 ① 자기 성찰의, 자기반성의 ② 내성적인","example":"He is introspective and likes being alone.","translation":"그는 내성적이고 혼자 있는 것을 좋아한다.","sourcePage":13,"pdfPage":9},{"id":9,"source":"MAIN","day":"01","word":"specify","entryType":"","meaning":"동 명시하다, 구체화하다","example":"We specified the amount of money needed for the project.","translation":"우리는 그 계획에 필요한 금액을 명시했다.","sourcePage":13,"pdfPage":9},{"id":10,"source":"MAIN","day":"01","word":"despise","entryType":"","meaning":"동 경멸하다, 혐오하다","example":"I despise people who spit on the street.","translation":"나는 길에 침 뱉는 사람들을 경멸한다.","sourcePage":14,"pdfPage":10},{"id":11,"source":"MAIN","day":"01","word":"conspicuous","entryType":"","meaning":"형 눈에 잘 띄는, 두드러한","example":"Most people don’t want to be too conspicuous.","translation":"대부분의 사람들이 너무 눈에 띄는 것을 원하지 않는다.","sourcePage":14,"pdfPage":10},{"id":12,"source":"MAIN","day":"01","word":"visible","entryType":"","meaning":"형 ① 눈에 보이는 ② 명백한","example":"The solar eclipse was visible from the coast.","translation":"개기일식은 해안에서 볼 수 있었다.","sourcePage":14,"pdfPage":10},{"id":13,"source":"MAIN","day":"01","word":"supervise","entryType":"","meaning":"동 감독하다, 관리하다","example":"The teacher supervised the children playing outside.","translation":"그 교사는 밖에서 노는 아이들을 감독했다.","sourcePage":14,"pdfPage":10},{"id":14,"source":"MAIN","day":"01","word":"revise","entryType":"","meaning":"동 수정하다, 개정하다","example":"The new government will revise the policy.","translation":"새 정부는 그 정책을 개정할 것이다.","sourcePage":14,"pdfPage":10},{"id":15,"source":"MAIN","day":"01","word":"devise","entryType":"","meaning":"동 고안하다, 궁리하다","example":"The expert devised an alternative to the problem.","translation":"그 전문가는 그 문제에 대한 대안을 고안했다.","sourcePage":15,"pdfPage":11},{"id":16,"source":"MAIN","day":"01","word":"envision","entryType":"","meaning":"동 상상하다, 마음속에 그리다","example":"They envision an equal society.","translation":"그들은 평등한 사회를 상상한다.","sourcePage":15,"pdfPage":11},{"id":17,"source":"MAIN","day":"01","word":"improvise","entryType":"","meaning":"동 즉흥적으로 하다","example":"I left my lesson plans at home, so I’ll have to improvise.","translation":"수업 계획안을 집에 두고 와서, 나는 즉흥적으로 해야 할 것이다.","sourcePage":15,"pdfPage":11},{"id":18,"source":"MAIN","day":"01","word":"describe","entryType":"","meaning":"동 묘사하다, 서술하다","example":"It described ways to keep teeth healthy.","translation":"그것은 치아를 건강하게 유지할 수 있는 방법들을 묘사하고 있었다.","sourcePage":15,"pdfPage":11},{"id":19,"source":"MAIN","day":"01","word":"inscribe","entryType":"","meaning":"동 ① 쓰다, 새기다 ② 명심하다","example":"He inscribed his name on the stone.","translation":"그는 자신의 이름을 돌에 새겼다.","sourcePage":15,"pdfPage":11},{"id":20,"source":"MAIN","day":"01","word":"prescribe","entryType":"","meaning":"동 ① 처방하다 ② 규정하다","example":"The doctor prescribed him a stronger medicine.","translation":"의사는 그에게 더 강한 약을 처방했다.","sourcePage":16,"pdfPage":12},{"id":21,"source":"MAIN","day":"01","word":"subscribe","entryType":"","meaning":"동 ① 구독하다, 가입하다 ② 기부하다","example":"Which journals do you subscribe to?","translation":"당신은 어떤 저널들을 구독하나요?","sourcePage":16,"pdfPage":12},{"id":22,"source":"MAIN","day":"01","word":"ascribe","entryType":"","meaning":"동 ~의 탓으로 돌리다","example":"She ascribed her failure to bad luck.","translation":"그녀는 그녀의 실패를 불운 탓으로 돌렸다.","sourcePage":16,"pdfPage":12},{"id":23,"source":"MAIN","day":"01","word":"manuscript","entryType":"","meaning":"명 원고, 손으로 쓴 책","example":"He also wrote some movie manuscripts.","translation":"그는 몇 편의 영화 대본도 썼다.","sourcePage":16,"pdfPage":12},{"id":24,"source":"MAIN","day":"01","word":"biography","entryType":"","meaning":"명 전기, 일대기","example":"Which do you prefer between biography and fiction?","translation":"당신은 전기와 소설 중에서 어느 것을 더 좋아하나요?","sourcePage":16,"pdfPage":12},{"id":25,"source":"MAIN","day":"01","word":"autobiography","entryType":"","meaning":"명 자서전","example":"You should write your autobiography.","translation":"당신은 자서전을 써야 한다.","sourcePage":16,"pdfPage":12},{"id":26,"source":"MAIN","day":"01","word":"paragraph","entryType":"","meaning":"명 문단, 단락, 절","example":"This paragraph is too long to follow.","translation":"이 단락은 너무 길어서 이해가 잘 안 된다.","sourcePage":17,"pdfPage":13},{"id":27,"source":"MAIN","day":"01","word":"geography","entryType":"","meaning":"명 지리학","example":"We learn science, history, and geography at school.","translation":"우리는 학교에서 과학, 역사 그리고 지리학을 배운다.","sourcePage":17,"pdfPage":13},{"id":28,"source":"MAIN","day":"01","word":"involve","entryType":"","meaning":"동 ① 포함하다, 수반하다 ② 관련시키다","example":"Don’t involve me in that matter.","translation":"그 일에 날 끌어들이지 마.","sourcePage":17,"pdfPage":13},{"id":29,"source":"MAIN","day":"01","word":"evolve","entryType":"","meaning":"동 진화하다[시키다], 발전하다[시키다]","example":"We didn’t evolve to have the same brain.","translation":"우리는 같은 뇌를 갖도록 진화하지 않았다.","sourcePage":17,"pdfPage":13},{"id":30,"source":"MAIN","day":"01","word":"revolve","entryType":"","meaning":"동 회전하다, 돌다","example":"The earth revolves around the sun.","translation":"지구는 태양 주위를 돈다.","sourcePage":17,"pdfPage":13},{"id":31,"source":"MAIN","day":"01","word":"revolt","entryType":"","meaning":"동 반란을 일으키다, 반항하다 / 명 반역, 반항","example":"They revolted against the dictator.","translation":"그들은 그 독재자에 대항하여 반란을 일으켰다.","sourcePage":18,"pdfPage":14},{"id":32,"source":"MAIN","day":"01","word":"vocal","entryType":"","meaning":"형 목소리의 / 명 보컬, 노래 부분","example":"As a singer, his vocal powers get into full swing.","translation":"가수로서 그의 목소리의 힘은 최고조에 달한다.","sourcePage":18,"pdfPage":14},{"id":33,"source":"MAIN","day":"01","word":"vocation","entryType":"","meaning":"명 ① 천직, 소명 ② 직업","example":"He is a doctor with a strong sense of vocation.","translation":"그는 강한 소명을 가진 의사이다.","sourcePage":18,"pdfPage":14},{"id":34,"source":"MAIN","day":"01","word":"advocate","entryType":"","meaning":"동 ① 지지하다, 옹호하다 ② 주장하다 / 명 지지자, 옹호자","example":"Most experts advocate the reduction of all violence.","translation":"대부분의 전문가들은 모든 폭력의 감소를 지지한다.","sourcePage":18,"pdfPage":14},{"id":35,"source":"MAIN","day":"01","word":"provoke","entryType":"","meaning":"동 ① (특정 반응을) 유발하다 ② 화나게 하다","example":"The news provoked a negative response.","translation":"그 뉴스는 부정적인 반응을 유발했다.","sourcePage":18,"pdfPage":14},{"id":36,"source":"MAIN","day":"01","word":"evoke","entryType":"","meaning":"동 불러내다, (기억·감정을) 일깨우다","example":"Her case evoked public sympathy.","translation":"그녀의 사건이 대중의 연민을 불러일으켰다.","sourcePage":19,"pdfPage":15},{"id":37,"source":"MAIN","day":"01","word":"revoke","entryType":"","meaning":"동 취소하다, 폐지하다","example":"His license was revoked for three months.","translation":"그는 3개월간 면허가 취소되었다.","sourcePage":19,"pdfPage":15},{"id":38,"source":"MAIN","day":"01","word":"dictate","entryType":"","meaning":"동 ① 명령하다, 지시하다 ② 받아쓰게 하다, 구술하다 / 명 명령, 지시","example":"She dictated a letter to her secretary.","translation":"그녀는 비서에게 편지를 받아쓰게 했다.","sourcePage":19,"pdfPage":15},{"id":39,"source":"MAIN","day":"01","word":"contradict","entryType":"","meaning":"동 ① 반박하다, 반대하다 ② 모순되다","example":"I contradicted everything he said.","translation":"나는 그가 한 모든 말을 반박했다.","sourcePage":19,"pdfPage":15},{"id":40,"source":"MAIN","day":"01","word":"indicate","entryType":"","meaning":"동 ① 나타내다, 암시하다 ② 지시하다, 가리키다","example":"The survey indicates a boom in the economy.","translation":"그 조사는 경제가 호황임을 나타낸다.","sourcePage":19,"pdfPage":15},{"id":41,"source":"MAIN","day":"01","word":"dedicate","entryType":"","meaning":"동 바치다, 헌신하다, 전념하다","example":"He dedicated his life to academic research.","translation":"그는 학술 연구에 그의 삶을 바쳤다.","sourcePage":20,"pdfPage":16},{"id":42,"source":"MAIN","day":"01","word":"claim","entryType":"","meaning":"동 요구하다, 주장하다 / 명 요구, 주장","example":"Intentionally making false claims for a product is fraud.","translation":"의도적으로 상품에 대해 거짓된 주장을 하는 것은 사기이다.","sourcePage":20,"pdfPage":16},{"id":43,"source":"MAIN","day":"01","word":"exclaim","entryType":"","meaning":"동 소리치다, 외치다","example":"“It isn’t fair!” she exclaimed angrily.","translation":"“이건 불공평해!” 그녀가 화가 나서 소리쳤다.","sourcePage":20,"pdfPage":16},{"id":44,"source":"MAIN","day":"01","word":"proclaim","entryType":"","meaning":"동 선언[선포]하다","example":"They proclaimed the independence of Korea.","translation":"그들은 대한민국의 독립을 선언했다.","sourcePage":20,"pdfPage":16},{"id":45,"source":"MAIN","day":"01","word":"acclaim","entryType":"","meaning":"동 칭송하다, 환호하다","example":"The song was acclaimed as a masterpiece.","translation":"그 곡은 걸작으로 칭송받았다.","sourcePage":20,"pdfPage":16},{"id":46,"source":"MAIN","day":"01","word":"reclaim","entryType":"","meaning":"동 ① 되찾다 ② 개간하다 ③ 교화하다","example":"This land will be reclaimed for building a golf course.","translation":"이 땅은 골프장 건설을 위해 개간될 것이다.","sourcePage":21,"pdfPage":17},{"id":47,"source":"MAIN","day":"01","word":"fluid","entryType":"","meaning":"명 유동체[액체, 기체] / 형 유동적인, 변하기 쉬운","example":"Water, milk, gasoline, and oil are all examples of fluids.","translation":"물, 우유, 휘발유 그리고 기름은 모두 액체의 예이다.","sourcePage":21,"pdfPage":17},{"id":48,"source":"MAIN","day":"01","word":"fluent","entryType":"","meaning":"형 유창한, 능변의","example":"He is fluent in Spanish.","translation":"그는 스페인어에 유창하다.","sourcePage":21,"pdfPage":17},{"id":49,"source":"MAIN","day":"01","word":"affluent","entryType":"","meaning":"형 ① 풍부한 ② 부유한","example":"She lives in an affluent suburb.","translation":"그녀는 부유한 교외 지역에 살고 있다.","sourcePage":21,"pdfPage":17},{"id":50,"source":"MAIN","day":"01","word":"fluctuate","entryType":"","meaning":"동 오르내리다, 변동하다","example":"Stock prices continue to fluctuate.","translation":"주가가 계속 오르내리고 있다.","sourcePage":21,"pdfPage":17},{"id":51,"source":"MAIN","day":"02","word":"produce","entryType":"","meaning":"동 ① 생산하다, 제조하다 ② (결과 등을) 낳다 / 명 농산물","example":"The region produces over 50% of the country’s wheat.","translation":"그 지역은 그 나라 밀의 50%가 넘는 양을 생산한다.","sourcePage":22,"pdfPage":18},{"id":52,"source":"MAIN","day":"02","word":"reduce","entryType":"","meaning":"동 줄이다, 축소하다","example":"Being active reduces the risk of heart disease.","translation":"활동적인 것은 심장병의 위험을 줄인다.","sourcePage":22,"pdfPage":18},{"id":53,"source":"MAIN","day":"02","word":"induce","entryType":"","meaning":"동 ① 유도하다, 설득하다 ② 유발하다, 일으키다","example":"Nothing would induce him to take the job.","translation":"그 무엇으로도 그가 그 일을 맡지 않을 것이다.","sourcePage":22,"pdfPage":18},{"id":54,"source":"MAIN","day":"02","word":"deduce","entryType":"","meaning":"동 연역하다, 추론하다","example":"We can deduce a lot from what people buy.","translation":"우리는 사람들이 사는 것으로부터 많은 것을 추론할 수 있다.","sourcePage":23,"pdfPage":19},{"id":55,"source":"MAIN","day":"02","word":"seduce","entryType":"","meaning":"동 ① 부추기다 ② 유혹하다","example":"He tried to seduce his friend into smoking.","translation":"그는 그의 친구가 담배를 피우도록 부추기려 했다.","sourcePage":23,"pdfPage":19},{"id":56,"source":"MAIN","day":"02","word":"conduct","entryType":"","meaning":"동 ① 인도하다, 지휘하다 ② 경영하다, 수행하다 / 명 ① 수행 ② 실체","example":"The company conducted background checks.","translation":"그 회사는 배경 조사를 수행했다.","sourcePage":23,"pdfPage":19},{"id":57,"source":"MAIN","day":"02","word":"biology","entryType":"","meaning":"명 생물학","example":"The students dissected frogs in biology class.","translation":"학생들은 생물학 수업에서 개구리를 해부했다.","sourcePage":23,"pdfPage":19},{"id":58,"source":"MAIN","day":"02","word":"sociology","entryType":"","meaning":"명 사회학","example":"I was majoring in sociology, but I changed my major to education.","translation":"난 사회학을 전공하고 있었는데, 교육학으로 전공을 바꿨다.","sourcePage":23,"pdfPage":19},{"id":59,"source":"MAIN","day":"02","word":"psychology","entryType":"","meaning":"명 ① 심리학 ② 심리 (상태)","example":"Our psychology is another factor in the consumption of calories.","translation":"우리의 심리 상태는 칼로리 섭취의 또 다른 요인이다.","sourcePage":24,"pdfPage":20},{"id":60,"source":"MAIN","day":"02","word":"geology","entryType":"","meaning":"명 지질학","example":"I’m going to take a geology course next semester.","translation":"나는 다음 학기에 지질학 과목을 들으려 한다.","sourcePage":24,"pdfPage":20},{"id":61,"source":"MAIN","day":"02","word":"ecology","entryType":"","meaning":"명 ① 생태학 ② 생태계","example":"The oil spill caused great damage to the fragile ecology of the coastline.","translation":"기름 유출이 해안지대의 취약한 생태계에 크나큰 피해를 입혔다.","sourcePage":24,"pdfPage":20},{"id":62,"source":"MAIN","day":"02","word":"anthropology","entryType":"","meaning":"명 인류학","example":"Every university has a department of anthropology.","translation":"모든 대학에 인류학과가 있다.","sourcePage":24,"pdfPage":20},{"id":63,"source":"MAIN","day":"02","word":"formula","entryType":"","meaning":"명 식, (수학) 공식","example":"The whole world is searching for a formula for peace.","translation":"전 세계가 평화의 공식을 찾고 있다.","sourcePage":24,"pdfPage":20},{"id":64,"source":"MAIN","day":"02","word":"uniform","entryType":"","meaning":"명 제복, 군복, 교복 / 형 ① 획일적인 ② 균일한, 한결같은","example":"The shop sells everything at a uniform price.","translation":"그 가게는 모든 상품을 균일한 가격으로 판매한다.","sourcePage":25,"pdfPage":21},{"id":65,"source":"MAIN","day":"02","word":"inform","entryType":"","meaning":"동 알리다, 통지하다","example":"Please inform me what to do next.","translation":"다음에 무엇을 해야 할지 알려 주세요.","sourcePage":25,"pdfPage":21},{"id":66,"source":"MAIN","day":"02","word":"reform","entryType":"","meaning":"동 개혁하다, 개선하다 / 명 개혁, 개선","example":"Artists during the Renaissance reformed painting.","translation":"르네상스 시대의 예술가들은 회화를 개혁했다.","sourcePage":25,"pdfPage":21},{"id":67,"source":"MAIN","day":"02","word":"conform","entryType":"","meaning":"동 ① 따르다, 순응하다 (to) ② 일치하다 (to)","example":"This building conforms to safety regulations.","translation":"이 건물은 안전 규정을 따르고 있다.","sourcePage":25,"pdfPage":21},{"id":68,"source":"MAIN","day":"02","word":"transform","entryType":"","meaning":"동 변형시키다, 바꾸다","example":"They were not transformed by economic changes.","translation":"그들은 경제적인 변화로 바뀌지 않았다.","sourcePage":25,"pdfPage":21},{"id":69,"source":"MAIN","day":"02","word":"deform","entryType":"","meaning":"동 ① 변형[훼손]시키다 ② 불구로 만들다","example":"These plastics can be deformed easily on heating.","translation":"이 플라스틱들은 가열하면 쉽게 변형될 수 있다.","sourcePage":25,"pdfPage":21},{"id":70,"source":"MAIN","day":"02","word":"humble","entryType":"","meaning":"형 ① 겸손한 ② 보잘것없는","example":"To learn from others, you need a humble manner.","translation":"다른 사람들로부터 배우기 위해선 겸손한 태도가 필요하다.","sourcePage":26,"pdfPage":22},{"id":71,"source":"MAIN","day":"02","word":"humility","entryType":"","meaning":"명 겸손, 비하","example":"She is a person of great humility.","translation":"그녀는 매우 겸손한 사람이다.","sourcePage":26,"pdfPage":22},{"id":72,"source":"MAIN","day":"02","word":"humiliate","entryType":"","meaning":"동 굴욕감을 주다, 창피를 주다","example":"The boy deserved to be punished but there was no need to humiliate him.","translation":"그 소년이 벌 받을 짓을 했지만 그에게 굴욕감을 줄 필요는 없었다.","sourcePage":26,"pdfPage":22},{"id":73,"source":"MAIN","day":"02","word":"exhume","entryType":"","meaning":"동 발굴하다","example":"The remains have not yet been exhumed.","translation":"그 유물들은 아직 발굴되지 않았다.","sourcePage":26,"pdfPage":22},{"id":74,"source":"MAIN","day":"02","word":"humid","entryType":"","meaning":"형 습기 있는, 눅눅한","example":"The island is hot and humid in the summer.","translation":"그 섬은 여름에는 덥고 습하다.","sourcePage":26,"pdfPage":22},{"id":75,"source":"MAIN","day":"02","word":"vacant","entryType":"","meaning":"형 비어 있는, 사람이 살지 않는","example":"There are no vacant seats on this train.","translation":"이 열차에는 빈자리가 없다.","sourcePage":27,"pdfPage":23},{"id":76,"source":"MAIN","day":"02","word":"vague","entryType":"","meaning":"형 모호한, 애매한, 희미한","example":"I kept my statement deliberately vague.","translation":"나는 말을 일부러 모호하게 했다.","sourcePage":27,"pdfPage":23},{"id":77,"source":"MAIN","day":"02","word":"vain","entryType":"","meaning":"형 ① 소용 없는, 헛된 ② 허영심이 많은","example":"All my efforts were in vain.","translation":"내 모든 노력이 허사였다.","sourcePage":27,"pdfPage":23},{"id":78,"source":"MAIN","day":"02","word":"vacuum","entryType":"","meaning":"명 진공 (상태)","example":"Sound does not travel in a vacuum.","translation":"소리는 진공 상태에서는 전달되지 않는다.","sourcePage":27,"pdfPage":23},{"id":79,"source":"MAIN","day":"02","word":"vanish","entryType":"","meaning":"동 사라지다","example":"My wallet seems to have vanished.","translation":"내 지갑이 사라져 버린 것 같다.","sourcePage":27,"pdfPage":23},{"id":80,"source":"MAIN","day":"02","word":"evaporate","entryType":"","meaning":"동 증발하다, 증발시키다","example":"The sun is evaporating the earth’s moisture.","translation":"태양이 지구의 수분을 증발시키고 있다.","sourcePage":27,"pdfPage":23},{"id":81,"source":"MAIN","day":"02","word":"evacuate","entryType":"","meaning":"동 ① 대피시키다 ② 비우다","example":"Employees were urged to evacuate their offices immediately.","translation":"직원들은 즉각 사무실을 비우라는 재촉을 받았다.","sourcePage":28,"pdfPage":24},{"id":82,"source":"MAIN","day":"02","word":"devastate","entryType":"","meaning":"동 ① 완전히 파괴하다 ② 망연자실하게 하다","example":"The bomb devastated the old part of the city.","translation":"그 폭탄은 그 도시의 구시가지를 완전히 파괴했다.","sourcePage":28,"pdfPage":24},{"id":83,"source":"MAIN","day":"02","word":"legal","entryType":"","meaning":"형 ① 법률의, 법률상의 ② 합법적인","example":"Our company is fighting a legal battle.","translation":"우리 회사는 법정 공방을 하고 있다.","sourcePage":28,"pdfPage":24},{"id":84,"source":"MAIN","day":"02","word":"legitimate","entryType":"","meaning":"형 ① 합법적인 ② 정당한, 타당한","example":"They run a legitimate business.","translation":"그들은 합법적인 사업체를 운영한다.","sourcePage":28,"pdfPage":24},{"id":85,"source":"MAIN","day":"02","word":"legislation","entryType":"","meaning":"명 법률의 제정, 입법 (행위)","example":"The potential for new legislation is immense.","translation":"새로운 법률 제정의 잠재력은 거대하다.","sourcePage":28,"pdfPage":24},{"id":86,"source":"MAIN","day":"02","word":"privilege","entryType":"","meaning":"명 특권, 특전 / 동 ~에게 특권을 주다","example":"Education is a right, not a privilege.","translation":"교육은 특권이 아닌 권리이다.","sourcePage":29,"pdfPage":25},{"id":87,"source":"MAIN","day":"02","word":"legacy","entryType":"","meaning":"명 유산","example":"This store is my father’s legacy.","translation":"이 가게는 우리 아버지의 유산이다.","sourcePage":29,"pdfPage":25},{"id":88,"source":"MAIN","day":"02","word":"delegate","entryType":"","meaning":"동 위임하다 / 명 대표, 대리인","example":"The job can be delegated to someone else.","translation":"그 일은 다른 누군가에게 위임될 수 있다.","sourcePage":29,"pdfPage":25},{"id":89,"source":"MAIN","day":"02","word":"generate","entryType":"","meaning":"동 발생시키다, 만들어 내다, 낳다","example":"They need someone to generate new ideas.","translation":"그들은 새로운 아이디어를 만들어 낼 누군가가 필요하다.","sourcePage":29,"pdfPage":25},{"id":90,"source":"MAIN","day":"02","word":"genetic","entryType":"","meaning":"형 유전의, 유전학의","example":"A DNA profile is a person’s genetic fingerprint.","translation":"DNA 프로필은 한 사람의 유전자 지문이다.","sourcePage":29,"pdfPage":25},{"id":91,"source":"MAIN","day":"02","word":"genesis","entryType":"","meaning":"명 발생, 기원","example":"We are all curious about the genesis of life.","translation":"우리는 모두 생명의 기원에 대해 궁금해한다.","sourcePage":30,"pdfPage":26},{"id":92,"source":"MAIN","day":"02","word":"engender","entryType":"","meaning":"동 낳다, 불러일으키다","example":"His article engendered a lot of controversy.","translation":"그의 기사는 많은 논란을 낳았다.","sourcePage":30,"pdfPage":26},{"id":93,"source":"MAIN","day":"02","word":"genuine","entryType":"","meaning":"형 ① 진짜의, 진품의 ② 진실한, 성실한","example":"This signature is genuine.","translation":"이 서명은 진짜다.","sourcePage":30,"pdfPage":26},{"id":94,"source":"MAIN","day":"02","word":"genius","entryType":"","meaning":"명 천재, 비범한 재능","example":"He’s a genius at organizing people.","translation":"그는 사람들을 조직하는 데 천재이다.","sourcePage":30,"pdfPage":26},{"id":95,"source":"MAIN","day":"02","word":"ingenious","entryType":"","meaning":"형 기발한, 독창적인","example":"She suggested an ingenious method.","translation":"그녀는 기발한 방법을 제시했다.","sourcePage":30,"pdfPage":26},{"id":96,"source":"MAIN","day":"02","word":"indigenous","entryType":"","meaning":"형 ① 토착의 ② 타고난","example":"They are the indigenous people of Australia.","translation":"그들은 호주의 토착민들이다.","sourcePage":31,"pdfPage":27},{"id":97,"source":"MAIN","day":"02","word":"pesticide","entryType":"","meaning":"명 살충제, 농약","example":"The crops are regularly sprayed with pesticide.","translation":"그 작물들에는 정기적으로 농약이 살포된다.","sourcePage":31,"pdfPage":27},{"id":98,"source":"MAIN","day":"02","word":"genocide","entryType":"","meaning":"명 대량 살상, 집단학살","example":"Almost no one apologized for the genocide.","translation":"그 집단학살에 대해 사과한 사람은 거의 없었다.","sourcePage":31,"pdfPage":27},{"id":99,"source":"MAIN","day":"02","word":"homicide","entryType":"","meaning":"명 살인","example":"The police are investigating a homicide downtown.","translation":"경찰이 시내에서 발생한 살인 사건을 조사하고 있다.","sourcePage":31,"pdfPage":27},{"id":100,"source":"MAIN","day":"02","word":"precise","entryType":"","meaning":"형 정밀한, 정확한","example":"She gave me precise directions.","translation":"그녀는 나에게 정확한 지시를 해 주었다.","sourcePage":31,"pdfPage":27},{"id":101,"source":"MAIN","day":"03","word":"spirit","entryType":"","meaning":"명 ① 영혼, 정신 ② 기운, 활기","example":"Mr. Gonzales helped people find a shelter for their spirits.","translation":"Gonzales 씨는 사람들이 영혼의 안식처를 찾는 데 도움을 주었다.","sourcePage":32,"pdfPage":28},{"id":102,"source":"MAIN","day":"03","word":"respire","entryType":"","meaning":"동 호흡하다, 숨 쉬다","example":"Fish respire through their gills.","translation":"물고기는 아가미를 통해 호흡한다.","sourcePage":32,"pdfPage":28},{"id":103,"source":"MAIN","day":"03","word":"inspire","entryType":"","meaning":"동 ① (감정·생각을) 불어넣다, 영감을 주다 ② 고무(격려)하다","example":"My parents inspire me with confidence.","translation":"부모님은 나에게 자신감을 불어넣어 주신다.","sourcePage":32,"pdfPage":28},{"id":104,"source":"MAIN","day":"03","word":"aspire","entryType":"","meaning":"동 열망하다, 갈망하다 (to)","example":"He aspired to be a doctor.","translation":"그는 의사가 되고자 갈망했다.","sourcePage":33,"pdfPage":29},{"id":105,"source":"MAIN","day":"03","word":"conspire","entryType":"","meaning":"동 공모하다, 음모를 꾸미다","example":"The servants conspired against the king.","translation":"그 신하들은 왕에 대한 음모를 꾸몄다.","sourcePage":33,"pdfPage":29},{"id":106,"source":"MAIN","day":"03","word":"expire","entryType":"","meaning":"동 만료되다","example":"When does your passport expire?","translation":"당신의 여권은 언제 만료되나요?","sourcePage":33,"pdfPage":29},{"id":107,"source":"MAIN","day":"03","word":"illusion","entryType":"","meaning":"명 ① 환상, 환각 ② 착각, 오해","example":"This will give the illusion of an extra place.","translation":"이것은 공간이 더 있다는 착각을 줄 것이다.","sourcePage":33,"pdfPage":29},{"id":108,"source":"MAIN","day":"03","word":"delude","entryType":"","meaning":"동 속이다","example":"Do not let us delude ourselves.","translation":"우리가 우리 자신을 속이게 하지 마라.","sourcePage":33,"pdfPage":29},{"id":109,"source":"MAIN","day":"03","word":"allude","entryType":"","meaning":"동 ① 암시하다 ② 언급하다","example":"To call someone a sheep may allude that he is timid.","translation":"누군가를 양이라고 부르는 것은 그가 소심하다는 것을 암시할 수 있다.","sourcePage":33,"pdfPage":29},{"id":110,"source":"MAIN","day":"03","word":"elude","entryType":"","meaning":"동 교묘히 피하다, 빠져나오다","example":"He eluded the police for three months.","translation":"그는 세 달 동안 경찰을 교묘히 피했다.","sourcePage":34,"pdfPage":30},{"id":111,"source":"MAIN","day":"03","word":"include","entryType":"","meaning":"동 포함하다","example":"The meal includes dessert and coffee.","translation":"식사는 디저트와 커피를 포함한다.","sourcePage":34,"pdfPage":30},{"id":112,"source":"MAIN","day":"03","word":"exclude","entryType":"","meaning":"동 ① 제외[배제]하다 ② 거부하다, 막다, 차단하다 ③ 내쫓다, 추방하다","example":"It is unjust to exclude him.","translation":"그를 제외하는 것은 부당하다.","sourcePage":34,"pdfPage":30},{"id":113,"source":"MAIN","day":"03","word":"conclude","entryType":"","meaning":"동 ① 결론짓다, 끝내다 ② 결정하다, 결심하다","example":"The jury concluded from the evidence that she was guilty.","translation":"배심원단은 그 증거를 통해 그녀가 유죄라고 결론지었다.","sourcePage":34,"pdfPage":30},{"id":114,"source":"MAIN","day":"03","word":"disclose","entryType":"","meaning":"동 드러내다, 폭로하다","example":"The details of the takeover were disclosed.","translation":"인수 작업에 대한 자세한 내용이 드러났다.","sourcePage":34,"pdfPage":30},{"id":115,"source":"MAIN","day":"03","word":"enclose","entryType":"","meaning":"동 ① 동봉하다 ② 에워싸다","example":"A check was enclosed with his letter.","translation":"그의 편지에는 수표가 동봉되어 있었다.","sourcePage":35,"pdfPage":31},{"id":116,"source":"MAIN","day":"03","word":"consume","entryType":"","meaning":"동 ① 소비하다, 소모하다 ② 먹다, 마시다","example":"These plants consume great quantities of water.","translation":"이 식물들은 많은 양의 물을 소비한다.","sourcePage":35,"pdfPage":31},{"id":117,"source":"MAIN","day":"03","word":"resume","entryType":"","meaning":"동 다시 시작하다, 재개하다 / 명 이력서","example":"The singer will resume his solo career in October.","translation":"그 가수는 10월에 솔로 활동을 재개할 것이다.","sourcePage":35,"pdfPage":31},{"id":118,"source":"MAIN","day":"03","word":"assume","entryType":"","meaning":"동 ① 가정하다, 추정하다 ② (역할·임무 등을) 떠맡다, (책임을) 지다 ③ (태도)를 취하다, (양상을) 띠다 ④ ~인 체하다, 가장하다","example":"When you didn't show up, I assumed you were sick.","translation":"네가 나타나지 않았을 때, 나는 네가 아프다고 추정했다.","sourcePage":35,"pdfPage":31},{"id":119,"source":"MAIN","day":"03","word":"presume","entryType":"","meaning":"동 추정하다, 간주하다","example":"The experts presume that the dog was mummified in natural conditions.","translation":"전문가들은 그 개가 자연 상태에서 미라가 된 것으로 추정한다.","sourcePage":36,"pdfPage":32},{"id":120,"source":"MAIN","day":"03","word":"perceive","entryType":"","meaning":"동 인지하다, 알아차리다","example":"Nobody perceived me entering the room.","translation":"아무도 내가 방에 들어가는 것을 알아차리지 못했다.","sourcePage":36,"pdfPage":32},{"id":121,"source":"MAIN","day":"03","word":"deceive","entryType":"","meaning":"동 속이다, 기만하다","example":"Many women were deceived by his smooth talk.","translation":"많은 여성들이 그의 감언에 속아 넘어갔다.","sourcePage":36,"pdfPage":32},{"id":122,"source":"MAIN","day":"03","word":"conceive","entryType":"","meaning":"동 ① 생각해 내다, 상상하다 ② 임신하다","example":"The artist conceived a unique concept for her next painting.","translation":"그 화가는 그녀의 다음 그림을 위한 독특한 콘셉트를 상상했다.","sourcePage":36,"pdfPage":32},{"id":123,"source":"MAIN","day":"03","word":"intercept","entryType":"","meaning":"동 ① 가로채다 ② 가로막다","example":"The police tried to intercept protesters.","translation":"경찰은 시위자들을 가로막으려고 했다.","sourcePage":36,"pdfPage":32},{"id":124,"source":"MAIN","day":"03","word":"susceptible","entryType":"","meaning":"형 ① 영향 받기 쉬운, 민감한 ② (병에) 걸리기 쉬운","example":"Some people are susceptible to trends.","translation":"일부 사람들은 유행에 민감하다.","sourcePage":37,"pdfPage":33},{"id":125,"source":"MAIN","day":"03","word":"participate","entryType":"","meaning":"동 참가하다, 참여하다 (in)","example":"They participated in fundraising activities.","translation":"그들은 모금 활동에 참여했다.","sourcePage":37,"pdfPage":33},{"id":126,"source":"MAIN","day":"03","word":"obtain","entryType":"","meaning":"동 얻다, 획득하다","example":"She obtained approval to operate a food shop.","translation":"그녀는 식품점을 운영하기 위해 승인을 얻었다.","sourcePage":37,"pdfPage":33},{"id":127,"source":"MAIN","day":"03","word":"contain","entryType":"","meaning":"동 ① 포함하다, 함유하다 ② 억제하다, 억누르다","example":"Doctors struggled to contain the epidemic.","translation":"의사들은 그 전염병을 억제하기 위해 애썼다.","sourcePage":37,"pdfPage":33},{"id":128,"source":"MAIN","day":"03","word":"sustain","entryType":"","meaning":"동 ① 떠받치다, 지탱하다 ② 유지하다, 지속하다","example":"We work even harder and longer to sustain lifestyles.","translation":"우리는 생활방식을 유지하기 위해 훨씬 더 열심히 그리고 더 오랫동안 일하고 있다.","sourcePage":37,"pdfPage":33},{"id":129,"source":"MAIN","day":"03","word":"abstain","entryType":"","meaning":"동 삼가다, 자제하다 (from)","example":"I'm abstaining from drinking.","translation":"나는 음주를 삼가고 있다.","sourcePage":38,"pdfPage":34},{"id":130,"source":"MAIN","day":"03","word":"retain","entryType":"","meaning":"동 유지하다, 보유하다","example":"Some metals retain heat better than others.","translation":"어떤 금속은 다른 금속보다 열을 더 잘 유지한다.","sourcePage":38,"pdfPage":34},{"id":131,"source":"MAIN","day":"03","word":"tenant","entryType":"","meaning":"명 세입자, 소작인 / 동 세 들어 살다, 소작하다","example":"Her father employed her in keeping accounts and in dealing with tenants.","translation":"그녀의 아버지는 회계 일을 맡고 세입자들을 다루는 일을 하도록 그녀를 고용했다.","sourcePage":38,"pdfPage":34},{"id":132,"source":"MAIN","day":"03","word":"prohibit","entryType":"","meaning":"동 ① 금지하다 ② 막다, 방해하다","example":"The use of the Internet is prohibited.","translation":"인터넷의 사용을 금지한다.","sourcePage":38,"pdfPage":34},{"id":133,"source":"MAIN","day":"03","word":"inhibit","entryType":"","meaning":"동 ① 억제하다 ② 금지하다","example":"The church inhibits its people from smoking and drinking.","translation":"그 교회는 신자들의 흡연과 음주를 금하고 있다.","sourcePage":38,"pdfPage":34},{"id":134,"source":"MAIN","day":"03","word":"exhibit","entryType":"","meaning":"동 ① 전시하다, 진열하다 ② 나타내다, 드러내다 / 명 전시품, 전시(회)","example":"The gallery is exhibiting Van Gogh's paintings.","translation":"그 미술관은 Van Gogh의 그림을 전시하고 있다.","sourcePage":39,"pdfPage":35},{"id":135,"source":"MAIN","day":"03","word":"inhabit","entryType":"","meaning":"동 살다, 거주하다","example":"This land was inhabited by Native Americans a long time ago.","translation":"이 땅에는 아주 오래전에 미국 원주민들이 거주했다.","sourcePage":39,"pdfPage":35},{"id":136,"source":"MAIN","day":"03","word":"habitat","entryType":"","meaning":"명 ① 서식지 ② 거주 장소","example":"Animals are losing their natural habitat because of human civilization.","translation":"인간의 문명 때문에 동물들은 자연 서식지를 잃고 있다.","sourcePage":39,"pdfPage":35},{"id":137,"source":"MAIN","day":"03","word":"rehabilitate","entryType":"","meaning":"동 ① 사회에 복귀시키다 ② 회복시키다, 복원하다","example":"The center rehabilitates youthful offenders.","translation":"그 센터는 청소년 범죄자들을 사회에 복귀시킨다.","sourcePage":39,"pdfPage":35},{"id":138,"source":"MAIN","day":"03","word":"factual","entryType":"","meaning":"형 사실적인","example":"Science requires factual evidence to prove theories.","translation":"과학은 이론을 증명하는 사실적 증거를 요구한다.","sourcePage":39,"pdfPage":35},{"id":139,"source":"MAIN","day":"03","word":"proficient","entryType":"","meaning":"형 능숙한, 숙련된","example":"She is proficient in foreign languages.","translation":"그녀는 외국어에 능숙하다.","sourcePage":40,"pdfPage":36},{"id":140,"source":"MAIN","day":"03","word":"sufficient","entryType":"","meaning":"형 충분한","example":"She has sufficient qualifications for a team captain.","translation":"그녀는 팀의 주장으로서 충분한 자격이 있다.","sourcePage":40,"pdfPage":36},{"id":141,"source":"MAIN","day":"03","word":"deficient","entryType":"","meaning":"형 ① 부족한 ② 결함이 있는","example":"A deficient diet can lead to health problems.","translation":"결핍된 식단은 건강 문제를 일으킬 수 있다.","sourcePage":40,"pdfPage":36},{"id":142,"source":"MAIN","day":"03","word":"infect","entryType":"","meaning":"동 ① 감염[전염]시키다 ② 오염시키다","example":"The parasite has infected almost 3 million people worldwide.","translation":"그 기생충은 전 세계에 걸쳐 거의 3백만 명의 사람들을 감염시켰다.","sourcePage":40,"pdfPage":36},{"id":143,"source":"MAIN","day":"03","word":"facilitate","entryType":"","meaning":"동 쉽게[용이]하게 하다, 촉진시키다","example":"The new trade agreement will facilitate more rapid economic growth.","translation":"새로운 무역 협정은 더 빠른 경제 성장을 촉진시킬 것이다.","sourcePage":40,"pdfPage":36},{"id":144,"source":"MAIN","day":"03","word":"facility","entryType":"","meaning":"명 ① 시설, 설비, 기관[건물 등] ② 편의, 손쉬운 능력","example":"This college has good facilities for learning.","translation":"이 대학은 학습을 위한 좋은 시설들을 갖추고 있다.","sourcePage":40,"pdfPage":36},{"id":145,"source":"MAIN","day":"03","word":"propel","entryType":"","meaning":"동 추진하다, 나아가게 하다","example":"The boat sailed across the East Sea propelled only by wind power.","translation":"그 배는 오직 풍력으로만 추진력을 얻어 동해를 횡단했다.","sourcePage":41,"pdfPage":37},{"id":146,"source":"MAIN","day":"03","word":"compel","entryType":"","meaning":"동 강요[강제]하다, 억지로 ~하게 하다","example":"The rain compelled us to stay indoors.","translation":"비는 우리가 억지로 실내에 머물도록 만들었다.","sourcePage":41,"pdfPage":37},{"id":147,"source":"MAIN","day":"03","word":"impel","entryType":"","meaning":"동 ① 강요하다, 억지로 ~하게 하다 ② 추진하다, 나아가게 하다","example":"Fatigue impelled me to turn back.","translation":"피로가 나를 뒤로 돌아가게 했다.","sourcePage":41,"pdfPage":37},{"id":148,"source":"MAIN","day":"03","word":"expel","entryType":"","meaning":"동 쫓아내다, 추방하다","example":"He was expelled from school for misconduct.","translation":"그는 비행을 저질러 학교에서 쫓겨났다.","sourcePage":41,"pdfPage":37},{"id":149,"source":"MAIN","day":"03","word":"pulse","entryType":"","meaning":"명 맥박 / 동 맥박이 뛰다","example":"To measure the pulse, place your fingers over the opposite wrist.","translation":"맥박을 재기 위해 당신의 손가락을 반대쪽 손목에 올려놓으세요.","sourcePage":41,"pdfPage":37},{"id":150,"source":"MAIN","day":"03","word":"impulse","entryType":"","meaning":"명 ① 충동, 자극 ② 추진력","example":"I resisted the impulse to laugh.","translation":"나는 웃고 싶은 충동을 억눌렀다.","sourcePage":41,"pdfPage":37},{"id":151,"source":"MAIN","day":"04","word":"manual","entryType":"","meaning":"형 ① 손의 ② 수동의 / 명 소책자, 설명서","example":"This job requires little manual skill.","translation":"이 일에는 손 기술이 거의 필요하지 않다.","sourcePage":42,"pdfPage":38},{"id":152,"source":"MAIN","day":"04","word":"manufacture","entryType":"","meaning":"동 생산하다, 제조하다 / 명 제조(업)","example":"We spent a lot of time and money manufacturing new products.","translation":"우리는 새로운 제품들을 생산하는 데 많은 시간과 돈을 썼다.","sourcePage":42,"pdfPage":38},{"id":153,"source":"MAIN","day":"04","word":"mandatory","entryType":"","meaning":"형 ① 명령의 ② 강제적인, 의무적인, 필수의","example":"He thinks that wearing uniforms should be mandatory in schools.","translation":"그는 학교에서 교복 착용이 의무적이어야 한다고 생각한다.","sourcePage":42,"pdfPage":38},{"id":154,"source":"MAIN","day":"04","word":"manipulate","entryType":"","meaning":"동 ① 잘 다루다 ② 조작(조종)하다, 속이다","example":"As a politician, he knows how to manipulate public opinion.","translation":"그는 정치인으로서 여론을 조종하는 법을 안다.","sourcePage":43,"pdfPage":39},{"id":155,"source":"MAIN","day":"04","word":"maneuver","entryType":"","meaning":"동 ① 움직이다, 이동시키다 ② 기동 훈련시키다 ③ 조종하다, 책략을 쓰다 / 명 ① 책략, 술책 ② 작전, 기동 훈련","example":"The driver skillfully maneuvered the car.","translation":"그 운전자는 능숙하게 차를 조종했다.","sourcePage":43,"pdfPage":39},{"id":156,"source":"MAIN","day":"04","word":"impress","entryType":"","meaning":"동 깊은 인상을 주다, 감동시키다","example":"The speech impressed the audience.","translation":"그 연설은 청중에게 깊은 인상을 주었다.","sourcePage":43,"pdfPage":39},{"id":157,"source":"MAIN","day":"04","word":"depress","entryType":"","meaning":"동 낙담시키다, 우울하게 하다","example":"The lack of sunlight can depress some people.","translation":"햇빛이 부족하면 어떤 사람들은 우울해질 수 있다.","sourcePage":43,"pdfPage":39},{"id":158,"source":"MAIN","day":"04","word":"suppress","entryType":"","meaning":"동 ① (감정을) 참다, 억누르다 ② 진압하다","example":"He was unable to suppress his anger.","translation":"그는 화를 참을 수가 없었다.","sourcePage":43,"pdfPage":39},{"id":159,"source":"MAIN","day":"04","word":"oppress","entryType":"","meaning":"동 ① 탄압(억압)하다 ② 압박감을 주다, 우울하게 만들다","example":"The dictator oppressed the people of the country.","translation":"그 독재자는 그 나라 국민들을 억압했다.","sourcePage":44,"pdfPage":40},{"id":160,"source":"MAIN","day":"04","word":"repress","entryType":"","meaning":"동 ① (감정을) 참다, 억누르다 ② 탄압하다","example":"If you experience trauma, it's common to repress some of the details.","translation":"트라우마를 경험하면 일부 세부 사항을 억누르는 것이 일반적이다.","sourcePage":44,"pdfPage":40},{"id":161,"source":"MAIN","day":"04","word":"avenue","entryType":"","meaning":"명 대로, 가(街)","example":"She walked along Fifth Avenue.","translation":"그녀는 5번가를 걸었다.","sourcePage":44,"pdfPage":40},{"id":162,"source":"MAIN","day":"04","word":"revenue","entryType":"","meaning":"명 세입, 수입","example":"Tourism is this country’s main source of revenue.","translation":"관광업은 이 나라의 주요 수입원이다.","sourcePage":44,"pdfPage":40},{"id":163,"source":"MAIN","day":"04","word":"advent","entryType":"","meaning":"명 출현, 도래","example":"The advent of the Internet made the world much closer.","translation":"인터넷의 출현은 세계를 훨씬 더 가깝게 만들었다.","sourcePage":44,"pdfPage":40},{"id":164,"source":"MAIN","day":"04","word":"conventional","entryType":"","meaning":"형 관습[관례]적인, 전통적인","example":"'Good morning' is a conventional greeting.","translation":"'Good morning'은 전통적인 인사다.","sourcePage":45,"pdfPage":41},{"id":165,"source":"MAIN","day":"04","word":"exceed","entryType":"","meaning":"동 ① 넘다, 초과하다 ② 능가하다, 우월하다","example":"Your working hours must not exceed 40 hours a week.","translation":"당신의 근무시간은 일주일에 40시간을 초과해서는 안 된다.","sourcePage":45,"pdfPage":41},{"id":166,"source":"MAIN","day":"04","word":"proceed","entryType":"","meaning":"동 나아가다, 계속하다, 진행되다","example":"Despite her bad condition, she proceeded with the lesson.","translation":"상태가 좋지 않았음에도 불구하고, 그녀는 수업을 계속했다.","sourcePage":45,"pdfPage":41},{"id":167,"source":"MAIN","day":"04","word":"precede","entryType":"","meaning":"동 ① ~에 선행하다[앞서다], ~보다 먼저 일어나다 ② ~보다 우선하다","example":"Family duties precede those of society.","translation":"가족의 의무는 사회의 의무보다 우선한다.","sourcePage":45,"pdfPage":41},{"id":168,"source":"MAIN","day":"04","word":"predecessor","entryType":"","meaning":"명 전임자, 선배","example":"He couldn't take over the work from the predecessor.","translation":"그는 전임자로부터 업무를 인계받을 수 없었다.","sourcePage":45,"pdfPage":41},{"id":169,"source":"MAIN","day":"04","word":"recede","entryType":"","meaning":"동 ① 후퇴하다, 물러나다 ② 약해지다","example":"As old threats recede, new ones emerge.","translation":"오래된 위협이 사라지자 새로운 위협들이 나타난다.","sourcePage":46,"pdfPage":42},{"id":170,"source":"MAIN","day":"04","word":"access","entryType":"","meaning":"명 접근, 이용, 출입 / 동 접근하다, 이용하다","example":"People who have been adopted are not allowed to have access to their files.","translation":"입양된 사람들은 자신의 서류를 이용할 수 없다.","sourcePage":46,"pdfPage":42},{"id":171,"source":"MAIN","day":"04","word":"concede","entryType":"","meaning":"동 ① 양보하다 ② 인정하다","example":"The students didn’t concede the logic of his theory.","translation":"학생들은 그의 이론의 논리성을 인정하지 않았다.","sourcePage":46,"pdfPage":42},{"id":172,"source":"MAIN","day":"04","word":"antecedent","entryType":"","meaning":"명 ① 선례 ② 조상 ③ 선행된, 이전의","example":"I had an opportunity to find out about my antecedents.","translation":"나는 내 조상에 대해 알아볼 기회가 있었다.","sourcePage":46,"pdfPage":42},{"id":173,"source":"MAIN","day":"04","word":"grade","entryType":"","meaning":"명 ① 등급, 단계 ② 학년 ③ 성적","example":"Their daughter talks about her first-grade teacher.","translation":"그들의 딸은 자신의 1학년 선생님에 관해 이야기하고 있다.","sourcePage":46,"pdfPage":42},{"id":174,"source":"MAIN","day":"04","word":"gradual","entryType":"","meaning":"형 단계적인, 점진적인","example":"Losing weight is a slow, gradual process.","translation":"체중을 줄이는 것은 느리고 점진적인 과정이다.","sourcePage":47,"pdfPage":43},{"id":175,"source":"MAIN","day":"04","word":"ingredient","entryType":"","meaning":"명 ① (요리) 재료 ② 성분, 구성 요소","example":"Endurance is an essential ingredient contributing to someone’s success.","translation":"인내는 누군가의 성공에 기여하는 필수적인 구성 요소이다.","sourcePage":47,"pdfPage":43},{"id":176,"source":"MAIN","day":"04","word":"regress","entryType":"","meaning":"동 퇴보하다, 퇴행하다","example":"The national economy has regressed.","translation":"국가 경제가 퇴보했다.","sourcePage":47,"pdfPage":43},{"id":177,"source":"MAIN","day":"04","word":"dismiss","entryType":"","meaning":"동 ① 해고하다 ② 해산시키다 ③ 묵살하다","example":"The class was dismissed.","translation":"수업이 끝났다.","sourcePage":47,"pdfPage":43},{"id":178,"source":"MAIN","day":"04","word":"mission","entryType":"","meaning":"명 ① 임무, 사명 ② 전도, 포교 ③ 사절단","example":"It doesn’t mean a company must abandon its primary economic mission.","translation":"그것이 회사가 반드시 회사의 주요한 경제적 임무를 포기해야 한다는 뜻은 아니다.","sourcePage":47,"pdfPage":43},{"id":179,"source":"MAIN","day":"04","word":"admit","entryType":"","meaning":"동 ① 인정하다, 시인하다 ② 받아들이다, (입학을) 허가하다","example":"You try to extend the conversation without admitting your ignorance.","translation":"당신은 자신의 무지를 인정하지 않고 대화를 이어가려고 한다.","sourcePage":48,"pdfPage":44},{"id":180,"source":"MAIN","day":"04","word":"commit","entryType":"","meaning":"동 ① 범하다, 저지르다 ② 전념하다, 헌신하다 ③ 맡기다, 위임하다 ④ 약속하다","example":"People who commit such offences aren’t normal.","translation":"그러한 범행을 저지르는 사람들은 정상적이지 않다.","sourcePage":48,"pdfPage":44},{"id":181,"source":"MAIN","day":"04","word":"submit","entryType":"","meaning":"동 ① 제출하다 ② 복종하다, 굴복하다","example":"I submitted a loan application.","translation":"나는 대출 신청서를 제출했다.","sourcePage":48,"pdfPage":44},{"id":182,"source":"MAIN","day":"04","word":"transmit","entryType":"","meaning":"동 ① 전송하다 ② 전염시키다 ③ (열 등을) 전도하다","example":"The computer failed to transmit the files.","translation":"그 컴퓨터는 파일을 전송하는 데 실패했다.","sourcePage":48,"pdfPage":44},{"id":183,"source":"MAIN","day":"04","word":"emit","entryType":"","meaning":"동 내뿜다, 방출하다","example":"A lot of factories emit poisons into the air.","translation":"많은 공장들은 대기 중에 독극물을 내뿜는다.","sourcePage":48,"pdfPage":44},{"id":184,"source":"MAIN","day":"04","word":"intermittent","entryType":"","meaning":"형 간헐적인, 간간이 일어나는","example":"There will be intermittent showers this afternoon.","translation":"오늘 오후 간간이 소나기가 내릴 것이다.","sourcePage":48,"pdfPage":44},{"id":185,"source":"MAIN","day":"04","word":"portable","entryType":"","meaning":"형 휴대용의, 가지고 다닐 수 있는","example":"Portable emergency lights are installed at every subway station.","translation":"휴대용 비상등이 모든 지하철역에 설치되어 있다.","sourcePage":49,"pdfPage":45},{"id":186,"source":"MAIN","day":"04","word":"import","entryType":"","meaning":"동 수입하다 / 명 수입","example":"The country has to import most of its raw materials.","translation":"그 나라는 원자재 대부분을 수입해야 한다.","sourcePage":49,"pdfPage":45},{"id":187,"source":"MAIN","day":"04","word":"transport","entryType":"","meaning":"동 운송하다, 수송하다 / 명 운송(업), 수송","example":"Pet taxi services aim to transport pet animals.","translation":"펫 택시 서비스는 반려동물을 수송하는 것을 목적으로 한다.","sourcePage":49,"pdfPage":45},{"id":188,"source":"MAIN","day":"04","word":"deport","entryType":"","meaning":"동 ① (국외로) 추방하다 ② (강제로) 이송하다","example":"The state deported illegal immigrants.","translation":"그 주는 불법 이민자들을 추방했다.","sourcePage":49,"pdfPage":45},{"id":189,"source":"MAIN","day":"04","word":"pose","entryType":"","meaning":"동 ① 자세를 취하다 ② (문제를) 제기하다 / 명 자세","example":"We posed for our photographs next to the Statue of Liberty.","translation":"우리는 자유의 여신상 옆에서 사진을 찍기 위해 자세를 취했다.","sourcePage":49,"pdfPage":45},{"id":190,"source":"MAIN","day":"04","word":"compose","entryType":"","meaning":"동 ① 구성하다 ② 작곡하다, 작문하다","example":"This train is composed of ten cars.","translation":"이 열차는 10량으로 구성되어 있다.","sourcePage":50,"pdfPage":46},{"id":191,"source":"MAIN","day":"04","word":"propose","entryType":"","meaning":"동 제안[제의]하다","example":"I will propose a new plan at the meeting.","translation":"나는 회의에서 새로운 계획을 제안할 것이다.","sourcePage":50,"pdfPage":46},{"id":192,"source":"MAIN","day":"04","word":"expose","entryType":"","meaning":"동 ① 노출시키다, 드러내다 ② 폭로하다","example":"Do not expose infants to strong sunlight.","translation":"유아들이 강한 햇빛에 노출되지 않게 하라.","sourcePage":50,"pdfPage":46},{"id":193,"source":"MAIN","day":"04","word":"impose","entryType":"","meaning":"동 ① 부과하다 ② 강요하다","example":"A new tax was imposed on fuel.","translation":"새로운 세금이 연료에 부과되었다.","sourcePage":50,"pdfPage":46},{"id":194,"source":"MAIN","day":"04","word":"oppose","entryType":"","meaning":"동 반대하다, 대항하다","example":"I am really upset that your newspaper opposes this project.","translation":"나는 당신들의 신문이 이 프로젝트에 반대하는 것이 정말 화가 난다.","sourcePage":50,"pdfPage":46},{"id":195,"source":"MAIN","day":"04","word":"dispose","entryType":"","meaning":"동 ① 배치하다 ② 처리[처분]하다 (of) ③ 경향을 갖게 하다","example":"They disposed of stolen property.","translation":"그들은 훔친 물건을 처리했다.","sourcePage":50,"pdfPage":46},{"id":196,"source":"MAIN","day":"04","word":"deposit","entryType":"","meaning":"명 ① 보증금, 예치금 ② 침전물 / 동 ① 두다, 넣다 ② 예금하다","example":"I deposited money in a bank.","translation":"나는 돈을 은행에 예금했다.","sourcePage":51,"pdfPage":47},{"id":197,"source":"MAIN","day":"04","word":"define","entryType":"","meaning":"동 정의하다, 규정하다","example":"This is especially true when we attempt to define life.","translation":"이것은 우리가 인생을 정의하려고 할 때 특히 그러하다.","sourcePage":51,"pdfPage":47},{"id":198,"source":"MAIN","day":"04","word":"confine","entryType":"","meaning":"동 ① 제한하다, 한정하다 ② 가두다, 감금하다","example":"The work will not be confined to the area.","translation":"그 작업이 그 지역에만 한정되지는 않을 것이다.","sourcePage":51,"pdfPage":47},{"id":199,"source":"MAIN","day":"04","word":"refine","entryType":"","meaning":"동 ① 정제하다, 불순물을 제거하다 ② 세련되게 하다, 다듬다","example":"Diesel is refined from crude oil.","translation":"경유는 원유에서 정제된다.","sourcePage":51,"pdfPage":47},{"id":200,"source":"MAIN","day":"04","word":"infinite","entryType":"","meaning":"형 무한한, 한계가 없는","example":"The Internet has opened up infinite potentials.","translation":"인터넷이 무한한 가능성을 활짝 열었다.","sourcePage":51,"pdfPage":47},{"id":201,"source":"MAIN","day":"05","word":"prefer","entryType":"","meaning":"동 선호하다, 더 좋아하다","example":"My parents prefer tea to coffee.","translation":"부모님은 커피보다 차를 더 좋아하신다.","sourcePage":52,"pdfPage":48},{"id":202,"source":"MAIN","day":"05","word":"confer","entryType":"","meaning":"동 ① 상의하다, 회의하다 ② 수여하다","example":"He wanted to confer with his colleagues before making a decision.","translation":"그는 결정을 내리기 전에 동료들과 의논하고 싶었다.","sourcePage":52,"pdfPage":48},{"id":203,"source":"MAIN","day":"05","word":"infer","entryType":"","meaning":"동 추론[추측]하다","example":"His friends inferred that he was drunk.","translation":"그의 친구들은 그가 취해 있었다고 추측했다.","sourcePage":52,"pdfPage":48},{"id":204,"source":"MAIN","day":"05","word":"fertile","entryType":"","meaning":"형 ① 비옥한, 기름진 ② 많이 낳는, 생식력 있는 ③ 풍부한","example":"The settlers tried to find some fertile land.","translation":"개척자들이 비옥한 땅을 찾으려 했다.","sourcePage":53,"pdfPage":49},{"id":205,"source":"MAIN","day":"05","word":"defer","entryType":"","meaning":"동 ① 미루다, 연기하다 ② 경의를 표하다","example":"The blackout deferred the upgrade.","translation":"정전은 업그레이드를 지연시켰다.","sourcePage":53,"pdfPage":49},{"id":206,"source":"MAIN","day":"05","word":"sedentary","entryType":"","meaning":"형 주로 앉아서 하는","example":"She wanted a sedentary job.","translation":"그녀는 주로 앉아서 하는 일을 원했다.","sourcePage":53,"pdfPage":49},{"id":207,"source":"MAIN","day":"05","word":"residue","entryType":"","meaning":"명 잔여, 나머지","example":"There was some kind of sticky residue on the floor.","translation":"바닥에 끈적끈적한 잔여물이 남아 있었다.","sourcePage":53,"pdfPage":49},{"id":208,"source":"MAIN","day":"05","word":"subside","entryType":"","meaning":"동 가라앉다, 진정되다","example":"The fury of the storm has subsided.","translation":"사나운 폭풍우가 가라앉았다.","sourcePage":53,"pdfPage":49},{"id":209,"source":"MAIN","day":"05","word":"subsidize","entryType":"","meaning":"동 보조금을 주다","example":"The government subsidized farmers to support agriculture.","translation":"정부는 농업을 지원하기 위해 농부들에게 보조금을 주었다.","sourcePage":54,"pdfPage":50},{"id":210,"source":"MAIN","day":"05","word":"stable","entryType":"","meaning":"형 안정된, 견고한","example":"Her blood pressure is now stable.","translation":"그녀의 혈압이 이제는 안정이 되었다.","sourcePage":54,"pdfPage":50},{"id":211,"source":"MAIN","day":"05","word":"static","entryType":"","meaning":"형 정적인, 고정적인 / 명 잡음","example":"House prices will remain static for a long period.","translation":"주택 가격이 오랜 시간 동안 고정적일 것이다.","sourcePage":54,"pdfPage":50},{"id":212,"source":"MAIN","day":"05","word":"stationary","entryType":"","meaning":"형 정지된, 고정된","example":"It is stationary and not removable.","translation":"그것은 고정되어서 제거할 수 없다.","sourcePage":54,"pdfPage":50},{"id":213,"source":"MAIN","day":"05","word":"constitute","entryType":"","meaning":"동 ① 구성하다, 형성하다 ② 제정하다, 설립하다","example":"People under the age of 40 constitute the majority of the labor force.","translation":"40세 미만의 사람들이 노동력의 대부분을 차지한다.","sourcePage":54,"pdfPage":50},{"id":214,"source":"MAIN","day":"05","word":"institute","entryType":"","meaning":"동 ① 제정하다, 설립하다 ② 도입하다, 시작[시행]하다 / 명 기관[협회], 연구소","example":"The institute publishes research reports quarterly.","translation":"그 기관은 매 분기마다 연구 보고서를 발간한다.","sourcePage":55,"pdfPage":51},{"id":215,"source":"MAIN","day":"05","word":"substitute","entryType":"","meaning":"동 대신하다, 대체하다 / 명 대신하는 것[사람]","example":"Is there anyone to substitute for me?","translation":"저를 대신해 줄 사람이 있나요?","sourcePage":55,"pdfPage":51},{"id":216,"source":"MAIN","day":"05","word":"destitute","entryType":"","meaning":"형 ① 빈곤한 ② ~이 없는, 결핍한","example":"The war left her completely destitute.","translation":"전쟁으로 그녀는 완전히 궁핍해졌다.","sourcePage":55,"pdfPage":51},{"id":217,"source":"MAIN","day":"05","word":"obstinate","entryType":"","meaning":"형 고집 센, 완고한","example":"She is the most obstinate person.","translation":"그녀는 가장 고집이 센 사람이다.","sourcePage":55,"pdfPage":51},{"id":218,"source":"MAIN","day":"05","word":"consistent","entryType":"","meaning":"형 ① 일관된 ② ~와 일치하는 (with)","example":"You must be consistent in applying the rules.","translation":"규칙들을 적용할 때는 일관성이 있어야 한다.","sourcePage":55,"pdfPage":51},{"id":219,"source":"MAIN","day":"05","word":"state","entryType":"","meaning":"명 ① 상태 ② 국가 / 동 진술하다, 말하다","example":"The country is in a state of political chaos.","translation":"그 나라는 정치적으로 혼란한 상태이다.","sourcePage":55,"pdfPage":51},{"id":220,"source":"MAIN","day":"05","word":"status","entryType":"","meaning":"명 ① (사회적) 지위, 신분 ② 상황","example":"What jobs have the highest status in Korea?","translation":"한국에서는 어떤 직업들이 가장 사회적 지위가 높나요?","sourcePage":56,"pdfPage":52},{"id":221,"source":"MAIN","day":"05","word":"statue","entryType":"","meaning":"명 상, 조각상, 동상","example":"Tourists took pictures of the impressive statue.","translation":"관광객들이 그 인상적인 조각상의 사진을 찍었다.","sourcePage":56,"pdfPage":52},{"id":222,"source":"MAIN","day":"05","word":"stature","entryType":"","meaning":"명 ① 지명도, 위상 ② (사람의) 키","example":"The company is known for its high ethical stature.","translation":"그 회사는 높은 윤리적 위상으로 유명하다.","sourcePage":56,"pdfPage":52},{"id":223,"source":"MAIN","day":"05","word":"statute","entryType":"","meaning":"명 ① 법규, 법령 ② (조직·기관의) 규정, (학교의) 학칙","example":"They are lobbying for a change in the tax statute.","translation":"세법 개정을 위해 로비를 벌이고 있다.","sourcePage":56,"pdfPage":52},{"id":224,"source":"MAIN","day":"05","word":"structure","entryType":"","meaning":"명 ① 건축, 건물 ② 구조 / 동 조직하다, 구조화하다","example":"The structure of the banking system is changing.","translation":"은행 체계의 구조는 변하고 있다.","sourcePage":56,"pdfPage":52},{"id":225,"source":"MAIN","day":"05","word":"construct","entryType":"","meaning":"동 ① 건설하다, 세우다 ② 구성하다","example":"Christian Huygens constructed the first pendulum clock.","translation":"Christian Huygens가 최초의 추시계를 만들었다.","sourcePage":57,"pdfPage":53},{"id":226,"source":"MAIN","day":"05","word":"instruct","entryType":"","meaning":"동 ① 가르치다, 교육하다 ② 지시하다","example":"The doctor instructed the patient to relax and breathe.","translation":"의사는 환자에게 편안하게 숨을 쉬도록 지시했다.","sourcePage":57,"pdfPage":53},{"id":227,"source":"MAIN","day":"05","word":"obstruct","entryType":"","meaning":"동 방해하다, 막다","example":"Trees may obstruct the passage of sunlight.","translation":"나무들이 햇빛의 통과를 방해할 수도 있다.","sourcePage":57,"pdfPage":53},{"id":228,"source":"MAIN","day":"05","word":"instrument","entryType":"","meaning":"명 ① 도구, 기계 ② 악기","example":"All you hear are isolated sounds from the instruments.","translation":"들리는 것은 악기들로부터 나오는 개별적인 소리들뿐이다.","sourcePage":57,"pdfPage":53},{"id":229,"source":"MAIN","day":"05","word":"novel","entryType":"","meaning":"형 참신한, 새로운 / 명 소설","example":"He comes up with a novel idea all the time.","translation":"그는 매번 참신한 생각을 떠올린다.","sourcePage":57,"pdfPage":53},{"id":230,"source":"MAIN","day":"05","word":"innovation","entryType":"","meaning":"명 ① 혁신 ② 획기적인 것","example":"It just means you need to embrace innovation.","translation":"이것은 단지 당신이 혁신을 받아들여야 한다는 것을 의미한다.","sourcePage":58,"pdfPage":54},{"id":231,"source":"MAIN","day":"05","word":"renovate","entryType":"","meaning":"동 개조하다, 보수하다","example":"Work continues on renovating the library.","translation":"그 도서관 수리 작업이 계속되고 있다.","sourcePage":58,"pdfPage":54},{"id":232,"source":"MAIN","day":"05","word":"novice","entryType":"","meaning":"명 초보자, 풋내기","example":"He is a novice at swimming.","translation":"그는 수영 초보자이다.","sourcePage":58,"pdfPage":54},{"id":233,"source":"MAIN","day":"05","word":"renew","entryType":"","meaning":"동 ① 재개하다 ② 갱신[연장]하다","example":"Can I renew these library books?","translation":"이 도서관 책들의 대출을 연장할 수 있나요?","sourcePage":58,"pdfPage":54},{"id":234,"source":"MAIN","day":"05","word":"medium","entryType":"","meaning":"명 ① 매개물, 매체, 수단 ② 중간 / 형 중간의","example":"Digital video discs are becoming the most popular video storage medium.","translation":"디지털 비디오 디스크(DVD)는 가장 대중적인 영상 저장 매체가 되고 있다.","sourcePage":58,"pdfPage":54},{"id":235,"source":"MAIN","day":"05","word":"mediate","entryType":"","meaning":"동 중재하다, 조정하다","example":"He was asked to mediate in the dispute.","translation":"그는 분쟁을 조정해 달라는 요청을 받았다.","sourcePage":59,"pdfPage":55},{"id":236,"source":"MAIN","day":"05","word":"meditate","entryType":"","meaning":"동 ① 명상하다, 숙고하다 ② 계획하다","example":"I am going to learn how to meditate.","translation":"나는 명상하는 법을 배울 예정이다.","sourcePage":59,"pdfPage":55},{"id":237,"source":"MAIN","day":"05","word":"mediocre","entryType":"","meaning":"형 보통의, 평범한, 그저 그런","example":"I felt the play was mediocre.","translation":"나는 그 연극이 그저 그렇다고 느꼈다.","sourcePage":59,"pdfPage":55},{"id":238,"source":"MAIN","day":"05","word":"Mediterranean","entryType":"","meaning":"형 지중해의","example":"The Nile River empties into the Mediterranean Sea.","translation":"나일강은 지중해로 흘러든다.","sourcePage":59,"pdfPage":55},{"id":239,"source":"MAIN","day":"05","word":"meantime","entryType":"","meaning":"명 그동안 / 부 그동안에, 한편","example":"The boy ran away in the meantime.","translation":"그 사이에 소년은 도망갔다.","sourcePage":59,"pdfPage":55},{"id":240,"source":"MAIN","day":"05","word":"midst","entryType":"","meaning":"명 중앙, 한가운데","example":"People had to keep life going in the midst of wars.","translation":"사람들은 전쟁 한가운데서도 삶을 영위해야 했다.","sourcePage":59,"pdfPage":55},{"id":241,"source":"MAIN","day":"05","word":"similar","entryType":"","meaning":"형 유사한, 비슷한","example":"The two houses are similar in size.","translation":"그 두 집은 크기가 비슷하다.","sourcePage":60,"pdfPage":56},{"id":242,"source":"MAIN","day":"05","word":"assimilate","entryType":"","meaning":"동 ① 동화되다[시키다] ② 소화하다, 이해하다 ③ 흡수하다","example":"Newcomers find it hard to assimilate.","translation":"새로 오는 사람들은 동화되기 힘들어한다.","sourcePage":60,"pdfPage":56},{"id":243,"source":"MAIN","day":"05","word":"simulate","entryType":"","meaning":"동 ① 가장하다, 흉내 내다 ② 모의실험을 하다","example":"I shook a sheet of metal to simulate the voice of thunder.","translation":"나는 천둥 소리를 흉내 내기 위해 금속판을 흔들었다.","sourcePage":60,"pdfPage":56},{"id":244,"source":"MAIN","day":"05","word":"simultaneous","entryType":"","meaning":"형 동시의, 동시에 일어나는","example":"There were several simultaneous attacks by the rebels.","translation":"반란군의 동시 공격이 몇 차례 있었다.","sourcePage":60,"pdfPage":56},{"id":245,"source":"MAIN","day":"05","word":"intact","entryType":"","meaning":"형 ① 원형 그대로의, 손상되지 않은 ② 완전한","example":"This house has been preserved intact.","translation":"이 집은 원형 모습 그대로 보존되어 왔다.","sourcePage":60,"pdfPage":56},{"id":246,"source":"MAIN","day":"05","word":"tactile","entryType":"","meaning":"형 촉각의","example":"Tactile communication is basic to human beings.","translation":"촉각적인 의사소통은 인간에게 기본적인 것이다.","sourcePage":61,"pdfPage":57},{"id":247,"source":"MAIN","day":"05","word":"tangible","entryType":"","meaning":"형 ① 만질 수 있는 ② 실제하는, 유형(有形)의 ③ 확실한","example":"Museums are our history in tangible form.","translation":"박물관은 유형의 형태로 된 우리의 역사이다.","sourcePage":61,"pdfPage":57},{"id":248,"source":"MAIN","day":"05","word":"contagious","entryType":"","meaning":"형 전염되는, 전염성의","example":"A contagious disease is caused by a virus.","translation":"전염병은 바이러스에 의해 발생한다.","sourcePage":61,"pdfPage":57},{"id":249,"source":"MAIN","day":"05","word":"contaminate","entryType":"","meaning":"동 더럽히다, 오염시키다","example":"The water is contaminated with lead.","translation":"그 물은 납에 오염되었다.","sourcePage":61,"pdfPage":57},{"id":250,"source":"MAIN","day":"05","word":"integrate","entryType":"","meaning":"동 통합시키다","example":"They successfully integrated technology.","translation":"그들은 기술을 성공적으로 통합시켰다.","sourcePage":61,"pdfPage":57},{"id":251,"source":"MAIN","day":"06","word":"tend","entryType":"","meaning":"동 ~하는 경향이 있다, ~하기 쉽다","example":"The drugs tend to cause drowsiness.","translation":"그 약들은 졸음을 유발하는 경향이 있다.","sourcePage":62,"pdfPage":58},{"id":252,"source":"MAIN","day":"06","word":"extend","entryType":"","meaning":"동 확장[연장]하다, 늘리다","example":"The citizens submitted the petition to extend the road.","translation":"시민들은 도로를 확장해 달라는 청원서를 제출했다.","sourcePage":62,"pdfPage":58},{"id":253,"source":"MAIN","day":"06","word":"intend","entryType":"","meaning":"동 ① ~할 작정이다, 의도하다 ② 의미하다","example":"We intended no harm.","translation":"우리는 해를 끼칠 의도가 없었다.","sourcePage":62,"pdfPage":58},{"id":254,"source":"MAIN","day":"06","word":"pretend","entryType":"","meaning":"동 ~인 체하다, 가장하다","example":"As soon as I saw a bear on the mountain trails, I pretended to be dead.","translation":"산길에서 곰을 보자마자 나는 죽은 척했다.","sourcePage":63,"pdfPage":59},{"id":255,"source":"MAIN","day":"06","word":"tense","entryType":"","meaning":"형 긴장한, 불안한 / 명 시제","example":"There is no need to get tense.","translation":"긴장할 필요가 없다.","sourcePage":63,"pdfPage":59},{"id":256,"source":"MAIN","day":"06","word":"convert","entryType":"","meaning":"동 전환[개조]하다, 바꾸다","example":"The store will convert your dollars into euros.","translation":"그 가게는 당신의 달러를 유로로 바꿔 줄 것이다.","sourcePage":63,"pdfPage":59},{"id":257,"source":"MAIN","day":"06","word":"divert","entryType":"","meaning":"동 ① 방향을 전환하다 ② (주의를) 돌리다, 전환하다","example":"The heavy rain diverted the course of a stream.","translation":"폭우가 하천의 흐름을 바꾸었다.","sourcePage":63,"pdfPage":59},{"id":258,"source":"MAIN","day":"06","word":"introvert","entryType":"","meaning":"명 내향적인 사람, 내성적인 사람","example":"He was an introvert.","translation":"그는 내성적인 사람이었다.","sourcePage":63,"pdfPage":59},{"id":259,"source":"MAIN","day":"06","word":"extrovert","entryType":"","meaning":"명 외향적인 사람","example":"I want to have an extrovert personality.","translation":"나는 외향적인 성격을 갖고 싶다.","sourcePage":64,"pdfPage":60},{"id":260,"source":"MAIN","day":"06","word":"reverse","entryType":"","meaning":"동 ① 뒤집다, 반대로 하다 ② 되돌리다 / 형 반대의, 거꾸로의","example":"We should reverse the order of these pages.","translation":"우리는 이 페이지들의 순서를 뒤집어야 한다.","sourcePage":64,"pdfPage":60},{"id":261,"source":"MAIN","day":"06","word":"inverse","entryType":"","meaning":"명 역, 반대 / 형 반대의, 역의","example":"There's an inverse relationship between exercise and stress levels.","translation":"운동과 스트레스 수준 사이에는 반비례 관계가 있다.","sourcePage":64,"pdfPage":60},{"id":262,"source":"MAIN","day":"06","word":"converse","entryType":"","meaning":"동 대화하다 / 형 정반대의 / 명 정반대","example":"They converse in Spanish.","translation":"그들은 스페인어로 대화한다.","sourcePage":64,"pdfPage":60},{"id":263,"source":"MAIN","day":"06","word":"diverge","entryType":"","meaning":"동 ① 나뉘다, 갈라지다 ② 빗나가다, 일탈하다","example":"Don't be afraid to diverge from the norm, be creative!","translation":"기준에서 벗어나는 것을 두려워하지 말고 창의적이 되어라!","sourcePage":64,"pdfPage":60},{"id":264,"source":"MAIN","day":"06","word":"converge","entryType":"","meaning":"동 ① 수렴하다 ② 모이다, 집중되다","example":"Surfers converged on the beach.","translation":"서퍼들이 해변으로 모여들었다.","sourcePage":64,"pdfPage":60},{"id":265,"source":"MAIN","day":"06","word":"controversy","entryType":"","meaning":"명 논쟁, 토론, 분쟁","example":"There was considerable controversy over his appointment.","translation":"그의 임명을 둘러싸고 상당한 논쟁이 있었다.","sourcePage":65,"pdfPage":61},{"id":266,"source":"MAIN","day":"06","word":"versatile","entryType":"","meaning":"형 다재다능한, 다용도의","example":"Charcoal is a highly versatile material.","translation":"숯은 매우 다용도로 쓰이는 재료이다.","sourcePage":65,"pdfPage":61},{"id":267,"source":"MAIN","day":"06","word":"serve","entryType":"","meaning":"동 ① 봉사하다, 복무하다 ② 섬기다, 시중들다 ③ (음식을) 차리다, 접대하다","example":"Be polite to the person who serves you.","translation":"당신을 시중드는 사람에게 예의 바르게 대하라.","sourcePage":65,"pdfPage":61},{"id":268,"source":"MAIN","day":"06","word":"preserve","entryType":"","meaning":"동 지키다, 보존하다","example":"There are many things you can do to preserve the environment.","translation":"환경을 보존하기 위해 할 수 있는 일이 많다.","sourcePage":65,"pdfPage":61},{"id":269,"source":"MAIN","day":"06","word":"conserve","entryType":"","meaning":"동 보존하다, 보호하다","example":"We must conserve our nonrenewable resources.","translation":"우리는 재생 불가능한 자원을 보존해야 한다.","sourcePage":65,"pdfPage":61},{"id":270,"source":"MAIN","day":"06","word":"reserve","entryType":"","meaning":"동 예약하다, 남겨두다 / 명 예약, 비축","example":"I reserved a table for three at the restaurant.","translation":"나는 식당에 세 명 자리를 예약했다.","sourcePage":66,"pdfPage":62},{"id":271,"source":"MAIN","day":"06","word":"observe","entryType":"","meaning":"동 ① 관찰하다, 감시하다 ② (규칙 등을) 준수하다, 지키다 ③ 말하다","example":"I observed the people around me.","translation":"나는 주변 사람들을 관찰했다.","sourcePage":66,"pdfPage":62},{"id":272,"source":"MAIN","day":"06","word":"sever","entryType":"","meaning":"동 자르다, 끊다","example":"The body of the ship was severed in two.","translation":"배의 선체가 두 동강 났다.","sourcePage":66,"pdfPage":62},{"id":273,"source":"MAIN","day":"06","word":"seclude","entryType":"","meaning":"동 격리시키다, 은둔시키다","example":"He secluded himself from the outside world.","translation":"그는 외부 세계로부터 자신을 격리시켰다.","sourcePage":66,"pdfPage":62},{"id":274,"source":"MAIN","day":"06","word":"segment","entryType":"","meaning":"명 부분, 구획, 조각 / 동 나누다, 분할하다","example":"We control a large segment of the market.","translation":"우리는 시장의 큰 부분을 통제한다.","sourcePage":66,"pdfPage":62},{"id":275,"source":"MAIN","day":"06","word":"intersect","entryType":"","meaning":"동 교차하다, 가로지르다","example":"The two lines intersect at right angles.","translation":"두 선은 직각으로 교차한다.","sourcePage":67,"pdfPage":63},{"id":276,"source":"MAIN","day":"06","word":"fragile","entryType":"","meaning":"형 약한, 부서지기 쉬운","example":"This object is fragile, so we must be careful when handling it.","translation":"이 물건은 깨지기 쉬우므로 다룰 때 조심해야 한다.","sourcePage":67,"pdfPage":63},{"id":277,"source":"MAIN","day":"06","word":"fragment","entryType":"","meaning":"명 조각, 파편 / 동 산산이 부수다, 해체하다","example":"The archaeologists examined the fragments of ancient pottery.","translation":"고고학자들은 고대 도자기의 파편들을 조사했다.","sourcePage":67,"pdfPage":63},{"id":278,"source":"MAIN","day":"06","word":"fraction","entryType":"","meaning":"명 ① 분수, 비율 ② 일부, 단편","example":"Only a small fraction of the population speaks this language fluently.","translation":"인구의 극히 일부만이 이 언어를 유창하게 말한다.","sourcePage":67,"pdfPage":63},{"id":279,"source":"MAIN","day":"06","word":"fracture","entryType":"","meaning":"명 골절, 파손 / 동 골절되다, 파열되다","example":"Old people's bones are vulnerable to fracture.","translation":"노인들의 뼈는 골절되기 쉽다.","sourcePage":67,"pdfPage":63},{"id":280,"source":"MAIN","day":"06","word":"bankrupt","entryType":"","meaning":"형 파산한, 파산한 / 동 파산시키다","example":"Many banks and factories went bankrupt.","translation":"많은 은행과 공장들이 파산했다.","sourcePage":68,"pdfPage":64},{"id":281,"source":"MAIN","day":"06","word":"corrupt","entryType":"","meaning":"형 부패한, 타락한 / 동 타락시키다, 부패하게 하다","example":"She was corrupted by power and ambition.","translation":"그녀는 권력과 야망으로 타락했다.","sourcePage":68,"pdfPage":64},{"id":282,"source":"MAIN","day":"06","word":"abrupt","entryType":"","meaning":"형 ① 갑작스러운, 돌연한 ② 퉁명스러운","example":"She was very abrupt with me in the meeting.","translation":"그녀는 회의에서 나에게 매우 퉁명스러웠다.","sourcePage":68,"pdfPage":64},{"id":283,"source":"MAIN","day":"06","word":"erupt","entryType":"","meaning":"동 분출하다[시키다], 폭발하다[시키다]","example":"The volcano is expected to erupt at any time.","translation":"그 화산은 언제라도 폭발할 것으로 예상된다.","sourcePage":68,"pdfPage":64},{"id":284,"source":"MAIN","day":"06","word":"interrupt","entryType":"","meaning":"동 방해하다, 훼방시키다","example":"It is rude to interrupt the speaker.","translation":"말하는 사람을 방해하는 것은 무례하다.","sourcePage":68,"pdfPage":64},{"id":285,"source":"MAIN","day":"06","word":"disrupt","entryType":"","meaning":"동 방해하다, 훼방하다","example":"Bus services will be disrupted today.","translation":"오늘 버스 운행이 중단될 것이다.","sourcePage":69,"pdfPage":65},{"id":286,"source":"MAIN","day":"06","word":"sentiment","entryType":"","meaning":"명 ① 감정, 정서 ② 감상","example":"There is no place for sentiment in competition.","translation":"경쟁에서는 감정이 설 자리가 없다.","sourcePage":69,"pdfPage":65},{"id":287,"source":"MAIN","day":"06","word":"resent","entryType":"","meaning":"동 분개하다, 불쾌하게 여기다","example":"He bitterly resents being treated unfairly.","translation":"그는 부당한 대우를 받는 것을 몹시 불쾌하게 여긴다.","sourcePage":69,"pdfPage":65},{"id":288,"source":"MAIN","day":"06","word":"assent","entryType":"","meaning":"동 동의하다(to) / 명 동의, 찬성","example":"They assented to the terms of the contract.","translation":"그들은 계약 조건에 동의했다.","sourcePage":69,"pdfPage":65},{"id":289,"source":"MAIN","day":"06","word":"consent","entryType":"","meaning":"동 동의하다(to) / 명 동의, 허락, 합의","example":"They consented to participate in the scientific study.","translation":"그들은 과학 연구에 참여하는 것에
