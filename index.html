function toggleWordbook(){
  const body=document.getElementById("wordbookBody"),arrow=document.getElementById("wordbookArrow");
  if(!body)return;
  const open=body.style.display!=="none";
  body.style.display=open?"none":"block";
  arrow.textContent=open?"▸":"▾";
}

function makeQuestion(pool,index=0){
  const w=pool[index];
  if(!w)return null;
  const used=new Set([w.meaning]);
  const cands=shuffle(pool.filter(x=>x.id!==w.id&&!used.has(x.meaning)));
  const ds=[];
  for(const x of cands){
    if(!used.has(x.meaning)){
      ds.push(x.meaning);
      used.add(x.meaning);
      if(ds.length===3)break;
    }
  }
  if(ds.length<3)return null;
  return{w,options:shuffle([w.meaning,...ds])};
}
function openQuizSetup(mode,day=null){
  selectedMode=mode;
  if(mode==="day"){
  let pool=words.filter(w=>w.day===day);
  if(pool.length<4)return toast("퀴즈에는 최소 4개의 단어가 필요해요.");
  quiz={pool:shuffle(pool),index:0,correct:0,answers:[],locked:false,timer:null,session:startSession("day",pool.length,pool.length,day),sessionRecorded:false};
  return showQuestion()
}
  let title=mode==="wrong"?"오답 퀴즈":"전체 랜덤 퀴즈",pool=mode==="wrong"?words.filter(w=>getStats(w.id).streak<3):words;
  document.getElementById("app").innerHTML=`<div class="card"><h2>${title}</h2><p><small>출제 가능 단어: ${pool.length}개 · 같은 세션에서는 중복 출제하지 않아요.</small></p><h3>문제 수 선택</h3><div class="grid">
  <button class="btn secondary quizCount" onclick="beginSelectedQuiz(20,this)">20문제</button><button class="btn secondary quizCount" onclick="beginSelectedQuiz(50,this)">50문제</button>
  <button class="btn secondary quizCount" onclick="beginSelectedQuiz(100,this)">100문제</button><button class="btn secondary quizCount" onclick="beginSelectedQuiz(500,this)">500문제</button></div>
  <button class="btn secondary" onclick="renderHome()">취소</button></div>`
}
function beginSelectedQuiz(count, btn=null){
  if(btn){
    document.querySelectorAll(".quizCount").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
  }
  let pool=selectedMode==="wrong"?words.filter(w=>getStats(w.id).streak<3):words;
  if(pool.length<4)return toast("퀴즈에는 최소 4개의 단어가 필요해요.");
  let n=count==="all"?pool.length:Math.min(Number(count),pool.length);
  quiz={pool:shuffle(pool).slice(0,n),index:0,correct:0,answers:[],locked:false,timer:null,session:startSession(selectedMode,n,pool.length),sessionRecorded:false};showQuestion()
}
function getQuizTimerSeconds(){
  const n=Number(localStorage.getItem("pe10_timer"));
  return Number.isFinite(n) && n>0 ? n : 5;
}
function showQuestion(){
  document.body.classList.add('quiz-active');
  if(quiz.index>=quiz.pool.length)return showResult();
  if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;}
  const made=makeQuestion(quiz.pool,quiz.index);
  if(!made){toast("보기 3개를 만들 수 없어 퀴즈를 종료합니다.");return showResult()}
  quiz.current=made;
  quiz.locked=false;
  const w=made.w,o=made.options;
  const seconds=getQuizTimerSeconds();
  document.getElementById("app").innerHTML=`<div class="quizLayout30">
    <section class="quizRegion30 quizHeader30"><div class="progress">${quiz.index+1} / ${quiz.pool.length}</div></section>
    <section class="quizRegion30 quizQuestion30"><div class="quizword"><div id="timer" class="timer">${seconds}</div><div class="word">${esc(w.word)}</div><button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 발음 듣기</button></div></section>
    <section class="quizRegion30 quizOptions30"><div class="quizOptionStack30">${o.map((x,i)=>`<button class="option quizOption30" onclick="answer(${i})">${renderMeaning(x,true)}</button>`).join("")}</div></section>
    <section class="quizRegion30 quizFooter30"><button class="btn secondary quizStop30" onclick="stopQuiz()">그만하기</button></section>
  </div>`;
  startTimer(seconds);
}
function startTimer(seconds=getQuizTimerSeconds()){
  if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;}
  quiz.remaining=seconds;
  const e=document.getElementById("timer");
  if(e)e.textContent=quiz.remaining;
  quiz.timer=setInterval(()=>{
    if(!quiz || !document.getElementById("timer")){
      clearInterval(quiz.timer);quiz.timer=null;return;
    }
    quiz.remaining--;
    const el=document.getElementById("timer");
    if(el){
      el.textContent=quiz.remaining;
      el.classList.toggle("urgent",quiz.remaining<=2);
    }
    if(quiz.remaining<=0){
      clearInterval(quiz.timer);
      quiz.timer=null;
      timeOut();
    }
  },1000);
}

function stopQuiz(){
  if(!quiz)return;
  clearInterval(quiz.timer);
  quiz.timer=null;
  let attempted=quiz.answers.length;
  let wrongCount=quiz.answers.filter(a=>!a.ok).length;
  let correctCount=quiz.answers.filter(a=>a.ok).length;
  let pct=attempted?Math.round(correctCount/attempted*100):0;
  let p=document.createElement("div");
  p.className="resultOverlay";
  p.innerHTML=`<div class="resultPopup timeout" style="text-align:center">
    <div class="popupWord">퀴즈를 그만하시겠어요?</div>
    <p style="color:var(--muted);margin:10px 0 16px">현재까지 푼 문제의 결과를 확인할 수 있어요.</p>
    <div class="card" style="margin:0 0 12px;background:#f8fbfc;box-shadow:none">
      <div class="grid">
        <div class="stat"><div class="num">${attempted} / ${quiz.pool.length}</div><div class="label">진행 상황</div></div>
        <div class="stat"><div class="num">${correctCount}</div><div class="label">정답</div></div>
        <div class="stat"><div class="num">${wrongCount}</div><div class="label">오답</div></div>
        <div class="stat"><div class="num">${pct}%</div><div class="label">정답률</div></div>
      </div>
    </div>
    <button class="btn secondary" onclick="this.closest('.resultOverlay').remove();showQuestion()">계속 풀기</button>
    <button class="btn danger" onclick="this.closest('.resultOverlay').remove();showInterruptedResult()">그만두고 결과 보기</button>
  </div>`;
  document.body.appendChild(p);
}
function timeOut(){
  if(quiz.locked)return;
  quiz.locked=true; quiz.timer=null;
  let w=quiz.current.w;
  quiz.current.ok=false; quiz.current.timeout=true; quiz.current.selected="시간 초과";
  quiz.answers.push({w,ok:false,timeout:true,selected:"시간 초과"});
  recordAnswer(w,false,true);
  showPopup("timeout",w,null);
}
function answer(i){
  if(quiz.locked)return;
  quiz.locked=true; clearInterval(quiz.timer); quiz.timer=null;
  let w=quiz.current.w,o=quiz.current.options,ok=o[i]===w.meaning;
  quiz.current.ok=ok; quiz.current.timeout=false; quiz.current.selected=o[i];
  quiz.answers.push({w,ok,timeout:false,selected:o[i]});
  if(ok)quiz.correct++;
  recordAnswer(w,ok);
  showPopup(ok?"ok":"bad",w,o[i]);
}
function showPopup(type,w,selected){
  let title=type==="ok"?"정답!":type==="bad"?"오답!":"시간 초과!";
  let p=document.createElement("div"); p.className="resultOverlay";
  p.innerHTML=`<div class="resultPopup ${type}">
    <div class="popupWord">${esc(w.word)}</div>
    <div class="popupActions">
      <button class="btn secondary" onclick="let p=this.closest('.resultOverlay');if(p._advanceTimer)clearTimeout(p._advanceTimer);openDetail(${w.id});p.remove()">단어 상세 보기</button>
      <button class="btn" onclick="let p=this.closest('.resultOverlay');if(p._advanceTimer)clearTimeout(p._advanceTimer);p.remove();continueQuizAfterPopup()">다음 문제</button>
    </div>
    <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 발음 다시 듣기</button>
    ${type==="bad"?`<div class="myAnswer">내 선택${renderMeaning(selected,true)}</div>`:""}
    ${type==="timeout"?`<div class="timeoutMsg">제한 시간 안에 답을 선택하지 못했어요.</div>`:""}
    <div class="correctAnswer"><span>✓ 정답</span>${renderMeaning(w.meaning,true)}</div>
    <div style="margin-top:12px">${title}</div>
  </div>`;
  document.body.appendChild(p);

  // 팝업 등장 즉시 영어 발음 자동 재생.
  setTimeout(()=>speakWord(w.word),100);

  // 5초 후 자동으로 다음 문제.
  p._advanceTimer=setTimeout(()=>{
    if(document.body.contains(p)){
      p.remove();
      continueQuizAfterPopup();
    }
  },Number(localStorage.getItem("pe10_popup_timer")||5)*1000);
}

function continueQuizAfterPopup(){
  if(!quiz)return renderHome();
  quiz.locked=false;
  quiz.index++;
  showQuestion();
}

function showInterruptedResult(){
  if(!quiz)return renderHome();
  recordSession("interrupted",false);
  let t=quiz.answers.length;
  let correct=quiz.answers.filter(a=>a.ok).length;
  let wrongAnswers=quiz.answers.filter(a=>!a.ok);
  let pct=t?Math.round(correct/t*100):0;
  let total=quiz.pool.length;

  document.getElementById("app").innerHTML=`<div class="resultHero">
    <div>중단 결과</div>
    <div class="pct">${pct}%</div>
    <div>${t} / ${total} 문제 진행 · 정답 ${correct} · 오답 ${wrongAnswers.length}</div>
  </div>
  <div class="card">
    <h2>이번 학습 결과</h2>
    <div class="grid">
      <div class="stat"><div class="num">${t}</div><div class="label">푼 문제</div></div>
      <div class="stat"><div class="num">${correct}</div><div class="label">정답</div></div>
      <div class="stat"><div class="num">${wrongAnswers.length}</div><div class="label">오답</div></div>
      <div class="stat"><div class="num">${pct}%</div><div class="label">정답률</div></div>
    </div>
  </div>

  <div class="card">
    <h2 class="wrong">틀린 단어 (${wrongAnswers.length}개)</h2>
    ${wrongAnswers.length
      ? wrongAnswers.map(a=>`<div class="wordrow">
          <b class="wrong" style="cursor:pointer" onclick="openDetail(${a.w.id})">${esc(a.w.word)}</b><br>
          <small>❌ 오답${a.timeout?" · ⏰ 시간 초과":""} · 정답: ${esc(a.w.meaning)}${a.timeout?"":" · 선택: "+esc(a.selected)}</small><br>
          <button class="speak" onclick="speakWord(${JSON.stringify(a.w.word)})">🔊 발음 듣기</button>
          <button class="miniBtn" onclick="openDetail(${a.w.id})">단어 상세</button>
        </div>`).join("")
      : "<p>이번 학습에서 틀린 단어가 없어요. 👍</p>"}
    ${wrongAnswers.length>=4?`<button class="btn danger" onclick="startWrongFromInterrupted()">이번 중단 세션 오답 다시 풀기</button>`:""}
  </div>

  <button class="btn secondary" onclick="renderHome();quiz=null">홈으로</button>
  <button class="btn" onclick="resumeInterruptedQuiz()">이어서 풀기</button>`;
}

function resumeInterruptedQuiz(){
  if(!quiz)return renderHome();
  const overlay=document.querySelector(".resultOverlay");
  if(overlay)overlay.remove();

  // '그만하기'는 아직 답을 선택하지 않은 현재 문제에서 중단한 것이므로
  // 이어서 풀기에서는 같은 문제부터 다시 시작한다.
  // 반면 정답/오답 팝업에서 '단어 상세 보기 → 퀴즈로 돌아가기'는
  // 이미 답을 선택한 문제이므로 기존 continueQuizAfterDetail()이
  // index를 증가시켜 다음 문제로 이동한다.

  if(quiz.index>=quiz.pool.length)return showResult();
  if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;}
  quiz.locked=false;
  quiz.current=null;
  quiz.remaining=getQuizTimerSeconds();

  // 중단 결과는 최종 종료가 아니므로 같은 세션을 계속 사용한다.
  if(quiz.session){
    quiz.session.status="active";
    quiz.session.resumedAt=new Date().toISOString();
    quiz.session.updatedAt=quiz.session.resumedAt;
    const existing=sessions.findIndex(s=>s.id===quiz.session.id);
    if(existing>=0)sessions[existing]=quiz.session;
    else sessions.unshift(quiz.session);
    save();
  }
  quiz.sessionRecorded=false;
  showQuestion();
}

function startWrongFromInterrupted(){
  const badIds=new Set(quiz.answers.filter(a=>!a.ok).map(a=>a.w.id));
  const pool=words.filter(w=>badIds.has(w.id));
  if(pool.length<4)return toast("오답 퀴즈에는 최소 4개의 단어가 필요해요.");
  const parentSessionId=quiz.session?.id||null;
  quiz={
    pool:shuffle(pool),
    index:0,
    correct:0,
    answers:[],
    locked:false,
    timer:null,
    session:startSession("interrupted_wrong",pool.length,pool.length,null,{parentSessionId}),
    sessionRecorded:false
  };
  showQuestion();
}

function showResult(){
  recordSession("completed");
  let t=quiz.answers.length,s=t?Math.round(quiz.correct/t*100):0;
  document.getElementById("app").innerHTML=`<div class="resultHero"><div>정답률</div><div class="pct">${s}%</div><div>${quiz.correct} / ${t}</div></div>
  <div class="card"><h2>결과</h2>${quiz.answers.map(a=>`<div class="wordrow"><b class="${a.ok?'right':'wrong'}" style="cursor:pointer" onclick="openDetail(${a.w.id})">${esc(a.w.word)}</b><br><small>${a.ok?"⭕ 정답":"❌ 오답"}${a.timeout?" · ⏰ 시간 초과":""} · 정답: ${renderMeaning(a.w.meaning,true)}${a.ok?"":" · 선택: "+renderMeaning(a.selected,true)}</small></div>`).join("")}
  ${quiz.answers.some(a=>!a.ok)?`<button class="btn danger" onclick="startSessionWrongQuiz()">이번 세션 오답 다시 풀기 (${quiz.answers.filter(a=>!a.ok).length})</button>`:""}
  <button class="btn secondary" onclick="renderHome()">홈으로</button></div>`
}
function startSessionWrongQuiz(){
  if(!quiz)return renderHome();
  const ids=[...new Set(quiz.answers.filter(a=>!a.ok).map(a=>a.w.id))];
  const pool=ids.map(id=>words.find(w=>w.id===id)).filter(Boolean);
  if(pool.length<1)return toast("이번 세션에 오답이 없어요.");
  // 결과 화면에서 시작하므로 기존 세션은 이미 완료된 상태.
  // 오답 재풀이 자체는 독립된 새 학습 세션으로 기록한다.
  selectedMode="wrong_session";
  quiz={
    pool:shuffle(pool),
    index:0,
    correct:0,
    answers:[],
    locked:false,
    timer:null,
    session:startSession("wrong_session",pool.length,pool.length,null,{parentSessionId:quiz.session?.id||null}),
    sessionRecorded:false
  };
  showQuestion();
}

function renderWrong(){
  let bad=words.filter(w=>wrong[w.id]);document.getElementById("app").innerHTML=`<div class="card"><h2>틀린 단어</h2><p>${bad.length}개</p>
  ${bad.length?bad.map(w=>`<div class="wordrow"><b class="wrong" style="cursor:pointer" onclick="openDetail(${w.id})">${esc(w.word)}</b><br><small>${esc(w.meaning)}</small><br>
  <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 발음 듣기</button></div>`).join(""):"<p>현재 틀린 단어가 없어요.</p>"}
  ${bad.length>=4?`<button class="btn danger" onclick="openQuizSetup('wrong')">틀린 단어 다시 풀기</button>`:""}</div>`
}
function renderChunks(){
  const items=[];
  words.forEach(w=>{
    const st=getStudy(w.id);
    (st.chunks||[]).forEach((chunk,i)=>items.push({word:w,chunk,index:i}));
  });
  document.getElementById("app").innerHTML=`<div class="card">
    <h2>Chunk</h2>
    <p><small>단어장에서 자동 생성하지 않고, 공부하면서 직접 추가한 Chunk만 모아둔 공간이에요.</small></p>
    ${items.length
      ? items.map(x=>`<div class="wordrow">
          <b style="cursor:pointer" onclick="openDetail(${x.word.id})">${esc(x.word.word)}</b>
          <div style="margin-top:6px">${esc(x.chunk)}</div>
          <button class="miniBtn" onclick="openDetail(${x.word.id})">단어 상세</button>
          <button class="miniBtn" onclick="removeChunkFromFolder(${x.word.id},${x.index})">삭제</button>
        </div>`).join("")
      : `<p>아직 추가한 Chunk가 없어요.</p>
         <small>단어 상세 화면에서 공부에 필요한 Chunk를 직접 추가해보세요.</small>`}
  </div>`;
}
function removeChunkFromFolder(id,index){
  getStudy(id).chunks.splice(index,1);
  save();
  renderChunks();
}

function renderRecords(){
  const entries=words.filter(w=>getStats(w.id).total>0).sort((a,b)=>getStats(b.id).total-getStats(a.id).total);
  const k=todayKey(),d=daily[k]||{quiz:0,correct:0,wrong:0,timeout:0},pct=d.quiz?Math.round(d.correct/d.quiz*100):0;
  const recent=sessions.slice(0,30);
  document.getElementById("app").innerHTML=`<div class="card"><h2>오늘의 학습 기록</h2><div class="grid">
  <div class="stat"><div class="num">${d.quiz}</div><div class="label">오늘 학습량</div></div><div class="stat"><div class="num">${d.correct}</div><div class="label">정답</div></div>
  <div class="stat"><div class="num">${d.wrong}</div><div class="label">오답</div></div><div class="stat"><div class="num">${pct}%</div><div class="label">정답률</div></div></div></div>
  <div class="card"><h2>학습 세션</h2>
  ${recent.length?recent.map(s=>{
    const dt=new Date(s.endedAt||s.startedAt).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const label=s.mode==="wrong_session"?"이번 세션 오답":s.mode==="interrupted_wrong"?"중단 세션 오답":s.mode==="wrong"?"누적 오답":s.mode==="day"?`DAY ${s.day||""}`:"전체 랜덤";
    const status=s.status==="completed"?"완료":s.status==="active"?"진행 중":"중단";
    return `<div class="wordrow"><b>${dt} · ${label}</b><br><small>${status} · ${s.attempted||0}/${s.requestedCount||s.poolLength}문제 · 정답 ${s.correct||0} · 오답 ${s.wrong||0} · 정답률 ${s.accuracy||0}%</small></div>`;
  }).join(""):"<p><small>아직 학습 세션이 없습니다.</small></p>"}</div>
  <div class="card"><h3>단어별 기록</h3>${entries.length?entries.map(w=>{let s=getStats(w.id);let p=s.total?Math.round(s.correct/s.total*100):0;return `<div class="wordrow"><b style="cursor:pointer" onclick="openDetail(${w.id})">${esc(w.word)}</b><br><small>출제 ${s.total} · 정답 ${s.correct} · 오답 ${s.wrong} · 시간초과 ${s.timeout} · 정답률 ${p}%</small></div>`}).join(""):"<p><small>아직 학습 기록이 없습니다.</small></p>"}</div>`
}

function renderStats(){
  const k=todayKey();
  const today=daily[k]||{quiz:0,correct:0,wrong:0,timeout:0};
  const all=sessions.reduce((a,s)=>({
    quiz:a.quiz+(s.attempted||0),
    correct:a.correct+(s.correct||0),
    wrong:a.wrong+(s.wrong||0),
    timeout:a.timeout+(s.timeout||0)
  }),{quiz:0,correct:0,wrong:0,timeout:0});
  const todayPct=today.quiz?Math.round(today.correct/today.quiz*100):0;
  document.getElementById("app").innerHTML=`<div class="card"><h2>통계</h2>
    <div class="grid">
      <div class="stat"><div class="num">${all.quiz}</div><div class="label">전체 학습량</div></div>
      <div class="stat"><div class="num">${today.quiz}</div><div class="label">오늘 학습량</div></div>
      <div class="stat"><div class="num">${todayPct}%</div><div class="label">오늘 정답률</div></div>
      
    </div>
  </div>
  <div class="card"><h3>학습 현황</h3>
    <p><b>전체</b> ${all.quiz}문제 · 정답 ${all.correct} · 오답 ${all.wrong}</p>
    <p><b>오늘</b> ${today.quiz}문제 · 정답 ${today.correct} · 오답 ${today.wrong}</p>
  </div>`;
}

function setTimer(s,btn=null){
  localStorage.setItem("pe10_timer",String(s));
  document.querySelectorAll(".timerChoice").forEach(b=>b.classList.remove("selected"));
  if(btn)btn.classList.add("selected");
  toast(`제한시간 ${s}초로 설정했어요.`);
}
function renderSettings(){
  const qt=getQuizTimerSeconds();
  const pt=Number(localStorage.getItem("pe10_popup_timer")||5);
  const timerOptions=[3,5,7,10];
  const popupOptions=[2,3,5,7,10];

  document.getElementById("app").innerHTML=`<div class="card"><h2>설정</h2>
  <h3>퀴즈 제한시간</h3><div class="grid">
  ${timerOptions.map(s=>`<button class="btn secondary timerChoice ${qt===s?"selected":""}" onclick="setTimer(${s},this)">${s}초</button>`).join("")}
  </div>
  <p><small>문제 하나를 풀 수 있는 제한시간 · 현재 <b>${qt}초</b></small></p>

  <h3>정답·오답 팝업 시간</h3><div class="grid">
  ${popupOptions.map(s=>`<button class="btn secondary popupTimerChoice ${pt===s?"selected":""}" onclick="setPopupTimer(${s},this)">${s}초</button>`).join("")}
  </div>
  <p><small>팝업 등장 즉시 발음이 재생되고, 설정한 시간이 지나면 다음 문제로 이동합니다 · 현재 <b>${pt}초</b></small></p>

  <button class="btn secondary" onclick="speakWord('spectator')">🔊 발음 테스트</button>
  <button class="btn danger" onclick="if(confirm('학습 기록과 My Study 데이터를 모두 초기화할까요?')){stats={};wrong={};daily={};study={};sessions=[];save();toast('학습 기록을 초기화했어요.')}">학습 기록 초기화</button>
  </div>`
}
function setPopupTimer(s,btn=null){
  localStorage.setItem("pe10_popup_timer",String(s));
  document.querySelectorAll(".popupTimerChoice").forEach(b=>b.classList.remove("selected"));
  if(btn)btn.classList.add("selected");
  toast(`팝업 시간을 ${s}초로 설정했어요.`);
}

document.getElementById("navHome").onclick=()=>{setActive("navHome");renderHome()};
document.getElementById("navQuiz").onclick=()=>{setActive("navQuiz");openQuizSetup("all")};
document.getElementById("navWrong").onclick=()=>{setActive("navWrong");renderWrong()};
document.getElementById("navChunks").onclick=()=>{setActive("navChunks");renderChunks()};
document.getElementById("navRecords").onclick=()=>{setActive("navRecords");renderRecords()};
document.getElementById("navStats").onclick=()=>{setActive("navStats");renderStats()};
document.getElementById("navSettings").onclick=()=>{setActive("navSettings");renderSettings()};
function setActive(id){document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));document.getElementById(id).classList.add("active")}
renderHome();
</script></body></html>
