ot override their efforts.","translation":"그들의 노력을 무시해서는 안 된다.","sourcePage":135,"pdfPage":131},{"id":619,"source":"MAIN","day":"13","word":"overcome","entryType":"","meaning":"동 ① 극복하다 ② (적을) 이기다","example":"The two parties managed to overcome their differences on the issue.","translation":"그 두 정당은 그 사안에 대한 그들의 의견 차이를 극복하는 데 성공했다.","sourcePage":135,"pdfPage":131},{"id":620,"source":"MAIN","day":"13","word":"overwork","entryType":"","meaning":"동 과로하다 / 명 과로","example":"Overworking can lead to burnout.","translation":"과로는 번아웃을 초래할 수 있다.","sourcePage":136,"pdfPage":132},{"id":621,"source":"MAIN","day":"13","word":"overweight","entryType":"","meaning":"형 ① 과체중의, 비만의 ② 중량 초과의","example":"One out of every two Americans is overweight.","translation":"미국인 두 명 중 한 명이 과체중이다.","sourcePage":136,"pdfPage":132},{"id":622,"source":"MAIN","day":"13","word":"unique","entryType":"","meaning":"형 ① 유일무이한 ② 독특한","example":"Every snowflake has a unique design.","translation":"모든 눈송이는 독특한 디자인을 가지고 있다.","sourcePage":136,"pdfPage":132},{"id":623,"source":"MAIN","day":"13","word":"union","entryType":"","meaning":"명 ① 결합, 단결 ② (노동)조합, 협회","example":"This has affected the public's overall opinion toward the European Union.","translation":"이것은 유럽 연합에 대한 대중의 전반적인 여론에 영향을 미쳤다.","sourcePage":136,"pdfPage":132},{"id":624,"source":"MAIN","day":"13","word":"unite","entryType":"","meaning":"동 결합하다, 통합하다","example":"Sports can unite people of all backgrounds.","translation":"스포츠는 모든 배경을 가진 사람들을 통합할 수 있다.","sourcePage":136,"pdfPage":132},{"id":625,"source":"MAIN","day":"13","word":"unify","entryType":"","meaning":"동 통일하다, 통합하다","example":"Qin Shi Huang conquered all opposing states and unified China in 221 BC.","translation":"진시황은 기원전 221년에 모든 적대적인 국가들을 정복하고 중국을 통일하였다.","sourcePage":137,"pdfPage":133},{"id":626,"source":"MAIN","day":"13","word":"universal","entryType":"","meaning":"형 ① 전 세계적인 ② 보편적인","example":"Universal healthcare is a goal for many nations.","translation":"보편적 의료 서비스는 많은 국가의 목표이다.","sourcePage":137,"pdfPage":133},{"id":627,"source":"MAIN","day":"13","word":"unanimous","entryType":"","meaning":"형 만장일치의","example":"The jury reached a unanimous verdict.","translation":"배심원단은 만장일치로 평결을 내렸다.","sourcePage":137,"pdfPage":133},{"id":628,"source":"MAIN","day":"13","word":"bilingual","entryType":"","meaning":"형 2개 국어를 구사할 수 있는 / 명 2개 국어 구사자","example":"She is bilingual in English and Korean.","translation":"그녀는 영어와 한국어 두 개 언어를 한다.","sourcePage":137,"pdfPage":133},{"id":629,"source":"MAIN","day":"13","word":"biannual","entryType":"","meaning":"형 연 2회의","example":"You need to have a routine biannual examination.","translation":"당신은 일 년에 두 번 정기 검진을 받아야 한다.","sourcePage":137,"pdfPage":133},{"id":630,"source":"MAIN","day":"13","word":"billion","entryType":"","meaning":"명 10억","example":"Each day nearly a billion gallons of crude oil are refined.","translation":"매일 거의 10억 갤런의 원유가 정제된다.","sourcePage":138,"pdfPage":134},{"id":631,"source":"MAIN","day":"13","word":"dual","entryType":"","meaning":"형 두 부분으로 된, 이중의","example":"The celebrity has dual nationality.","translation":"그 연예인은 이중 국적자이다.","sourcePage":138,"pdfPage":134},{"id":632,"source":"MAIN","day":"13","word":"dubious","entryType":"","meaning":"형 의심하는, 수상쩍은","example":"I have dubious feelings about this plan.","translation":"나는 이 계획에 대해 의구심이 든다.","sourcePage":138,"pdfPage":134},{"id":633,"source":"MAIN","day":"13","word":"tribe","entryType":"","meaning":"명 부족, 종족","example":"Boomerangs were mostly used in competitions between native tribes.","translation":"부메랑은 주로 원주민 부족들 사이의 대결에 사용되었다.","sourcePage":138,"pdfPage":134},{"id":634,"source":"MAIN","day":"13","word":"trivial","entryType":"","meaning":"형 사소한, 하찮은","example":"Don't waste time on trivial matters.","translation":"사소한 일로 시간을 낭비하지 마라.","sourcePage":138,"pdfPage":134},{"id":635,"source":"MAIN","day":"13","word":"quarter","entryType":"","meaning":"명 1/4, 15분, 25센트","example":"Nearly a quarter of Australians aged 30 to 59 are married.","translation":"30~59세의 오스트레일리아인 사람 중 거의 4분의 1 정도가 결혼했다.","sourcePage":138,"pdfPage":134},{"id":636,"source":"MAIN","day":"13","word":"square","entryType":"","meaning":"명 ① 정사각형 ② 광장 / 형 똑바른, 정면으로","example":"Some builders left a huge square of plate glass standing upright in a plaza.","translation":"어떤 건설업자들이 광장에 큰 정사각형의 판유리를 똑바로 세워 놓았다.","sourcePage":139,"pdfPage":135},{"id":637,"source":"MAIN","day":"13","word":"simplify","entryType":"","meaning":"동 단순화하다","example":"We need to simplify regulations for small businesses.","translation":"우리는 중소기업을 위한 규제를 간소화해야 한다.","sourcePage":139,"pdfPage":135},{"id":638,"source":"MAIN","day":"13","word":"purify","entryType":"","meaning":"동 깨끗이 하다, 정화하다","example":"To purify water, you can boil it or use a filter.","translation":"물을 정화하려면 물을 끓이거나 필터를 사용할 수 있다.","sourcePage":139,"pdfPage":135},{"id":639,"source":"MAIN","day":"13","word":"clarify","entryType":"","meaning":"동 ① 명확하게 하다 ② 맑게 하다","example":"Can you clarify the instructions, please?","translation":"지침을 명확히 설명해 주시겠어요?","sourcePage":139,"pdfPage":135},{"id":640,"source":"MAIN","day":"13","word":"terrify","entryType":"","meaning":"동 겁나게 하다, 두렵게 하다","example":"The spider terrified her, so she screamed.","translation":"거미가 그녀를 겁나게 해서 그녀는 소리를 질렀다.","sourcePage":139,"pdfPage":135},{"id":641,"source":"MAIN","day":"13","word":"classify","entryType":"","meaning":"동 분류하다","example":"The professor asked me to classify books by subjects.","translation":"교수님은 나에게 책을 주제별로 분류해 달라고 요청하셨다.","sourcePage":140,"pdfPage":136},{"id":642,"source":"MAIN","day":"13","word":"civilize","entryType":"","meaning":"동 문명화하다, 교화하다","example":"They tried to civilize the natives of Africa.","translation":"그들은 아프리카의 원주민들을 개화시키려고 노력했다.","sourcePage":140,"pdfPage":136},{"id":643,"source":"MAIN","day":"13","word":"stabilize","entryType":"","meaning":"동 안정되다, 안정시키다","example":"After the storm, the weather conditions stabilized.","translation":"폭풍이 지나간 후 기상 조건이 안정되었다.","sourcePage":140,"pdfPage":136},{"id":644,"source":"MAIN","day":"13","word":"theorize","entryType":"","meaning":"동 이론화하다, 이론[학설]을 세우다","example":"Scientists theorize the existence of life on other planets.","translation":"과학자들은 다른 행성에 생명체가 존재한다고 이론화한다.","sourcePage":140,"pdfPage":136},{"id":645,"source":"MAIN","day":"13","word":"publish","entryType":"","meaning":"동 ① 출판[발행]하다 ② 발표[공표]하다","example":"He began publishing poems and essays.","translation":"그는 시와 수필을 발표하기 시작했다.","sourcePage":140,"pdfPage":136},{"id":646,"source":"MAIN","day":"13","word":"distinguish","entryType":"","meaning":"동 구별하다, 식별하다","example":"Can you distinguish between fact and fiction in this story?","translation":"이 이야기에서 사실과 허구를 구별할 수 있나요?","sourcePage":141,"pdfPage":137},{"id":647,"source":"MAIN","day":"13","word":"differentiate","entryType":"","meaning":"동 구별하다, 구분 짓다","example":"News reporters have to differentiate facts from opinions.","translation":"기자들은 사실과 의견을 구별해야 한다.","sourcePage":141,"pdfPage":137},{"id":648,"source":"MAIN","day":"13","word":"originate","entryType":"","meaning":"동 시작되다, 비롯하다","example":"Humankind originated in Africa.","translation":"인류는 아프리카에서 시작되었다.","sourcePage":141,"pdfPage":137},{"id":649,"source":"MAIN","day":"13","word":"activate","entryType":"","meaning":"동 작동시키다, 활성화시키다","example":"The employee activated the security system before leaving the building.","translation":"그 직원은 건물을 떠나기 전에 보안 시스템을 작동시켰다.","sourcePage":141,"pdfPage":137},{"id":650,"source":"MAIN","day":"13","word":"strengthen","entryType":"","meaning":"동 강하게 하다, 강화시키다","example":"Strengthen your argument with evidence.","translation":"증거를 통해 당신의 주장을 강화하라.","sourcePage":141,"pdfPage":137},{"id":651,"source":"MAIN","day":"14","word":"favorable","entryType":"","meaning":"형 호의적인, 유리한","example":"Only 10 percent expressed a favorable view.","translation":"10%만이 호의적인 견해를 표현했다.","sourcePage":142,"pdfPage":138},{"id":652,"source":"MAIN","day":"14","word":"comparable","entryType":"","meaning":"형 비슷한, 비교할 만한, 필적하는","example":"These two laptops are comparable in price.","translation":"이 두 노트북은 가격이 비슷하다.","sourcePage":142,"pdfPage":138},{"id":653,"source":"MAIN","day":"14","word":"penniless","entryType":"","meaning":"형 무일푼의, 가난한","example":"They struggled to survive, penniless and homeless.","translation":"그들은 무일푼에 집도 없이 살아남기 위해 애썼다.","sourcePage":143,"pdfPage":139},{"id":654,"source":"MAIN","day":"14","word":"restless","entryType":"","meaning":"형 ① 불안한, 들뜬 ② 잠을 이루지 못한","example":"The crowd grew restless as the wait continued.","translation":"기다리는 시간이 계속되자 군중은 점점 불안해졌다.","sourcePage":143,"pdfPage":139},{"id":655,"source":"MAIN","day":"14","word":"thoughtful","entryType":"","meaning":"형 사려 깊은","example":"The thoughtful children wrote thank-you letters to firefighters.","translation":"사려 깊은 아이들은 소방관들에게 감사 편지를 썼다.","sourcePage":143,"pdfPage":139},{"id":656,"source":"MAIN","day":"14","word":"plentiful","entryType":"","meaning":"형 많은, 풍부한","example":"My sister has a plentiful source of inspiration.","translation":"내 여동생은 풍부한 영감의 원천을 가지고 있다.","sourcePage":143,"pdfPage":139},{"id":657,"source":"MAIN","day":"14","word":"eventful","entryType":"","meaning":"형 다사다난한, 파란만장한","example":"Her stories reflected her own eventful past.","translation":"그녀의 이야기들은 그녀 자신의 다사다난한 과거를 반영했다.","sourcePage":143,"pdfPage":139},{"id":658,"source":"MAIN","day":"14","word":"vigorous","entryType":"","meaning":"형 ① 활력이 있는 ② 열렬한","example":"A vigorous person does things with great energy.","translation":"활력이 있는 사람은 큰 에너지를 가지고 일을 한다.","sourcePage":143,"pdfPage":139},{"id":659,"source":"MAIN","day":"14","word":"marvelous","entryType":"","meaning":"형 훌륭한, 놀라운","example":"The world is wide and has a lot of marvelous people in it.","translation":"세상은 넓고 그 안에는 훌륭한 사람들이 많이 있다.","sourcePage":144,"pdfPage":140},{"id":660,"source":"MAIN","day":"14","word":"righteous","entryType":"","meaning":"형 정의로운, 공정한","example":"He is a man of righteous character.","translation":"그는 의로운 성품을 가진 사람이다.","sourcePage":144,"pdfPage":140},{"id":661,"source":"MAIN","day":"14","word":"spacious","entryType":"","meaning":"형 넓은, 널찍한","example":"Spacious parking is available at the venue.","translation":"그 장소에는 넓은 주차 공간이 마련되어 있다.","sourcePage":144,"pdfPage":140},{"id":662,"source":"MAIN","day":"14","word":"adventurous","entryType":"","meaning":"형 모험을 즐기는, 대담한, 모험적인","example":"I'm not adventurous enough to travel alone.","translation":"나는 혼자 여행할 만큼 모험적이지 않다.","sourcePage":144,"pdfPage":140},{"id":663,"source":"MAIN","day":"14","word":"aromatic","entryType":"","meaning":"형 향기로운","example":"The smell of aromatic candles from a gift shop was heavy in the air.","translation":"선물 가게의 향기로운 양초 냄새가 공기 중에 진하게 퍼져 있었다.","sourcePage":144,"pdfPage":140},{"id":664,"source":"MAIN","day":"14","word":"mechanical","entryType":"","meaning":"형 기계적인, 기계의, 기계학적인","example":"It leads to defects in mechanical properties.","translation":"그것은 기계적 특성의 결함으로 이어진다.","sourcePage":144,"pdfPage":140},{"id":665,"source":"MAIN","day":"14","word":"costly","entryType":"","meaning":"형 값비싼, 비용이 많이 드는","example":"Building a spaceship is a very costly endeavor.","translation":"우주선을 만드는 것은 매우 비용이 많이 드는 일이다.","sourcePage":145,"pdfPage":141},{"id":666,"source":"MAIN","day":"14","word":"deadly","entryType":"","meaning":"형 치명적인, 극도의, 심한","example":"Wear a helmet — head injuries can be deadly.","translation":"헬멧을 써라. 머리 부상은 치명적일 수 있다.","sourcePage":145,"pdfPage":141},{"id":667,"source":"MAIN","day":"14","word":"abundant","entryType":"","meaning":"형 풍부한","example":"A kiwi contains abundant nutrition.","translation":"키위에는 풍부한 영양소가 들어 있다.","sourcePage":145,"pdfPage":141},{"id":668,"source":"MAIN","day":"14","word":"prudent","entryType":"","meaning":"형 신중한, 사려 깊은","example":"We must choose the prudent course.","translation":"우리는 신중한 방법을 선택해야 한다.","sourcePage":145,"pdfPage":141},{"id":669,"source":"MAIN","day":"14","word":"personal","entryType":"","meaning":"형 ① 개인의, 사적인 ② 개인에 관한","example":"The artist relies heavily on her personal experiences.","translation":"그 예술가는 자신의 개인적인 경험에 크게 의존한다.","sourcePage":145,"pdfPage":141},{"id":670,"source":"MAIN","day":"14","word":"optional","entryType":"","meaning":"형 선택적인, 임의의","example":"The Games consist of 10 optional sports.","translation":"그 경기는 10개의 선택 종목으로 구성된다.","sourcePage":146,"pdfPage":142},{"id":671,"source":"MAIN","day":"14","word":"habitual","entryType":"","meaning":"형 습관적인, 상습적인","example":"We need to break this habitual cycle of procrastination.","translation":"우리는 이 습관적인 미루기의 순환을 끊어야 한다.","sourcePage":146,"pdfPage":142},{"id":672,"source":"MAIN","day":"14","word":"massive","entryType":"","meaning":"형 막대한, 큰, 거대한","example":"A scientist discovered a massive new galaxy.","translation":"한 과학자가 거대한 새로운 은하를 발견했다.","sourcePage":146,"pdfPage":142},{"id":673,"source":"MAIN","day":"14","word":"customary","entryType":"","meaning":"형 관례적인, 습관적인 / 명 관습적인","example":"Is tipping waiters customary in your country?","translation":"당신 나라에서는 웨이터에게 팁을 주는 것이 관례인가요?","sourcePage":146,"pdfPage":142},{"id":674,"source":"MAIN","day":"14","word":"momentary","entryType":"","meaning":"형 순간적인, 잠깐의","example":"After a momentary hesitation, she determined to leave.","translation":"잠깐 망설인 후, 그녀는 떠나기로 결심했다.","sourcePage":146,"pdfPage":142},{"id":675,"source":"MAIN","day":"14","word":"statutory","entryType":"","meaning":"형 법령의, 법정의","example":"Statutory deductions are allowed for those expenses.","translation":"그러한 비용에 대해서는 법정 공제가 허용된다.","sourcePage":146,"pdfPage":142},{"id":676,"source":"MAIN","day":"14","word":"fortunate","entryType":"","meaning":"형 운이 좋은, 다행한","example":"The lost hiker was fortunate to be found alive.","translation":"길을 잃은 등산객은 살아서 발견되어 다행이었다.","sourcePage":147,"pdfPage":143},{"id":677,"source":"MAIN","day":"14","word":"passionate","entryType":"","meaning":"형 열정적인, 열렬한","example":"She is a passionate defender of civil liberties.","translation":"그녀는 시민의 자유를 열정적으로 옹호하는 사람이다.","sourcePage":147,"pdfPage":143},{"id":678,"source":"MAIN","day":"14","word":"childish","entryType":"","meaning":"형 유치한","example":"Is this behavior too childish for someone your age?","translation":"이런 행동은 당신 나이에 비해 너무 유치한가요?","sourcePage":147,"pdfPage":143},{"id":679,"source":"MAIN","day":"14","word":"mannish","entryType":"","meaning":"형 남자 같은, 남성적인","example":"Her sister was wearing a hat and mannish clothing.","translation":"그녀의 언니는 모자와 남성적인 옷을 입고 있었다.","sourcePage":147,"pdfPage":143},{"id":680,"source":"MAIN","day":"14","word":"sensation","entryType":"","meaning":"명 ① 감각, 느낌 ② 센세이션, 선풍 / 명 feeling, sense","example":"He felt an unpleasant sensation at the moment.","translation":"그는 그 순간 불쾌한 느낌을 느꼈다.","sourcePage":147,"pdfPage":143},{"id":681,"source":"MAIN","day":"14","word":"combustion","entryType":"","meaning":"명 연소","example":"The combustion of fossil fuels has many impacts on environments.","translation":"화석 연료의 연소는 환경에 많은 영향을 미친다.","sourcePage":148,"pdfPage":144},{"id":682,"source":"MAIN","day":"14","word":"cruelty","entryType":"","meaning":"명 잔인함, 잔혹성","example":"The cruelty of his words cut me like a knife.","translation":"그의 말의 잔인함은 칼처럼 나를 아프게 했다.","sourcePage":148,"pdfPage":144},{"id":683,"source":"MAIN","day":"14","word":"stupidity","entryType":"","meaning":"명 어리석음, 어리석은 짓","example":"I was shocked by the stupidity of their decision.","translation":"나는 그들의 결정의 어리석음에 충격을 받았다.","sourcePage":148,"pdfPage":144},{"id":684,"source":"MAIN","day":"14","word":"frequency","entryType":"","meaning":"명 ① 빈도, 횟수 ② 빈번함 ③ 주파수","example":"The frequency of natural disasters seems to be increasing.","translation":"자연재해의 빈도가 증가하고 있는 것처럼 보인다.","sourcePage":148,"pdfPage":144},{"id":685,"source":"MAIN","day":"14","word":"nuisance","entryType":"","meaning":"명 성가신 사람, 골칫거리","example":"He was a nuisance to his football team.","translation":"그는 자신의 축구팀에 골칫거리였다.","sourcePage":148,"pdfPage":144},{"id":686,"source":"MAIN","day":"14","word":"altitude","entryType":"","meaning":"명 고도, 해발","example":"The helicopter was flying at high altitude.","translation":"그 헬리콥터는 높은 고도에서 비행하고 있었다.","sourcePage":149,"pdfPage":145},{"id":687,"source":"MAIN","day":"14","word":"solitude","entryType":"","meaning":"명 고독, 외로움","example":"The artist found inspiration in the peaceful solitude.","translation":"그 예술가는 평화로운 고독 속에서 영감을 얻었다.","sourcePage":149,"pdfPage":145},{"id":688,"source":"MAIN","day":"14","word":"shortage","entryType":"","meaning":"명 부족, 결핍","example":"There is a shortage of food in the flooded areas.","translation":"홍수 지역에는 식량 부족이 있다.","sourcePage":149,"pdfPage":145},{"id":689,"source":"MAIN","day":"14","word":"leakage","entryType":"","meaning":"명 누출","example":"Check the bottles for leakage before use, please.","translation":"사용하기 전에 병에 누출이 있는지 확인하세요.","sourcePage":149,"pdfPage":145},{"id":690,"source":"MAIN","day":"14","word":"withdrawal","entryType":"","meaning":"명 철회, 취소, 후퇴","example":"The sudden withdrawal of support caused the project's delay.","translation":"갑작스러운 지원 철회가 프로젝트의 지연을 초래했다.","sourcePage":149,"pdfPage":145},{"id":691,"source":"MAIN","day":"14","word":"citizenship","entryType":"","meaning":"명 시민권","example":"He gained his citizenship after living here for ten years.","translation":"그는 이곳에서 10년 동안 거주한 후 시민권을 얻었다.","sourcePage":150,"pdfPage":146},{"id":692,"source":"MAIN","day":"14","word":"hardship","entryType":"","meaning":"명 어려움, 고난, 곤란","example":"The policy made many citizens suffer hardship.","translation":"그 정책은 많은 시민들이 어려움을 겪게 했다.","sourcePage":150,"pdfPage":146},{"id":693,"source":"MAIN","day":"14","word":"adulthood","entryType":"","meaning":"명 성인기","example":"Upon reaching adulthood, she finally felt independent.","translation":"성인이 되자 그녀는 마침내 독립했다고 느꼈다.","sourcePage":150,"pdfPage":146},{"id":694,"source":"MAIN","day":"14","word":"livelihood","entryType":"","meaning":"명 생계의 수단, 생업","example":"Their principal livelihood was in the sea.","translation":"그들의 주요 생계 수단은 바다에 있었다.","sourcePage":150,"pdfPage":146},{"id":695,"source":"MAIN","day":"14","word":"racism","entryType":"","meaning":"명 인종 차별(주의)","example":"Building a society free of racism is an ongoing challenge.","translation":"인종 차별이 없는 사회를 만드는 것은 계속되는 과제이다.","sourcePage":150,"pdfPage":146},{"id":696,"source":"MAIN","day":"14","word":"optimism","entryType":"","meaning":"명 낙관주의, 낙관론","example":"Her optimism is contagious; it lifts everyone's spirits.","translation":"그녀의 낙관주의는 전염성이 있어 모두의 기운을 북돋운다.","sourcePage":151,"pdfPage":147},{"id":697,"source":"MAIN","day":"14","word":"pessimism","entryType":"","meaning":"명 비관주의, 비관론","example":"There is pessimism about job prospects.","translation":"취업 전망에 대한 비관론이 있다.","sourcePage":151,"pdfPage":147},{"id":698,"source":"MAIN","day":"14","word":"robber","entryType":"","meaning":"명 도둑, 강도","example":"Witnesses described the robber as wearing a mask.","translation":"목격자들은 그 강도가 마스크를 쓰고 있었다고 설명했다.","sourcePage":151,"pdfPage":147},{"id":699,"source":"MAIN","day":"14","word":"carrier","entryType":"","meaning":"명 ① 운송 회사, 항공사 ② 보균자, (병원균) 매개체","example":"The mosquito is a carrier of yellow fever.","translation":"모기는 황열병의 매개체이다.","sourcePage":151,"pdfPage":147},{"id":700,"source":"MAIN","day":"14","word":"politician","entryType":"","meaning":"명 정치가","example":"Is she a qualified candidate to become a politician?","translation":"그녀는 정치가가 될 자격을 갖춘 후보인가요?","sourcePage":151,"pdfPage":147},{"id":701,"source":"MAIN","day":"15","word":"highlight","entryType":"","meaning":"동 강조하다 / 명 하이라이트, 가장 좋은[두드러지는] 부분","example":"This museum exhibit highlights historical artifacts.","translation":"이 박물관 전시는 역사적인 유물들을 강조한다.","sourcePage":154,"pdfPage":2},{"id":702,"source":"MAIN","day":"15","word":"emphasize","entryType":"","meaning":"동 강조하다","example":"Parents emphasize that children should be independent.","translation":"부모들은 아이들이 독립적이어야 한다고 강조한다.","sourcePage":154,"pdfPage":2},{"id":703,"source":"MAIN","day":"15","word":"underscore","entryType":"","meaning":"동 강조하다, 밑줄을 긋다","example":"Underscore the key words.","translation":"핵심 단어에 밑줄을 그어라.","sourcePage":155,"pdfPage":3},{"id":704,"source":"MAIN","day":"15","word":"accentuate","entryType":"","meaning":"동 강조하다, 두드러지게 하다","example":"I’ll accentuate the positive in my speech.","translation":"나는 연설에서 긍정적인 면을 강조하겠다.","sourcePage":155,"pdfPage":3},{"id":705,"source":"MAIN","day":"15","word":"accidental","entryType":"","meaning":"형 우연한, 돌발적인 / 부수적인","example":"She expects an accidental meeting with him.","translation":"그녀는 그와의 우연한 만남을 기대한다.","sourcePage":155,"pdfPage":3},{"id":706,"source":"MAIN","day":"15","word":"account","entryType":"","meaning":"명 ① 이야기 ② 설명 ③ 계좌 ④ (회계) 장부 / 동 ① 설명하다 (for) ② 비율을 차지하다 (for)","example":"They went to the bank to open a new bank account.","translation":"그들은 새로운 은행 계좌를 개설하러 은행에 갔다.","sourcePage":155,"pdfPage":3},{"id":707,"source":"MAIN","day":"15","word":"allot","entryType":"","meaning":"동 할당[배당]하다","example":"The teacher allotted homework to each student.","translation":"그 교사는 각 학생에게 숙제를 할당했다.","sourcePage":155,"pdfPage":3},{"id":708,"source":"MAIN","day":"15","word":"allocate","entryType":"","meaning":"동 할당하다, 배분하다","example":"The resources were allocated to the project.","translation":"자원이 그 프로젝트에 할당되었다.","sourcePage":156,"pdfPage":4},{"id":709,"source":"MAIN","day":"15","word":"assign","entryType":"","meaning":"동 할당하다 / 임명하다, 선임하다","example":"Which one of these seats is she assigned to?","translation":"이 좌석들 중 어느 좌석으로 배정받았나요?","sourcePage":156,"pdfPage":4},{"id":710,"source":"MAIN","day":"15","word":"resign","entryType":"","meaning":"동 사임하다, 사직하다 / 포기하다, 체념하다","example":"There was heavy pressure to resign.","translation":"사임하기에는 심한 압박이 있었다.","sourcePage":156,"pdfPage":4},{"id":711,"source":"MAIN","day":"15","word":"designate","entryType":"","meaning":"동 지정하다, 지명하다, 임명하다","example":"This room was designated as a smoking area.","translation":"이 방은 흡연 구역으로 지정됐다.","sourcePage":156,"pdfPage":4},{"id":712,"source":"MAIN","day":"15","word":"nominate","entryType":"","meaning":"동 후보자로 지명[추천]하다 / 임명하다","example":"He was nominated as best actor.","translation":"그는 최우수 남자 배우상 후보로 지명되었다.","sourcePage":156,"pdfPage":4},{"id":713,"source":"MAIN","day":"15","word":"inaugurate","entryType":"","meaning":"동 취임시키다, 개시하다","example":"The senator was inaugurated as President.","translation":"그 상원의원은 대통령에 취임했다.","sourcePage":157,"pdfPage":5},{"id":714,"source":"MAIN","day":"15","word":"select","entryType":"","meaning":"동 선택하다","example":"She selected the biggest pearl.","translation":"그녀는 가장 큰 진주를 선택했다.","sourcePage":157,"pdfPage":5},{"id":715,"source":"MAIN","day":"15","word":"recommend","entryType":"","meaning":"동 추천하다, 권하다","example":"Can you recommend a good hotel in Seoul?","translation":"서울에서 좋은 호텔을 추천해 주시겠어요?","sourcePage":157,"pdfPage":5},{"id":716,"source":"MAIN","day":"15","word":"suggest","entryType":"","meaning":"동 제안하다 / 암시하다","example":"The evidence suggests that he stole the money.","translation":"그 증거는 그가 그 돈을 훔쳤음을 암시한다.","sourcePage":157,"pdfPage":5},{"id":717,"source":"MAIN","day":"15","word":"connote","entryType":"","meaning":"동 내포하다, 암시하다","example":"What he says connotes multiple meanings.","translation":"그의 말은 복합적인 의미를 내포하고 있다.","sourcePage":157,"pdfPage":5},{"id":718,"source":"MAIN","day":"15","word":"recognize","entryType":"","meaning":"동 알아보다, 인지하다 / 인정하다","example":"I recognized the voice of my mom.","translation":"나는 엄마의 목소리를 알아들었다.","sourcePage":158,"pdfPage":6},{"id":719,"source":"MAIN","day":"15","word":"cognition","entryType":"","meaning":"명 인식, 인지","example":"Social cognition skills are critical for learning.","translation":"사회적 인지 능력은 학습에 중요하다.","sourcePage":158,"pdfPage":6},{"id":720,"source":"MAIN","day":"15","word":"acquaint","entryType":"","meaning":"동 알리다, 전하다","example":"Please acquaint me with the details of the case.","translation":"그 사건의 자세한 내용을 나에게 알려 주세요.","sourcePage":158,"pdfPage":6},{"id":721,"source":"MAIN","day":"15","word":"bulletin","entryType":"","meaning":"명 게시, 고시","example":"He put something on the bulletin board.","translation":"그는 게시판에 무언가를 게시했다.","sourcePage":158,"pdfPage":6},{"id":722,"source":"MAIN","day":"15","word":"note","entryType":"","meaning":"동 적어 두다, 주목하다, 언급하다 / 명 메모, 음표","example":"I made a note to call her back later.","translation":"나는 그녀에게 나중에 다시 전화하겠다고 메모를 남겼다.","sourcePage":158,"pdfPage":6},{"id":723,"source":"MAIN","day":"15","word":"notify","entryType":"","meaning":"동 알리다, 통지하다","example":"Please notify the family of the cancellation.","translation":"그 가족에게 취소 사실을 알려 주세요.","sourcePage":159,"pdfPage":7},{"id":724,"source":"MAIN","day":"15","word":"notice","entryType":"","meaning":"명 주의, 주목 / 통지, 통보 / 안내문 / 동 알아차리다, 주목하다, 통지하다","example":"We didn’t notice the time passing while we were playing.","translation":"우리는 노는 동안 시간 가는 줄 몰랐다.","sourcePage":159,"pdfPage":7},{"id":725,"source":"MAIN","day":"15","word":"distribute","entryType":"","meaning":"동 분배하다, 나누어 주다","example":"The organization distributed food to the earthquake victims.","translation":"그 단체는 지진 피해자들에게 먹을 것을 나누어 주었다.","sourcePage":159,"pdfPage":7},{"id":726,"source":"MAIN","day":"15","word":"dispense","entryType":"","meaning":"동 나누어 주다, 제공하다 / 조제하다","example":"They dispensed necessities to the poor.","translation":"그들은 가난한 사람들에게 생필품을 나누어 주었다.","sourcePage":159,"pdfPage":7},{"id":727,"source":"MAIN","day":"15","word":"dose","entryType":"","meaning":"명 복용량, 투여량","example":"The dose is three pills with every meal.","translation":"복용량은 매끼 세 알씩이다.","sourcePage":159,"pdfPage":7},{"id":728,"source":"MAIN","day":"15","word":"portion","entryType":"","meaning":"명 ① 부분 ② 몫 / 동 분배하다","example":"She sliced the cake into several portions.","translation":"그녀는 케이크를 여러 조각으로 잘랐다.","sourcePage":160,"pdfPage":8},{"id":729,"source":"MAIN","day":"15","word":"proportion","entryType":"","meaning":"명 비율, 부분","example":"The proportion of regular smokers increases sharply with age.","translation":"정기적인 흡연자들의 비율은 나이가 들수록 급격하게 증가한다.","sourcePage":160,"pdfPage":8},{"id":730,"source":"MAIN","day":"15","word":"symmetry","entryType":"","meaning":"명 (좌우의) 대칭, 균형","example":"Balance and symmetry are important in art.","translation":"예술에서는 균형과 대칭이 중요하다.","sourcePage":160,"pdfPage":8},{"id":731,"source":"MAIN","day":"15","word":"equilibrium","entryType":"","meaning":"명 평형, 균형 / (마음의) 평정","example":"Yoga restores one’s inner equilibrium.","translation":"요가는 사람의 내적 균형을 회복시켜 준다.","sourcePage":160,"pdfPage":8},{"id":732,"source":"MAIN","day":"15","word":"possess","entryType":"","meaning":"동 소유하다, 가지다","example":"You are not allowed to possess a pistol in this country.","translation":"이 나라에서는 총기를 소유하는 것이 허용되지 않는다.","sourcePage":160,"pdfPage":8},{"id":733,"source":"MAIN","day":"15","word":"asset","entryType":"","meaning":"명 자산, 재산","example":"The house and furniture are my assets.","translation":"그 집과 가구는 나의 자산이다.","sourcePage":160,"pdfPage":8},{"id":734,"source":"MAIN","day":"15","word":"property","entryType":"","meaning":"명 ① 재산, 소유물 ② 특성, 속성","example":"Cultural property is not always in fashion but remains important.","translation":"문화재는 항상 유행하는 것은 아니지만 변함없이 중요하다.","sourcePage":161,"pdfPage":9},{"id":735,"source":"MAIN","day":"15","word":"mortgage","entryType":"","meaning":"명 저당, (담보) 대출 / 동 저당 잡히다","example":"I’m having difficulty keeping up my mortgage payments.","translation":"나는 주택 담보 대출금을 계속 갚는 데 어려움을 겪고 있다.","sourcePage":161,"pdfPage":9},{"id":736,"source":"MAIN","day":"15","word":"acquire","entryType":"","meaning":"동 얻다, 획득하다, 습득하다","example":"She has acquired a good knowledge of English.","translation":"그녀는 훌륭한 영어 지식을 습득했다.","sourcePage":161,"pdfPage":9},{"id":737,"source":"MAIN","day":"15","word":"inquire","entryType":"","meaning":"동 묻다, 질문하다 / 조사하다","example":"He inquired about train schedules for Liverpool.","translation":"그는 리버풀행 열차 시간표에 대해서 물었다.","sourcePage":161,"pdfPage":9},{"id":738,"source":"MAIN","day":"15","word":"question","entryType":"","meaning":"명 질문, 문제 / 동 질문하다, 의심하다, 이의를 제기하다","example":"Don’t be afraid to question authority.","translation":"권위에 의문을 제기하는 것을 두려워하지 마라.","sourcePage":161,"pdfPage":9},{"id":739,"source":"MAIN","day":"15","word":"issue","entryType":"","meaning":"동 ① 발행[발표]하다 ② 공표[발표]하다 / 명 ① 주제, 쟁점 ② 문제 ③ (정기 간행물의) 호","example":"We need to address the climate issue.","translation":"우리는 기후 문제를 해결해야 한다.","sourcePage":161,"pdfPage":9},{"id":740,"source":"MAIN","day":"15","word":"anonymous","entryType":"","meaning":"형 익명의, 작자 불명의","example":"We received an anonymous letter.","translation":"우리는 익명의 편지를 받았다.","sourcePage":162,"pdfPage":10},{"id":741,"source":"MAIN","day":"15","word":"nominal","entryType":"","meaning":"형 명목상의, 이름뿐인","example":"He is the nominal leader of the party.","translation":"그는 그 정당의 명목상 대표이다.","sourcePage":162,"pdfPage":10},{"id":742,"source":"MAIN","day":"15","word":"ambiguous","entryType":"","meaning":"형 애매한, 모호한","example":"This particular part of the law is a little ambiguous.","translation":"이 법의 특정한 부분은 약간 모호하다.","sourcePage":162,"pdfPage":10},{"id":743,"source":"MAIN","day":"15","word":"ambivalent","entryType":"","meaning":"형 양면적인, 상반되는 감정을 가진","example":"She is ambivalent about getting married.","translation":"그녀는 결혼에 대해 상반되는 감정을 가졌다.","sourcePage":162,"pdfPage":10},{"id":744,"source":"MAIN","day":"15","word":"obscure","entryType":"","meaning":"형 불명확한, 모호한 / 잘 알려지지 않은 / 동 모호하게 하다","example":"The origin of the word remains obscure.","translation":"그 단어의 기원은 여전히 분명하지 않다.","sourcePage":162,"pdfPage":10},{"id":745,"source":"MAIN","day":"15","word":"specific","entryType":"","meaning":"형 구체적인, 분명한 / 특정한","example":"I asked the interviewees specific questions.","translation":"나는 면접자들에게 구체적인 질문을 했다.","sourcePage":162,"pdfPage":10},{"id":746,"source":"MAIN","day":"15","word":"concrete","entryType":"","meaning":"형 ① 구체적인 ② 콘크리트로 된 / 명 콘크리트","example":"The police had no concrete evidence.","translation":"경찰은 구체적인 증거를 가지고 있지 않았다.","sourcePage":163,"pdfPage":11},{"id":747,"source":"MAIN","day":"15","word":"particular","entryType":"","meaning":"형 특정한, 특별한 / 개별적인","example":"This particular model is one of our biggest sellers.","translation":"이 특정 모델은 가장 많이 팔리는 우리 제품들 중 하나이다.","sourcePage":163,"pdfPage":11},{"id":748,"source":"MAIN","day":"15","word":"sole","entryType":"","meaning":"형 유일한, 단 하나의 / 혼자의, 독신의","example":"Her sole object in life is to become a travel writer.","translation":"그녀의 유일한 삶의 목표는 여행 작가가 되는 것이다.","sourcePage":163,"pdfPage":11},{"id":749,"source":"MAIN","day":"15","word":"solitary","entryType":"","meaning":"형 혼자의, 혼자 하는 / 고독한, 외로운","example":"They kept him in solitary confinement.","translation":"그들은 그를 독방에 감금시켰다.","sourcePage":163,"pdfPage":11},{"id":750,"source":"MAIN","day":"15","word":"desolate","entryType":"","meaning":"형 적막한, 황량한 / 고독한, 쓸쓸한","example":"I discovered a house in a desolate desert.","translation":"나는 황량한 사막에서 한 채의 집을 발견했다.","sourcePage":163,"pdfPage":11},{"id":751,"source":"MAIN","day":"16","word":"ample","entryType":"","meaning":"형 충분한, 풍부한","example":"The town experienced ample rainfall this spring, replenishing the water reserves.","translation":"그 마을은 올봄에 비가 많이 내려 수자원이 풍부해졌다.","sourcePage":164,"pdfPage":12},{"id":752,"source":"MAIN","day":"16","word":"copious","entryType":"","meaning":"형 많은, 풍부한","example":"She supported her opinion with copious evidence.","translation":"그녀는 방대한 증거로 자기 의견을 뒷받침했다.","sourcePage":164,"pdfPage":12},{"id":753,"source":"MAIN","day":"16","word":"adequate","entryType":"","meaning":"형 충분한, 적당한","example":"The room was a bit small but adequate.","translation":"방은 조금 작았지만 충분했다.","sourcePage":164,"pdfPage":12},{"id":754,"source":"MAIN","day":"16","word":"luxuriant","entryType":"","meaning":"형 풍부한, 무성한","example":"She has a luxuriant imagination.","translation":"그녀는 풍부한 상상력을 가지고 있다.","sourcePage":165,"pdfPage":13},{"id":755,"source":"MAIN","day":"16","word":"abound","entryType":"","meaning":"동 풍부하다, 충분하다, 많이 있다","example":"Fish abound in the streams and rivers.","translation":"시냇물과 강에는 물고기가 풍부하다.","sourcePage":165,"pdfPage":13},{"id":756,"source":"MAIN","day":"16","word":"redundant","entryType":"","meaning":"형 ① 과잉의, 불필요한 ② 장황한","example":"Further explanation is redundant.","translation":"추가적인 설명은 불필요하다.","sourcePage":165,"pdfPage":13},{"id":757,"source":"MAIN","day":"16","word":"afford","entryType":"","meaning":"동 ~할 여유가 있다, ~할 형편이 되다","example":"I cannot afford to take a long vacation.","translation":"나는 긴 휴가를 갈 여유가 없다.","sourcePage":165,"pdfPage":13},{"id":758,"source":"MAIN","day":"16","word":"bulky","entryType":"","meaning":"형 부피가 큰, 거대한","example":"This luggage is bulky in size but light in weight.","translation":"이 짐은 부피는 크지만 무게는 가볍다.","sourcePage":165,"pdfPage":13},{"id":759,"source":"MAIN","day":"16","word":"gigantic","entryType":"","meaning":"형 거대한","example":"The statue of the latest president was gigantic.","translation":"그 신임 대통령의 동상은 거대했다.","sourcePage":165,"pdfPage":13},{"id":760,"source":"MAIN","day":"16","word":"enormous","entryType":"","meaning":"형 엄청난, 거대한, 막대한","example":"The children showed enormous interest in Lego.","translation":"그 아이들은 레고에 엄청난 관심을 보였다.","sourcePage":166,"pdfPage":14},{"id":761,"source":"MAIN","day":"16","word":"immense","entryType":"","meaning":"형 엄청난, 거대한, 막대한","example":"The benefits are immense.","translation":"그 혜택은 어마어마하다.","sourcePage":166,"pdfPage":14},{"id":762,"source":"MAIN","day":"16","word":"tremendous","entryType":"","meaning":"형 ① 엄청난, 거대한 ② 무시무시한","example":"He became a tremendous reader.","translation":"그는 엄청난 독서광이 되었다.","sourcePage":166,"pdfPage":14},{"id":763,"source":"MAIN","day":"16","word":"mighty","entryType":"","meaning":"형 강력한, 힘센","example":"They are mighty soldiers.","translation":"그들은 강력한 군인들이다.","sourcePage":166,"pdfPage":14},{"id":764,"source":"MAIN","day":"16","word":"warlike","entryType":"","meaning":"형 ① 전쟁의 ② 호전적인, 도전적인","example":"Even though the Egyptians were warlike, they found time for peaceful games.","translation":"이집트인들은 호전적이기는 했지만, 평화로운 게임을 위한 시간을 가지기도 했다.","sourcePage":166,"pdfPage":14},{"id":765,"source":"MAIN","day":"16","word":"warfare","entryType":"","meaning":"명 전쟁, 전투","example":"He wrote of the horrors of modern warfare.","translation":"그는 현대 전쟁의 끔찍함에 대해 글을 썼다.","sourcePage":166,"pdfPage":14},{"id":766,"source":"MAIN","day":"16","word":"armor","entryType":"","meaning":"명 갑옷 / 동 무장하다","example":"You need body armor to succeed in that business.","translation":"그 업계에서 성공하려면 갑옷이라도 필요하다.","sourcePage":167,"pdfPage":15},{"id":767,"source":"MAIN","day":"16","word":"tactic","entryType":"","meaning":"명 ① 전략, 방법 ② 전술 [pl.]","example":"You need a good tactic to win the game.","translation":"그 게임에서 이기려면 좋은 전략이 필요하다.","sourcePage":167,"pdfPage":15},{"id":768,"source":"MAIN","day":"16","word":"creep","entryType":"","meaning":"동 살금살금 움직이다, 기어가다","example":"The worm crept along the table.","translation":"지렁이가 탁자 위를 기어갔다.","sourcePage":167,"pdfPage":15},{"id":769,"source":"MAIN","day":"16","word":"crawl","entryType":"","meaning":"동 기어가다, 포복하다 / 명 ① 기어감, 포복 ② 서행","example":"She crawled across the floor.","translation":"그녀는 바닥을 기어갔다.","sourcePage":167,"pdfPage":15},{"id":770,"source":"MAIN","day":"16","word":"paw","entryType":"","meaning":"명 (동물)의 발","example":"The dog licked his paw.","translation":"개가 자기 발을 핥았다.","sourcePage":167,"pdfPage":15},{"id":771,"source":"MAIN","day":"16","word":"mammal","entryType":"","meaning":"명 포유동물","example":"Mammals are animals such as humans, dogs, lions, and whales.","translation":"포유동물은 인간, 개, 사자, 그리고 고래와 같은 동물들이다.","sourcePage":167,"pdfPage":15},{"id":772,"source":"MAIN","day":"16","word":"bark","entryType":"","meaning":"동 (개가) 짖다 / 명 나무껍질","example":"The loud noise made the dog bark.","translation":"시끄러운 소리에 개가 짖었다.","sourcePage":167,"pdfPage":15},{"id":773,"source":"MAIN","day":"16","word":"roar","entryType":"","meaning":"동 ① 고함치다 ② (동물이) 으르렁거리다 / 명 ① 고함, 아우성 ② 포효","example":"The lion came out of the cage roaring.","translation":"사자가 으르렁거리면서 우리에서 나왔다.","sourcePage":168,"pdfPage":16},{"id":774,"source":"MAIN","day":"16","word":"scar","entryType":"","meaning":"명 흉터, 자국 / 동 ~에 상처를 남기다","example":"He was scarred for life during a pub fight.","translation":"그는 술집에서 싸우다가 평생 남을 상처를 입었다.","sourcePage":168,"pdfPage":16},{"id":775,"source":"MAIN","day":"16","word":"inflict","entryType":"","meaning":"동 ① (상처를) 입히다 ② (형벌·고통을) 가하다, 주다","example":"The cat inflicted injury on her owner.","translation":"그 고양이는 주인에게 상처를 입혔다.","sourcePage":168,"pdfPage":16},{"id":776,"source":"MAIN","day":"16","word":"haunt","entryType":"","meaning":"동 ① (유령이) 나오다, 출몰하다 ② (불쾌한 생각·기억이) 떠오르다","example":"This house has been haunted by ghosts for many years.","translation":"이 집은 여러 해 동안 귀신이 출몰해 왔다.","sourcePage":168,"pdfPage":16},{"id":777,"source":"MAIN","day":"16","word":"fright","entryType":"","meaning":"명 공포, 경악","example":"He had a fright when he saw the ghost.","translation":"그는 유령을 봤을 때 공포에 사로잡혔다.","sourcePage":168,"pdfPage":16},{"id":778,"source":"MAIN","day":"16","word":"dread","entryType":"","meaning":"명 공포, 불안 / 동 두려워하다, 무서워하다","example":"I dread the thought of coming home late at night.","translation":"나는 밤늦게 집에 오는 것을 생각하면 무섭다.","sourcePage":168,"pdfPage":16},{"id":779,"source":"MAIN","day":"16","word":"nervous","entryType":"","meaning":"형 ① 불안해하는, 초조한 ② 신경의","example":"He was very nervous and couldn’t sit still in the chair.","translation":"그는 너무 초조해서 의자에 가만히 앉아 있을 수 없었다.","sourcePage":168,"pdfPage":16},{"id":780,"source":"MAIN","day":"16","word":"anxious","entryType":"","meaning":"형 ① 걱정하는 ② 열망하는, 갈망하는","example":"We were anxious for his safety.","translation":"우리는 그가 안전한지 걱정했다.","sourcePage":169,"pdfPage":17},{"id":781,"source":"MAIN","day":"16","word":"predator","entryType":"","meaning":"명 ① 약탈자 ② 포식동물, 육식동물","example":"Many predators hunt in the night time.","translation":"많은 포식동물이 밤에 사냥한다.","sourcePage":169,"pdfPage":17},{"id":782,"source":"MAIN","day":"16","word":"fierce","entryType":"","meaning":"형 ① 사나운 ② 맹렬한","example":"Fierce fighting continued without intermission.","translation":"맹렬한 싸움이 끊임없이 지속되었다.","sourcePage":169,"pdfPage":17},{"id":783,"source":"MAIN","day":"16","word":"furious","entryType":"","meaning":"형 ① 격노한 ② 맹렬한","example":"He risked a glance at her furious face.","translation":"그는 그녀의 격노한 얼굴을 힐끗 한 번 보았다.","sourcePage":169,"pdfPage":17},{"id":784,"source":"MAIN","day":"16","word":"rage","entryType":"","meaning":"동 분노하다, 몹시 화내다 / 명 분노, 격분","example":"He trembled with rage.","translation":"그는 분노로 몸을 떨었다.","sourcePage":169,"pdfPage":17},{"id":785,"source":"MAIN","day":"16","word":"ruthless","entryType":"","meaning":"형 무자비한, 가차 없는","example":"The country is ruled by a ruthless dictator.","translation":"그 나라는 무자비한 독재자의 통치를 받는다.","sourcePage":169,"pdfPage":17},{"id":786,"source":"MAIN","day":"16","word":"steep","entryType":"","meaning":"형 가파른","example":"The stairs are high and steep.","translation":"계단이 높고 가파르다.","sourcePage":169,"pdfPage":17},{"id":787,"source":"MAIN","day":"16","word":"severe","entryType":"","meaning":"형 ① 극심한, 심각한 ② 엄격한","example":"Don’t be so severe with the children.","translation":"아이들에게 그렇게 엄격하게 굴지 마라.","sourcePage":170,"pdfPage":18},{"id":788,"source":"MAIN","day":"16","word":"intense","entryType":"","meaning":"형 ① 강렬한, 극심한 ② 열정적인, 진지한","example":"He’s very intense about everything.","translation":"그는 매사에 아주 열정적이다.","sourcePage":170,"pdfPage":18},{"id":789,"source":"MAIN","day":"16","word":"drastic","entryType":"","meaning":"형 과감한, 격렬한, 급격한","example":"He resorted to a drastic measure.","translation":"그는 과감한 조치를 취했다.","sourcePage":170,"pdfPage":18},{"id":790,"source":"MAIN","day":"16","word":"radical","entryType":"","meaning":"형 ① 근본적인, 기본적인 ② 급진적인, 과격한 / 명 급진주의자","example":"It requires a radical change in the educational system.","translation":"그것은 교육 제도의 근본적인 변화가 필요하다.","sourcePage":170,"pdfPage":18},{"id":791,"source":"MAIN","day":"16","word":"fundamental","entryType":"","meaning":"형 ① 근본적인, 기본적인 ② 핵심적인, 필수적인","example":"Nonviolence was the fundamental tenet of Gandhi’s philosophy.","translation":"비폭력은 간디 철학의 기본 교리였다.","sourcePage":170,"pdfPage":18},{"id":792,"source":"MAIN","day":"16","word":"ultimate","entryType":"","meaning":"형 최후의, 궁극적인, 절대적인","example":"Do you want to know the ultimate question?","translation":"궁극적 질문에 대해 알고 싶으세요?","sourcePage":170,"pdfPage":18},{"id":793,"source":"MAIN","day":"16","word":"terminal","entryType":"","meaning":"형 말기의, 불치의 / 명 종착역, 종점","example":"He has terminal lung cancer.","translation":"그는 폐암 말기이다.","sourcePage":170,"pdfPage":18},{"id":794,"source":"MAIN","day":"16","word":"terminate","entryType":"","meaning":"동 끝내다, 종료하다","example":"The agreement between us was terminated.","translation":"우리 사이의 합의는 폐기되었다.","sourcePage":171,"pdfPage":19},{"id":795,"source":"MAIN","day":"16","word":"exterminate","entryType":"","meaning":"동 몰살시키다, 전멸시키다","example":"He used pesticides to exterminate insects.","translation":"그는 곤충을 박멸하는 데 살충제를 썼다.","sourcePage":171,"pdfPage":19},{"id":796,"source":"MAIN","day":"16","word":"annihilate","entryType":"","meaning":"동 ① 전멸시키다 ② 완파하다","example":"We annihilated the enemy soldiers.","translation":"우리는 적군 병사들을 전멸시켰다.","sourcePage":171,"pdfPage":19},{"id":797,"source":"MAIN","day":"16","word":"eliminate","entryType":"","meaning":"동 없애다, 제거하다","example":"This diet claims to eliminate toxins from the body.","translation":"이 다이어트법은 체내의 독소를 제거해 준다고 주장한다.","sourcePage":171,"pdfPage":19},{"id":798,"source":"MAIN","day":"16","word":"abolish","entryType":"","meaning":"동 폐지하다, 없애다","example":"Slavery was abolished after the Civil War.","translation":"노예제도는 남북전쟁 이후 폐지되었다.","sourcePage":171,"pdfPage":19},{"id":799,"source":"MAIN","day":"16","word":"uproot","entryType":"","meaning":"동 뿌리째 뽑다, 근절하다","example":"He tried to uproot the evils of the Administration.","translation":"그는 행정부의 악폐를 근절시키려고 노력했다.","sourcePage":171,"pdfPage":19},{"id":800,"source":"MAIN","day":"16","word":"collapse","entryType":"","meaning":"동 붕괴하다, 무너지다 / 명 붕괴, 실패","example":"The roof collapsed under the weight of snow.","translation":"지붕이 눈의 무게를 못 이기고 무너졌다.","sourcePage":171,"pdfPage":19},{"id":801,"source":"MAIN","day":"17","word":"withdraw","entryType":"","meaning":"동 물러나다, 철수하다 / (돈을) 인출하다 / 철회하다, 취소하다","example":"They urged him to withdraw his complaint.","translation":"그들은 그에게 고소를 철회하도록 설득했다.","sourcePage":172,"pdfPage":20},{"id":802,"source":"MAIN","day":"17","word":"withhold","entryType":"","meaning":"동 주지 않다 / 억누르다, 억제하다 / 보류하다","example":"He withheld his consent to the plan.","translation":"그는 그 계획에 대한 동의를 보류했다.","sourcePage":172,"pdfPage":20},{"id":803,"source":"MAIN","day":"17","word":"withstand","entryType":"","meaning":"동 저항하다, 견디다","example":"All buildings can withstand earthquakes.","translation":"모든 건물들은 지진을 견딜 수 있다.","sourcePage":172,"pdfPage":20},{"id":804,"source":"MAIN","day":"17","word":"upright","entryType":"","meaning":"형 똑바로 선, 직립의 / 명 수직, 직립","example":"Raise your body into an upright position.","translation":"몸을 똑바로 세우세요.","sourcePage":173,"pdfPage":21},{"id":805,"source":"MAIN","day":"17","word":"erect","entryType":"","meaning":"형 똑바로 선 / 동 세우다, 건립하다","example":"The child stood erect, trying to listen carefully.","translation":"그 아이는 똑바로 서서 주의 깊게 들으려고 했다.","sourcePage":173,"pdfPage":21},{"id":806,"source":"MAIN","day":"17","word":"frame","entryType":"","meaning":"동 ① 틀에 넣다, 짜다, 만들다 ② 누명을 씌우다 / 명 ① 틀, 액자 ② 뼈대 ③ 구조","example":"The window frame is cracked and needs repair.","translation":"창틀에 금이 가서 수리가 필요하다.","sourcePage":173,"pdfPage":21},{"id":807,"source":"MAIN","day":"17","word":"infuse","entryType":"","meaning":"동 주입하다, 불어넣다","example":"He infused fresh courage into his army.","translation":"그는 그의 군대에 새로운 용기를 불어넣었다.","sourcePage":173,"pdfPage":21},{"id":808,"source":"MAIN","day":"17","word":"implant","entryType":"","meaning":"동 심다, 뿌리내리다","example":"Prejudices can be implanted in the mind easily.","translation":"편견은 마음속에 쉽게 심어질 수 있다.","sourcePage":173,"pdfPage":21},{"id":809,"source":"MAIN","day":"17","word":"transplant","entryType":"","meaning":"동 이식하다, 옮겨 심다 / 명 이식","example":"She underwent a heart transplant operation.","translation":"그녀는 심장 이식 수술을 받았다.","sourcePage":173,"pdfPage":21},{"id":810,"source":"MAIN","day":"17","word":"detect","entryType":"","meaning":"동 발견하다, 감지하다","example":"The tests are designed to detect the disease early.","translation":"그 검사들은 그 질병을 초기에 발견하기 위해 고안되었다.","sourcePage":173,"pdfPage":21},{"id":811,"source":"MAIN","day":"17","word":"diagnose","entryType":"","meaning":"동 진단하다","example":"She was diagnosed with cancer.","translation":"그녀는 암 진단을 받았다.","sourcePage":174,"pdfPage":22},{"id":812,"source":"MAIN","day":"17","word":"ascertain","entryType":"","meaning":"동 확인하다, 확실히 하다","example":"We were unable to ascertain the truth.","translation":"우리는 사실을 확인할 수 없었다.","sourcePage":174,"pdfPage":22},{"id":813,"source":"MAIN","day":"17","word":"identify","entryType":"","meaning":"동 ① (신원을) 확인하다, 식별하다 ② 동일시하다 (with)","example":"Witnesses were asked to identify the man who robbed the theater.","translation":"목격자들은 극장을 턴 남자의 신원을 확인해 달라는 요청을 받았다.","sourcePage":174,"pdfPage":22},{"id":814,"source":"MAIN","day":"17","word":"identical","entryType":"","meaning":"형 동일한, 똑같은","example":"His essay is almost identical to mine.","translation":"그의 에세이는 내 것과 거의 똑같다.","sourcePage":174,"pdfPage":22},{"id":815,"source":"MAIN","day":"17","word":"concur","entryType":"","meaning":"동 동시에 일어나다 / 동의하다 (with)","example":"I concur with his opinion.","translation":"나는 그의 의견에 동의한다.","sourcePage":174,"pdfPage":22},{"id":816,"source":"MAIN","day":"17","word":"coincident","entryType":"","meaning":"형 동시에 발생하는 / 일치하는 (with)","example":"Their goals are coincident with ours.","translation":"그들의 목표는 우리의 목표와 일치한다.","sourcePage":174,"pdfPage":22},{"id":817,"source":"MAIN","day":"17","word":"consonant","entryType":"","meaning":"형 ~와 일치하는, 조화를 이루는 (with)","example":"His actions are consonant with his principles.","translation":"그의 행동은 그의 원칙과 일치한다.","sourcePage":175,"pdfPage":23},{"id":818,"source":"MAIN","day":"17","word":"compatible","entryType":"","meaning":"형 양립하는, 화합할 수 있는","example":"This project isn't compatible with the company’s plans.","translation":"이 프로젝트는 회사의 계획과 양립하지 않는다.","sourcePage":175,"pdfPage":23},{"id":819,"source":"MAIN","day":"17","word":"comparative","entryType":"","meaning":"형 비교의, 상대적인","example":"I'm taking a course in comparative literature.","translation":"나는 비교 문학 강좌를 듣고 있다.","sourcePage":175,"pdfPage":23},{"id":820,"source":"MAIN","day":"17","word":"considerable","entryType":"","meaning":"형 상당한, 중요한","example":"That family owns a considerable amount of land.","translation":"그 가족은 상당한 양의 토지를 소유하고 있다.","sourcePage":175,"pdfPage":23},{"id":821,"source":"MAIN","day":"17","word":"substantial","entryType":"","meaning":"형 (양이) 상당한 / 본질적인, 중요한 / 실재의","example":"He found substantial happiness in work.","translation":"그는 일에서 상당한 행복을 얻었다.","sourcePage":175,"pdfPage":23},{"id":822,"source":"MAIN","day":"17","word":"cardinal","entryType":"","meaning":"형 가장 중요한, 기본적인 / 명 기수","example":"It is a matter of cardinal importance.","translation":"그것은 가장 중요한 문제이다.","sourcePage":175,"pdfPage":23},{"id":823,"source":"MAIN","day":"17","word":"chief","entryType":"","meaning":"형 주요한, 중요한 / 명 (조직·단체의) 우두머리, 장","example":"Fathers work very hard as the chief of their family.","translation":"아버지들은 가정의 가장으로서 매우 열심히 일한다.","sourcePage":176,"pdfPage":24},{"id":824,"source":"MAIN","day":"17","word":"earnest","entryType":"","meaning":"형 성실한, 열심인 / 진지한","example":"There is no doubt that he is an earnest believer.","translation":"그가 성실한 신자라는 데에는 의심의 여지가 없다.","sourcePage":176,"pdfPage":24},{"id":825,"source":"MAIN","day":"17","word":"industrious","entryType":"","meaning":"형 근면한, 부지런한","example":"He is an industrious office worker.","translation":"그는 근면한 회사원이다.","sourcePage":176,"pdfPage":24},{"id":826,"source":"MAIN","day":"17","word":"diligent","entryType":"","meaning":"형 근면한, 성실한","example":"He is diligent in his studies.","translation":"그는 학업에 성실하다.","sourcePage":176,"pdfPage":24},{"id":827,"source":"MAIN","day":"17","word":"laborious","entryType":"","meaning":"형 힘든, 고된 / 근면한, 부지런한","example":"Checking all the information will be laborious.","translation":"정보를 모두 확인하는 일은 힘들 것이다.","sourcePage":176,"pdfPage":24},{"id":828,"source":"MAIN","day":"17","word":"sincere","entryType":"","meaning":"형 진실된, 진정한","example":"He lived a sincere life.","translation":"그는 진실된 삶을 살았다.","sourcePage":176,"pdfPage":24},{"id":829,"source":"MAIN","day":"17","word":"straightforward","entryType":"","meaning":"형 ① 똑바른, 정직한 ② 간단한, 쉬운 / 부 똑바로, 정직하게","example":"It’s a pretty straightforward procedure.","translation":"그건 아주 간단한 절차이다.","sourcePage":176,"pdfPage":24},{"id":830,"source":"MAIN","day":"17","word":"candid","entryType":"","meaning":"형 솔직한, 노골적인","example":"We had candid talks about the current crisis.","translation":"우리는 현재의 위기에 관해 솔직한 대화를 나누었다.","sourcePage":177,"pdfPage":25},{"id":831,"source":"MAIN","day":"17","word":"authentic","entryType":"","meaning":"형 진짜의, 진품인 / 믿을 만한","example":"The restaurant offers authentic Greek food.","translation":"그 식당은 진짜 그리스 요리를 제공한다.","sourcePage":177,"pdfPage":25},{"id":832,"source":"MAIN","day":"17","word":"actual","entryType":"","meaning":"형 실제의, 사실상의","example":"The actual cost was higher than we expected.","translation":"실제 비용은 우리가 예상했던 것보다 높았다.","sourcePage":177,"pdfPage":25},{"id":833,"source":"MAIN","day":"17","word":"sophisticated","entryType":"","meaning":"형 세련된, 교양 있는 / 정교한, 복잡한","example":"Medical techniques are becoming more and more sophisticated.","translation":"의학 기술은 점점 더 정교해지고 있다.","sourcePage":177,"pdfPage":25},{"id":834,"source":"MAIN","day":"17","word":"exquisite","entryType":"","meaning":"형 매우 훌륭한, 정교한, 우아한","example":"I admired the exquisite artwork.","translation":"나는 그 정교한 예술품에 감탄했다.","sourcePage":177,"pdfPage":25},{"id":835,"source":"MAIN","day":"17","word":"elaborate","entryType":"","meaning":"형 공들인, 정교한 / 동 정교하게 만들다 / 자세히 설명하다, 상세하다","example":"She prepared a very elaborate meal.","translation":"그녀는 대단히 공들인 식사를 준비했다.","sourcePage":177,"pdfPage":25},{"id":836,"source":"MAIN","day":"17","word":"elegant","entryType":"","meaning":"형 우아한, 품위 있는","example":"I like the restaurant's elegant decoration.","translation":"나는 그 레스토랑의 우아한 장식을 좋아한다.","sourcePage":178,"pdfPage":26},{"id":837,"source":"MAIN","day":"17","word":"thorough","entryType":"","meaning":"형 철저한, 빈틈없는","example":"His knowledge is extensive and thorough.","translation":"그의 지식은 광범위하고 철저하다.","sourcePage":178,"pdfPage":26},{"id":838,"source":"MAIN","day":"17","word":"merit","entryType":"","meaning":"명 장점","example":"The plan has both merits and demerits.","translation":"그 계획은 장점도 있고 단점도 있다.","sourcePage":178,"pdfPage":26},{"id":839,"source":"MAIN","day":"17","word":"flaw","entryType":"","meaning":"명 결점, 흠","example":"Pride was the greatest flaw in his personality.","translation":"자만심은 그의 성격에서 가장 큰 결점이었다.","sourcePage":178,"pdfPage":26},{"id":840,"source":"MAIN","day":"17","word":"faulty","entryType":"","meaning":"형 결함이 있는, 불완전한","example":"Ask for a refund if the goods are faulty.","translation":"상품에 결함이 있으면 환불을 요청하세요.","sourcePage":178,"pdfPage":26},{"id":841,"source":"MAIN","day":"17","word":"blemish","entryType":"","meaning":"명 티, 흠 / 동 흠집을 내다, 더럽히다","example":"His reputation is without a blemish.","translation":"그의 명성은 흠잡을 데 없다.","sourcePage":178,"pdfPage":26},{"id":842,"source":"MAIN","day":"17","word":"shortcoming","entryType":"","meaning":"명 결점, 단점","example":"His shortcoming is his lack of concentration.","translation":"그의 결점은 집중력의 부족이다.","sourcePage":178,"pdfPage":26},{"id":843,"source":"MAIN","day":"17","word":"rare","entryType":"","meaning":"형 드문, 진귀한","example":"Good singers can be found anywhere, but great singers are rare.","translation":"좋은 가수는 어디에서나 찾을 수 있지만, 위대한 가수는 드물다.","sourcePage":178,"pdfPage":26},{"id":844,"source":"MAIN","day":"17","word":"sparse","entryType":"","meaning":"형 드문, 희박한, 드문드문 나 있는","example":"The information on the subject is sparse.","translation":"그 주제에 대한 정보는 매우 적다.","sourcePage":179,"pdfPage":27},{"id":845,"source":"MAIN","day":"17","word":"scarce","entryType":"","meaning":"형 부족한, 드문","example":"The human resources in the region are scarce.","translation":"그 지역의 인적 자원은 부족하다.","sourcePage":179,"pdfPage":27},{"id":846,"source":"MAIN","day":"17","word":"scanty","entryType":"","meaning":"형 부족한, 빈약한","example":"She is scanty of words.","translation":"그녀는 말수가 적다.","sourcePage":179,"pdfPage":27},{"id":847,"source":"MAIN","day":"17","word":"meager","entryType":"","meaning":"형 빈약한, 불충분한","example":"This encyclopedia contains meager information.","translation":"이 백과사전은 빈약한 정보를 담고 있다.","sourcePage":179,"pdfPage":27},{"id":848,"source":"MAIN","day":"17","word":"slender","entryType":"","meaning":"형 날씬한, 호리호리한 / 빈약한","example":"She was slender, with delicate wrists and ankles.","translation":"그녀는 섬세한 손목과 발목을 가진 날씬한 사람이었다.","sourcePage":179,"pdfPage":27},{"id":849,"source":"MAIN","day":"17","word":"dearth","entryType":"","meaning":"명 부족, 결핍","example":"There was a dearth of reliable information on the subject.","translation":"그 주제에 대한 신뢰할 만한 정보가 부족했다.","sourcePage":179,"pdfPage":27},{"id":850,"source":"MAIN","day":"17","word":"plump","entryType":"","meaning":"형 살찐, 통통한","example":"Maria was small and plump with a mass of curly hair.","translation":"Maria는 풍성한 곱슬머리를 가진 작고 통통한 사람이었다.","sourcePage":179,"pdfPage":27},{"id":851,"source":"MAIN","day":"18","word":"obese","entryType":"","meaning":"형 살찐, 비만인","example":"Lose weight if you’re overweight or obese.","translation":"만약 당신이 과체중이거나 비만이라면 살을 빼십시오.","sourcePage":180,"pdfPage":28},{"id":852,"source":"MAIN","day":"18","word":"corporal","entryType":"","meaning":"형 신체의, 육체의","example":"The school banned corporal punishment.","translation":"그 학교는 신체적 처벌을 금지했다.","sourcePage":180,"pdfPage":28},{"id":853,"source":"MAIN","day":"18","word":"metabolic","entryType":"","meaning":"형 신진대사의","example":"The high metabolic rate generates body heat.","translation":"높은 신진대사율은 체열을 발생시킨다.","sourcePage":180,"pdfPage":28},{"id":854,"source":"MAIN","day":"18","word":"diabetes","entryType":"","meaning":"명 당뇨병","example":"The fruit reduces the risk of heart disease and diabetes.","translation":"그 과일은 심장병과 당뇨병의 위험을 줄여 준다.","sourcePage":180,"pdfPage":28},{"id":855,"source":"MAIN","day":"18","word":"dizzy","entryType":"","meaning":"형 현기증 나는, 어지러운","example":"I often get dizzy spells.","translation":"나는 종종 잠깐씩 현기증이 난다.","sourcePage":181,"pdfPage":29},{"id":856,"source":"MAIN","day":"18","word":"insomnia","entryType":"","meaning":"명 불면증","example":"Insomnia is caused by worries about daily life.","translation":"불면증은 일상생활에 대한 걱정에서 유발된다.","sourcePage":181,"pdfPage":29},{"id":857,"source":"MAIN","day":"18","word":"vomit","entryType":"","meaning":"동 ① 토하다 ② 내뱉다, 분출하다","example":"He vomited all he had eaten.","translation":"그는 먹은 것을 다 토했다.","sourcePage":181,"pdfPage":29},{"id":858,"source":"MAIN","day":"18","word":"spit","entryType":"","meaning":"동 (침·피·음식물을) 뱉다 / 명 ① 침 ② (침을) 뱉기","example":"You have bad manners to spit on the sidewalk.","translation":"너는 길바닥에 침을 뱉는 나쁜 버릇이 있다.","sourcePage":181,"pdfPage":29},{"id":859,"source":"MAIN","day":"18","word":"substance","entryType":"","meaning":"명 ① 물질, 물체 ② 본질, 실체","example":"Water is a vital substance for life.","translation":"물은 생명에 필수적인 물질이다.","sourcePage":181,"pdfPage":29},{"id":860,"source":"MAIN","day":"18","word":"molecule","entryType":"","meaning":"명 분자","example":"The atoms bond together to form a molecule.","translation":"원자들이 함께 결합하여 분자를 형성한다.","sourcePage":181,"pdfPage":29},{"id":861,"source":"MAIN","day":"18","word":"particle","entryType":"","meaning":"명 미립자, 극소량","example":"There’s not a particle of truth in his remark.","translation":"그의 말에는 티끌만큼의 진실도 없다.","sourcePage":181,"pdfPage":29},{"id":862,"source":"MAIN","day":"18","word":"carbon","entryType":"","meaning":"명 탄소","example":"The black lead in pencils is made of soft carbon.","translation":"연필에 쓰이는 흑연은 부드러운 탄소로 만들어진다.","sourcePage":182,"pdfPage":30},{"id":863,"source":"MAIN","day":"18","word":"vessel","entryType":"","meaning":"명 ① 배, 선박 ② 용기, 그릇 ③ 혈관 / 명 ② container","example":"They planned to escape to another refuge by that vessel.","translation":"그들은 저 배를 타고 다른 피난처로 달아날 계획을 세웠다.","sourcePage":182,"pdfPage":30},{"id":864,"source":"MAIN","day":"18","word":"artery","entryType":"","meaning":"명 동맥","example":"The highway has fulfilled its task as an economic artery.","translation":"그 고속도로는 경제 동맥으로서의 임무를 다하고 있다.","sourcePage":182,"pdfPage":30},{"id":865,"source":"MAIN","day":"18","word":"liver","entryType":"","meaning":"명 간","example":"The stomach cancer has spread to the liver.","translation":"위암이 간으로 전이됐다.","sourcePage":182,"pdfPage":30},{"id":866,"source":"MAIN","day":"18","word":"wrist","entryType":"","meaning":"명 손목","example":"He took me by the wrist yesterday.","translation":"그가 어제 내 손목을 잡았다.","sourcePage":182,"pdfPage":30},{"id":867,"source":"MAIN","day":"18","word":"flesh","entryType":"","meaning":"명 ① (사람·동물의) 살, 고기 ② (과일의) 과육","example":"Is this cut of meat flesh or a plant-based alternative?","translation":"이 부위는 고기 살인가요, 아니면 식물성 대체품인가요?","sourcePage":182,"pdfPage":30},{"id":868,"source":"MAIN","day":"18","word":"knee","entryType":"","meaning":"명 무릎","example":"The man fell to his knees in surprise.","translation":"그 남자는 놀라서 무릎을 꿇었다.","sourcePage":182,"pdfPage":30},{"id":869,"source":"MAIN","day":"18","word":"offspring","entryType":"","meaning":"명 (사람의) 자손, 자식, (짐승의) 새끼","example":"A liger is the offspring of a male lion and a female tiger.","translation":"라이거는 수컷 사자와 암컷 호랑이 사이의 새끼이다.","sourcePage":183,"pdfPage":31},{"id":870,"source":"MAIN","day":"18","word":"embryo","entryType":"","meaning":"명 태아, 배아","example":"He is doing research into human embryo cloning.","translation":"그는 인간 배아 복제에 대해 연구하고 있다.","sourcePage":183,"pdfPage":31},{"id":871,"source":"MAIN","day":"18","word":"infant","entryType":"","meaning":"명 유아 / 형 ① 유아의 ② 초기의","example":"The first issue an infant faces right after birth is trust.","translation":"유아가 출생 직후 직면하는 문제는 믿음이다.","sourcePage":183,"pdfPage":31},{"id":872,"source":"MAIN","day":"18","word":"adolescence","entryType":"","meaning":"명 청소년기, 사춘기","example":"In our culture, adolescence lasts almost 10 years.","translation":"우리 문화에서는, 청소년기가 거의 10년 동안 계속된다.","sourcePage":183,"pdfPage":31},{"id":873,"source":"MAIN","day":"18","word":"juvenile","entryType":"","meaning":"형 ① 청소년의 ② 젊은","example":"Juvenile crime is increasing at a terrific rate.","translation":"청소년 범죄가 무서운 속도로 증가하고 있다.","sourcePage":183,"pdfPage":31},{"id":874,"source":"MAIN","day":"18","word":"orphan","entryType":"","meaning":"명 고아 / 형 고아의","example":"He adopted the orphan.","translation":"그는 그 고아를 입양했다.","sourcePage":183,"pdfPage":31},{"id":875,"source":"MAIN","day":"18","word":"widow","entryType":"","meaning":"명 미망인, 과부, 홀어미","example":"The widow puts her hopes on her only son.","translation":"그 과부는 외아들에게 희망을 걸고 있다.","sourcePage":184,"pdfPage":32},{"id":876,"source":"MAIN","day":"18","word":"victim","entryType":"","meaning":"명 ① 피해자, 희생자 ② 제물, 희생양","example":"They are trying to rescue as many victims as possible.","translation":"그들은 가능한 한 많은 희생자들을 구조하려고 노력하고 있다.","sourcePage":184,"pdfPage":32},{"id":877,"source":"MAIN","day":"18","word":"prey","entryType":"","meaning":"명 먹이, 희생(자) / 동 잡아먹다","example":"These animals were the prey of hyenas.","translation":"이런 동물들이 하이에나의 먹이였다.","sourcePage":184,"pdfPage":32},{"id":878,"source":"MAIN","day":"18","word":"keen","entryType":"","meaning":"형 ① 예리한, 날카로운 ② 열망하는, 열정적인","example":"The hiker has a keen sense of direction.","translation":"그 등산가는 예리한 방향 감각을 가지고 있다.","sourcePage":184,"pdfPage":32},{"id":879,"source":"MAIN","day":"18","word":"acute","entryType":"","meaning":"형 ① 뾰족한, 날카로운 ② 격렬한, 극심한","example":"She is an acute observer of social phenomena.","translation":"그녀는 사회 현상에 대한 날카로운 관찰자이다.","sourcePage":184,"pdfPage":32},{"id":880,"source":"MAIN","day":"18","word":"swift","entryType":"","meaning":"형 신속한, 재빠른","example":"She was swift to react.","translation":"그녀는 재빠르게 반응을 보였다.","sourcePage":184,"pdfPage":32},{"id":881,"source":"MAIN","day":"18","word":"nimble","entryType":"","meaning":"형 ① (동작이) 민첩한, 재빠른 ② 영리한, 빈틈없는","example":"She played the guitar with nimble fingers.","translation":"그녀는 빠른 손놀림으로 기타를 연주했다.","sourcePage":184,"pdfPage":32},{"id":882,"source":"MAIN","day":"18","word":"passive"," :"MAIN","day":"18","word":"hospitality","entryType":"","meaning":"명 환대, 후한 대접","example":"I’m grateful for your hospitality.","translation":"저는 당신의 환대에 감사합니다.","sourcePage":186,"pdfPage":34},{"id":892,"source":"MAIN","day":"18","word":"invigorate","entryType":"","meaning":"동 ① 기운 나게 하다 ② 활성화하다","example":"She felt invigorated after the walk.","translation":"그녀는 산책을 하고 나니 기운이 났다.","sourcePage":186,"pdfPage":34},{"id":893,"source":"MAIN","day":"18","word":"enhance","entryType":"","meaning":"동 높이다, 향상시키다","example":"Their dedication to their work enhanced the reputation of the company.","translation":"그들의 일에 대한 헌신은 회사의 명성을 높였다.","sourcePage":186,"pdfPage":34},{"id":894,"source":"MAIN","day":"18","word":"increase","entryType":"","meaning":"동 증가하다, 증가시키다 / 명 증가","example":"It can increase the risk of heart disease.","translation":"그것은 심장병의 위험을 증가시킬 수 있다.","sourcePage":186,"pdfPage":34},{"id":895,"source":"MAIN","day":"18","word":"augment","entryType":"","meaning":"동 증가시키다, 증가하다","example":"Heavy rains augmented the water supply.","translation":"폭우로 물 공급이 증가했다.","sourcePage":187,"pdfPage":35},{"id":896,"source":"MAIN","day":"18","word":"mount","entryType":"","meaning":"동 ① (산·계단을) 오르다 ② 증가하다 / 명 산","example":"She mounted the stairs with difficulty.","translation":"그녀는 힘겹게 계단을 올라갔다.","sourcePage":187,"pdfPage":35},{"id":897,"source":"MAIN","day":"18","word":"surmount","entryType":"","meaning":"동 ① 극복하다 ② (산·언덕 등을) 오르다, 넘다","example":"We can surmount every difficulty with patience.","translation":"인내를 가지고 우리는 모든 어려움을 극복할 수 있다.","sourcePage":187,"pdfPage":35},{"id":898,"source":"MAIN","day":"18","word":"paramount","entryType":"","meaning":"형 ① 주요한 ② 최고의","example":"This is of paramount importance.","translation":"이것은 다른 무엇보다 중요하다.","sourcePage":187,"pdfPage":35},{"id":899,"source":"MAIN","day":"18","word":"maximum","entryType":"","meaning":"명 최고, 최대 / 형 최대의, 최고의","example":"The maximum speed limit here is 50km per hour.","translation":"이곳의 최고 제한 속도는 시속 50km이다.","sourcePage":187,"pdfPage":35},{"id":900,"source":"MAIN","day":"18","word":"utmost","entryType":"","meaning":"형 최고의, 극도의","example":"Secrecy is of the utmost importance.","translation":"보안이 최고로 중요하다.","sourcePage":187,"pdfPage":35},{"id":901,"source":"MAIN","day":"19","word":"ascend","entryType":"","meaning":"동 올라가다, 오르다","example":"The air became colder as I ascended.","translation":"위로 올라갈수록 공기가 차가워졌다.","sourcePage":188,"pdfPage":36},{"id":902,"source":"MAIN","day":"19","word":"descend","entryType":"","meaning":"동 ① 내려가다 ② (-의) 자손이다 ③ 전해지다","example":"The plane began to descend.","translation":"비행기가 하강하기 시작했다.","sourcePage":188,"pdfPage":36},{"id":903,"source":"MAIN","day":"19","word":"transcend","entryType":"","meaning":"동 초월하다, 넘다","example":"Her appeal transcends class barriers.","translation":"그녀의 매력은 계급의 장벽을 초월한다.","sourcePage":188,"pdfPage":36},{"id":904,"source":"MAIN","day":"19","word":"elevate","entryType":"","meaning":"동 높이다, 들어 올리다","example":"The song elevated my spirits.","translation":"그 노래는 내 기분을 고양시켰다.","sourcePage":188,"pdfPage":36},{"id":905,"source":"MAIN","day":"19","word":"escalate","entryType":"","meaning":"동 상승하다, 확대하다","example":"We do not want to escalate the war.","translation":"우리는 그 전쟁이 확대되는 것을 원치 않는다.","sourcePage":189,"pdfPage":37},{"id":906,"source":"MAIN","day":"19","word":"magnify","entryType":"","meaning":"동 확대하다","example":"The lens magnifies an object 100 times.","translation":"그 렌즈는 물체를 100배 확대한다.","sourcePage":189,"pdfPage":37},{"id":907,"source":"MAIN","day":"19","word":"exaggerate","entryType":"","meaning":"동 과장하다","example":"Peter tends to exaggerate the story.","translation":"Peter는 이야기를 과장하는 경향이 있다.","sourcePage":189,"pdfPage":37},{"id":908,"source":"MAIN","day":"19","word":"boost","entryType":"","meaning":"동 신장시키다, 북돋우다","example":"The movie helped to boost her screen career.","translation":"그 영화는 그녀의 영화계 경력을 신장시키는 데 도움이 되었다.","sourcePage":189,"pdfPage":37},{"id":909,"source":"MAIN","day":"19","word":"boast","entryType":"","meaning":"동 자랑하다, 뽐내다","example":"Parents like to boast about their children’s achievements.","translation":"부모들은 자녀의 성취에 대해 자랑하기를 좋아한다.","sourcePage":189,"pdfPage":37},{"id":910,"source":"MAIN","day":"19","word":"envy","entryType":"","meaning":"동 부러워하다 / 명 부러움, 질투","example":"I envy people who are very sociable.","translation":"나는 매우 사교적인 사람들이 부럽다.","sourcePage":189,"pdfPage":37},{"id":911,"source":"MAIN","day":"19","word":"proliferate","entryType":"","meaning":"동 확산하다, 급증하다","example":"Germs tend to proliferate in humid conditions.","translation":"세균은 습한 환경에서 증식하는 경향이 있다.","sourcePage":189,"pdfPage":37},{"id":912,"source":"MAIN","day":"19","word":"surpass","entryType":"","meaning":"동 능가하다, 뛰어넘다","example":"The result surpassed our expectations.","translation":"그 결과는 우리의 예상을 뛰어넘었다.","sourcePage":190,"pdfPage":38},{"id":913,"source":"MAIN","day":"19","word":"aid","entryType":"","meaning":"동 원조하다, 돕다 / 명 원조, 도움","example":"Many governments give aid to their poor citizens.","translation":"많은 정부가 가난한 시민들에게 원조를 제공한다.","sourcePage":190,"pdfPage":38},{"id":914,"source":"MAIN","day":"19","word":"assist","entryType":"","meaning":"동 돕다, 원조하다","example":"He will assist me in moving some equipment.","translation":"그는 내가 장비를 옮기는 것을 도와줄 것이다.","sourcePage":190,"pdfPage":38},{"id":915,"source":"MAIN","day":"19","word":"thrive","entryType":"","meaning":"동 번영하다, 번창하다","example":"Today her company continues to thrive.","translation":"오늘날 그녀의 회사는 계속해서 번창하고 있다.","sourcePage":190,"pdfPage":38},{"id":916,"source":"MAIN","day":"19","word":"prosper","entryType":"","meaning":"동 번영하다, 번창하다","example":"We need to create an atmosphere where business can prosper.","translation":"우리는 사업이 번창할 수 있는 분위기를 조성할 필요가 있다.","sourcePage":190,"pdfPage":38},{"id":917,"source":"MAIN","day":"19","word":"flourish","entryType":"","meaning":"동 번영하다, 번창하다","example":"He is flourishing in his new business.","translation":"그는 새 사업에서 번창하고 있다.","sourcePage":190,"pdfPage":38},{"id":918,"source":"MAIN","day":"19","word":"blossom","entryType":"","meaning":"동 ① 꽃을 피우다 ② 번영하다","example":"The cherry trees began to blossom.","translation":"벚나무에 꽃이 피기 시작했다.","sourcePage":190,"pdfPage":38},{"id":919,"source":"MAIN","day":"19","word":"morale","entryType":"","meaning":"명 사기, 의욕","example":"Staff are suffering from low morale.","translation":"직원들은 낮은 사기로 고통받고 있다.","sourcePage":191,"pdfPage":39},{"id":920,"source":"MAIN","day":"19","word":"potent","entryType":"","meaning":"형 강력한, 효능 있는","example":"It was a potent drug.","translation":"그것은 강력한 약이었다.","sourcePage":191,"pdfPage":39},{"id":921,"source":"MAIN","day":"19","word":"potential","entryType":"","meaning":"형 잠재적인, 가능한 / 명 잠재력, 가능성","example":"He wanted to talk with potential customers.","translation":"그는 잠재 고객들과 이야기하고 싶어 했다.","sourcePage":191,"pdfPage":39},{"id":922,"source":"MAIN","day":"19","word":"omnipotent","entryType":"","meaning":"형 전능한, 무엇이든지 할 수 있는","example":"Some people believe God is omnipotent.","translation":"어떤 사람들은 신이 전능하다고 믿는다.","sourcePage":191,"pdfPage":39},{"id":923,"source":"MAIN","day":"19","word":"promising","entryType":"","meaning":"형 장래가 촉망되는, 조짐이 좋은","example":"She is regarded as a promising athlete.","translation":"그녀는 유망한 운동선수로 여겨진다.","sourcePage":191,"pdfPage":39},{"id":924,"source":"MAIN","day":"19","word":"frustrate","entryType":"","meaning":"동 좌절시키다","example":"The lack of evidence in this case is frustrating the police detectives.","translation":"이 사건의 증거 부족이 경찰 수사관들을 좌절시키고 있다.","sourcePage":191,"pdfPage":39},{"id":925,"source":"MAIN","day":"19","word":"deter","entryType":"","meaning":"동 ① 단념시키다 ② 저지하다","example":"Failure did not deter him from trying again.","translation":"실패는 그가 다시 도전하는 것을 단념시키지 못했다.","sourcePage":191,"pdfPage":39},{"id":926,"source":"MAIN","day":"19","word":"dissuade","entryType":"","meaning":"동 단념시키다, 만류하다","example":"I tried to dissuade him from his foolish intention.","translation":"나는 그의 어리석은 의도를 단념시키려고 했다.","sourcePage":192,"pdfPage":40},{"id":927,"source":"MAIN","day":"19","word":"dwindle","entryType":"","meaning":"동 줄어들다, 감소하다, 쇠퇴하다","example":"His fortune has dwindled away.","translation":"그의 재산은 점점 줄어들었다.","sourcePage":192,"pdfPage":40},{"id":928,"source":"MAIN","day":"19","word":"diminish","entryType":"","meaning":"동 줄이다, 감소하다 / 약화시키다","example":"His influence has diminished over time.","translation":"시간이 흐르면서 그의 영향력이 줄었다.","sourcePage":192,"pdfPage":40},{"id":929,"source":"MAIN","day":"19","word":"curtail","entryType":"","meaning":"동 삭감하다, 축소시키다","example":"Spending on snacks was severely curtailed.","translation":"간식 구입비가 대폭 삭감되었다.","sourcePage":192,"pdfPage":40},{"id":930,"source":"MAIN","day":"19","word":"plunge","entryType":"","meaning":"동 뛰어들다, 급락하다 / 명 급락","example":"He plunged into a river because of the unbearable heat.","translation":"그는 견딜 수 없는 더위 때문에 강으로 뛰어들었다.","sourcePage":192,"pdfPage":40},{"id":931,"source":"MAIN","day":"19","word":"plummet","entryType":"","meaning":"동 곤두박질치다, 급락하다","example":"The jet plummeted into a row of houses.","translation":"그 제트기는 여러 집 사이로 곤두박질쳤다.","sourcePage":192,"pdfPage":40},{"id":932,"source":"MAIN","day":"19","word":"shrink","entryType":"","meaning":"동 ① 감소하다(시키다) ② 오그라들다, 움츠러들다","example":"My sweater shrank in the wash.","translation":"내 스웨터는 세탁하면서 줄어들었다.","sourcePage":193,"pdfPage":41},{"id":933,"source":"MAIN","day":"19","word":"stumble","entryType":"","meaning":"동 넘어지다, 비틀거리다","example":"The man stumbled along.","translation":"그 남자는 비틀거리며 걸었다.","sourcePage":193,"pdfPage":41},{"id":934,"source":"MAIN","day":"19","word":"stagger","entryType":"","meaning":"동 ① 비틀거리다, 흔들리다 ② 깜짝 놀라게 하다","example":"He staggered with a package on his shoulder.","translation":"그는 어깨에 짐을 지고 비틀거렸다.","sourcePage":193,"pdfPage":41},{"id":935,"source":"MAIN","day":"19","word":"startle","entryType":"","meaning":"동 깜짝 놀라게 하다","example":"I was startled at the knocking at midnight.","translation":"나는 한밤중에 문을 두드리는 소리에 깜짝 놀랐다.","sourcePage":193,"pdfPage":41},{"id":936,"source":"MAIN","day":"19","word":"flee","entryType":"","meaning":"동 달아나다, 피하다","example":"Many people have fled from the area of the fighting.","translation":"많은 사람들이 전투 지역에서 달아났다.","sourcePage":193,"pdfPage":41},{"id":937,"source":"MAIN","day":"19","word":"escape","entryType":"","meaning":"동 도망가다, 달아나다, 피하다 / 명 탈출","example":"The two were killed, but he escaped.","translation":"두 사람은 살해되었지만, 그는 달아났다.","sourcePage":193,"pdfPage":41},{"id":938,"source":"MAIN","day":"19","word":"avoid","entryType":"","meaning":"동 피하다, 회피하다","example":"She managed to avoid being punished.","translation":"그녀는 가까스로 처벌을 피했다.","sourcePage":194,"pdfPage":42},{"id":939,"source":"MAIN","day":"19","word":"evade","entryType":"","meaning":"동 피하다, 회피하다","example":"I want to evade an embarrassing question.","translation":"나는 곤란한 질문을 피하고 싶다.","sourcePage":194,"pdfPage":42},{"id":940,"source":"MAIN","day":"19","word":"detest","entryType":"","meaning":"동 혐오하다, 몹시 싫어하다","example":"The two political rivals detest each other.","translation":"그 두 정적은 서로를 몹시 싫어한다.","sourcePage":194,"pdfPage":42},{"id":941,"source":"MAIN","day":"19","word":"abhor","entryType":"","meaning":"동 혐오하다, 몹시 싫어하다","example":"They abhor all forms of racism.","translation":"그들은 모든 형태의 인종차별을 혐오한다.","sourcePage":194,"pdfPage":42},{"id":942,"source":"MAIN","day":"19","word":"disgust","entryType":"","meaning":"동 ① 메스껍게 하다 ② 혐오감을 일으키다 / 명 ① 메스꺼움 ② 혐오","example":"She looked with disgust at the food.","translation":"그녀는 음식에 혐오감을 느끼며 바라보았다.","sourcePage":194,"pdfPage":42},{"id":943,"source":"MAIN","day":"19","word":"hostile","entryType":"","meaning":"형 적대적인, 싫어하는","example":"The students had hostile attitudes towards their teachers.","translation":"그 학생들은 교사들에게 적대적인 태도를 보였다.","sourcePage":194,"pdfPage":42},{"id":944,"source":"MAIN","day":"19","word":"aggressive","entryType":"","meaning":"형 ① 공격적인 ② 적극적인","example":"She suggested an aggressive marketing campaign.","translation":"그녀는 공격적인 마케팅 캠페인을 제안했다.","sourcePage":195,"pdfPage":43},{"id":945,"source":"MAIN","day":"19","word":"neutral","entryType":"","meaning":"형 중립적인, 공평한","example":"The country remained neutral in the war.","translation":"그 나라는 전쟁에서 중립을 유지했다.","sourcePage":195,"pdfPage":43},{"id":946,"source":"MAIN","day":"19","word":"sociable","entryType":"","meaning":"형 사교적인","example":"Our new neighbors are not very sociable.","translation":"우리의 새 이웃들은 그다지 사교적이지 않다.","sourcePage":195,"pdfPage":43},{"id":947,"source":"MAIN","day":"19","word":"intimate","entryType":"","meaning":"형 친밀한, 친한","example":"I am on intimate terms with him.","translation":"나는 그와 친밀한 사이이다.","sourcePage":195,"pdfPage":43},{"id":948,"source":"MAIN","day":"19","word":"affection","entryType":"","meaning":"명 애정","example":"Parents have affection for their children.","translation":"부모들은 자녀들에게 애정을 갖는다.","sourcePage":195,"pdfPage":43},{"id":949,"source":"MAIN","day":"19","word":"active","entryType":"","meaning":"형 활동적인, 적극적인","example":"He showed an active involvement in the team project.","translation":"그는 팀 프로젝트에 적극적으로 참여했다.","sourcePage":195,"pdfPage":43},{"id":950,"source":"MAIN","day":"19","word":"radioactive","entryType":"","meaning":"형 방사선의, 방사능의","example":"Uranium is a radioactive element.","translation":"우라늄은 방사성 원소이다.","sourcePage":195,"pdfPage":43},{"id":951,"source":"MAIN","day":"20","word":"sweep","entryType":"","meaning":"동 ① 쓸다, 청소하다 ② 휩쓸다 ③ (선거·경기에서) 압승하다","example":"They were swept into the sea.","translation":"그들은 바다로 휩쓸려 갔다.","sourcePage":196,"pdfPage":44},{"id":952,"source":"MAIN","day":"20","word":"extinguish","entryType":"","meaning":"동 ① 끝내다, 없애다 ② 끄다 / 명 ① remove, eliminate","example":"Firefighters tried to extinguish the fire.","translation":"소방관들이 화재를 진압하려고 애를 썼다.","sourcePage":196,"pdfPage":44},{"id":953,"source":"MAIN","day":"20","word":"liquidate","entryType":"","meaning":"동 ① 청산하다 ② 팔다, 매각하다 ③ 숙청하다","example":"He decided to liquidate some of his buildings.","translation":"그는 자기 건물 중 일부를 매각하기로 결정했다.","sourcePage":196,"pdfPage":44},{"id":954,"source":"MAIN","day":"20","word":"wipe","entryType":"","meaning":"동 ① (먼지·물기 등을) 닦다 ② 지우다 / 명 닦음 / 동 ② remove, erase, efface, obliterate","example":"She wiped her hands on the towel.","translation":"그녀는 수건에 손을 닦았다.","sourcePage":197,"pdfPage":45},{"id":955,"source":"MAIN","day":"20","word":"delete","entryType":"","meaning":"동 지우다 / 명 remove, eradicate, erase, efface, obliterate","example":"I think I just deleted a key part of my computer system.","translation":"내가 내 컴퓨터 시스템에서 중요한 부분을 방금 삭제한 것 같다.","sourcePage":197,"pdfPage":45},{"id":956,"source":"MAIN","day":"20","word":"obsolete","entryType":"","meaning":"형 구식의, 더는 쓸모없는 / 명 outdated, old-fashioned","example":"With the advent of smartphones, MP3 players have become obsolete.","translation":"스마트폰의 등장으로 MP3 플레이어는 쓸모가 없어졌다.","sourcePage":197,"pdfPage":45},{"id":957,"source":"MAIN","day":"20","word":"oblivion","entryType":"","meaning":"명 ① 망각 ② 의식하지 못하는 상태","example":"The only earthly certainty is oblivion.","translation":"세상에서 유일하게 확실한 것은 망각이다.","sourcePage":197,"pdfPage":45},{"id":958,"source":"MAIN","day":"20","word":"stain","entryType":"","meaning":"동 얼룩지게 하다, 더럽히다 / 명 ① 얼룩 ② 오점, 흠","example":"Be careful not to stain your new shirt.","translation":"네 새 셔츠에 얼룩이 묻지 않도록 조심해라.","sourcePage":197,"pdfPage":45},{"id":959,"source":"MAIN","day":"20","word":"rust","entryType":"","meaning":"동 녹슬다, 녹슬게 하다 / 명 녹 / 동 corrode","example":"Water rusts iron.","translation":"수분은 철을 녹슬게 한다.","sourcePage":197,"pdfPage":45},{"id":960,"source":"MAIN","day":"20","word":"rot","entryType":"","meaning":"동 썩다, 부패하다 / 명 썩음, 부패 / 동 decay","example":"Foods are apt to rot quickly in summer.","translation":"여름엔 음식이 빨리 부패하기 쉽다.","sourcePage":197,"pdfPage":45},{"id":961,"source":"MAIN","day":"20","word":"migrate","entryType":"","meaning":"동 이주하다, 이동하다 / 동 relocate, emigrate","example":"Thousands of workers migrate to this area each summer.","translation":"매년 여름 수천 명의 근로자가 이 지역으로 이주한다.","sourcePage":198,"pdfPage":46},{"id":962,"source":"MAIN","day":"20","word":"immigrate","entryType":"","meaning":"동 이민 오다","example":"His family immigrated to Canada after the war.","translation":"그의 가족은 전쟁 후 캐나다로 이민 왔다.","sourcePage":198,"pdfPage":46},{"id":963,"source":"MAIN","day":"20","word":"mutual","entryType":"","meaning":"형 ① 서로의, 상호 간의 ② 공동의, 공통의 / 명 ① reciprocal, communal, correlative","example":"There was an atmosphere of mutual trust between them.","translation":"그들 사이에는 서로를 신뢰하는 분위기가 있었다.","sourcePage":198,"pdfPage":46},{"id":964,"source":"MAIN","day":"20","word":"commute","entryType":"","meaning":"동 통근하다 / 명 통근 (거리)","example":"She commutes from Oxford to London every day.","translation":"그녀는 매일 옥스퍼드에서 런던까지 통근한다.","sourcePage":198,"pdfPage":46},{"id":965,"source":"MAIN","day":"20","word":"mutate","entryType":"","meaning":"동 변형되다, 돌연변이가 되다","example":"The cell is likely to mutate into drug-resistant forms.","translation":"그 세포는 약물에 내성이 있는 형태로 변형될 가능성이 있다.","sourcePage":198,"pdfPage":46},{"id":966,"source":"MAIN","day":"20","word":"secure","entryType":"","meaning":"형 ① 안전한 ② 틀림없는, 확실한 / 동 ① 안전하게 하다 ② 확보하다","example":"It is wise to keep your money in a secure place.","translation":"당신의 돈을 안전한 곳에 보관하는 것이 현명하다.","sourcePage":198,"pdfPage":46},{"id":967,"source":"MAIN","day":"20","word":"fasten","entryType":"","meaning":"동 ① 매다, 메이다 ② 잠그다(잠기다) ③ 고정시키다","example":"Fasten your seatbelt before takeoff.","translation":"이륙 전에 안전벨트를 착용하세요.","sourcePage":199,"pdfPage":47},{"id":968,"source":"MAIN","day":"20","word":"punctual","entryType":"","meaning":"형 시간을 엄수하는, 기한을 잘 지키는 / 부 punctual","example":"He’s always very punctual.","translation":"그는 항상 시간을 아주 잘 지킨다.","sourcePage":199,"pdfPage":47},{"id":969,"source":"MAIN","day":"20","word":"acupuncture","entryType":"","meaning":"명 침술","example":"Acupuncture is a famous treatment in China.","translation":"침술은 중국에서 유명한 치료법이다.","sourcePage":199,"pdfPage":47},{"id":970,"source":"MAIN","day":"20","word":"indulge","entryType":"","meaning":"동 ① 탐닉하다, 빠지다 ② 제멋대로 하게 하다","example":"He indulged himself in gambling.","translation":"그는 도박에 빠졌다.","sourcePage":199,"pdfPage":47},{"id":971,"source":"MAIN","day":"20","word":"curse","entryType":"","meaning":"동 저주하다, 욕하다 / 명 저주, 욕설","example":"The witch cursed the princess at her birth.","translation":"마녀는 공주가 태어났을 때 저주를 걸었다.","sourcePage":199,"pdfPage":47},{"id":972,"source":"MAIN","day":"20","word":"insult","entryType":"","meaning":"동 모욕하다, 창피를 주다 / 명 모욕, 무례 / 동 offend","example":"I never had the intention to insult you.","translation":"당신을 모욕할 의도는 전혀 없었습니다.","sourcePage":199,"pdfPage":47},{"id":973,"source":"MAIN","day":"20","word":"coarse","entryType":"","meaning":"형 ① 거친 ② 음란한, 상스러운","example":"The dress material was of coarse texture.","translation":"그 옷감은 질감이 거칠었다.","sourcePage":199,"pdfPage":47},{"id":974,"source":"MAIN","day":"20","word":"crude","entryType":"","meaning":"형 거친, 가공하지 않은 / 동 raw, coarse","example":"Crude oil needs to be processed to make gasoline.","translation":"원유는 휘발유로 만들기 위해 가공되어야 한다.","sourcePage":199,"pdfPage":47},{"id":975,"source":"MAIN","day":"20","word":"harsh","entryType":"","meaning":"형 거친, 가혹한 / 동 cruel, brutal, ruthless","example":"Don’t you think that’s a bit harsh?","translation":"그건 좀 가혹하지 않아요?","sourcePage":200,"pdfPage":48},{"id":976,"source":"MAIN","day":"20","word":"barren","entryType":"","meaning":"형 ① 불모의 ② 불임의 / 명 불모지, 척박한 땅 / 형 unproductive, sterile, arid, infertile","example":"Some deserts are barren, with no life.","translation":"몇몇 사막은 생명체가 없는 불모지이다.","sourcePage":200,"pdfPage":48},{"id":977,"source":"MAIN","day":"20","word":"sterile","entryType":"","meaning":"형 ① 불모의 ② 불임의 ③ 살균한 / 동 ① unproductive, barren, arid, infertile","example":"Mules are usually sterile.","translation":"노새는 대개 불임이다.","sourcePage":200,"pdfPage":48},{"id":978,"source":"MAIN","day":"20","word":"arid","entryType":"","meaning":"형 ① 마른, 불모의 ② 무미건조한, 재미없는 / 동 ① unproductive, barren, sterile, infertile","example":"This plant grows well in arid regions.","translation":"이 식물은 건조한 지역에서 잘 자란다.","sourcePage":200,"pdfPage":48},{"id":979,"source":"MAIN","day":"20","word":"drou
