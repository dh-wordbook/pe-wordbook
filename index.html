ress the severe economic condition.","translation":"대통령은 심각한 경제 상황을 바로잡겠다고 약속했다.","sourcePage":307,"pdfPage":163},{"id":1674,"source":"MAIN","day":"34","word":"correct","entryType":"","meaning":"동 고치다, 바로잡다 / 형 올바른, 정확한","example":"Did you correct the errors in your essay?","translation":"에세이의 오류를 수정했나요?","sourcePage":307,"pdfPage":163},{"id":1675,"source":"MAIN","day":"34","word":"accurate","entryType":"","meaning":"형 정확한","example":"The assessment of the situation should be accurate.","translation":"그 상황에 대한 평가는 정확해야 한다.","sourcePage":308,"pdfPage":164},{"id":1676,"source":"MAIN","day":"34","word":"meddle","entryType":"","meaning":"동 간섭하다, 참견하다","example":"She had no right to meddle in his affairs.","translation":"그녀가 그의 일에 간섭할 권리는 없었다.","sourcePage":308,"pdfPage":164},{"id":1677,"source":"MAIN","day":"34","word":"pushy","entryType":"","meaning":"형 지나치게 밀어붙이는","example":"He's a very pushy man.","translation":"그는 매우 지나치게 밀어붙이는 사람이다.","sourcePage":308,"pdfPage":164},{"id":1678,"source":"MAIN","day":"34","word":"heedless","entryType":"","meaning":"형 부주의한","example":"He is heedless of the danger.","translation":"그는 위험에 부주의하다.","sourcePage":308,"pdfPage":164},{"id":1679,"source":"MAIN","day":"34","word":"caution","entryType":"","meaning":"동 경고하다, 조심시키다 / 명 ① 주의, 조심 ② 경고","example":"The policeman gave him a caution for speeding.","translation":"경찰은 그에게 과속 주의를 주었다.","sourcePage":308,"pdfPage":164},{"id":1680,"source":"MAIN","day":"34","word":"trait","entryType":"","meaning":"명 특성, 특색, 특징","example":"Certain traits set them apart from the others.","translation":"어떤 특징들은 다른 사람들과 그들을 구별한다.","sourcePage":308,"pdfPage":164},{"id":1681,"source":"MAIN","day":"34","word":"portrait","entryType":"","meaning":"명 초상화, 인물 사진","example":"The portrait is full of life.","translation":"그 초상화는 살아 있는 것 같다.","sourcePage":308,"pdfPage":164},{"id":1682,"source":"MAIN","day":"34","word":"phenomenon","entryType":"","meaning":"명 현상 / pl. phenomenal","example":"We are reminded daily of this phenomenon.","translation":"우리는 매일 이러한 현상을 생각하게 된다.","sourcePage":309,"pdfPage":165},{"id":1683,"source":"MAIN","day":"34","word":"symptom","entryType":"","meaning":"명 ① 증상 ② 징후, 징조","example":"There are, however, several things you can do to suppress the symptoms.","translation":"그러나 증상을 억제하기 위해 당신이 할 수 있는 것들이 몇 가지 있다.","sourcePage":309,"pdfPage":165},{"id":1684,"source":"MAIN","day":"34","word":"preliminary","entryType":"","meaning":"형 예비(준비)의 / 명 ① 준비 행동 ② 예선전, 예비 시험","example":"After a few preliminary remarks, he announced the winners.","translation":"몇 차례 예비 발언 후에, 그가 당첨자들을 발표했다.","sourcePage":309,"pdfPage":165},{"id":1685,"source":"MAIN","day":"34","word":"initial","entryType":"","meaning":"형 처음의, 최초의 / 명 머리글자(이니셜) / 동 처음 서명하다","example":"The initial reaction was excellent.","translation":"초기 반응은 훌륭했다.","sourcePage":309,"pdfPage":165},{"id":1686,"source":"MAIN","day":"34","word":"initiative","entryType":"","meaning":"명 ① 주도(권), 진취성 ② 계획 ③ 솔선, 선도","example":"He did it on his own initiative.","translation":"그는 본인 주도하에 그 것을 했다.","sourcePage":309,"pdfPage":165},{"id":1687,"source":"MAIN","day":"34","word":"threshold","entryType":"","meaning":"명 ① 출발점, 발단 ② 입구, 문지방","example":"They met at the threshold of the theater.","translation":"그들은 극장의 입구에서 만났다.","sourcePage":309,"pdfPage":165},{"id":1688,"source":"MAIN","day":"34","word":"vanguard","entryType":"","meaning":"명 선구자, 선두, 선봉(부대)","example":"He is in the vanguard of cancer research.","translation":"그는 암 연구에 있어 선구자이다.","sourcePage":309,"pdfPage":165},{"id":1689,"source":"MAIN","day":"34","word":"conquer","entryType":"","meaning":"동 ① 정복하다 ② 극복하다","example":"A lot of people have tried to conquer the mountain.","translation":"많은 사람들이 그 산을 정복하려고 노력해 왔다.","sourcePage":310,"pdfPage":166},{"id":1690,"source":"MAIN","day":"34","word":"triumph","entryType":"","meaning":"명 승리 / 동 승리하다","example":"News of their triumph spread around the world.","translation":"그들의 승리 소식이 전 세계에 퍼졌다.","sourcePage":310,"pdfPage":166},{"id":1691,"source":"MAIN","day":"34","word":"overwhelm","entryType":"","meaning":"동 ① 압도하다 ② 당황하게 하다","example":"I wept overwhelmed with joy.","translation":"나는 기쁨에 압도되어 울었다.","sourcePage":310,"pdfPage":166},{"id":1692,"source":"MAIN","day":"34","word":"surrender","entryType":"","meaning":"동 ① 항복하다 ② 포기하다, 넘겨주다 / 명 ① 항복 ② 양도","example":"I would rather die than surrender.","translation":"항복하느니 차라리 죽겠다.","sourcePage":310,"pdfPage":166},{"id":1693,"source":"MAIN","day":"34","word":"relinquish","entryType":"","meaning":"동 포기하다, 단념하다","example":"He was forced to relinquish control of the company.","translation":"그는 그 회사에 대한 지배권을 포기하도록 강요받았다.","sourcePage":310,"pdfPage":166},{"id":1694,"source":"MAIN","day":"34","word":"servile","entryType":"","meaning":"형 굽실거리는, 비굴한","example":"He shows a servile attitude to the country we detest.","translation":"그는 우리가 혐오하는 나라에 비굴한 태도로 보여준다.","sourcePage":310,"pdfPage":166},{"id":1695,"source":"MAIN","day":"34","word":"beg","entryType":"","meaning":"동 ① 간청하다, 애원하다 ② 구걸하다","example":"Sometimes hungry people beg for food.","translation":"가끔씩 배고픈 이들이 음식을 구걸한다.","sourcePage":311,"pdfPage":167},{"id":1696,"source":"MAIN","day":"34","word":"flatter","entryType":"","meaning":"동 아첨하다, 알랑거리다","example":"She doesn’t want to flatter people to gain their trust.","translation":"그녀는 신뢰를 얻기 위해 사람들에게 아첨하는 것을 원하지 않는다.","sourcePage":311,"pdfPage":167},{"id":1697,"source":"MAIN","day":"34","word":"fair","entryType":"","meaning":"형 ① 공정한 ② 상당한 ③ (하늘이) 맑은 ④ 아름다운 / 명 박람회","example":"Fair trade ensures equitable wages for farmers.","translation":"공정 무역은 농민들에게 공평한 임금을 보장한다.","sourcePage":311,"pdfPage":167},{"id":1698,"source":"MAIN","day":"34","word":"partial","entryType":"","meaning":"형 ① 부분적인, 불완전한 ② 편애하는, 불공평한","example":"It was only a partial solution to the problem.","translation":"그것은 그 문제에 대한 부분적인 해결책일 뿐이었다.","sourcePage":311,"pdfPage":167},{"id":1699,"source":"MAIN","day":"34","word":"compartment","entryType":"","meaning":"명 칸, 구획","example":"The luggage is all lined up in the storage compartment.","translation":"짐가방들이 짐칸에 모두 정렬되어 있다.","sourcePage":311,"pdfPage":167},{"id":1700,"source":"MAIN","day":"34","word":"chamber","entryType":"","meaning":"명 ① (공공건물의) 회의실 ② 방, 실","example":"The king held court in the grand chamber.","translation":"그 왕은 대회의실에서 궁정을 열었다.","sourcePage":311,"pdfPage":167},{"id":1701,"source":"MAIN","day":"35","word":"disaster","entryType":"","meaning":"명 재난, 재해, 재앙","example":"Was it a natural disaster or human error?","translation":"그것은 자연재해였나요 아니면 인간의 실수였나요?","sourcePage":312,"pdfPage":168},{"id":1702,"source":"MAIN","day":"35","word":"calamity","entryType":"","meaning":"명 재난, 재해, 재앙","example":"The war brought calamity to the entire region.","translation":"그 전쟁은 전 지역에 재앙을 가져왔다.","sourcePage":312,"pdfPage":168},{"id":1703,"source":"MAIN","day":"35","word":"catastrophe","entryType":"","meaning":"명 재앙, 대참사","example":"The flood in Venice was a major catastrophe.","translation":"베니스의 홍수는 주된 재앙이었다.","sourcePage":312,"pdfPage":168},{"id":1704,"source":"MAIN","day":"35","word":"isolate","entryType":"","meaning":"동 고립시키다, 격리하다","example":"She was isolated to prevent infection.","translation":"그녀는 전염병 예방을 위해 격리되었다.","sourcePage":313,"pdfPage":169},{"id":1705,"source":"MAIN","day":"35","word":"insulate","entryType":"","meaning":"동 단열[방음·절연] 처리를 하다","example":"Conserve energy by insulating your home.","translation":"집에 단열 처리를 하여 에너지를 절약하라.","sourcePage":313,"pdfPage":169},{"id":1706,"source":"MAIN","day":"35","word":"quarantine","entryType":"","meaning":"동 격리하다 / 명 격리, 검역","example":"The patients were immediately quarantined.","translation":"환자들은 즉시 격리되었다.","sourcePage":313,"pdfPage":169},{"id":1707,"source":"MAIN","day":"35","word":"segregate","entryType":"","meaning":"동 ① 분리하다, 격리하다 ② (인종) 차별하다","example":"Blacks were segregated from whites here.","translation":"이곳에서 흑인들은 백인들과 격리되었다.","sourcePage":313,"pdfPage":169},{"id":1708,"source":"MAIN","day":"35","word":"polarize","entryType":"","meaning":"동 양극화되다, 양극화시키다","example":"The issue has polarized public opinion.","translation":"그 쟁점이 여론을 양극화시켰다.","sourcePage":313,"pdfPage":169},{"id":1709,"source":"MAIN","day":"35","word":"cram","entryType":"","meaning":"동 ① 밀어[쑤셔] 넣다 ② 벼락치기 공부를 하다","example":"It's better not to cram at the last minute.","translation":"마지막 순간에 벼락치기를 하지 않는 것이 좋다.","sourcePage":313,"pdfPage":169},{"id":1710,"source":"MAIN","day":"35","word":"arrogant","entryType":"","meaning":"형 거만한, 오만한","example":"I didn't like her arrogant attitude.","translation":"나는 그녀의 거만한 태도가 맘에 들지 않았다.","sourcePage":313,"pdfPage":169},{"id":1711,"source":"MAIN","day":"35","word":"overbearing","entryType":"","meaning":"형 고압적인, 거만한","example":"We resented her overbearing attitude.","translation":"우리는 그녀의 고압적인 태도에 분개했다.","sourcePage":314,"pdfPage":170},{"id":1712,"source":"MAIN","day":"35","word":"haughty","entryType":"","meaning":"형 오만한, 건방진","example":"I disliked her haughty cast.","translation":"나는 그녀의 오만한 태도가 싫었다.","sourcePage":314,"pdfPage":170},{"id":1713,"source":"MAIN","day":"35","word":"bold","entryType":"","meaning":"형 ① 대담한 ② 굵은","example":"He is absolutely not timid but as bold as a lion.","translation":"그는 절대로 소심하지 않고 사자처럼 대담하다.","sourcePage":314,"pdfPage":170},{"id":1714,"source":"MAIN","day":"35","word":"feast","entryType":"","meaning":"명 잔치, 축제 / 동 맘껏 먹다","example":"We had a feast at home yesterday because it was a holiday.","translation":"어제는 휴일이었기 때문에 우리는 집에서 잔치를 벌였다.","sourcePage":314,"pdfPage":170},{"id":1715,"source":"MAIN","day":"35","word":"feat","entryType":"","meaning":"명 공적, 위업","example":"Despite his historic feat, his life was miserable.","translation":"그의 역사적 위업에도 불구하고, 그의 인생은 비참했다.","sourcePage":314,"pdfPage":170},{"id":1716,"source":"MAIN","day":"35","word":"dynasty","entryType":"","meaning":"명 왕조, 명가, 명문","example":"The practice dates from the Joseon Dynasty period.","translation":"그 관행은 조선 왕조 시대부터 시작된 것이다.","sourcePage":314,"pdfPage":170},{"id":1717,"source":"MAIN","day":"35","word":"sovereign","entryType":"","meaning":"명 군주, 주권자 / 형 ① 주권이 있는 ② 독립의, 자치의","example":"Sovereign power resides with the people.","translation":"주권은 국민에게 있다.","sourcePage":315,"pdfPage":171},{"id":1718,"source":"MAIN","day":"35","word":"monarch","entryType":"","meaning":"명 군주, 최고 지배자","example":"He's a hidden monarch, like King Arthur was.","translation":"그는 Arthur 왕처럼 숨겨진 군주입니다.","sourcePage":315,"pdfPage":171},{"id":1719,"source":"MAIN","day":"35","word":"empire","entryType":"","meaning":"명 제국","example":"She once ruled over a vast empire.","translation":"그녀는 한때 방대한 제국을 다스렸다.","sourcePage":315,"pdfPage":171},{"id":1720,"source":"MAIN","day":"35","word":"hierarchy","entryType":"","meaning":"명 ① 지배 계층 ② 계급(제), 계층","example":"The caste system categorized Hindus into a social hierarchy.","translation":"카스트 제도는 힌두교도들을 사회 계급제로 분류했다.","sourcePage":315,"pdfPage":171},{"id":1721,"source":"MAIN","day":"35","word":"tyranny","entryType":"","meaning":"명 ① 폭정, 포악한 행위 ② 전제 정치, 독재","example":"The colonists rebelled against the king's tyranny.","translation":"식민지 주민들은 왕의 폭정에 반항했다.","sourcePage":315,"pdfPage":171},{"id":1722,"source":"MAIN","day":"35","word":"autocratic","entryType":"","meaning":"형 독재의, 독재적인","example":"The president resigned after 30 years of autocratic rule.","translation":"그 대통령은 30년간의 독재 통치 끝에 사임했다.","sourcePage":315,"pdfPage":171},{"id":1723,"source":"MAIN","day":"35","word":"arbitrary","entryType":"","meaning":"형 ① 임의적인, 제멋대로인 ② 일방적인, 독단적인","example":"He made ambiguous, arbitrary decisions.","translation":"그는 모호하고 임의적인 결정을 내렸다.","sourcePage":316,"pdfPage":172},{"id":1724,"source":"MAIN","day":"35","word":"unruly","entryType":"","meaning":"형 제멋대로 하는","example":"His unruly behavior is getting worse.","translation":"그의 제멋대로 하는 행동이 점점 더 심해지고 있다.","sourcePage":316,"pdfPage":172},{"id":1725,"source":"MAIN","day":"35","word":"autonomy","entryType":"","meaning":"명 ① 자치권, 자율성 ② 자치 국가","example":"The six republics are demanding autonomy.","translation":"6개 공화국들이 자치를 요구하고 있다.","sourcePage":316,"pdfPage":172},{"id":1726,"source":"MAIN","day":"35","word":"dignity","entryType":"","meaning":"명 존엄, 위엄, 품위","example":"In a democracy, everyone deserves to be treated with human dignity.","translation":"민주주의 사회에서는, 모든 사람이 존엄한 인간으로 대우받을 자격이 있다.","sourcePage":316,"pdfPage":172},{"id":1727,"source":"MAIN","day":"35","word":"majesty","entryType":"","meaning":"명 위엄, 존엄, 장엄함","example":"He was awed by the majesty of the mountain.","translation":"그는 그 산의 장엄함에 경외감이 들었다.","sourcePage":316,"pdfPage":172},{"id":1728,"source":"MAIN","day":"35","word":"sanction","entryType":"","meaning":"동 ① 승인하다 ② 제재하다 / 명 ① 인가 ② 제재","example":"A city hall gave sanction to building a library.","translation":"시청은 도서관을 짓는 것을 허가했다.","sourcePage":316,"pdfPage":172},{"id":1729,"source":"MAIN","day":"35","word":"endorse","entryType":"","meaning":"동 ① 승인하다, 지지하다, 보증하다 ② (수표 등에) 배서하다","example":"She endorses the ideas expressed in the article.","translation":"그녀는 그 논문에 표현된 사상을 지지한다.","sourcePage":316,"pdfPage":172},{"id":1730,"source":"MAIN","day":"35","word":"approve","entryType":"","meaning":"동 찬성하다, 허가하다, 승인하다","example":"Her parents didn't approve of her marriage.","translation":"그녀의 부모는 그녀의 결혼에 찬성하지 않았다.","sourcePage":317,"pdfPage":173},{"id":1731,"source":"MAIN","day":"35","word":"probable","entryType":"","meaning":"형 있을 법한, 가능성이 있는","example":"It is probable that it will rain tomorrow.","translation":"내일 비가 올 것 같다.","sourcePage":317,"pdfPage":173},{"id":1732,"source":"MAIN","day":"35","word":"forbid","entryType":"","meaning":"동 금지하다","example":"You are forbidden to smoke during the meeting.","translation":"회의 중에 담배를 피우는 것은 금지합니다.","sourcePage":317,"pdfPage":173},{"id":1733,"source":"MAIN","day":"35","word":"refuse","entryType":"","meaning":"동 거절하다, 거부하다","example":"He would never refuse to help a neighbor.","translation":"그는 이웃을 돕는 것을 절대 거절하지 않을 것이다.","sourcePage":317,"pdfPage":173},{"id":1734,"source":"MAIN","day":"35","word":"reject","entryType":"","meaning":"동 거절하다, 거부하다","example":"He is afraid you will reject him.","translation":"그는 당신이 그를 거절할까 봐 두려워하고 있다.","sourcePage":317,"pdfPage":173},{"id":1735,"source":"MAIN","day":"35","word":"embarrass","entryType":"","meaning":"동 당황하게 하다, 난처하게 하다","example":"Don't embarrass me with difficult questions.","translation":"어려운 질문으로 날 당황하게 하지 마.","sourcePage":317,"pdfPage":173},{"id":1736,"source":"MAIN","day":"35","word":"exasperate","entryType":"","meaning":"동 화나게 하다, 악화시키다","example":"It only exasperated the problem.","translation":"그것은 문제를 악화시킬 뿐이었다.","sourcePage":317,"pdfPage":173},{"id":1737,"source":"MAIN","day":"35","word":"offend","entryType":"","meaning":"동 화나게 하다, 기분 상하게 하다 / 위반하다","example":"Be careful not to offend the customers.","translation":"손님들의 기분을 나쁘게 하지 않도록 주의하세요.","sourcePage":318,"pdfPage":174},{"id":1738,"source":"MAIN","day":"35","word":"inflammatory","entryType":"","meaning":"형 선동적인, 분노를 유발하는","example":"That politician made inflammatory speeches.","translation":"그 정치인은 선동적인 연설을 했다.","sourcePage":318,"pdfPage":174},{"id":1739,"source":"MAIN","day":"35","word":"edible","entryType":"","meaning":"형 먹을 수 있는","example":"The fruit of that tree is not edible.","translation":"저 나무의 열매는 먹을 수 없다.","sourcePage":318,"pdfPage":174},{"id":1740,"source":"MAIN","day":"35","word":"savor","entryType":"","meaning":"동 맛보다, 음미하다","example":"I want to savor something fresh and unique.","translation":"나는 신선하고 독특한 것을 맛보길 원한다.","sourcePage":318,"pdfPage":174},{"id":1741,"source":"MAIN","day":"35","word":"acid","entryType":"","meaning":"형 신 맛의, 산성의 / 명 산","example":"Acid rain also destroys land.","translation":"산성비는 땅도 파괴한다.","sourcePage":318,"pdfPage":174},{"id":1742,"source":"MAIN","day":"35","word":"potable","entryType":"","meaning":"형 마셔도 되는, 식수로 적합한","example":"Reclaimed water is reused as a potable supply.","translation":"정수된 물은 식수로 재사용된다.","sourcePage":318,"pdfPage":174},{"id":1743,"source":"MAIN","day":"35","word":"fragrant","entryType":"","meaning":"형 향기로운","example":"The air was fragrant with the smell of orange blossoms.","translation":"공기가 오렌지 꽃 냄새로 향기로웠다.","sourcePage":318,"pdfPage":174},{"id":1744,"source":"MAIN","day":"35","word":"scent","entryType":"","meaning":"명 향기, 냄새 / 동 냄새를 맡다","example":"The orange has a scent all its own.","translation":"오렌지에는 독특한 향기가 있다.","sourcePage":319,"pdfPage":175},{"id":1745,"source":"MAIN","day":"35","word":"odor","entryType":"","meaning":"명 (좋지 못한) 냄새","example":"Its odor is unmistakable, but hard to describe.","translation":"그 냄새는 분명하지만 설명하기 어렵다.","sourcePage":319,"pdfPage":175},{"id":1746,"source":"MAIN","day":"35","word":"ferment","entryType":"","meaning":"동 (발효)시키다 / 명 효모, 발효","example":"A winemaker ferments grapes into wine.","translation":"와인 제조자는 포도를 발효시켜 와인을 만든다.","sourcePage":319,"pdfPage":175},{"id":1747,"source":"MAIN","day":"35","word":"swell","entryType":"","meaning":"동 부풀다, 팽창하다","example":"My toe swelled when I dropped a jar on it.","translation":"내 발가락은 내가 단지를 떨어뜨렸을 때 부풀어 올랐다.","sourcePage":319,"pdfPage":175},{"id":1748,"source":"MAIN","day":"35","word":"inflation","entryType":"","meaning":"명 통화 팽창, 인플레이션","example":"The overissue of paper money causes inflation.","translation":"지폐의 과도한 발행은 인플레이션을 일으킨다.","sourcePage":319,"pdfPage":175},{"id":1749,"source":"MAIN","day":"35","word":"germ","entryType":"","meaning":"명 병균, 세균","example":"Doctors are always washing their hands to avoid germs.","translation":"의사들은 병균을 피하기 위해 항상 손을 씻는다.","sourcePage":319,"pdfPage":175},{"id":1750,"source":"MAIN","day":"35","word":"sprout","entryType":"","meaning":"동 싹트다, 발아하다","example":"The farmer's corn crop sprouted in early March.","translation":"농부의 옥수수 작물이 3월 초에 싹텄다.","sourcePage":319,"pdfPage":175},{"id":1751,"source":"MAIN","day":"36","word":"choke","entryType":"","meaning":"동 숨이 막히다, 질식시키다","example":"He was choked with smoke.","translation":"그는 연기에 숨이 막혔다.","sourcePage":328,"pdfPage":176},{"id":1752,"source":"MAIN","day":"36","word":"smother","entryType":"","meaning":"동 질식시키다, 숨 막히게 하다","example":"Emma felt smothered by his love.","translation":"Emma는 그의 애정에 숨이 막힐 것 같았다.","sourcePage":328,"pdfPage":176},{"id":1753,"source":"MAIN","day":"36","word":"bother","entryType":"","meaning":"동 ① 귀찮게 하다, 괴롭히다 ② 걱정하다","example":"The noise was beginning to bother us, so we left.","translation":"소음이 우리를 괴롭히기 시작해서, 우리는 자리를 떴다.","sourcePage":328,"pdfPage":176},{"id":1754,"source":"MAIN","day":"36","word":"tease","entryType":"","meaning":"동 괴롭히다, 놀리다","example":"Don't tease the weak.","translation":"약자를 괴롭히지 마라.","sourcePage":329,"pdfPage":177},{"id":1755,"source":"MAIN","day":"36","word":"irritate","entryType":"","meaning":"동 짜증 나게 하다, 화나게 하다","example":"Ordinarily, the process of buying clothes irritates me.","translation":"보통, 옷을 사는 과정은 나를 짜증 나게 한다.","sourcePage":329,"pdfPage":177},{"id":1756,"source":"MAIN","day":"36","word":"afflict","entryType":"","meaning":"동 괴롭히다, 피해를 입히다","example":"She was afflicted at the failure.","translation":"그녀는 그 실패에 괴로워했다.","sourcePage":329,"pdfPage":177},{"id":1757,"source":"MAIN","day":"36","word":"bully","entryType":"","meaning":"동 괴롭히다, 협박하다 / 명 약자를 괴롭히는 사람, 불량배","example":"Our students do not bully each other.","translation":"우리 학생들은 서로를 괴롭히지 않는다.","sourcePage":329,"pdfPage":177},{"id":1758,"source":"MAIN","day":"36","word":"menace","entryType":"","meaning":"동 위협하다, 협박하다 / 명 위협, 협박","example":"The pollution of atmosphere is a menace to health.","translation":"대기 오염은 건강에 위협이 된다.","sourcePage":329,"pdfPage":177},{"id":1759,"source":"MAIN","day":"36","word":"threat","entryType":"","meaning":"명 위협","example":"The threat of potential loss plays a critical role in human decision-making.","translation":"잠재적 손실의 위협은 사람의 의사결정에 중요한 역할을 한다.","sourcePage":329,"pdfPage":177},{"id":1760,"source":"MAIN","day":"36","word":"practice","entryType":"","meaning":"동 ① 연습하다 ② 실행하다 ③ (의사·변호사 등으로) 일하다 / 명 ① 연습 ② 실행 ③ 관행 ④ (의사·변호사) 업무","example":"Practice makes perfect, so keep practicing!","translation":"연습이 완벽을 만든다, 그러니 계속 연습해라!","sourcePage":330,"pdfPage":178},{"id":1761,"source":"MAIN","day":"36","word":"discipline","entryType":"","meaning":"명 ① 훈련 ② 규율, 훈육 ③ 징벌 ④ 학문, 학과 / 동 ① 훈련하다, 훈육하다 ② 징계하다, 벌하다","example":"He did not like the army because of the strict discipline.","translation":"그는 엄격한 규율 때문에 군대를 좋아하지 않았다.","sourcePage":330,"pdfPage":178},{"id":1762,"source":"MAIN","day":"36","word":"punish","entryType":"","meaning":"동 벌주다, 처벌하다","example":"Drunk driving should be punished with a prison sentence.","translation":"음주 운전은 징역형으로 처벌받아야 한다.","sourcePage":330,"pdfPage":178},{"id":1763,"source":"MAIN","day":"36","word":"blame","entryType":"","meaning":"동 비난하다, 탓하다 / 명 비난, 탓","example":"Blaming each other won't solve anything.","translation":"서로를 탓한다고 해결되는 것은 아무것도 없다.","sourcePage":330,"pdfPage":178},{"id":1764,"source":"MAIN","day":"36","word":"criticize","entryType":"","meaning":"동 비판하다, 비난하다","example":"It’s a lot easier to criticize a plan than to offer useful suggestions.","translation":"유용한 제안을 하기보다 계획을 비판하기가 훨씬 더 쉽다.","sourcePage":330,"pdfPage":178},{"id":1765,"source":"MAIN","day":"36","word":"condemn","entryType":"","meaning":"동 ① 비난하다 ② (형을) 선고하다","example":"We shouldn't condemn her on mere supposition.","translation":"우리는 단순 추측으로 그녀를 비난해서는 안 된다.","sourcePage":331,"pdfPage":179},{"id":1766,"source":"MAIN","day":"36","word":"rebuke","entryType":"","meaning":"명 심한 비난, 질책 / 동 질책하다, 꾸짖다","example":"He was stunned by the harsh rebuke from his father.","translation":"그는 아버지의 혹독한 질책에 깜짝 놀랐다.","sourcePage":331,"pdfPage":179},{"id":1767,"source":"MAIN","day":"36","word":"reprehend","entryType":"","meaning":"동 책망하다, 비난하다","example":"He reprehended them in a gentle way.","translation":"그는 점잖게 그들을 꾸짖었다.","sourcePage":331,"pdfPage":179},{"id":1768,"source":"MAIN","day":"36","word":"reproach","entryType":"","meaning":"명 비난, 책망 / 동 질책하다, 나무라다, 비난하다","example":"Her voice was full of reproach.","translation":"그녀의 목소리에는 비난이 가득했다.","sourcePage":331,"pdfPage":179},{"id":1769,"source":"MAIN","day":"36","word":"reprimand","entryType":"","meaning":"명 비난, 질책 / 동 질책하다, 꾸짖다","example":"She received a severe reprimand for her irresponsible behavior.","translation":"그녀는 그녀의 무책임한 행동에 대해 심한 질책을 받았다.","sourcePage":331,"pdfPage":179},{"id":1770,"source":"MAIN","day":"36","word":"criterion","entryType":"","meaning":"명 기준 (pl. criteria)","example":"A person's appetite is a good criterion of his health.","translation":"사람의 식욕은 건강의 좋은 기준이다.","sourcePage":332,"pdfPage":180},{"id":1771,"source":"MAIN","day":"36","word":"mock","entryType":"","meaning":"동 조롱하다, 놀리다","example":"It’s impolite to mock other people.","translation":"다른 사람들을 조롱하는 것은 불손하다.","sourcePage":332,"pdfPage":180},{"id":1772,"source":"MAIN","day":"36","word":"ridicule","entryType":"","meaning":"동 비웃다, 조롱하다 / 명 비웃음, 조롱","example":"The other kids ridiculed him for the way he dressed.","translation":"다른 아이들은 그의 옷차림을 놀렸다.","sourcePage":332,"pdfPage":180},{"id":1773,"source":"MAIN","day":"36","word":"cynical","entryType":"","meaning":"형 냉소적인, 비꼬는","example":"I don’t think he has a cynical view of the world.","translation":"나는 그가 세상을 냉소적으로 본다고 생각하지 않는다.","sourcePage":332,"pdfPage":180},{"id":1774,"source":"MAIN","day":"36","word":"charge","entryType":"","meaning":"동 ① 청구하다, 부과하다 ② 기소[고소]하다, 비난하다 ③ 책임지게 하다, 충전하다 / 명 ① 요금 ② 기소, 고발, 비난 ③ 책임","example":"The driver was charged with a speeding-related offense.","translation":"그 운전자는 속도 위반으로 기소되었다.","sourcePage":332,"pdfPage":180},{"id":1775,"source":"MAIN","day":"36","word":"accuse","entryType":"","meaning":"동 ① 비난하다 ② 고발[고소], 기소하다","example":"She accused him of plagiarism.","translation":"그녀는 그를 표절로 고발했다.","sourcePage":333,"pdfPage":181},{"id":1776,"source":"MAIN","day":"36","word":"impeach","entryType":"","meaning":"동 탄핵하다","example":"The judge was impeached for taking a bribe.","translation":"그 재판관은 뇌물을 받은 혐의로 탄핵당했다.","sourcePage":333,"pdfPage":181},{"id":1777,"source":"MAIN","day":"36","word":"summon","entryType":"","meaning":"동 소환하다, 호출하다","example":"The murderer was summoned to appear in the court.","translation":"그 살인자는 법정에 서도록 소환되었다.","sourcePage":333,"pdfPage":181},{"id":1778,"source":"MAIN","day":"36","word":"arrest","entryType":"","meaning":"동 체포하다, 구속하다 / 명 체포","example":"The police arrested the suspect at the scene of the crime.","translation":"경찰은 용의자를 범행 현장에서 체포했다.","sourcePage":333,"pdfPage":181},{"id":1779,"source":"MAIN","day":"36","word":"allege","entryType":"","meaning":"동 ① 주장하다, 단언하다 ② 혐의를 제기하다","example":"He alleged malpractice.","translation":"그는 의료 과실을 주장했다.","sourcePage":333,"pdfPage":181},{"id":1780,"source":"MAIN","day":"36","word":"attorney","entryType":"","meaning":"명 대리인, 변호사","example":"I was assigned to assist an older man, a business attorney.","translation":"나는 나이 많은 기업 변호사를 돕는 일을 맡게 되었다.","sourcePage":334,"pdfPage":182},{"id":1781,"source":"MAIN","day":"36","word":"jury","entryType":"","meaning":"명 배심원, 배심원단","example":"The criminal was judged guilty by a jury of twelve men and women.","translation":"그 범죄자는 12명의 남녀 배심원단에 의해서 유죄로 판정받았다.","sourcePage":334,"pdfPage":182},{"id":1782,"source":"MAIN","day":"36","word":"judicial","entryType":"","meaning":"형 사법의","example":"People need better access to the judicial system.","translation":"사람들은 사법 제도에 대한 더 나은 접근성이 필요하다.","sourcePage":334,"pdfPage":182},{"id":1783,"source":"MAIN","day":"36","word":"justify","entryType":"","meaning":"동 정당화하다","example":"Nothing can justify a war.","translation":"어떤 것도 전쟁을 정당화할 수 없다.","sourcePage":334,"pdfPage":182},{"id":1784,"source":"MAIN","day":"36","word":"warrant","entryType":"","meaning":"동 ① 정당화하다 ② 보증하다 / 명 ① 영장 ② 이유, 근거 ③ 보증","example":"The judge issued a warrant for his arrest.","translation":"판사가 그의 체포를 위한 영장을 발부했다.","sourcePage":334,"pdfPage":182},{"id":1785,"source":"MAIN","day":"36","word":"testify","entryType":"","meaning":"동 ① 증언하다 ② 증명하다","example":"I testified for the accused.","translation":"나는 피고를 위해 증언했다.","sourcePage":334,"pdfPage":182},{"id":1786,"source":"MAIN","day":"36","word":"testimony","entryType":"","meaning":"명 증언, 증거, 고백","example":"The witness refused to give testimony.","translation":"그 증인은 증언을 하는 것을 거부했다.","sourcePage":335,"pdfPage":183},{"id":1787,"source":"MAIN","day":"36","word":"confess","entryType":"","meaning":"동 ① 고백하다, 자백하다 ② 인정하다","example":"She confessed her lack of knowledge.","translation":"그녀는 자신의 무지를 고백했다.","sourcePage":335,"pdfPage":183},{"id":1788,"source":"MAIN","day":"36","word":"verify","entryType":"","meaning":"동 ① 입증하다, 증명하다 ② 확인하다","example":"I need to verify whether their claims are true.","translation":"나는 그들의 주장이 사실인지 아닌지 확인할 필요가 있다.","sourcePage":335,"pdfPage":183},{"id":1789,"source":"MAIN","day":"36","word":"verdict","entryType":"","meaning":"명 평결, 판결","example":"Has the jury reached a guilty verdict?","translation":"배심원단이 유죄 판결을 내렸습니까?","sourcePage":335,"pdfPage":183},{"id":1790,"source":"MAIN","day":"36","word":"sentence","entryType":"","meaning":"명 ① 문장 ② 형벌, 선고 / 동 (형을) 선고하다","example":"The judge pronounced sentence of death on him.","translation":"판사가 그에게 사형 선고를 내렸다.","sourcePage":335,"pdfPage":183},{"id":1791,"source":"MAIN","day":"36","word":"clause","entryType":"","meaning":"명 ① 조항 ② 절(節)","example":"A penalty clause has been written into the contract.","translation":"위약금 조항이 계약서에 쓰여 있다.","sourcePage":336,"pdfPage":184},{"id":1792,"source":"MAIN","day":"36","word":"convict","entryType":"","meaning":"동 유죄를 선고하다 / 명 죄인, 죄수","example":"He was convicted of breaking into the house.","translation":"그는 가택 침입죄로 유죄를 선고받았다.","sourcePage":336,"pdfPage":184},{"id":1793,"source":"MAIN","day":"36","word":"innocent","entryType":"","meaning":"형 ① 무죄인, 결백한 ② 순진한","example":"The accused was found innocent.","translation":"그 피고인은 무죄로 밝혀졌다.","sourcePage":336,"pdfPage":184},{"id":1794,"source":"MAIN","day":"36","word":"repent","entryType":"","meaning":"동 후회하다","example":"He came to repent his decision.","translation":"그는 자신의 결정을 후회하게 되었다.","sourcePage":336,"pdfPage":184},{"id":1795,"source":"MAIN","day":"36","word":"release","entryType":"","meaning":"동 ① 풀어 주다, 석방하다 ② 발표하다, 개봉하다 ③ 방출하다 / 명 ① 석방 ② 발표 ③ 방출","example":"The secret agent released the man.","translation":"첩보원이 그 남자를 풀어 주었다.","sourcePage":336,"pdfPage":184},{"id":1796,"source":"MAIN","day":"36","word":"endeavor","entryType":"","meaning":"동 애쓰다, 노력하다 / 명 노력, 시도","example":"He endeavored to bring joy to the lives of sick children.","translation":"그는 몸이 아픈 어린이들의 삶에 기쁨을 가져다주려고 애를 썼다.","sourcePage":337,"pdfPage":185},{"id":1797,"source":"MAIN","day":"36","word":"strive","entryType":"","meaning":"동 ① 노력하다, 애쓰다 ② 투쟁하다","example":"It’s necessary to strive in order to win.","translation":"이기기 위해 노력해야 한다.","sourcePage":337,"pdfPage":185},{"id":1798,"source":"MAIN","day":"36","word":"struggle","entryType":"","meaning":"동 ① 몸부림치다, 투쟁하다, 애쓰다 ② 싸우다, 격투하다 / 명 ① 투쟁, 분투 ② 싸움","example":"The activists struggle for justice and equality.","translation":"운동가들은 정의와 평등을 위해 투쟁한다.","sourcePage":337,"pdfPage":185},{"id":1799,"source":"MAIN","day":"36","word":"dispute","entryType":"","meaning":"동 ① 반박하다 ② 논쟁하다 / 명 논쟁, 분쟁","example":"We disputed whether we would adopt the proposal.","translation":"우리는 그 제안을 채택할지 논쟁했다.","sourcePage":337,"pdfPage":185},{"id":1800,"source":"MAIN","day":"36","word":"challenge","entryType":"","meaning":"동 ① 도전하다 ② 이의를 제기하다 / 명 도전","example":"The findings were challenged for lack of credibility.","translation":"그 연구 결과는 신뢰성이 부족하다는 이유로 이의 제기를 받았다.","sourcePage":337,"pdfPage":185},{"id":1801,"source":"MAIN","day":"37","word":"reconcile","entryType":"","meaning":"동 화해시키다, 조정하다","example":"It’s hard to reconcile your ideal with reality.","translation":"이상과 현실을 조화시키기는 어렵다.","sourcePage":338,"pdfPage":186},{"id":1802,"source":"MAIN","day":"37","word":"pacify","entryType":"","meaning":"동 진정시키다, 평온하게 하다","example":"It was difficult for the police to pacify the angry crowd.","translation":"경찰이 성난 군중을 진정시키는 것은 어려웠다.","sourcePage":338,"pdfPage":186},{"id":1803,"source":"MAIN","day":"37","word":"counsel","entryType":"","meaning":"동 조언하다, 충고하다 / 명 조언, 상담","example":"He counseled me to quit smoking.","translation":"그는 나에게 담배를 끊으라고 조언했다.","sourcePage":338,"pdfPage":186},{"id":1804,"source":"MAIN","day":"37","word":"compromise","entryType":"","meaning":"명 타협, 절충 / 동 타협하다","example":"In the end, they arrived at a compromise.","translation":"결국, 그들은 절충안에 도달했다.","sourcePage":339,"pdfPage":187},{"id":1805,"source":"MAIN","day":"37","word":"council","entryType":"","meaning":"명 의회, 위원회","example":"The city council advises the mayor on what to do.","translation":"시 의회는 시장에게 어떻게 해야 할지 조언한다.","sourcePage":339,"pdfPage":187},{"id":1806,"source":"MAIN","day":"37","word":"commission","entryType":"","meaning":"명 위원회, 위임 / 동 위임하다, 의뢰하다","example":"The UN formed a commission on human rights to promote equality.","translation":"UN은 평등을 증진하기 위해 인권 위원회를 구성했다.","sourcePage":339,"pdfPage":187},{"id":1807,"source":"MAIN","day":"37","word":"politics","entryType":"","meaning":"명 정치, 정치학","example":"It seems that most people have very little interest in politics.","translation":"대부분의 사람들은 정치에 관심이 거의 없는 것 같다.","sourcePage":339,"pdfPage":187},{"id":1808,"source":"MAIN","day":"37","word":"policy","entryType":"","meaning":"명 정책","example":"What is the economic policy of the government?","translation":"정부의 경제 정책은 무엇입니까?","sourcePage":339,"pdfPage":187},{"id":1809,"source":"MAIN","day":"37","word":"diplomacy","entryType":"","meaning":"명 외교(술)","example":"Skillful diplomacy helps to avert war.","translation":"능숙한 외교는 전쟁을 막는 데 도움이 된다.","sourcePage":339,"pdfPage":187},{"id":1810,"source":"MAIN","day":"37","word":"ambassador","entryType":"","meaning":"명 대사, 사절","example":"He was appointed as an ambassador to a country in Africa.","translation":"그는 아프리카의 한 나라에 대사로 임명되었다.","sourcePage":339,"pdfPage":187},{"id":1811,"source":"MAIN","day":"37","word":"mayor","entryType":"","meaning":"명 시장","example":"The mayor announced that she was not going to seek another term.","translation":"시장은 그녀가 다음 임기에 출마하지 않을 것이라고 발표했다.","sourcePage":340,"pdfPage":188},{"id":1812,"source":"MAIN","day":"37","word":"candidate","entryType":"","meaning":"명 후보자, 지원자","example":"She stands out as the leading candidate.","translation":"그녀가 유력한 후보자로 돋보인다.","sourcePage":340,"pdfPage":188},{"id":1813,"source":"MAIN","day":"37","word":"cunning","entryType":"","meaning":"형 약삭빠른, 교활한","example":"He was cunning like a fox.","translation":"그는 여우처럼 교활했다.","sourcePage":340,"pdfPage":188},{"id":1814,"source":"MAIN","day":"37","word":"insurance","entryType":"","meaning":"명 보험","example":"The insurance policy covers all baggage.","translation":"그 보험 약관은 모든 수하물을 보장한다.","sourcePage":340,"pdfPage":188},{"id":1815,"source":"MAIN","day":"37","word":"guarantee","entryType":"","meaning":"동 보증하다, 약속하다 / 명 보증, 보증서","example":"The watch is guaranteed for three years.","translation":"그 시계는 3년간 보증된다.","sourcePage":340,"pdfPage":188},{"id":1816,"source":"MAIN","day":"37","word":"certify","entryType":"","meaning":"동 증명하다, 인증하다","example":"You must certify that you are over the age of 18.","translation":"당신은 18세 이상임을 증명해야 한다.","sourcePage":340,"pdfPage":188},{"id":1817,"source":"MAIN","day":"37","word":"certificate","entryType":"","meaning":"명 증명서, 자격증","example":"A certificate of completion was awarded to all participants.","translation":"참가자 전원에게 수료증이 수여되었다.","sourcePage":340,"pdfPage":188},{"id":1818,"source":"MAIN","day":"37","word":"oath","entryType":"","meaning":"명 맹세, 서약","example":"I take an oath that I will love him forever.","translation":"나는 그를 영원히 사랑할 것이라고 맹세한다.","sourcePage":341,"pdfPage":189},{"id":1819,"source":"MAIN","day":"37","word":"pledge","entryType":"","meaning":"동 서약하다, 맹세하다 / 명 서약, 맹세","example":"Let’s pledge to reduce our carbon footprint.","translation":"탄소 발자국을 줄이겠다고 약속하자.","sourcePage":341,"pdfPage":189},{"id":1820,"source":"MAIN","day":"37","word":"vow","entryType":"","meaning":"동 맹세하다, 서약하다 / 명 맹세, 서약","example":"She vowed she would never play tennis again.","translation":"그녀는 다시는 테니스를 치지 않겠다고 맹세했다.","sourcePage":341,"pdfPage":189},{"id":1821,"source":"MAIN","day":"37","word":"swear","entryType":"","meaning":"동 맹세하다, 욕하다","example":"Do you swear to tell the truth, the whole truth, and nothing but the truth?","translation":"진실을, 모든 진실을, 오직 진실만을 말할 것을 맹세합니까?","sourcePage":341,"pdfPage":189},{"id":1822,"source":"MAIN","day":"37","word":"pinnacle","entryType":"","meaning":"명 정상, 절정","example":"Pop art reached its pinnacle in the United States.","translation":"팝아트는 미국에서 절정에 이르렀다.","sourcePage":341,"pdfPage":189},{"id":1823,"source":"MAIN","day":"37","word":"summit","entryType":"","meaning":"명 정상, 꼭대기 / 정상 회담","example":"We will reach the summit soon.","translation":"우리는 곧 정상에 도착할 것이다.","sourcePage":341,"pdfPage":189},{"id":1824,"source":"MAIN","day":"37","word":"lure","entryType":"","meaning":"명 유혹, 미끼 / 동 유혹하다","example":"Don’t lure him away from his studies.","translation":"그를 공부에서 벗어나도록 유혹하지 마라.","sourcePage":341,"pdfPage":189},{"id":1825,"source":"MAIN","day":"37","word":"allure","entryType":"","meaning":"명 매력, 유혹 / 동 매혹하다, 유혹하다","example":"They allured him into gambling.","translation":"그들은 그를 도박에 빠지도록 유혹했다.","sourcePage":342,"pdfPage":190},{"id":1826,"source":"MAIN","day":"37","word":"tempt","entryType":"","meaning":"동 유혹하다, 꾀다","example":"When I see a pizza, I’m tempted to break my diet.","translation":"나는 피자를 보면 식단을 깨고 싶은 유혹을 느낀다.","sourcePage":342,"pdfPage":190},{"id":1827,"source":"MAIN","day":"37","word":"fascinate","entryType":"","meaning":"동 매혹시키다, 마음을 사로잡다","example":"Her performance fascinated the audience.","translation":"그녀의 공연은 관객의 마음을 사로잡았다.","sourcePage":342,"pdfPage":190},{"id":1828,"source":"MAIN","day":"37","word":"enchant","entryType":"","meaning":"동 매혹시키다, 마법을 걸다","example":"He was enchanted to see her again after so long.","translation":"그는 그렇게 오랜 시간이 지난 후 그녀를 다시 만나 황홀했다.","sourcePage":342,"pdfPage":190},{"id":1829,"source":"MAIN","day":"37","word":"tilt","entryType":"","meaning":"동 기울다, 기울이다, 경사지다","example":"Carl tilted his head and looked sideways at her.","translation":"Carl은 고개를 기울여 그녀를 옆으로 바라보았다.","sourcePage":342,"pdfPage":190},{"id":1830,"source":"MAIN","day":"37","word":"lean","entryType":"","meaning":"동 기대다, 기울다 / 명 경사","example":"The Leaning Tower of Pisa famously leans to one side.","translation":"피사의 사탑은 한쪽으로 기울어져 있는 것으로 유명하다.","sourcePage":342,"pdfPage":190},{"id":1831,"source":"MAIN","day":"37","word":"smuggle","entryType":"","meaning":"동 밀수하다, 밀수입[수출]하다","example":"She smuggled in luxury items.","translation":"그녀는 사치품을 밀수입했다.","sourcePage":343,"pdfPage":191},{"id":1832,"source":"MAIN","day":"37","word":"stalk","entryType":"","meaning":"동 (사람을) 몰래 따라가다, 추적하다","example":"He stalks his victims like a hunter after a deer.","translation":"그는 사슴을 쫓는 사냥꾼처럼 희생자를 뒤쫓는다.","sourcePage":343,"pdfPage":191},{"id":1833,"source":"MAIN","day":"37","word":"lurk","entryType":"","meaning":"동 숨어 있다, 잠복하다","example":"Some uneasiness still lurked in my memory.","translation":"어떤 불안감이 아직도 내 기억에 잠재해 있었다.","sourcePage":343,"pdfPage":191},{"id":1834,"source":"MAIN","day":"37","word":"seal","entryType":"","meaning":"동 봉인하다, 밀봉하다 / 명 봉인, 도장, 바다표범","example":"You have to seal the envelope with some adhesive.","translation":"접착제로 봉투를 밀봉해야 한다.","sourcePage":343,"pdfPage":191},{"id":1835,"source":"MAIN","day":"37","word":"autograph","entryType":"","meaning":"명 자필 서명 / 동 서명하다","example":"Their autographs are common and are not worth much.","translation":"그들의 자필 서명은 흔해서 그리 가치가 크지 않다.","sourcePage":343,"pdfPage":191},{"id":1836,"source":"MAIN","day":"37","word":"carve","entryType":"","meaning":"동 조각하다, 새기다","example":"Americans carve pumpkins but they never use the stem.","translation":"미국인들은 호박을 조각하지만 줄기는 절대 사용하지 않는다.","sourcePage":343,"pdfPage":191},{"id":1837,"source":"MAIN","day":"37","word":"engrave","entryType":"","meaning":"동 새기다, 조각하다","example":"Her name was engraved on the silver cup.","translation":"그녀의 이름이 은잔에 새겨져 있었다.","sourcePage":343,"pdfPage":191},{"id":1838,"source":"MAIN","day":"37","word":"sculpture","entryType":"","meaning":"명 조각(상)","example":"We saw sculptures of ancient Roman gods.","translation":"우리는 고대 로마 신들의 조각상을 보았다.","sourcePage":344,"pdfPage":192},{"id":1839,"source":"MAIN","day":"37","word":"vicinity","entryType":"","meaning":"명 근처, 인접","example":"There is a shopping mall in the immediate vicinity.","translation":"아주 가까운 곳에 쇼핑몰이 하나 있다.","sourcePage":344,"pdfPage":192},{"id":1840,"source":"MAIN","day":"37","word":"proximity","entryType":"","meaning":"명 가까움, 근접","example":"Some species may nest in close proximity to each other.","translation":"어떤 종들은 서로 가까운 곳에 둥지를 틀 수도 있다.","sourcePage":344,"pdfPage":192},{"id":1841,"source":"MAIN","day":"37","word":"adjacent","entryType":"","meaning":"형 인접한, 가까운","example":"The mall is adjacent to our house.","translation":"쇼핑몰은 우리 집과 인접해 있다.","sourcePage":344,"pdfPage":192},{"id":1842,"source":"MAIN","day":"37","word":"adjoin","entryType":"","meaning":"동 인접하다, 붙어 있다, 이웃하다","example":"The buildings adjoin each other.","translation":"그 건물들은 서로 붙어 있다.","sourcePage":344,"pdfPage":192},{"id":1843,"source":"MAIN","day":"37","word":"via","entryType":"","meaning":"전 ~을 경유하여, ~을 거쳐","example":"He went to New York via London.","translation":"그는 런던을 거쳐 뉴욕으로 갔다.","sourcePage":344,"pdfPage":192},{"id":1844,"source":"MAIN","day":"37","word":"trunk","entryType":"","meaning":"명 ① (자동차) 트렁크 ② 큰 여행 가방 ③ 나무의 줄기","example":"They lifted the trunk down from the shelf.","translation":"그들은 여행 가방을 선반에서 바닥으로 내렸다.","sourcePage":344,"pdfPage":192},{"id":1845,"source":"MAIN","day":"37","word":"stroll","entryType":"","meaning":"동 산책하다, 거닐다","example":"The whole family was enjoying a leisurely stroll in the sunshine.","translation":"가족이 모두 햇살 아래 한가로운 산책을 즐기고 있었다.","sourcePage":345,"pdfPage":193},{"id":1846,"source":"MAIN","day":"37","word":"roam","entryType":"","meaning":"동 배회하다, 방랑하다","example":"The traveler roamed around the world.","translation":"그 여행자는 전 세계를 방랑했다.","sourcePage":345,"pdfPage":193},{"id":1847,"source":"MAIN","day":"37","word":"wander","entryType":"","meaning":"동 헤매다, 돌아다니다","example":"I love to wander around taking photos.","translation":"나는 사진을 찍으며 돌아다니는 것을 좋아한다.","sourcePage":345,"pdfPage":193},{"id":1848,"source":"MAIN","day":"37","word":"nomadic","entryType":"","meaning":"형 유목의, 방랑의","example":"The tribe lives a nomadic life.","translation":"그 부족은 유목 생활을 한다.","sourcePage":345,"pdfPage":193},{"id":1849,"source":"MAIN","day":"37","word":"itinerary","entryType":"","meaning":"명 일정, 여행 일정","example":"The itinerary is subject to change due to weather.","translation":"일정은 날씨로 인해 변경될 수 있다.","sourcePage":345,"pdfPage":193},{"id":1850,"source":"MAIN","day":"37","word":"destination","entryType":"","meaning":"명 목적지, 행선지","example":"Only half of the emergency supplies have reached their destination.","translation":"비상 보급품의 절반만이 목적지에 도착했다.","sourcePage":345,"pdfPage":193},{"id":1851,"source":"MAIN","day":"38","word":"overseas","entryType":"","meaning":"형 해외의, 외국의 / 부 해외로","example":"Manufacturing has left the big cities and relocated overseas.","translation":"제조업은 대도시를 벗어나 해외로 옮겨가고 있다.","sourcePage":346,"pdfPage":194},{"id":1852,"source":"MAIN","day":"38","word":"overboard","entryType":"","meaning":"부 배 밖으로 (배 밖에) 물 속으로","example":"He was thrown overboard near the Statue of Liberty.","translation":"그는 자유의 여신상 근처에서 배 밖으로 던져졌다.","sourcePage":346,"pdfPage":194},{"id":1853,"source":"MAIN","day":"38","word":"circulate","entryType":"","meaning":"동 ① 순환하다, 돌다 ② (소문이) 퍼지다, 유포되다","example":"Rumors of his arrest circulated.","translation":"그의 체포에 대한 소문이 퍼졌다.","sourcePage":346,"pdfPage":194},{"id":1854,"source":"MAIN","day":"38","word":"detour","entryType":"","meaning":"명 우회","example":"We had to make a detour.","translation":"우리는 우회해 가야 했다.","sourcePage":346,"pdfPage":194},{"id":1855,"source":"MAIN","day":"38","word":"drift","entryType":"","meaning":"동 표류하다, 떠돌다 / 명 ① 표류 ② 경향","example":"The boat drifted for about six days.","translation":"그 배는 약 6일 동안 표류했다.","sourcePage":347,"pdfPage":195},{"id":1856,"source":"MAIN","day":"38","word":"float","entryType":"","meaning":"동 ① 뜨다, 떠오르다 ② 떠다니다, 떠돌다","example":"Leaves float gently on the surface of water.","translation":"나뭇잎들이 수면 위에 부드럽게 떠다닌다.","sourcePage":347,"pdfPage":195},{"id":1857,"source":"MAIN","day":"38","word":"embark","entryType":"","meaning":"동 ① 승선하다 ② 시작하다","example":"Riders are waiting to embark on the train.","translation":"승객들이 열차에 탑승하려고 기다리고 있다.","sourcePage":347,"pdfPage":195},{"id":1858,"source":"MAIN","day":"38","word":"cruise","entryType":"","meaning":"동 순항하다, 돌아다니다 / 명 순항","example":"We cruised down the coast in our sailboat.","translation":"우리는 요트를 타고 해안을 순항했다.","sourcePage":347,"pdfPage":195},{"id":1859,"source":"MAIN","day":"38","word":"navigate","entryType":"","meaning":"동 ① 항해하다, 조종하다 ② 길을 찾다","example":"The experienced captain navigated the ship safely.","translation":"숙련된 선장이 안전하게 배를 조종했다.","sourcePage":347,"pdfPage":195},{"id":1860,"source":"MAIN","day":"38","word":"steer","entryType":"","meaning":"동 ① 조종하다 ② 이끌다","example":"This boat steers easily.","translation":"이 배는 조종하기가 쉽다.","sourcePage":347,"pdfPage":195},{"id":1861,"source":"MAIN","day":"38","word":"anchor","entryType":"","meaning":"동 정박하다, 닻을 내리다 / 명 ① 닻, 정박 ② 사회자","example":"They anchored the boat.","translation":"그들은 그 배를 정박했다.","sourcePage":347,"pdfPage":195},{"id":1862,"source":"MAIN","day":"38","word":"linger","entryType":"","meaning":"동 오래 머무르다, 남아 있다, 지속되다","example":"The last guests lingered until 2 a.m.","translation":"마지막 손님들이 새벽 2시까지 머물렀다.","sourcePage":347,"pdfPage":195},{"id":1863,"source":"MAIN","day":"38","word":"lodge","entryType":"","meaning":"명 오두막집 / 동 숙박하다, 숙박시키다","example":"The building he was lodged in turned out to be a church.","translation":"그가 숙박했던 그 건물은 교회임이 밝혀졌다.","sourcePage":348,"pdfPage":196},{"id":1864,"source":"MAIN","day":"38","word":"accommodate","entryType":"","meaning":"동 ① 숙박시키다, 수용하다 ② ~에게 편의를 제공하다","example":"Our ship accommodates up to 200.","translation":"우리 배는 200명까지 수용할 수 있다.","sourcePage":348,"pdfPage":196},{"id":1865,"source":"MAIN","day":"38","word":"forage","entryType":"","meaning":"동 먹이를 찾다, ~을 찾다 / 명 사료","example":"Skunks usually forage during the night.","translation":"스컹크는 주로 밤에 먹이를 찾는다.","sourcePage":348,"pdfPage":196},{"id":1866,"source":"MAIN","day":"38","word":"burglar","entryType":"","meaning":"명 강도, 도둑","example":"He chased after the burglar but couldn't catch him.","translation":"그는 도둑을 쫓아갔지만 잡지 못했다.","sourcePage":348,"pdfPage":196},{"id":1867,"source":"MAIN","day":"38","word":"scout","entryType":"","meaning":"명 정찰(병) / 동 정찰하다, 수색하다","example":"The police officer was on the scout.","translation":"그 경찰은 정찰 중이었다.","sourcePage":348,"pdfPage":196},{"id":1868,"source":"MAIN","day":"38","word":"patrol","entryType":"","meaning":"동 순찰하다, 돌아다니다 / 명 순찰, 순찰대","example":"He was starting patrol when I was leaving.","translation":"내가 떠날 때 그는 순찰을 시작하고 있었다.","sourcePage":348,"pdfPage":196},{"id":1869,"source":"MAIN","day":"38","word":"pedestrian","entryType":"","meaning":"명 보행자 / 형 보행의, 도보의","example":"The driver hit a pedestrian on the street.","translation":"그 운전자가 길에서 보행자를 치었다.","sourcePage":348,"pdfPage":196},{"id":1870,"source":"MAIN","day":"38","word":"scrutinize","entryType":"","meaning":"동 세심히 살피다, 면밀히 조사하다","example":"He scrutinized her face.","translation":"그는 그녀의 얼굴을 세심히 살폈다.","sourcePage":349,"pdfPage":197},{"id":1871,"source":"MAIN","day":"38","word":"probe","entryType":"","meaning":"동 ① 엄밀히 조사하다 ② 규명하다 / 명 ① 철저한 조사 ② 탐사선","example":"Firefighters created a special team to probe the cause of the fire.","translation":"소방관들은 화재의 원인을 엄밀히 조사하기 위해 특별팀을 만들었다.","sourcePage":349,"pdfPage":197},{"id":1872,"source":"MAIN","day":"38","word":"investigate","entryType":"","meaning":"동 조사하다, 연구하다","example":"The air force will investigate the wreck tomorrow.","translation":"공군은 내일 난파선의 잔해를 조사할 것이다.","sourcePage":349,"pdfPage":197},{"id":1873,"source":"MAIN","day":"38","word":"overhaul","entryType":"","meaning":"동 ① (기계·시스템을) 점검하다, 정밀 조사하다 ② (경주에서 남을) 앞지르다","example":"The institution has recently overhauled the political system.","translation":"그 기관은 최근 정치 체계를 철저히 조사했다.","sourcePage":349,"pdfPage":197},{"id":1874,"source":"MAIN","day":"38","word":"scatter","entryType":"","meaning":"동 흩뿌리다, 흩어지게 하다","example":"The farmer scattered seeds on his field at planting time.","translation":"그 농부는 농작물을 심는 시기에 그의 밭에 씨를 뿌렸다.","sourcePage":349,"pdfPage":197},{"id":1875,"source":"MAIN","day":"38","word":"disperse","entryType":"","meaning":"동 ① 흩어지다, 해산시키다 ② 퍼뜨리다, 보급하다","example":"Police used tear gas to disperse the crowds.","translation":"경찰이 군중을 해산시키기 위해 최루탄을 사용했다.","sourcePage":349,"pdfPage":197},{"id":1876,"source":"MAIN","day":"38","word":"diffuse","entryType":"","meaning":"형 널리 퍼진 ② 산만한, 장황한 / 동 ① 퍼뜨리다, 분산시키다 ② 퍼지다","example":"The problem is how to diffuse power without creating anarchy.","translation":"문제는 어떻게 하면 무질서 없이 권력을 분산시키느냐이다.","sourcePage":350,"pdfPage":198},{"id":1877,"source":"MAIN","day":"38","word":"split","entryType":"","meaning":"동 나누다, 쪼개다 / 명 분열","example":"The boys split the pie into three equal portions.","translation":"소년들이 그 파이를 조각으로 균등하게 나누었다.","sourcePage":350,"pdfPage":198},{"id":1878,"source":"MAIN","day":"38","word":"remnant","entryType":"","meaning":"명 나머지, 잔여","example":"Throw away the remnants of last night's meal.","translation":"어젯밤 식사의 나머지는 버려라.","sourcePage":350,"pdfPage":198},{"id":1879,"source":"MAIN","day":"38","word":"leftover","entryType":"","meaning":"명 ① 나머지, 남은 음식 ② 잔재, 유물 / 형 나머지의, 먹다 남은","example":"The dog ate up all the leftovers.","translation":"개가 남은 음식을 모두 먹어치웠다.","sourcePage":350,"pdfPage":198},{"id":1880,"source":"MAIN","day":"38","word":"by-product","entryType":"","meaning":"명 ① 부산물 ② 부작용","example":"Carbon dioxide is a by-product of respiration.","translation":"이산화탄소는 호흡의 부산물이다.","sourcePage":350,"pdfPage":198},{"id":1881,"source":"MAIN","day":"38","word":"peripheral","entryType":"","meaning":"형 주변적인, 지엽적인","example":"Fund-raising is peripheral to our main activities.","translation":"기금 조성 활동은 우리의 주된 활동에 비해 지엽적이다.","sourcePage":350,"pdfPage":198},{"id":1882,"source":"MAIN","day":"38","word":"annex","entryType":"","meaning":"동 ① (영토 등을) 합병하다 ② 추가하다 / 명 부가물, (건물의) 별관","example":"Britain annexed the Malta in 1814.","translation":"영국은 몰타섬을 1814년에 합병했다.","sourcePage":351,"pdfPage":199},{"id":1883,"source":"MAIN","day":"38","word":"dusk","entryType":"","meaning":"명 황혼, 땅거미","example":"We arrived home at dusk.","translation":"우리는 땅거미가 질 무렵에 집에 도착했다.","sourcePage":351,"pdfPage":199},{"id":1884,"source":"MAIN","day":"38","word":"twilight","entryType":"","meaning":"명 여명(기), 황혼(기)","example":"Driving at twilight is dangerous.","translation":"여명기에 운전하는 것은 위험하다.","sourcePage":351,"pdfPage":199},{"id":1885,"source":"MAIN","day":"38","word":"cherish","entryType":"","meaning":"동 소중히 하다","example":"We should cherish the love.","translation":"우리는 사랑을 소중히 여겨야 한다.","sourcePage":351,"pdfPage":199},{"id":1886,"source":"MAIN","day":"38","word":"precious","entryType":"","meaning":"형 귀중한, 소중한","example":"Nothing is more precious than health.","translation":"건강보다 소중한 것은 없다.","sourcePage":351,"pdfPage":199},{"id":1887,"source":"MAIN","day":"38","word":"embrace","entryType":"","meaning":"동 ① 포옹하다, 껴안다 ② 받아들이다 / 명 ① 포옹 ② 수락","example":"The mother embraced her child tightly.","translation":"엄마는 자기 아이를 꼭 끌어안았다.","sourcePage":351,"pdfPage":199},{"id":1888,"source":"MAIN","day":"38","word":"pastime","entryType":"","meaning":"명 취미, 기분 전환, 오락","example":"I think that the world's favorite pastime would be watching TV.","translation":"내 생각에 전 세계 사람들이 가장 좋아하는 취미는 TV 시청이 아닐까 싶다.","sourcePage":351,"pdfPage":199},{"id":1889,"source":"MAIN","day":"38","word":"chore","entryType":"","meaning":"명 ① 정기적·일상적으로 하는 일 ② 힘든(집안의) 일","example":"She finds shopping a chore.","translation":"그녀는 쇼핑을 하기 싫은 일이라고 생각한다.","sourcePage":352,"pdfPage":200},{"id":1890,"source":"MAIN","day":"38","word":"chop","entryType":"","meaning":"동 자르다 / 명 절단","example":"He chopped a branch off the tree.","translation":"그는 나무에서 가지 하나를 잘라 내었다.","sourcePage":352,"pdfPage":200},{"id":1891,"source":"MAIN","day":"38","word":"misery","entryType":"","meaning":"명 불행, (정신적) 고통","example":"Virtue leads to happiness, and vice to misery.","translation":"덕행은 행복에 이르는 길이요, 악덕은 불행에 이르는 길이다.","sourcePage":352,"pdfPage":200},{"id":1892,"source":"MAIN","day":"38","word":"anguish","entryType":"","meaning":"명 극심한 고통, 고뇌 / 동 괴롭히다, 괴로워하다","example":"His soul was filled with anguish.","translation":"그의 영혼은 고뇌에 차 있었다.","sourcePage":352,"pdfPage":200},{"id":1893,"source":"MAIN","day":"38","word":"agony","entryType":"","meaning":"명 극심한 고통","example":"She rolled around the floor in agony.","translation":"그녀는 극심한 고통으로 바닥에서 데굴데굴 굴렀다.","sourcePage":352,"pdfPage":200},{"id":1894,"source":"MAIN","day":"38","word":"distress","entryType":"","meaning":"명 고통, 괴로움 / 동 괴롭히다","example":"Mark showed no outward signs of distress.","translation":"Mark는 겉으로는 전혀 괴로운 표시를 보이지 않았다.","sourcePage":352,"pdfPage":200},{"id":1895,"source":"MAIN","day":"38","word":"torment","entryType":"","meaning":"명 고통, 고뇌, 고민거리 / 동 괴롭히다, 고문하다","example":"I suffered mental torment after the incident.","translation":"나는 그 사건 이후 정신적 고통을 겪었다.","sourcePage":353,"pdfPage":201},{"id":1896,"source":"MAIN","day":"38","word":"torture","entryType":"","meaning":"동 고문하다, 괴롭히다 / 명 고문, 심한 고통","example":"He confessed under torture.","translation":"그는 고문을 당하여 자백했다.","sourcePage":353,"pdfPage":201},{"id":1897,"source":"MAIN","day":"38","word":"distort","entryType":"","meaning":"동 비틀다, 왜곡하다","example":"Many factors can distort the result.","translation":"많은 요인이 결과를 왜곡할 수 있다.","sourcePage":353,"pdfPage":201},{"id":1898,"source":"MAIN","day":"38","word":"pity","entryType":"","meaning":"명 동정, 연민 / 동 동정을 느끼다","example":"I feel such pity for those poor starving children in Africa.","translation":"나는 아프리카에서 굶주리는 불쌍한 아이들에게 너무나 동정심을 느껴.","sourcePage":353,"pdfPage":201},{"id":1899,"source":"MAIN","day":"38","word":"compassion","entryType":"","meaning":"명 연민, 동정","example":"Her compassion for others led her to volunteer abroad.","translation":"그녀의 타인에 대한 연민은 그녀를 해외에서 봉사하도록 이끌었다.","sourcePage":353,"pdfPage":201},{"id":1900,"source":"MAIN","day":"38","word":"cordial","entryType":"","meaning":"형 진심의, 다정한","example":"Colleagues thought him cordial.","translation":"동료들은 그가 다정하다고 생각했다.","sourcePage":353,"pdfPage":201},{"id":1901,"source":"MAIN","day":"39","word":"gratify","entryType":"","meaning":"동 만족시키다","example":"This book gratifies my desire for knowledge.","translation":"이 책은 지식에 대한 나의 욕구를 만족시켜 준다.","sourcePage":354,"pdfPage":202},{"id":1902,"source":"MAIN","day":"39","word":"grateful","entryType":"","meaning":"형 고마워하는, 감사하는","example":"The community is grateful for your assistance.","translation":"그 지역 사회는 당신의 도움에 고마워하고 있다.","sourcePage":354,"pdfPage":202},{"id":1903,"source":"MAIN","day":"39","word":"disgrace","entryType":"","meaning":"명 불명예 / 동 더럽히다","example":"The president had to resign in disgrace.","translation":"대통령은 불명예스럽게 사임해야만 했다.","sourcePage":354,"pdfPage":202},{"id":1904,"source":"MAIN","day":"39","word":"stigma","entryType":"","meaning":"명 낙인","example":"He has the stigma of having a criminal record.","translation":"그는 전과 기록이 있다는 낙인이 찍혀 있다.","sourcePage":355,"pdfPage":203},{"id":1905,"source":"MAIN","day":"39","word":"grudge","entryType":"","meaning":"명 원한, 유감 / 동 억울해하다, 아까워하다","example":"He grudges having to pay so much tax.","translation":"그는 그렇게 많은 세금을 내야 하는 것에 억울해한다.","sourcePage":355,"pdfPage":203},{"id":1906,"source":"MAIN","day":"39","word":"dilettante","entryType":"","meaning":"명 아마추어 애호가, 호사가","example":"She's a professional artist, not a dilettante.","translation":"그녀는 전문적인 화가이지, 아마추어 애호가가 아니다.","sourcePage":355,"pdfPage":203},{"id":1907,"source":"MAIN","day":"39","word":"addict","entryType":"","meaning":"동 중독시키다 / 명 중독자","example":"Everybody knows she is a chocolate addict.","translation":"모두 그녀가 초콜릿 중독자라는 것을 안다.","sourcePage":355,"pdfPage":203},{"id":1908,"source":"MAIN","day":"39","word":"blatant","entryType":"","meaning":"형 노골적인, 명백한","example":"There was a blatant attempt to buy votes.","translation":"표를 얻으려는 노골적인 시도가 있었다.","sourcePage":355,"pdfPage":203},{"id":1909,"source":"MAIN","day":"39","word":"impudent","entryType":"","meaning":"형 무례한, 뻔뻔스러운","example":"The interviewer asked me an impudent question.","translation":"그 면접관은 나에게 무례한 질문을 했다.","sourcePage":355,"pdfPage":203},{"id":1910,"source":"MAIN","day":"39","word":"conscience","entryType":"","meaning":"명 양심","example":"We want our children to develop a conscience.","translation":"우리는 우리 아이들이 양심을 기르기를 바란다.","sourcePage":355,"pdfPage":203},{"id":1911,"source":"MAIN","day":"39","word":"impending","entryType":"","meaning":"형 임박한, 곧 일어날","example":"A trial for one person is impending.","translation":"한 사람에 대한 재판이 임박했다.","sourcePage":356,"pdfPage":204},{"id":1912,"source":"MAIN","day":"39","word":"imminent","entryType":"","meaning":"형 긴박한, 임박한","example":"We are awaiting their imminent arrival.","translation":"우리는 그들의 임박한 도착을 기다리고 있다.","sourcePage":356,"pdfPage":204},{"id":1913,"source":"MAIN","day":"39","word":"intrude","entryType":"","meaning":"동 침입하다, 간섭[개입]하다","example":"Do not intrude upon somebody's privacy.","translation":"남의 사생활에 간섭하지 마라.","sourcePage":356,"pdfPage":204},{"id":1914,"source":"MAIN","day":"39","word":"invade","entryType":"","meaning":"동 침입[침략]하다, 침해하다","example":"The foreign army attempted to invade the coastal region.","translation":"외국 군대가 해안 지역을 침략하려고 했다.","sourcePage":356,"pdfPage":204},{"id":1915,"source":"MAIN","day":"39","word":"assault","entryType":"","meaning":"명 공격, 폭행 / 동 공격하다","example":"Both men were charged with assault.","translation":"그 남자들은 둘 다 폭행으로 기소되었다.","sourcePage":356,"pdfPage":204},{"id":1916,"source":"MAIN","day":"39","word":"assail","entryType":"","meaning":"동 맹렬히 공격하다, 괴롭히다","example":"The enemy assailed our castle.","translation":"적군이 우리 성을 맹렬히 공격했다.","sourcePage":356,"pdfPage":204},{"id":1917,"source":"MAIN","day":"39","word":"rebel","entryType":"","meaning":"명 반역자, 저항자 / 동 반항하다, 저항하다","example":"The colony rebelled against the rule of the oppressive king.","translation":"식민지는 폭군의 통치에 반기를 들었다.","sourcePage":356,"pdfPage":204},{"id":1918,"source":"MAIN","day":"39","word":"defy","entryType":"","meaning":"동 반항[도전]하다, 무시하다","example":"I wouldn't have dared to defy my teachers.","translation":"나라면 선생님들에게 감히 반항하지 못했을 것이다.","sourcePage":357,"pdfPage":205},{"id":1919,"source":"MAIN","day":"39","word":"resist","entryType":"","meaning":"동 반대하다, 저항하다","example":"Teenagers may find it difficult to resist peer pressure.","translation":"십 대들은 또래의 압력에 저항하는 것이 어려워할 수도 있다.","sourcePage":357,"pdfPage":205},{"id":1920,"source":"MAIN","day":"39","word":"confront","entryType":"","meaning":"동 직면하다, 마주치다, 맞서다, 대항하다","example":"She knew that she had to confront her fears.","translation":"그녀는 자신의 공포감에 맞서야 한다는 것을 알고 있었다.","sourcePage":357,"pdfPage":205},{"id":1921,"source":"MAIN","day":"39","word":"protest","entryType":"","meaning":"동 항의하다, 주장하다 / 명 시위, 주장","example":"That protest exploded into a riot.","translation":"그 시위가 폭발하여 폭동이 되었다.","sourcePage":357,"pdfPage":205},{"id":1922,"source":"MAIN","day":"39","word":"mess","entryType":"","meaning":"명 상태, 난장판 / 동 엉망으로 만들다","example":"Don’t mess up my clean room.","translation":"내 깨끗한 방을 어지럽히지 마라.","sourcePage":357,"pdfPage":205},{"id":1923,"source":"MAIN","day":"39","word":"entangle","entryType":"","meaning":"동 얽히게 하다, 복잡하게 하다","example":"Long threads are easily entangled.","translation":"긴 실은 쉽게 엉킨다.","sourcePage":357,"pdfPage":205},{"id":1924,"source":"MAIN","day":"39","word":"intricate","entryType":"","meaning":"형 복잡한, 정교한","example":"My sweater has an intricate design.","translation":"내 스웨터는 디자인이 복잡하다.","sourcePage":357,"pdfPage":205},{"id":1925,"source":"MAIN","day":"39","word":"chaos","entryType":"","meaning":"명 혼돈, 무질서","example":"The political situation of the country is in chaos.","translation":"그 나라의 정치적 상황은 혼돈 상태에 있다.","sourcePage":358,"pdfPage":206},{"id":1926,"source":"MAIN","day":"39","word":"turmoil","entryType":"","meaning":"명 혼란, 동요","example":"The whole class is in turmoil.","translation":"학급 전체가 혼란에 빠졌다.","sourcePage":358,"pdfPage":206},{"id":1927,"source":"MAIN","day":"39","word":"uproar","entryType":"","meaning":"명 소란, 소동","example":"The meeting ended in uproar.","translation":"그 모임은 소란 속에 끝났다.","sourcePage":358,"pdfPage":206},{"id":1928,"source":"MAIN","day":"39","word":"uprising","entryType":"","meaning":"명 폭동, 반란","example":"The civil uprising was put down very quickly.","translation":"시민 반란은 매우 빠르게 진압되었다.","sourcePage":358,"pdfPage":206},{"id":1929,"source":"MAIN","day":"39","word":"ruin","entryType":"","meaning":"명 파괴, 파멸 / 동 폐허로 만들다, 파멸시키다","example":"Idleness leads to ruin.","translation":"나태는 파멸을 초래한다.","sourcePage":358,"pdfPage":206},{"id":1930,"source":"MAIN","day":"39","word":"wreck","entryType":"","meaning":"동 망가뜨리다, 난파시키다 / 명 난파, (사고) 잔해","example":"The ship was wrecked.","translation":"그 배는 난파당했다.","sourcePage":358,"pdfPage":206},{"id":1931,"source":"MAIN","day":"39","word":"demolish","entryType":"","meaning":"동 부수다, 허물다","example":"The building has long since been demolished.","translation":"그 건물은 허물어진 지가 오래되었다.","sourcePage":358,"pdfPage":206},{"id":1932,"source":"MAIN","day":"39","word":"violate","entryType":"","meaning":"동 (법 등을) 위반하다, 어기다 / (사생활 등을) 침해하다","example":"The policeman stopped her from violating a traffic law.","translation":"경찰관은 그녀가 교통법규를 위반하지 않도록 했다.","sourcePage":359,"pdfPage":207},{"id":1933,"source":"MAIN","day":"39","word":"breach","entryType":"","meaning":"동 위반하다, 어기다 / 명 위반, 불이행","example":"That one cost them ten thousand pounds in breach of contract.","translation":"계약 위반으로 그들은 만 파운드를 물어야 했다.","sourcePage":359,"pdfPage":207},{"id":1934,"source":"MAIN","day":"39","word":"infringe","entryType":"","meaning":"동 위반하다, 침해하다","example":"Their actions are likely to infringe a copyright.","translation":"그들의 행동들은 저작권을 침해할 가능성이 있다.","sourcePage":359,"pdfPage":207},{"id":1935,"source":"MAIN","day":"39","word":"spoil","entryType":"","meaning":"동 망치다, 상하게 하다","example":"The heavy rain spoiled the crops.","translation":"큰비가 농작물을 망쳤다.","sourcePage":359,"pdfPage":207},{"id":1936,"source":"MAIN","day":"39","word":"worsen","entryType":"","meaning":"동 악화되다, 악화시키다","example":"Ignoring the issue will only worsen it.","translation":"그 문제를 무시하는 것은 그것을 악화시킬 뿐이다.","sourcePage":359,"pdfPage":207},{"id":1937,"source":"MAIN","day":"39","word":"exacerbate","entryType":"","meaning":"동 악화시키다","example":"He hurt his foot, and walking on it exacerbated the pain.","translation":"그는 발을 다쳤고, 그 발로 걸으면 통증이 심해졌다.","sourcePage":359,"pdfPage":207},{"id":1938,"source":"MAIN","day":"39","word":"aggravate","entryType":"","meaning":"동 악화시키다","example":"Their help aggravated the situation even further.","translation":"그들의 도움은 상황을 더욱 악화시켰다.","sourcePage":360,"pdfPage":208},{"id":1939,"source":"MAIN","day":"39","word":"deteriorate","entryType":"","meaning":"동 악화되다, 더 나빠지다 / 악화시키다, 저하시키다","example":"Planes deteriorate quickly in high humidity.","translation":"높은 습도에서 비행기는 빠르게 나빠진다.","sourcePage":360,"pdfPage":208},{"id":1940,"source":"MAIN","day":"39","word":"blunt","entryType":"","meaning":"형 직설적인, 퉁명스러운 / 동 무디게 하다","example":"He was sawing the bread with a blunt knife.","translation":"그는 무딘 칼로 빵을 톱질하듯 자르고 있었다.","sourcePage":360,"pdfPage":208},{"id":1941,"source":"MAIN","day":"39","word":"unerring","entryType":"","meaning":"형 항상 정확한","example":"He is unerring in his judgment.","translation":"그는 판단에 있어 항상 정확하다.","sourcePage":360,"pdfPage":208},{"id":1942,"source":"MAIN","day":"39","word":"infallible","entryType":"","meaning":"형 틀림이 없는, 절대 확실한","example":"She is infallible in her judgment.","translation":"그녀의 판단에는 틀림이 없다.","sourcePage":360,"pdfPage":208},{"id":1943,"source":"MAIN","day":"39","word":"fallacy","entryType":"","meaning":"명 잘못된 생각, 착오","example":"I detected the fallacy of her argument.","translation":"나는 그녀의 주장에 담긴 오류를 발견했다.","sourcePage":360,"pdfPage":208},{"id":1944,"source":"MAIN","day":"39","word":"fortify","entryType":"","meaning":"동 강화하다, 요새화하다","example":"They fortified their determination.","translation":"그들은 자신의 결의를 강화했다.","sourcePage":361,"pdfPage":209},{"id":1945,"source":"MAIN","day":"39","word":"reinforce","entryType":"","meaning":"동 강화하다, 보강하다","example":"The TV show reinforced racial stereotypes.","translation":"그 TV 쇼는 인종적 고정관념을 강화했다.","sourcePage":361,"pdfPage":209},{"id":1946,"source":"MAIN","day":"39","word":"underpin","entryType":"","meaning":"동 뒷받침하다, 보강하다, 지지하다","example":"It is impossible to underpin the argument.","translation":"그 주장을 뒷받침하는 것은 불가능하다.","sourcePage":361,"pdfPage":209},{"id":1947,"source":"MAIN","day":"39","word":"uphold","entryType":"","meaning":"동 지지하다, 떠받치다","example":"He tends to uphold the tradition.","translation":"그는 전통을 지지하는 경향이 있다.","sourcePage":361,"pdfPage":209},{"id":1948,"source":"MAIN","day":"39","word":"gloomy","entryType":"","meaning":"형 어둑어둑한, 음울한, 울적한","example":"My gloomy feelings were disappearing.","translation":"나의 음울한 기분은 사라지고 있었다.","sourcePage":361,"pdfPage":209},{"id":1949,"source":"MAIN","day":"39","word":"dismal","entryType":"","meaning":"형 음울한, 울적하게 하는, 음산한","example":"The atmosphere of the hospital is pretty dismal.","translation":"병원의 분위기는 꽤 음산하다.","sourcePage":361,"pdfPage":209},{"id":1950,"source":"MAIN","day":"39","word":"dismay","entryType":"","meaning":"명 당황, 실망 / 동 당황하게 하다, 실망시키다","example":"He was dismayed to know that he couldn't find his wallet.","translation":"그는 자신의 지갑을 찾을 수 없다는 것을 알고 실망했다.","sourcePage":361,"pdfPage":209},{"id":1951,"source":"MAIN","day":"40","word":"dreary","entryType":"","meaning":"형 ① 쓸쓸한, 황량한 ② 따분한, 지루한","example":"Suppose plants were not to flower, how dreary nature would be!","translation":"만일 초목에 꽃이 피지 않는다면, 자연은 얼마나 쓸쓸할까!","sourcePage":362,"pdfPage":210},{"id":1952,"source":"MAIN","day":"40","word":"solemn","entryType":"","meaning":"형 ① 엄숙한, 근엄한 ② 중대한","example":"His solemn face broke into smiles.","translation":"그의 근엄한 얼굴에서 미소가 번져 나왔다.","sourcePage":362,"pdfPage":210},{"id":1953,"source":"MAIN","day":"40","word":"fuss","entryType":"","meaning":"명 ① 야단법석, 호들갑 ② 불평","example":"Don't make a fuss about a minor thing like that.","translation":"그렇게 사소한 일을 가지고 야단법석 떨지 마라.","sourcePage":362,"pdfPage":210},{"id":1954,"source":"MAIN","day":"40","word":"dominate","entryType":"","meaning":"동 지배하다, 우세하다","example":"The company dominates the sector with more than a 50 percent market share.","translation":"그 회사는 50%가 넘는 시장 점유율로 그 분야를 지배하고 있다.","sourcePage":362,"pdfPage":210},{"id":1955,"source":"MAIN","day":"40","word":"predominant","entryType":"","meaning":"형 ① 우세한 ② 두드러진, 뚜렷한 / 동 predominant: 지배하다, 우세하다","example":"The predominant feature of his character was pride.","translation":"그가 지닌 성격의 두드러진 특징은 자존심이었다.","sourcePage":363,"pdfPage":211},{"id":1956,"source":"MAIN","day":"40","word":"conjunction","entryType":"","meaning":"명 ① 결합, 합동 ② 접속사","example":"I'm willing to work in conjunction with you.","translation":"나는 당신과 함께 기꺼이 일할 의향이 있다.","sourcePage":363,"pdfPage":211},{"id":1957,"source":"MAIN","day":"40","word":"collaborate","entryType":"","meaning":"동 협력하다, 공동으로 일하다","example":"One needs to collaborate with peers to get work done.","translation":"일을 끝내려면 동료들과 협력해야 한다.","sourcePage":363,"pdfPage":211},{"id":1958,"source":"MAIN","day":"40","word":"cooperate","entryType":"","meaning":"동 협력하다, 협조하다","example":"They got a chance to cooperate with a major company.","translation":"그들은 대기업과 협력할 기회를 얻었다.","sourcePage":363,"pdfPage":211},{"id":1959,"source":"MAIN","day":"40","word":"ally","entryType":"","meaning":"동 동맹하다, 연합하다 / 명 동맹국, 동맹자","example":"Japan was once allied with England.","translation":"일본은 한때 영국과 동맹을 맺었었다.","sourcePage":363,"pdfPage":211},{"id":1960,"source":"MAIN","day":"40","word":"align","entryType":"","meaning":"동 ① 일직선으로 하다, 정렬시키다 ② 조정하다 ③ ~와 연합하다","example":"We have to align those two agendas.","translation":"우리는 그 두 안건을 조정해야 한다.","sourcePage":363,"pdfPage":211},{"id":1961,"source":"MAIN","day":"40","word":"associate","entryType":"","meaning":"동 ① 연상하다, 연관시키다 (A with B) ② 어울리다, 교제하다 (with) / 명 ① 동료 ② 제휴사","example":"Ghosts and witches are still associated with Halloween.","translation":"유령과 마녀는 여전히 할로윈과 연관된다.","sourcePage":363,"pdfPage":211},{"id":1962,"source":"MAIN","day":"40","word":"organize","entryType":"","meaning":"동 ① 조직하다, 구성하다 ② 정리하다","example":"The event will be organized by one of the leading department stores.","translation":"그 행사는 유명한 백화점 중 하나가 조직할 예정이다.","sourcePage":364,"pdfPage":212},{"id":1963,"source":"MAIN","day":"40","word":"coordinate","entryType":"","meaning":"동 ① 조정하다 ② 조화시키다 ③ 조직화하다 / 형 동등한","example":"We need someone to coordinate the campaign.","translation":"우리는 캠페인을 조정할 사람이 필요하다.","sourcePage":364,"pdfPage":212},{"id":1964,"source":"MAIN","day":"40","word":"subordinate","entryType":"","meaning":"형 종속된, 부수적인 / 명 부하 / 동 복종시키다","example":"I have five direct subordinates.","translation":"나에게는 다섯 명의 직속 부하가 있다.","sourcePage":364,"pdfPage":212},{"id":1965,"source":"MAIN","day":"40","word":"loyal","entryType":"","meaning":"형 충성스러운","example":"Soldiers are loyal to their own countries.","translation":"군인들은 자신의 나라에 충성스럽다.","sourcePage":364,"pdfPage":212},{"id":1966,"source":"MAIN","day":"40","word":"fidelity","entryType":"","meaning":"명 충실, 충성","example":"A dog's fidelity is stronger than that of a cat.","translation":"개의 충성심이 고양이보다 강하다.","sourcePage":364,"pdfPage":212},{"id":1967,"source":"MAIN","day":"40","word":"fling","entryType":"","meaning":"동 내던지다 / 명 내던지기, 투척","example":"He flung his books on the desk.","translation":"그는 책들을 책상에 내던졌다.","sourcePage":364,"pdfPage":212},{"id":1968,"source":"MAIN","day":"40","word":"hurl","entryType":"","meaning":"동 던지다, 내던지다","example":"They began to hurl stones at the police.","translation":"그들은 경찰에게 돌을 던지기 시작했다.","sourcePage":364,"pdfPage":212},{"id":1969,"source":"MAIN","day":"40","word":"saturate","entryType":"","meaning":"동 ① 흠뻑 적시다 ② 포화시키다, 과잉 공급하다","example":"The continuous rain saturated the soil.","translation":"계속 내린 비가 땅을 흠뻑 적셨다.","sourcePage":365,"pdfPage":213},{"id":1970,"source":"MAIN","day":"40","word":"soak","entryType":"","meaning":"동 (물에) 젖다, 잠기다, 스며들다","example":"My shoes are soaked through.","translation":"내 신발은 완전히 젖었다.","sourcePage":365,"pdfPage":213},{"id":1971,"source":"MAIN","day":"40","word":"dip","entryType":"","meaning":"동 ① 담그다, 적시다 ② 떨어지다","example":"He dipped his brush into the paint and began drawing.","translation":"그는 붓을 물감에 적셔서 그림을 그리기 시작했다.","sourcePage":365,"pdfPage":213},{"id":1972,"source":"MAIN","day":"40","word":"penetrate","entryType":"","meaning":"동 ① 꿰뚫다, 관통하다 ② 침투하다, 스며들다","example":"The flashlight penetrated the darkness.","translation":"손전등 불빛이 어둠을 꿰뚫었다.","sourcePage":365,"pdfPage":213},{"id":1973,"source":"MAIN","day":"40","word":"irrigate","entryType":"","meaning":"동 (땅에) 물을 대다, 관개하다","example":"He built reservoirs to irrigate land in the southern region.","translation":"그는 남쪽 지역 땅에 물을 대기 위해 저수지를 만들었다.","sourcePage":365,"pdfPage":213},{"id":1974,"source":"MAIN","day":"40","word":"pave","entryType":"","meaning":"동 (도로를) 포장하다","example":"Heaven is just like streets paved with gold.","translation":"천국은 마치 금으로 포장된 거리와 같다.","sourcePage":365,"pdfPage":213},{"id":1975,"source":"MAIN","day":"40","word":"commerce","entryType":"","meaning":"명 무역, 상업","example":"The music business combines art with commerce.","translation":"음악 사업은 예술과 상업을 결합시킨다.","sourcePage":365,"pdfPage":213},{"id":1976,"source":"MAIN","day":"40","word":"merchant","entryType":"","meaning":"명 상인","example":"The merchants in my town advertise in the newspaper.","translation":"우리 동네 상인들은 신문에 광고를 한다.","sourcePage":366,"pdfPage":214},{"id":1977,"source":"MAIN","day":"40","word":"vendor","entryType":"","meaning":"명 행상, (노점) 상인","example":"He's been working as a street vendor selling flowers.","translation":"그는 꽃을 파는 거리 상인으로 일해 오고 있다.","sourcePage":366,"pdfPage":214},{"id":1978,"source":"MAIN","day":"40","word":"agent","entryType":"","meaning":"명 ① 동인(動因), 행위자 ② 요원 ③ 대리인, 중개상","example":"Fear can be a powerful agent of motivation.","translation":"두려움은 동기 부여의 강력한 동인이 될 수 있다.","sourcePage":366,"pdfPage":214},{"id":1979,"source":"MAIN","day":"40","word":"wholesaler","entryType":"","meaning":"명 도매업자","example":"Analysts say that Hite shares the same wholesaler network as Jinro.","translation":"분석가들은 하이트가 진로와 동일한 도매 유통망을 이용하고 있다고 말한다.","sourcePage":366,"pdfPage":214},{"id":1980,"source":"MAIN","day":"40","word":"auction","entryType":"","meaning":"명 경매 / 동 경매하다","example":"They're holding an auction of jewelry on Thursday.","translation":"그들은 목요일에 보석 경매를 열 것이다.","sourcePage":366,"pdfPage":214},{"id":1981,"source":"MAIN","day":"40","word":"monopoly","entryType":"","meaning":"명 독점, 전매","example":"The company has a virtual monopoly.","translation":"그 회사가 사실상 독점권을 쥐고 있다.","sourcePage":366,"pdfPage":214},{"id":1982,"source":"MAIN","day":"40","word":"barter","entryType":"","meaning":"동 물물교환하다, 교역하다 / 명 물물교환, 교환물","example":"We work on the barter system.","translation":"우리는 물물교환 시스템에서 일한다.","sourcePage":367,"pdfPage":215},{"id":1983,"source":"MAIN","day":"40","word":"secondhand","entryType":"","meaning":"형 ① 간접적인 ② (상품이) 중고의","example":"Buying a secondhand car can be a risky business.","translation":"중고차를 사는 것은 위험한 일일 수 있다.","sourcePage":367,"pdfPage":215},{"id":1984,"source":"MAIN","day":"40","word":"discount","entryType":"","meaning":"동 ① 무시하다 ② 할인하다 / 명 할인","example":"The company decided to discount the risks involved.","translation":"그 회사는 관련된 위험을 무시하기로 결정했다.","sourcePage":367,"pdfPage":215},{"id":1985,"source":"MAIN","day":"40","word":"refund","entryType":"","meaning":"명 환불(금) / 동 환불하다","example":"Ask for a refund if the goods are faulty.","translation":"상품에 문제가 있으면 환불을 요청하세요.","sourcePage":367,"pdfPage":215},{"id":1986,"source":"MAIN","day":"40","word":"bargain","entryType":"","meaning":"동 ① 흥정하다 ② 계약하다, 협정하다 / 명 ① 싸게 산 물건, 특가품 ② 계약, 협정","example":"We bargained with him for the use of the property.","translation":"우리는 그와 그 땅의 사용 계약을 맺었다.","sourcePage":367,"pdfPage":215},{"id":1987,"source":"MAIN","day":"40","word":"negotiate","entryType":"","meaning":"동 협상하다, 교섭하다","example":"He's in a strong position to negotiate a deal.","translation":"그는 거래를 협상해서 유리한 위치에 있다.","sourcePage":367,"pdfPage":215},{"id":1988,"source":"MAIN","day":"40","word":"achieve","entryType":"","meaning":"동 ① 이루다, 성취하다, 달성하다 ② 획득하다","example":"It's essential to achieve work-life balance.","translation":"일과 삶의 균형을 이루는 것은 필수적이다.","sourcePage":367,"pdfPage":215},{"id":1989,"source":"MAIN","day":"40","word":"accomplish","entryType":"","meaning":"동 이루다, 성취하다","example":"To accomplish great things, we must dream as well as act.","translation":"위대한 것들을 성취하려면 행동할 뿐만 아니라 꿈꾸어야 한다.","sourcePage":368,"pdfPage":216},{"id":1990,"source":"MAIN","day":"40","word":"attain","entryType":"","meaning":"동 ① 이루다, 달성하다 ② 도달하다, 이르다","example":"Once you start, you must attain your objective.","translation":"일단 시작했으면, 목적을 달성해야 한다.","sourcePage":368,"pdfPage":216},{"id":1991,"source":"MAIN","day":"40","word":"fulfill","entryType":"","meaning":"동 ① 수행[이행]하다 ② 실현[성취]하다, 이루다","example":"My cherished desire has been fulfilled.","translation":"내가 염원하던 소망이 이루어졌다.","sourcePage":368,"pdfPage":216},{"id":1992,"source":"MAIN","day":"40","word":"execute","entryType":"","meaning":"동 ① 실행하다, 수행하다 ② 처형하다","example":"The royal family was executed the following year.","translation":"그림은 해에 왕족들은 처형되었다.","sourcePage":368,"pdfPage":216},{"id":1993,"source":"MAIN","day":"40","word":"implement","entryType":"","meaning":"동 이행하다, 시행하다 / 명 ① 도구, 기구 ② 수단","example":"It is increasingly difficult to implement the agreement.","translation":"그 협약을 이행하기가 점점 더 어렵다.","sourcePage":368,"pdfPage":216},{"id":1994,"source":"MAIN","day":"40","word":"enforce","entryType":"","meaning":"동 ① 시행[집행]하다, 실시하다 ② 강요하다","example":"The police are in charge of enforcing the law.","translation":"경찰은 법을 집행하는 일을 담당하고 있다.","sourcePage":368,"pdfPage":216},{"id":1995,"source":"MAIN","day":"40","word":"phase","entryType":"","meaning":"명 면, 국면, 단계","example":"The revolution entered a new phase.","translation":"혁명은 새로운 단계에 들어갔다.","sourcePage":369,"pdfPage":217},{"id":1996,"source":"MAIN","day":"40","word":"sheer","entryType":"","meaning":"형 ① 순전한, 순수한 ② 완전한","example":"It was her sheer persistence that wore them down in the end.","translation":"결국 그들이 무너진 것은 그녀의 순전한 고집 때문이었다.","sourcePage":369,"pdfPage":217},{"id":1997,"source":"MAIN","day":"40","word":"utter","entryType":"","meaning":"형 완전한, 전적인 / 동 말하다","example":"She did not utter any word during lunch.","translation":"그녀는 점심을 먹으면서 어떤 말도 하지 않았다.","sourcePage":369,"pdfPage":217},{"id":1998,"source":"MAIN","day":"40","word":"absolute","entryType":"","meaning":"형 완전한, 확실한, 절대적인","example":"God is the absolute being.","translation":"신은 절대적인 존재이다.","sourcePage":369,"pdfPage":217},{"id":1999,"source":"MAIN","day":"40","word":"complete","entryType":"","meaning":"동 ① 완료하다, 끝내다 ② 기입하다 / 형 ① 완전한 ② 완료된","example":"The job requires a complete understanding of procedures.","translation":"그 일은 절차에 대한 완전한 이해가 필요하다.","sourcePage":369,"pdfPage":217},{"id":2000,"source":"MAIN","day":"40","word":"outright","entryType":"","meaning":"형 ① 노골적인, 명백한 ② 완전한 / 부 ① 노골적으로 ② 완전히","example":"Did you pay for the car outright?","translation":"차 값을 완전히 지불했나요?","sourcePage":369,"pdfPage":217},{"id":2001,"source":"MAIN","day":"41","word":"polish","entryType":"","meaning":"동 ① 광내다, 닦다 ② 다듬다, 세련되게 하다 / 명 ① 윤 내기 ② 광택(제)","example":"He polished the silver spoon.","translation":"그는 은수저를 광냈다.","sourcePage":370,"pdfPage":218},{"id":2002,"source":"MAIN","day":"41","word":"trim","entryType":"","meaning":"동 다듬다, 잘라 내다 / 형 정돈된, 깔끔한","example":"He takes delight in trimming the garden every Sunday.","translation":"그는 일요일마다 정원을 손질하는 것이 낙이다.","sourcePage":370,"pdfPage":218},{"id":2003,"source":"MAIN","day":"41","word":"weave","entryType":"","meaning":"동 (천을) 짜다, 뜨다","example":"This shirt was woven by hand in Central America.","translation":"이 셔츠는 중앙아메리카에서 손으로 짜졌다.","sourcePage":370,"pdfPage":218},{"id":2004,"source":"MAIN","day":"41","word":"sap","entryType":"","meaning":"명 수액 / 동 약화시키다","example":"The hot sun sapped our energy.","translation":"뜨거운 태양이 우리의 기력을 약화시켰다.","sourcePage":370,"pdfPage":218},{"id":2005,"source":"MAIN","day":"41","word":"erode","entryType":"","meaning":"동 ① 침식시키다, 풍화시키다 ② 약화시키다","example":"The wind can erode and transport the soil.","translation":"바람은 흙을 침식시키고 운반할 수 있다.","sourcePage":371,"pdfPage":219},{"id":2006,"source":"MAIN","day":"41","word":"impair","entryType":"","meaning":"동 손상시키다, 해치다","example":"Lack of sleep impaired his concentration.","translation":"수면 부족이 그의 집중력을 해쳤다.","sourcePage":371,"pdfPage":219},{"id":2007,"source":"MAIN","day":"41","word":"negative","entryType":"","meaning":"형 ① 부정적인 ② 반대의 ③ [의학] 음성의 / 명 부정","example":"Smoking has a negative effect on health.","translation":"흡연은 건강에 부정적인 영향을 끼친다.","sourcePage":371,"pdfPage":219},{"id":2008,"source":"MAIN","day":"41","word":"adverse","entryType":"","meaning":"형 ① 반대의 ② 불리한","example":"The event was canceled due to adverse weather conditions.","translation":"그 행사는 불리한 기상 조건 때문에 취소되었다.","sourcePage":371,"pdfPage":219},{"id":2009,"source":"MAIN","day":"41","word":"invert","entryType":"","meaning":"동 (아래위를) 뒤집다, (순서를) 도치시키다","example":"She inverted an hourglass.","translation":"그녀는 모래시계를 뒤집었다.","sourcePage":371,"pdfPage":219},{"id":2010,"source":"MAIN","day":"41","word":"omit","entryType":"","meaning":"동 빠뜨리다, 생략하다","example":"The court reporter omitted the lawyer’s remarks from the record.","translation":"법원 서기가 변호사의 진술을 기록에서 빠뜨렸다.","sourcePage":371,"pdfPage":219},{"id":2011,"source":"MAIN","day":"41","word":"hollow","entryType":"","meaning":"형 ① 속이 빈, 공허한 ② 움푹 들어간","example":"The boy has a thin frame and hollow cheeks.","translation":"그 소년은 마른 체격과 움푹 들어간 뺨을 가지고 있다.","sourcePage":372,"pdfPage":220},{"id":2012,"source":"MAIN","day":"41","word":"devoid","entryType":"","meaning":"형 결여된, -이 전혀 없는","example":"The letter was devoid of warmth.","translation":"그 편지에는 따스함이 전혀 들어 있지 않았다.","sourcePage":372,"pdfPage":220},{"id":2013,"source":"MAIN","day":"41","word":"astronomy","entryType":"","meaning":"명 천문학","example":"Astronomy builds on the discoveries of the past.","translation":"천문학은 과거의 발견들을 기반으로 발전한다.","sourcePage":372,"pdfPage":220},{"id":2014,"source":"MAIN","day":"41","word":"chemistry","entryType":"","meaning":"명 화학","example":"I think chemistry is an interesting field.","translation":"나는 화학이 흥미로운 분야라고 생각한다.","sourcePage":372,"pdfPage":220},{"id":2015,"source":"MAIN","day":"41","word":"archaeology","entryType":"","meaning":"명 고고학","example":"Archaeology preserves heritage while tracing human evolution.","translation":"고고학은 인류의 진화를 추적하는 동시에 유산을 보존한다.","sourcePage":372,"pdfPage":220},{"id":2016,"source":"MAIN","day":"41","word":"architecture","entryType":"","meaning":"명 건축(학), 건축 양식","example":"Ancient Greek architecture has changed in various forms.","translation":"고대 그리스 건축 양식은 다양한 형태로 변화해 왔다.","sourcePage":372,"pdfPage":220},{"id":2017,"source":"MAIN","day":"41","word":"economics","entryType":"","meaning":"명 ① 경제학 ② 경제 (상태)","example":"Your children will participate in the fields of politics, economics, and education.","translation":"당신의 자녀들은 정치, 경제, 그리고 교육 분야에 참여하게 될 것이다.","sourcePage":372,"pdfPage":220},{"id":2018,"source":"MAIN","day":"41","word":"ethics","entryType":"","meaning":"명 윤리학","example":"We must not neglect ethics education.","translation":"우리는 윤리 교육을 등한시해선 안 된다.","sourcePage":373,"pdfPage":221},{"id":2019,"source":"MAIN","day":"41","word":"philosophy","entryType":"","meaning":"명 철학","example":"Our most popular form of modern philosophy is psychology.","translation":"가장 대중적인 형태의 현대 철학은 심리학이다.","sourcePage":373,"pdfPage":221},{"id":2020,"source":"MAIN","day":"41","word":"physics","entryType":"","meaning":"명 물리학","example":"He devoted his life to the study of physics.","translation":"그는 물리학 연구에 한평생을 바쳤다.","sourcePage":373,"pdfPage":221},{"id":2021,"source":"MAIN","day":"41","word":"physician","entryType":"","meaning":"명 (내과) 의사","example":"The physician prescribed him some medicine.","translation":"의사가 그에게 몇 가지
