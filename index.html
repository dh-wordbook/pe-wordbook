인 문의 양식을 통해 간편하게 질문을 제출하세요.","sourcePage":403,"pdfPage":259},{"id":2249,"source":"MAIN","day":"45","word":"civil complaint","entryType":"MULTIWORD","meaning":"명 민원","example":"Residents filed a civil complaint against the city over noise pollution concerns.","translation":"주민들은 소음 공해 문제로 시에 민원을 제기했다.","sourcePage":403,"pdfPage":259},{"id":2250,"source":"MAIN","day":"45","word":"seamless","entryType":"SINGLE","meaning":"형 매끄러운, 순조로운","example":"The new system ensures seamless integration of data from different government agencies.","translation":"새로운 시스템은 여러 정부 기관의 데이터를 원활하게 통합하게 해준다.","sourcePage":403,"pdfPage":259},{"id":2251,"source":"MAIN","day":"46","word":"forward","entryType":"SINGLE","meaning":"동 보내다, 전달하다","example":"The agency will forward your inquiry to the appropriate department for a response.","translation":"해당 기관에서 문의 사항을 해당 부서로 전달하여 답변을 드릴 것입니다.","sourcePage":412,"pdfPage":260},{"id":2252,"source":"MAIN","day":"46","word":"CC (Carbon Copy)","entryType":"MULTIWORD","meaning":"명 참조 / 동 참조하다","example":"Please CC your manager on the email regarding the project update.","translation":"프로젝트 업데이트와 관련된 이메일에 관리자를 참조해 주세요.","sourcePage":412,"pdfPage":260},{"id":2253,"source":"MAIN","day":"46","word":"sincerely","entryType":"SINGLE","meaning":"부 진심으로","example":"We appreciate your understanding and cooperation. Sincerely,","translation":"여러분의 이해와 협조에 감사드립니다. 진심으로 감사드리며,","sourcePage":412,"pdfPage":260},{"id":2254,"source":"MAIN","day":"46","word":"stunning","entryType":"SINGLE","meaning":"형 놀랄 만큼 멋진, 훌륭한","example":"The newly restored historical landmark offers a stunning exhibit of artifacts.","translation":"새롭게 복원된 역사적 랜드마크는 멋진 유물 전시를 제공한다.","sourcePage":413,"pdfPage":261},{"id":2255,"source":"MAIN","day":"46","word":"ship","entryType":"SINGLE","meaning":"동 보내다, 발송하다","example":"The package is shipped via express delivery.","translation":"소포는 특급 배송을 통해 발송된다.","sourcePage":413,"pdfPage":261},{"id":2256,"source":"MAIN","day":"46","word":"dispatch","entryType":"SINGLE","meaning":"동 ① 파견하다 ② 보내다, 발송하다 ③ 신속히 해치우다 / 명 파견, 발송","example":"It's crucial to dispatch the necessary documents to the client before the deadline.","translation":"마감일 전에 필요한 서류를 고객에게 발송하는 것이 중요하다.","sourcePage":413,"pdfPage":261},{"id":2257,"source":"MAIN","day":"46","word":"courier","entryType":"SINGLE","meaning":"명 택배 회사, 택배 배달원","example":"Next-day delivery is available through a reliable courier.","translation":"믿을 수 있는 택배를 통해 익일 배송이 가능하다.","sourcePage":413,"pdfPage":261},{"id":2258,"source":"MAIN","day":"46","word":"fairly","entryType":"SINGLE","meaning":"부 ① 상당히, 꽤 ② 공평하게","example":"Public transportation is fairly reliable in most major cities.","translation":"대부분의 주요 도시에서 대중교통은 상당히 안정적이다.","sourcePage":413,"pdfPage":261},{"id":2259,"source":"MAIN","day":"46","word":"retailer","entryType":"SINGLE","meaning":"명 ① 소매상인 ② 소매점","example":"The company is looking for a retailer to sell their new product line.","translation":"이 회사는 새로운 제품 라인을 판매할 소매업체를 찾고 있다.","sourcePage":413,"pdfPage":261},{"id":2260,"source":"MAIN","day":"46","word":"pharmacist","entryType":"SINGLE","meaning":"명 약사","example":"She chose a career path to become a pharmacist.","translation":"그녀는 약사가 되기 위한 진로를 선택했다.","sourcePage":413,"pdfPage":261},{"id":2261,"source":"MAIN","day":"46","word":"automotive","entryType":"SINGLE","meaning":"형 자동차의","example":"They formed a partnership to develop innovative automotive safety features.","translation":"그들은 혁신적인 자동차 안전 기능을 개발하기 위해 파트너십을 맺었다.","sourcePage":414,"pdfPage":262},{"id":2262,"source":"MAIN","day":"46","word":"up-to-date","entryType":"MULTIWORD","meaning":"형 ① 최신의 ② 최신식의","example":"Keep your résumé up-to-date to reflect your latest skills and experience.","translation":"가장 최근의 역량과 경력을 보여 줄 수 있도록 이력서를 최신 상태로 유지하세요.","sourcePage":414,"pdfPage":262},{"id":2263,"source":"MAIN","day":"46","word":"cutting-edge","entryType":"MULTIWORD","meaning":"형 최첨단의","example":"The keynote speaker will discuss cutting-edge trends in artificial intelligence.","translation":"기조연설자는 인공지능의 최신 동향에 대해 논의할 예정이다.","sourcePage":414,"pdfPage":262},{"id":2264,"source":"MAIN","day":"46","word":"state-of-the-art","entryType":"MULTIWORD","meaning":"형 최첨단의, 최신식의","example":"The hospital boasts a state-of-the-art medical imaging facility.","translation":"이 병원은 최첨단 의료 영상 시설을 자랑한다.","sourcePage":414,"pdfPage":262},{"id":2265,"source":"MAIN","day":"46","word":"remainder","entryType":"SINGLE","meaning":"명 나머지","example":"The sale cleared the remainder of the stock.","translation":"세일로 나머지 재고가 모두 소진되었다.","sourcePage":414,"pdfPage":262},{"id":2266,"source":"MAIN","day":"46","word":"office supplies","entryType":"MULTIWORD","meaning":"명 사무용품","example":"Remember to bring your own office supplies.","translation":"사무용품은 개인 지참하는 것을 잊지 마세요.","sourcePage":414,"pdfPage":262},{"id":2267,"source":"MAIN","day":"46","word":"warehouse","entryType":"SINGLE","meaning":"명 창고, 저장소","example":"The warehouse is closed today for a scheduled maintenance check.","translation":"창고는 정기 유지보수 점검을 위해 오늘 문을 닫는다.","sourcePage":415,"pdfPage":263},{"id":2268,"source":"MAIN","day":"46","word":"high-profile","entryType":"MULTIWORD","meaning":"형 유명한, 세간의 이목을 끄는","example":"The presidential visit attracted a large number of high-profile journalists.","translation":"대통령 방문에 많은 유명 언론인이 참석했다.","sourcePage":415,"pdfPage":263},{"id":2269,"source":"MAIN","day":"46","word":"infrastructure","entryType":"SINGLE","meaning":"명 사회 기반 시설","example":"Investing in sustainable infrastructure is crucial for long-term economic growth.","translation":"지속 가능한 인프라에 투자하는 것은 장기적인 경제 성장을 위해 매우 중요하다.","sourcePage":415,"pdfPage":263},{"id":2270,"source":"MAIN","day":"46","word":"complex","entryType":"SINGLE","meaning":"명 복합 건물, (건물) 단지 / 형 ① 복합의 ② 복잡한","example":"The new healthcare complex provides essential medical services to underserved communities.","translation":"새로운 의료 단지는 소외된 지역 사회에 필수적인 의료 서비스를 제공한다.","sourcePage":415,"pdfPage":263},{"id":2271,"source":"MAIN","day":"46","word":"wear and tear","entryType":"MULTIWORD","meaning":"명 마모, 손상","example":"The car shows signs of wear and tear after years of use.","translation":"수년간 사용한 차량은 마모된 흔적이 보인다.","sourcePage":415,"pdfPage":263},{"id":2272,"source":"MAIN","day":"46","word":"landscaping","entryType":"SINGLE","meaning":"명 조경","example":"The new landscaping work improved the curb appeal.","translation":"새로운 조경 작업은 연석의 매력을 개선했다.","sourcePage":415,"pdfPage":263},{"id":2273,"source":"MAIN","day":"46","word":"nature reserve","entryType":"MULTIWORD","meaning":"명 자연 보호 구역","example":"Public campaigns educate citizens about the importance of preserving nature reserves.","translation":"공공 캠페인은 시민들에게 자연 보호 구역 보존의 중요성을 교육한다.","sourcePage":416,"pdfPage":264},{"id":2274,"source":"MAIN","day":"46","word":"wilderness","entryType":"SINGLE","meaning":"명 황야, 황무지","example":"Scientists are studying the unique plant within the remote wilderness region.","translation":"과학자들은 외딴 황야 지역에서 서식하는 독특한 식물을 연구하고 있다.","sourcePage":416,"pdfPage":264},{"id":2275,"source":"MAIN","day":"46","word":"public figure","entryType":"MULTIWORD","meaning":"명 유명 인사, 공인","example":"After retirement, the former athlete became a public figure for youth mentorship programs.","translation":"은퇴 후 전직 선수는 청소년 멘토링 프로그램의 유명 인사가 되었다.","sourcePage":416,"pdfPage":264},{"id":2276,"source":"MAIN","day":"46","word":"biased","entryType":"SINGLE","meaning":"형 치우친, 편견을 가진","example":"The government's anti-poverty campaigns strive not to be biased in distributing aid.","translation":"정부의 빈곤 퇴치 캠페인은 편견 없이 원조를 배분하기 위해 노력한다.","sourcePage":416,"pdfPage":264},{"id":2277,"source":"MAIN","day":"46","word":"ventilation","entryType":"SINGLE","meaning":"명 ① 환기 ② 환기 장치","example":"Poor ventilation in public housing raises health concerns for residents.","translation":"공공 주택의 환기 불량은 거주자들의 건강에 대한 우려를 일으킨다.","sourcePage":416,"pdfPage":264},{"id":2278,"source":"MAIN","day":"46","word":"on-call security specialist","entryType":"MULTIWORD","meaning":"명 당직 보안 전문가","example":"A well-trained on-call security specialist can deter potential security threats.","translation":"잘 훈련된 당직 보안 전문가가 잠재적 보안 위협을 막을 수 있다.","sourcePage":416,"pdfPage":264},{"id":2279,"source":"MAIN","day":"46","word":"unauthorized entrance","entryType":"MULTIWORD","meaning":"명 무단출입","example":"Attempting unauthorized entrance is prohibited.","translation":"무단출입 시도는 금지되어 있다.","sourcePage":416,"pdfPage":264},{"id":2280,"source":"MAIN","day":"46","word":"defective","entryType":"SINGLE","meaning":"형 결함이 있는 / 명 불량품","example":"Public transportation authority is investigating reports of defective brakes on buses.","translation":"대중교통 당국에서 버스 브레이크 결함 신고를 조사하고 있다.","sourcePage":417,"pdfPage":265},{"id":2281,"source":"MAIN","day":"46","word":"floor plan","entryType":"MULTIWORD","meaning":"명 ① 평면도 ② 층별 안내도","example":"Make sure to review the floor plan before heading to your exam room.","translation":"시험장으로 향하기 전에 층별 안내도를 확인하세요.","sourcePage":417,"pdfPage":265},{"id":2282,"source":"MAIN","day":"46","word":"product demonstration","entryType":"MULTIWORD","meaning":"명 제품 시연","example":"The salesperson offered a product demonstration of the new smartphone features.","translation":"영업 담당자가 새로운 스마트폰 기능에 대한 제품 시연을 했다.","sourcePage":417,"pdfPage":265},{"id":2283,"source":"MAIN","day":"46","word":"network","entryType":"SINGLE","meaning":"동 인적 네트워크를 형성하다 / 명 망","example":"Attending industry conferences allows you to network with potential employers.","translation":"업계 콘퍼런스에 참석하면 잠재 고용주들과의 네트워크를 형성할 수 있다.","sourcePage":417,"pdfPage":265},{"id":2284,"source":"MAIN","day":"46","word":"self-employed","entryType":"MULTIWORD","meaning":"형 자영업을 하는","example":"He decided to become self-employed and open his own graphic design studio.","translation":"그는 자영업자가 되어 자신의 그래픽 디자인 스튜디오를 열기로 결정했다.","sourcePage":417,"pdfPage":265},{"id":2285,"source":"MAIN","day":"46","word":"sign up for","entryType":"MULTIWORD","meaning":"-을 신청하다","example":"Sign up for the marathon online before the registration deadline closes.","translation":"등록 마감일 전에 온라인으로 마라톤 참가 신청을 하세요.","sourcePage":417,"pdfPage":265},{"id":2286,"source":"MAIN","day":"46","word":"mergers and acquisitions (M&A)","entryType":"MULTIWORD","meaning":"명 기업 인수 합병","example":"The mergers and acquisitions of two major tech companies created a new industry giant.","translation":"두 개의 주요 기술 회사의 합병으로 새로운 산업 거인이 탄생했다.","sourcePage":417,"pdfPage":265},{"id":2287,"source":"MAIN","day":"46","word":"subscription","entryType":"SINGLE","meaning":"명 ① 예약, 구독(료) ② 기부(금)","example":"You can cancel your digital magazine subscription at any time through your account settings.","translation":"계정 설정에서 언제든지 귀하의 디지털 잡지의 구독을 취소할 수 있습니다.","sourcePage":418,"pdfPage":266},{"id":2288,"source":"MAIN","day":"46","word":"household","entryType":"SINGLE","meaning":"명 가구 / 형 가정의, 가족의","example":"Dispose of used batteries responsibly following your household waste disposal guidelines.","translation":"사용한 배터리는 반드시 가정용 폐기물 처리 지침에 따라 폐기하세요.","sourcePage":418,"pdfPage":266},{"id":2289,"source":"MAIN","day":"46","word":"domestic","entryType":"SINGLE","meaning":"형 ① 국내의 ② 가정의","example":"We prefer to support domestic businesses to stimulate the local economy.","translation":"저희는 지역 경제 활성화를 위해 국내 기업을 지원하는 것을 선호합니다.","sourcePage":418,"pdfPage":266},{"id":2290,"source":"MAIN","day":"46","word":"customized","entryType":"SINGLE","meaning":"형 주문 제작의, 맞춤의","example":"Customized learning plans are available for multilingual students.","translation":"다국어를 사용하는 학생을 위한 맞춤형 학습 계획이 있다.","sourcePage":418,"pdfPage":266},{"id":2291,"source":"MAIN","day":"46","word":"tailored","entryType":"SINGLE","meaning":"형 맞춤의, 주문 제작의","example":"Our training is tailored to your specific needs.","translation":"저희 교육은 귀하의 특정 요구 사항에 맞춰져 있습니다.","sourcePage":418,"pdfPage":266},{"id":2292,"source":"MAIN","day":"46","word":"overcrowding","entryType":"SINGLE","meaning":"명 과밀, 혼잡","example":"The authorities are taking measures to prevent overcrowding at the popular tourist destination.","translation":"당국은 인기 관광지의 혼잡을 방지하기 위해 조치를 취하고 있다.","sourcePage":418,"pdfPage":266},{"id":2293,"source":"MAIN","day":"46","word":"to this end","entryType":"MULTIWORD","meaning":"이 목적을 위해","example":"To this end, the city council is holding a public forum to gather feedback on the renovation.","translation":"이를 위해 시의회는 보수에 대한 의견을 모으기 위해 공개 토론회를 개최한다.","sourcePage":418,"pdfPage":266},{"id":2294,"source":"MAIN","day":"46","word":"overheat","entryType":"SINGLE","meaning":"동 과열하다, 과열되다 / 명 ① 과열 ② 지나친 흥분","example":"Libraries close early to prevent computer systems from overheating.","translation":"컴퓨터 시스템 과열을 방지하기 위해 도서관들은 일찍 문을 닫는다.","sourcePage":419,"pdfPage":267},{"id":2295,"source":"MAIN","day":"46","word":"litter","entryType":"SINGLE","meaning":"동 어지르다, 더럽히다 / 명 ① 쓰레기 ② 난잡","example":"The ocean floor is littered with humanity's garbage.","translation":"해저는 인류의 쓰레기로 어질러져 있다.","sourcePage":419,"pdfPage":267},{"id":2296,"source":"MAIN","day":"46","word":"sanitation","entryType":"SINGLE","meaning":"명 공중위생, 위생 설비","example":"The sanitation department is responsible for collecting household waste.","translation":"위생부서는 생활 쓰레기 수거를 담당하고 있다.","sourcePage":419,"pdfPage":267},{"id":2297,"source":"MAIN","day":"46","word":"round trip","entryType":"MULTIWORD","meaning":"명 왕복 여행","example":"The train fare includes a round-trip ticket.","translation":"기차 요금에는 왕복 티켓이 포함되어 있다.","sourcePage":419,"pdfPage":267},{"id":2298,"source":"MAIN","day":"46","word":"departure","entryType":"SINGLE","meaning":"명 출발, 떠남","example":"The plane's departure was delayed due to bad weather conditions.","translation":"기상 악화로 인해 비행기 출발이 지연되었다.","sourcePage":419,"pdfPage":267},{"id":2299,"source":"MAIN","day":"46","word":"arrival","entryType":"SINGLE","meaning":"명 도착","example":"The train's arrival is expected to be on time according to the schedule.","translation":"기차 도착은 예정 일정에 따라 정시에 도착할 예정이다.","sourcePage":419,"pdfPage":267},{"id":2300,"source":"MAIN","day":"46","word":"carry-on","entryType":"MULTIWORD","meaning":"형 휴대용의, 비행기 내에 들고 갈 수 있는","example":"Lost and found items from carry-on baggage are kept at the airport security checkpoint.","translation":"기내 반입 수하물의 분실물은 공항 보안 검색대에 보관된다.","sourcePage":419,"pdfPage":267},{"id":2301,"source":"MAIN","day":"47","word":"abide by","entryType":"MULTIWORD","meaning":"-을 따르다, 지키다, 준수하다","example":"Players must abide by the game rules.","translation":"선수는 경기 규칙을 준수해야 한다.","sourcePage":422,"pdfPage":270},{"id":2302,"source":"MAIN","day":"47","word":"account for","entryType":"MULTIWORD","meaning":"① -을 설명하다 ② -을 차지하다","example":"Can you account for the missing keys?","translation":"잃어버린 열쇠를 설명할 수 있나요?","sourcePage":422,"pdfPage":270},{"id":2303,"source":"MAIN","day":"47","word":"ahead of","entryType":"MULTIWORD","meaning":"-앞에, -보다 앞서서","example":"Two boys were ahead of us.","translation":"우리 앞에 남자애가 두 명 있었다.","sourcePage":422,"pdfPage":270},{"id":2304,"source":"MAIN","day":"47","word":"along with","entryType":"MULTIWORD","meaning":"-와 함께, 더불어","example":"I learned to develop interpersonal skills along with other skills.","translation":"나는 다른 기술과 함께 대인 관계 기술을 기르는 법을 배웠다.","sourcePage":423,"pdfPage":271},{"id":2305,"source":"MAIN","day":"47","word":"apart from","entryType":"MULTIWORD","meaning":"-을 제외하고, -이외에","example":"Apart from their house in London, they also have a villa in Spain.","translation":"런던에 있는 집 이외에 그들은 스페인에 별장 한 채도 소유하고 있다.","sourcePage":423,"pdfPage":271},{"id":2306,"source":"MAIN","day":"47","word":"apply for","entryType":"MULTIWORD","meaning":"-에 지원하다","example":"The leaflet explains how to apply for a job.","translation":"그 책자는 일자리에 지원하는 방법을 설명한다.","sourcePage":423,"pdfPage":271},{"id":2307,"source":"MAIN","day":"47","word":"as a result of","entryType":"MULTIWORD","meaning":"-의 결과로","example":"Some important facts emerged as a result of the investigation.","translation":"그 조사의 결과로 몇몇 중요한 사실이 드러났다.","sourcePage":423,"pdfPage":271},{"id":2308,"source":"MAIN","day":"47","word":"as to","entryType":"MULTIWORD","meaning":"-에 관해서(는)","example":"He was uncertain as to whether he should accept the job offer.","translation":"그는 그 일자리 제안을 받아들여야 할지에 관해서 확신이 없었다.","sourcePage":423,"pdfPage":271},{"id":2309,"source":"MAIN","day":"47","word":"at once","entryType":"MULTIWORD","meaning":"① 즉시 ② 한꺼번에","example":"If necessary, I can come at once.","translation":"필요하면 내가 즉시 올 수 있다.","sourcePage":423,"pdfPage":271},{"id":2310,"source":"MAIN","day":"47","word":"at risk of","entryType":"MULTIWORD","meaning":"-의 위험에 처한","example":"Many more are still at risk of suffering from hunger and disease.","translation":"더 많은 사람들이 아직도 배고픔과 질병으로 고통받을 위험에 처해 있다.","sourcePage":423,"pdfPage":271},{"id":2311,"source":"MAIN","day":"47","word":"at the cost[expense] of","entryType":"MULTIWORD","meaning":"-을 희생하여, 대가로","example":"Her fame was bought at the cost of her marriage.","translation":"그녀의 명성은 결혼 생활을 희생시키고 얻은 것이었다.","sourcePage":424,"pdfPage":272},{"id":2312,"source":"MAIN","day":"47","word":"at the mercy of","entryType":"MULTIWORD","meaning":"-의 처분대로, -에 좌우되는","example":"Our picnic was at the mercy of the weather.","translation":"우리의 소풍은 날씨에 좌우되었다.","sourcePage":424,"pdfPage":272},{"id":2313,"source":"MAIN","day":"47","word":"back up","entryType":"MULTIWORD","meaning":"-을 뒷받침하다, 지지하다, 후원하다","example":"Her strong work ethic backs up her claims.","translation":"그녀의 강한 직업 윤리가 그녀의 주장을 뒷받침한다.","sourcePage":424,"pdfPage":272},{"id":2314,"source":"MAIN","day":"47","word":"be apt to RV","entryType":"MULTIWORD","meaning":"-하기 쉽다, -하는 경향이 있다","example":"Babies are apt to put objects into their mouths.","translation":"아기들은 입에 물건을 집어넣는 경향이 있다.","sourcePage":424,"pdfPage":272},{"id":2315,"source":"MAIN","day":"47","word":"be based on","entryType":"MULTIWORD","meaning":"-에 기초하다, 근거하다","example":"The decision was based on emotion rather than rational thought.","translation":"그 결정은 합리적인 생각보다는 감정에 근거한 것이었다.","sourcePage":424,"pdfPage":272},{"id":2316,"source":"MAIN","day":"47","word":"be bent on RVing","entryType":"MULTIWORD","meaning":"① -하기를 결심하고 있다 ② -하는 데 열중하다","example":"She is solely bent on making money.","translation":"그녀는 오직 돈을 버는 데 열중한다.","sourcePage":424,"pdfPage":272},{"id":2317,"source":"MAIN","day":"47","word":"be bound to RV","entryType":"MULTIWORD","meaning":"① -하게 되어 있다, 반드시 -할 것이다 ② -할 의무가 있다","example":"She is bound to succeed with her dedication and hard work.","translation":"그녀는 그녀의 헌신과 노력으로 반드시 성공할 것이다.","sourcePage":424,"pdfPage":272},{"id":2318,"source":"MAIN","day":"47","word":"be concerned with[about]","entryType":"MULTIWORD","meaning":"-에 관심이 있다","example":"Are you concerned with fitting into a new social group?","translation":"새로운 사회 집단에 적응하는 것에 관심이 있으세요?","sourcePage":425,"pdfPage":273},{"id":2319,"source":"MAIN","day":"47","word":"be engaged in","entryType":"MULTIWORD","meaning":"① -에 참여하다 ② -에 종사하다","example":"He is engaged in foreign trade.","translation":"그는 해외 무역에 종사하고 있다.","sourcePage":425,"pdfPage":273},{"id":2320,"source":"MAIN","day":"47","word":"be faced with","entryType":"MULTIWORD","meaning":"-에 직면하다","example":"What challenges are you faced with in your daily life?","translation":"일상생활에서 어떤 어려움을 겪고 있나요?","sourcePage":425,"pdfPage":273},{"id":2321,"source":"MAIN","day":"47","word":"be inclined to RV","entryType":"MULTIWORD","meaning":"① -하고 싶어 하다 ② -하는 경향이 있다","example":"Unfortunately, most people in Korea are inclined to take these offenses lightly.","translation":"불행히도, 대부분의 한국 사람들은 이러한 범죄를 가볍게 여기는 경향이 있다.","sourcePage":425,"pdfPage":273},{"id":2322,"source":"MAIN","day":"47","word":"be likely to RV","entryType":"MULTIWORD","meaning":"-하기 쉽다, -할 것 같다","example":"Train fares are likely to remain unchanged.","translation":"기차 요금은 변하지 않은 채 유지될 것 같다.","sourcePage":425,"pdfPage":273},{"id":2323,"source":"MAIN","day":"47","word":"be subject to","entryType":"MULTIWORD","meaning":"① -의 대상이다 ② -의 지배를 받다 ③ -의 영향을 받기 쉽다","example":"The benefit is subject to change at any time.","translation":"본 혜택은 언제라도 변경될 수 있다.","sourcePage":425,"pdfPage":273},{"id":2324,"source":"MAIN","day":"47","word":"be supposed to RV","entryType":"MULTIWORD","meaning":"① -할 의무가 있다 ② -하기로 되어 있다, -할 예정이다","example":"He was supposed to arrive at the meeting an hour ago.","translation":"그는 한 시간 전에 회의에 도착하기로 되어 있었다.","sourcePage":425,"pdfPage":273},{"id":2325,"source":"MAIN","day":"47","word":"be willing to RV","entryType":"MULTIWORD","meaning":"기꺼이 -하다","example":"Inventors have to be willing to learn from failures.","translation":"발명가들은 실패에서 기꺼이 배우려고 해야 한다.","sourcePage":426,"pdfPage":274},{"id":2326,"source":"MAIN","day":"47","word":"break down","entryType":"MULTIWORD","meaning":"① 고장 나다 ② 허물어지다 ③ -을 부수다 ④ -을 분해하다","example":"This computer may break down because it is old.","translation":"이 컴퓨터는 오래돼서 고장날지도 모른다.","sourcePage":426,"pdfPage":274},{"id":2327,"source":"MAIN","day":"47","word":"break into","entryType":"MULTIWORD","meaning":"① 침입하다 ② 갑자기 -하기 시작하다","example":"The thief attempted to break into the jewelry store.","translation":"도둑이 보석 가게에 침입을 시도했다.","sourcePage":426,"pdfPage":274},{"id":2328,"source":"MAIN","day":"47","word":"break up","entryType":"MULTIWORD","meaning":"① 헤어지다 ② -을 부수다","example":"I broke up with her yesterday.","translation":"나는 어제 그녀와 헤어졌다.","sourcePage":426,"pdfPage":274},{"id":2329,"source":"MAIN","day":"47","word":"bring[put] A to life","entryType":"MULTIWORD","meaning":"-을 소생시키다, -에 활기를 불어넣다","example":"Her detailed descriptions bring the scenes of the novel to life.","translation":"그녀의 섬세한 묘사는 소설의 장면을 생생하게 표현한다.","sourcePage":426,"pdfPage":274},{"id":2330,"source":"MAIN","day":"47","word":"bring about","entryType":"MULTIWORD","meaning":"-을 야기하다, 초래하다","example":"Will this new technology bring about job losses?","translation":"이 새로운 기술이 일자리 감소를 가져올까요?","sourcePage":426,"pdfPage":274},{"id":2331,"source":"MAIN","day":"47","word":"bring out","entryType":"MULTIWORD","meaning":"① -을 끌어내다/발휘되게 하다 ② -을 출시하다, 발매하다","example":"The teacher’s encouragement helped bring out the best in her shy students.","translation":"선생님의 격려가 수줍은 학생들의 최고 기량을 끌어내는 데 도움이 되었다.","sourcePage":426,"pdfPage":274},{"id":2332,"source":"MAIN","day":"47","word":"bring up","entryType":"MULTIWORD","meaning":"① -을 기르다, 양육하다 ② (화제를) 꺼내다, 제기하다","example":"It is not easy to bring up children.","translation":"아이를 키우는 일은 쉽지 않다.","sourcePage":427,"pdfPage":275},{"id":2333,"source":"MAIN","day":"47","word":"by means of","entryType":"MULTIWORD","meaning":"① -에 의하여 ② -의 도움으로","example":"Knowledge can be acquired by means of various methods, such as reading and experience.","translation":"독서, 체험 등 다양한 방법으로 지식을 습득할 수 있다.","sourcePage":427,"pdfPage":275},{"id":2334,"source":"MAIN","day":"47","word":"by no means","entryType":"MULTIWORD","meaning":"결코 -이 아닌","example":"He is by no means a beggar.","translation":"그는 결코 거지가 아니다.","sourcePage":427,"pdfPage":275},{"id":2335,"source":"MAIN","day":"47","word":"by[in] virtue of","entryType":"MULTIWORD","meaning":"-덕분에, -때문에","example":"By virtue of her experience, she was chosen for the leadership role.","translation":"그녀는 자신의 경험 덕택에 리더 역할로 발탁되었다.","sourcePage":427,"pdfPage":275},{"id":2336,"source":"MAIN","day":"47","word":"call down","entryType":"MULTIWORD","meaning":"-을 꾸짖다, 비난하다","example":"The critics called down the movie for its poor acting.","translation":"평론가들은 연기가 형편없다는 이유로 영화를 깎아내렸다.","sourcePage":427,"pdfPage":275},{"id":2337,"source":"MAIN","day":"47","word":"call for","entryType":"MULTIWORD","meaning":"-을 요구하다, 필요로 하다","example":"Our goal is to call for citizens’ participation in the election.","translation":"우리의 목표는 시민들의 선거 참여를 촉구하는 것이다.","sourcePage":427,"pdfPage":275},{"id":2338,"source":"MAIN","day":"47","word":"call off","entryType":"MULTIWORD","meaning":"-을 취소[철회]하다","example":"The organizers had to call off the event due to bad weather.","translation":"주최 측은 악천후 때문에 행사를 취소해야 했다.","sourcePage":427,"pdfPage":275},{"id":2339,"source":"MAIN","day":"47","word":"care for","entryType":"MULTIWORD","meaning":"① -을 보살피다, 돌보다 ② -을 좋아하다","example":"We need to care for the environment for future generations.","translation":"우리는 미래 세대를 위해 환경을 보호해야 한다.","sourcePage":428,"pdfPage":276},{"id":2340,"source":"MAIN","day":"47","word":"carry on","entryType":"MULTIWORD","meaning":"계속하다, 이어가다","example":"Despite the setback, they were determined to carry on with their mission.","translation":"좌절에도 불구하고 그들은 그들의 임무를 계속하기로 결심했다.","sourcePage":428,"pdfPage":276},{"id":2341,"source":"MAIN","day":"47","word":"carry out","entryType":"MULTIWORD","meaning":"-을 수행하다, 실행하다","example":"The doctor found that she was unable to carry out her normal work.","translation":"의사는 그녀가 정상 근무를 수행할 수 없다고 판단했다.","sourcePage":428,"pdfPage":276},{"id":2342,"source":"MAIN","day":"47","word":"come across","entryType":"MULTIWORD","meaning":"① -을 우연히 마주치다 ② 이해[전달]되다","example":"I came across a strange man while going home.","translation":"집에 가는 동안 나는 이상한 남자를 우연히 마주쳤다.","sourcePage":428,"pdfPage":276},{"id":2343,"source":"MAIN","day":"47","word":"come in handy","entryType":"MULTIWORD","meaning":"유용해지다, 도움이 되다","example":"The information came in very handy.","translation":"그 정보는 매우 유용했다.","sourcePage":428,"pdfPage":276},{"id":2344,"source":"MAIN","day":"47","word":"come to life","entryType":"MULTIWORD","meaning":"활기를 띠다","example":"The match finally came to life in the second half.","translation":"시합은 후반전에 마침내 활기를 띠었다.","sourcePage":428,"pdfPage":276},{"id":2345,"source":"MAIN","day":"47","word":"come up with","entryType":"MULTIWORD","meaning":"① -을 생각해 내다, 만들어 내다 ② -을 제시[제안]하다","example":"You should come up with realistic but creative ideas.","translation":"너는 현실적이지만 창의적인 아이디어를 생각해 내야 한다.","sourcePage":429,"pdfPage":277},{"id":2346,"source":"MAIN","day":"47","word":"cope with","entryType":"MULTIWORD","meaning":"-에 대처하다","example":"There are many ways to cope with rejection.","translation":"거절에 대처하는 많은 방법들이 있다.","sourcePage":429,"pdfPage":277},{"id":2347,"source":"MAIN","day":"47","word":"cut back (on)","entryType":"MULTIWORD","meaning":"-을 줄이다","example":"The doctor advised him to cut back on salt in his diet.","translation":"의사는 그에게 식단에서 소금을 줄이라고 조언했다.","sourcePage":429,"pdfPage":277},{"id":2348,"source":"MAIN","day":"47","word":"dead end","entryType":"MULTIWORD","meaning":"막다른 골목","example":"I had no choice but to surrender when I was at a dead end.","translation":"막다른 골목에 이르러 나는 항복할 수밖에 없었다.","sourcePage":429,"pdfPage":277},{"id":2349,"source":"MAIN","day":"47","word":"deal with","entryType":"MULTIWORD","meaning":"-을 다루다, 처리하다","example":"We must take positive steps to deal with the problem.","translation":"우리는 그 문제를 처리하기 위해 긍정적인 조치를 취해야 할 것이다.","sourcePage":429,"pdfPage":277},{"id":2350,"source":"MAIN","day":"47","word":"depend (up)on","entryType":"MULTIWORD","meaning":"-에 의존하다, 달려 있다","example":"Children greatly depend on their parents.","translation":"아이들은 부모에게 대단히 의존한다.","sourcePage":429,"pdfPage":277},{"id":2351,"source":"MAIN","day":"48","word":"derive from","entryType":"MULTIWORD","meaning":"-에서 유래하다","example":"The rumor derived from a misunderstanding, not actual facts.","translation":"그 소문은 실제 사실이 아닌 오해에서 비롯되었다.","sourcePage":430,"pdfPage":278},{"id":2352,"source":"MAIN","day":"48","word":"do away with","entryType":"MULTIWORD","meaning":"-을 없애다, 폐지하다","example":"Many countries are doing away with capital punishment.","translation":"많은 국가에서 사형을 폐지하고 있다.","sourcePage":430,"pdfPage":278},{"id":2353,"source":"MAIN","day":"48","word":"do sb good","entryType":"MULTIWORD","meaning":"-에게 이익이 되다","example":"A few years of traveling abroad will do you good.","translation":"몇 년간의 해외여행이 너에게 도움이 될 거다.","sourcePage":430,"pdfPage":278},{"id":2354,"source":"MAIN","day":"48","word":"do without","entryType":"MULTIWORD","meaning":"-없이 지내다","example":"The new building is designed to do without air conditioning.","translation":"새 건물은 에어컨 없이도 지낼 수 있도록 설계되었다.","sourcePage":431,"pdfPage":279},{"id":2355,"source":"MAIN","day":"48","word":"down-to-earth","entryType":"MULTIWORD","meaning":"현실적인","example":"You should come up with down-to-earth but creative ideas.","translation":"너는 현실적이지만 창의적인 아이디어를 생각해 내야 한다.","sourcePage":431,"pdfPage":279},{"id":2356,"source":"MAIN","day":"48","word":"dwell on","entryType":"MULTIWORD","meaning":"-을 곰곰이 생각하다, 숙고하다","example":"We shouldn't dwell on things we cannot control.","translation":"통제할 수 없는 것에 연연해서는 안 된다.","sourcePage":431,"pdfPage":279},{"id":2357,"source":"MAIN","day":"48","word":"end up","entryType":"MULTIWORD","meaning":"결국 -하게 되다","example":"I ended up doing all the work myself.","translation":"결국 그 모든 일을 내가 다 하게 되었다.","sourcePage":431,"pdfPage":279},{"id":2358,"source":"MAIN","day":"48","word":"figure out","entryType":"MULTIWORD","meaning":"① -을 생각해 내다, 알아내다 ② -을 계산(산출)하다 ③ -을 이해하다","example":"I can't figure out how to do this.","translation":"나는 이것을 어떻게 하는 건지 이해할 수 없다.","sourcePage":431,"pdfPage":279},{"id":2359,"source":"MAIN","day":"48","word":"fill in","entryType":"MULTIWORD","meaning":"① -을 채우다, 작성하다 ② -을 대신하다","example":"Please fill in the blanks.","translation":"빈칸을 채우세요.","sourcePage":431,"pdfPage":279},{"id":2360,"source":"MAIN","day":"48","word":"fill out","entryType":"MULTIWORD","meaning":"(서류에) 기입하다, 작성하다","example":"Can you fill out this survey for us before you leave?","translation":"떠나기 전에 이 설문 조사를 작성해 주시겠습니까?","sourcePage":431,"pdfPage":279},{"id":2361,"source":"MAIN","day":"48","word":"for good","entryType":"MULTIWORD","meaning":"영원히","example":"He wanted me to stay with him for good.","translation":"그는 내가 영원히 그와 함께 있어 주기를 바랐다.","sourcePage":432,"pdfPage":280},{"id":2362,"source":"MAIN","day":"48","word":"for the sake of","entryType":"MULTIWORD","meaning":"-을 위해서","example":"They fasted for the sake of their religious beliefs.","translation":"그들은 종교적 신념을 위해 금식했다.","sourcePage":432,"pdfPage":280},{"id":2363,"source":"MAIN","day":"48","word":"for want[lack] of","entryType":"MULTIWORD","meaning":"-이 부족하여","example":"For want of a better option, we decided to stay home.","translation":"더 나은 선택지가 없어서 우리는 집에 있기로 결정했다.","sourcePage":432,"pdfPage":280},{"id":2364,"source":"MAIN","day":"48","word":"from time to time","entryType":"MULTIWORD","meaning":"때때로, 가끔","example":"The Internet connection from time to time becomes unstable.","translation":"인터넷 연결이 때때로 불안정해진다.","sourcePage":432,"pdfPage":280},{"id":2365,"source":"MAIN","day":"48","word":"get across","entryType":"MULTIWORD","meaning":"① -을 이해시키다 ② -을 건너다","example":"He used striking visuals to get his point across.","translation":"그는 자신의 논점을 이해시키기 위해 인상적인 시각 자료를 사용했다.","sourcePage":432,"pdfPage":280},{"id":2366,"source":"MAIN","day":"48","word":"get along with","entryType":"MULTIWORD","meaning":"-와 사이좋게 지내다","example":"He is friendly and gets along with everyone.","translation":"그는 친절하고 모든 사람과 잘 지낸다.","sourcePage":432,"pdfPage":280},{"id":2367,"source":"MAIN","day":"48","word":"get in one's way","entryType":"MULTIWORD","meaning":"-에게 방해가 되다","example":"Can I move the books? They get in my way.","translation":"그 책들 좀 옮겨도 될까요? 그것들이 저에게 방해가 되네요.","sourcePage":432,"pdfPage":280},{"id":2368,"source":"MAIN","day":"48","word":"get out of","entryType":"MULTIWORD","meaning":"-에서 벗어나다, 탈출하다, 피하다","example":"Try to get out of your comfort zone and try new things.","translation":"안전지대에서 벗어나 새로운 것을 시도해 봐라.","sourcePage":433,"pdfPage":281},{"id":2369,"source":"MAIN","day":"48","word":"get over","entryType":"MULTIWORD","meaning":"-을 극복하다, 회복하다","example":"The best way to get over a breakup is to focus on yourself.","translation":"이별을 극복하는 가장 좋은 방법은 자신에게 집중하는 것이다.","sourcePage":433,"pdfPage":281},{"id":2370,"source":"MAIN","day":"48","word":"get through","entryType":"MULTIWORD","meaning":"① -을 통과하다, 빠져나가다 ② -을 끝내다 ③ -을 극복하다","example":"I'm not sure we can get through all this work on time, with only four people.","translation":"우리 4명만으로 이 모든 일을 제시간에 끝낼 수 있을 것 같지 않다.","sourcePage":433,"pdfPage":281},{"id":2371,"source":"MAIN","day":"48","word":"give in","entryType":"MULTIWORD","meaning":"① -을 제출하다 ② (+ to) -에 굴복(항복)하다","example":"Will the company give in to the workers' demands?","translation":"회사가 근로자들의 요구에 굴복할까요?","sourcePage":433,"pdfPage":281},{"id":2372,"source":"MAIN","day":"48","word":"give rise to","entryType":"MULTIWORD","meaning":"-을 일으키다, 야기하다, 초래하다","example":"His comments gave rise to a heated debate on social media.","translation":"그의 발언은 소셜 미디어에서 뜨거운 논쟁을 불러일으켰다.","sourcePage":433,"pdfPage":281},{"id":2373,"source":"MAIN","day":"48","word":"give up","entryType":"MULTIWORD","meaning":"-을 포기하다, 그만두다","example":"His wife finally persuaded him to give up smoking.","translation":"그의 아내는 결국 그가 담배를 끊도록 설득했다.","sourcePage":433,"pdfPage":281},{"id":2374,"source":"MAIN","day":"48","word":"give way to","entryType":"MULTIWORD","meaning":"-에 굴복(항복)하다, 양보하다","example":"Please give way to the ambulance approaching with its siren on.","translation":"사이렌을 울리며 다가오는 구급차에 길을 비켜 주세요.","sourcePage":434,"pdfPage":282},{"id":2375,"source":"MAIN","day":"48","word":"go over","entryType":"MULTIWORD","meaning":"① -을 건너가다 ② -을 조사하다, 검토하다","example":"Would you like to go over the menu before you order?","translation":"주문하기 전에 메뉴판을 한번 살펴보시겠어요?","sourcePage":434,"pdfPage":282},{"id":2376,"source":"MAIN","day":"48","word":"go through","entryType":"MULTIWORD","meaning":"① -을 살펴보다 ② -을 겪다 ③ -을 통과하다","example":"I always start the day by going through my email.","translation":"나는 언제나 이메일을 살펴보는 것으로 나의 하루를 시작한다.","sourcePage":434,"pdfPage":282},{"id":2377,"source":"MAIN","day":"48","word":"hand down","entryType":"MULTIWORD","meaning":"-을 물려주다","example":"We handed down the old family recipes in a handwritten notebook.","translation":"우리는 오래된 가족 요리법을 직접 손으로 쓴 노트에 적어 물려주었다.","sourcePage":434,"pdfPage":282},{"id":2378,"source":"MAIN","day":"48","word":"hand in","entryType":"MULTIWORD","meaning":"-을 제출하다","example":"They handed in a petition signed by hundreds of residents.","translation":"그들은 수백 명의 주민이 서명한 탄원서를 제출했다.","sourcePage":434,"pdfPage":282},{"id":2379,"source":"MAIN","day":"48","word":"have nothing to do with","entryType":"MULTIWORD","meaning":"-와 관계가 없다","example":"I have nothing to do with the matter.","translation":"나는 그 문제와 아무 관계가 없다.","sourcePage":434,"pdfPage":282},{"id":2380,"source":"MAIN","day":"48","word":"have trouble[difficulty] (in) RVing","entryType":"MULTIWORD","meaning":"-하는 데 어려움[곤란]을 겪다","example":"People who drink too much coffee may have trouble (in) sleeping.","translation":"커피를 너무 많이 마시는 사람은 잠을 자는 데 어려움을 겪을 수 있다.","sourcePage":435,"pdfPage":283},{"id":2381,"source":"MAIN","day":"48","word":"hit upon","entryType":"MULTIWORD","meaning":"-을 생각해 내다","example":"While brainstorming, we hit upon a creative solution.","translation":"우리는 브레인스토밍을 하던 중 창의적인 해결책을 생각해 냈다.","sourcePage":435,"pdfPage":283},{"id":2382,"source":"MAIN","day":"48","word":"hold back","entryType":"MULTIWORD","meaning":"① -을 저지하다, 억제하다 ② -을 비밀로 해두다","example":"The dam held back the rushing water, preventing a flood.","translation":"댐은 밀려오는 물을 막아 홍수를 예방했다.","sourcePage":435,"pdfPage":283},{"id":2383,"source":"MAIN","day":"48","word":"hold (on) to","entryType":"MULTIWORD","meaning":"-을 고수하다","example":"The country holds on to its traditions despite modernization.","translation":"그 나라는 현대화에도 불구하고 전통을 고수하고 있다.","sourcePage":435,"pdfPage":283},{"id":2384,"source":"MAIN","day":"48","word":"in accordance with","entryType":"MULTIWORD","meaning":"-에 따라","example":"The matter will be dealt with in accordance with the law.","translation":"그 사건은 법에 따라 처리될 것이다.","sourcePage":435,"pdfPage":283},{"id":2385,"source":"MAIN","day":"48","word":"in addition to","entryType":"MULTIWORD","meaning":"-에 더하여, -뿐 아니라","example":"In addition to discounts, they offer a free gift.","translation":"할인에 더해, 그들은 사은품을 제공합니다.","sourcePage":435,"pdfPage":283},{"id":2386,"source":"MAIN","day":"48","word":"in case S+V","entryType":"MULTIWORD","meaning":"-의 경우에, -의 경우에 대비하여","example":"Take some spare clothes in case you get wet.","translation":"옷에 젖을 경우에 대비해서 여분의 옷을 좀 챙겨 가라.","sourcePage":435,"pdfPage":283},{"id":2387,"source":"MAIN","day":"48","word":"in charge of","entryType":"MULTIWORD","meaning":"-을 담당하는, 책임지는","example":"She is in charge of advertising.","translation":"그녀는 광고를 담당하고 있다.","sourcePage":436,"pdfPage":284},{"id":2388,"source":"MAIN","day":"48","word":"in comparison with[to]","entryType":"MULTIWORD","meaning":"-와 비교해 보면, -에 비해서","example":"In comparison with other countries, the US has a high poverty rate.","translation":"다른 나라들에 비해 미국은 빈곤율이 높은 편이다.","sourcePage":436,"pdfPage":284},{"id":2389,"source":"MAIN","day":"48","word":"in connection with","entryType":"MULTIWORD","meaning":"-와 관련하여","example":"Do you have any questions in connection with the feedback you received?","translation":"받은 피드백과 관련하여 질문이 있나요?","sourcePage":436,"pdfPage":284},{"id":2390,"source":"MAIN","day":"48","word":"in consequence of","entryType":"MULTIWORD","meaning":"-의 결과로","example":"The price of oil increased in consequence of the global conflict.","translation":"국제 분쟁의 결과로 유가가 상승했다.","sourcePage":436,"pdfPage":284},{"id":2391,"source":"MAIN","day":"48","word":"in effect","entryType":"MULTIWORD","meaning":"① 사실상, 실제로는 ② 유효한, 시행 중인","example":"The two systems are, in effect, identical.","translation":"사실상, 두 제도는 동일하다.","sourcePage":436,"pdfPage":284},{"id":2392,"source":"MAIN","day":"48","word":"in favor of","entryType":"MULTIWORD","meaning":"① -에 찬성하여 ② -에 유리하게, -의 이익이 되도록","example":"I am in favor of keeping the online real-name policy.","translation":"나는 온라인 실명제 유지에 찬성한다.","sourcePage":436,"pdfPage":284},{"id":2393,"source":"MAIN","day":"48","word":"in honor of","entryType":"MULTIWORD","meaning":"-에게 경의를 표하여, -을 기념하여","example":"The town held a parade in honor of the firefighters' dedication.","translation":"마을에서는 소방관들의 헌신을 기리며 퍼레이드를 열었다.","sourcePage":436,"pdfPage":284},{"id":2394,"source":"MAIN","day":"48","word":"in spite of","entryType":"MULTIWORD","meaning":"-에도 불구하고","example":"They fell in love in spite of the language barrier.","translation":"그들은 언어 장벽에도 불구하고 사랑에 빠졌다.","sourcePage":437,"pdfPage":285},{"id":2395,"source":"MAIN","day":"48","word":"in terms of","entryType":"MULTIWORD","meaning":"-면에서, -에 관하여","example":"The book is well organized in terms of plot.","translation":"그 책은 구성 면에서 잘 짜여 있다.","sourcePage":437,"pdfPage":285},{"id":2396,"source":"MAIN","day":"48","word":"in the face of","entryType":"MULTIWORD","meaning":"-에 직면해서","example":"Even in the face of challenges, she will play her heart out.","translation":"역경에도 불구하고역경에 직면해서도, 그녀는 끝까지 최선을 다할 것이다.","sourcePage":437,"pdfPage":285},{"id":2397,"source":"MAIN","day":"48","word":"in the wake of","entryType":"MULTIWORD","meaning":"-의 결과로서, -후에","example":"There have been demonstrations on the streets in the wake of the recent bomb attack.","translation":"최근에 일어난 폭탄 공격 이후에 거리에서 시위운동이 일어났다.","sourcePage":437,"pdfPage":285},{"id":2398,"source":"MAIN","day":"48","word":"in time","entryType":"MULTIWORD","meaning":"① 시간 맞추어, 제때에 ② 조만간","example":"The ambulance got there in time.","translation":"구급차가 거기에 제때에 도착했다.","sourcePage":437,"pdfPage":285},{"id":2399,"source":"MAIN","day":"48","word":"in view of","entryType":"MULTIWORD","meaning":"-에 비추어 (보면), -을 고려하여","example":"In view of the tight deadline, we need to work extra hours.","translation":"촉박한 마감 시간을 고려해서 우리는 시간외 근무를 해야 한다.","sourcePage":437,"pdfPage":285},{"id":2400,"source":"MAIN","day":"48","word":"jump to a conclusion","entryType":"MULTIWORD","meaning":"성급하게 결론을 내리다","example":"Don't jump to a conclusion!","translation":"성급하게 결론을 내리지 마!","sourcePage":437,"pdfPage":285},{"id":2401,"source":"MAIN","day":"49","word":"keep abreast of[with]","entryType":"MULTIWORD","meaning":"-에 뒤떨어지지 않다, -의 소식을 계속 접하다","example":"It is essential to keep abreast of new technologies in order to survive the world of the jungle.","translation":"약육강식의 세계에서 살아남기 위해서는 새로운 기술에 뒤떨어지지 않는 게 중요하다.","sourcePage":438,"pdfPage":286},{"id":2402,"source":"MAIN","day":"49","word":"keep away from","entryType":"MULTIWORD","meaning":"-을 멀리하다(가까이하지 않다), 피하다","example":"We should keep away from violent people.","translation":"우리는 폭력적인 사람들을 멀리해야 한다.","sourcePage":438,"pdfPage":286},{"id":2403,"source":"MAIN","day":"49","word":"keep in mind","entryType":"MULTIWORD","meaning":"-을 명심하다","example":"I will keep in mind what you said.","translation":"나는 당신이 한 말을 명심할 것이다.","sourcePage":438,"pdfPage":286},{"id":2404,"source":"MAIN","day":"49","word":"keep track of","entryType":"MULTIWORD","meaning":"① -을 기록하다 ② -을 잊어버리다, 놓치다","example":"The development of smartphones makes it easier to keep track of the personal schedule.","translation":"스마트폰의 발전으로 인해 개인 일정을 기록하는 것이 쉬워졌다.","sourcePage":439,"pdfPage":287},{"id":2405,"source":"MAIN","day":"49","word":"keep up with","entryType":"MULTIWORD","meaning":"① -에 뒤지지 않다, -의 유행을 따르다 ② -와 계속 연락하고 지내다","example":"It is difficult to keep up with the rapid pace of change.","translation":"빠른 변화 속도를 따라가기가 어렵다.","sourcePage":439,"pdfPage":287},{"id":2406,"source":"MAIN","day":"49","word":"lay off","entryType":"MULTIWORD","meaning":"-를 해고하다","example":"A sudden slump caused many of the employers to lay off their employees.","translation":"갑작스러운 경기 침체 때문에 많은 고용주들이 근로자들을 해고했다.","sourcePage":439,"pdfPage":287},{"id":2407,"source":"MAIN","day":"49","word":"lay out","entryType":"MULTIWORD","meaning":"① -을 펼치다, 전시하다 ② -을 설명하다","example":"The museum laid out its historical artifacts in chronological order.","translation":"박물관은 역사적인 유물들을 연대순으로 배치했다.","sourcePage":439,"pdfPage":287},{"id":2408,"source":"MAIN","day":"49","word":"lead to","entryType":"MULTIWORD","meaning":"-로 이르다, -을 초래하다","example":"Eating too much sugar can lead to health problems.","translation":"지나친 설탕 섭취는 건강 문제를 초래할 수 있다.","sourcePage":439,"pdfPage":287},{"id":2409,"source":"MAIN","day":"49","word":"leave out","entryType":"MULTIWORD","meaning":"-을 제외하다, 빠뜨리다","example":"Don't leave out any important information.","translation":"중요한 정보는 하나도 빠뜨리지 마라.","sourcePage":439,"pdfPage":287},{"id":2410,"source":"MAIN","day":"49","word":"let down","entryType":"MULTIWORD","meaning":"-을 실망시키다","example":"I promise our new product won't let you down.","translation":"새 제품은 당신을 실망시키지 않을 것이라고 약속한다.","sourcePage":439,"pdfPage":287},{"id":2411,"source":"MAIN","day":"49","word":"let go of","entryType":"MULTIWORD","meaning":"-에서 손을 놓다","example":"It is not easy to let go of a grudge and forgive.","translation":"원한을 버리고 용서하는 것은 쉽지 않다.","sourcePage":440,"pdfPage":288},{"id":2412,"source":"MAIN","day":"49","word":"live on","entryType":"MULTIWORD","meaning":"① -을 먹고 살다 ② 계속 살다","example":"Small birds live mainly on insects.","translation":"작은 새들은 주로 곤충을 먹고 산다.","sourcePage":440,"pdfPage":288},{"id":2413,"source":"MAIN","day":"49","word":"look after","entryType":"MULTIWORD","meaning":"-을 돌보다, 보살피다","example":"It's important to look after your mental and physical health.","translation":"정신적, 육체적 건강을 돌보는 것이 중요하다.","sourcePage":440,"pdfPage":288},{"id":2414,"source":"MAIN","day":"49","word":"look down on","entryType":"MULTIWORD","meaning":"-을 얕보다, 경시[멸시]하다","example":"True friends never look down on each other, even during difficult times.","translation":"진정한 친구는 힘든 시기에도 서로를 무시하지 않는다.","sourcePage":440,"pdfPage":288},{"id":2415,"source":"MAIN","day":"49","word":"look forward to N[RVing]","entryType":"MULTIWORD","meaning":"-하기를 고대하다","example":"I look forward to seeing her again.","translation":"나는 그녀를 다시 만나기를 고대한다.","sourcePage":440,"pdfPage":288},{"id":2416,"source":"MAIN","day":"49","word":"look into","entryType":"MULTIWORD","meaning":"-을 조사하다, 들여다보다","example":"Can you look into this issue and see if you can find a solution?","translation":"이 문제를 살펴보고 해결책을 찾아 주실 수 있을까요?","sourcePage":440,"pdfPage":288},{"id":2417,"source":"MAIN","day":"49","word":"look up to","entryType":"MULTIWORD","meaning":"-을 우러러보다, 존경하다","example":"Many people all over the world look up to her.","translation":"전 세계의 많은 사람들이 그녀를 존경한다.","sourcePage":440,"pdfPage":288},{"id":2418,"source":"MAIN","day":"49","word":"look upon A as B","entryType":"MULTIWORD","meaning":"A를 B로 간주하다","example":"Some people look upon change as a threat, while others see it as an opportunity.","translation":"어떤 사람들은 변화를 위협으로 여기는 반면, 어떤 사람들은 기회로 여긴다.","sourcePage":441,"pdfPage":289},{"id":2419,"source":"MAIN","day":"49","word":"lose track of","entryType":"MULTIWORD","meaning":"① -을 잊어버리다 ② -을 놓치다","example":"It's easy to lose track of time when you are playing video games.","translation":"비디오 게임을 하고 있으면 시간 가는 것을 잊기 쉽다.","sourcePage":441,"pdfPage":289},{"id":2420,"source":"MAIN","day":"49","word":"make a point of RVing","entryType":"MULTIWORD","meaning":"반드시 -하다, -을 강조하다","example":"It’s one of the few hobbies that I always make a point of doing.","translation":"내가 언제나 꼭 빼놓지 않고 하는 몇 안 되는 취미 중 하나이다.","sourcePage":441,"pdfPage":289},{"id":2421,"source":"MAIN","day":"49","word":"make believe","entryType":"MULTIWORD","meaning":"-인 체하다","example":"I made believe that I was younger than he.","translation":"나는 그보다 어린 척했다.","sourcePage":441,"pdfPage":289},{"id":2422,"source":"MAIN","day":"49","word":"make light of","entryType":"MULTIWORD","meaning":"-을 하찮게 여기다, 경시하다","example":"He never makes light of small things.","translation":"그는 작은 일도 결코 하찮게 여기지 않는다.","sourcePage":441,"pdfPage":289},{"id":2423,"source":"MAIN","day":"49","word":"make out","entryType":"MULTIWORD","meaning":"① -을 이해하다, 알아내다 ② 성공하다","example":"I can’t make out what she wants.","translation":"나는 그녀가 뭘 원하는지 이해할 수가 없다.","sourcePage":441,"pdfPage":289},{"id":2424,"source":"MAIN","day":"49","word":"make sense","entryType":"MULTIWORD","meaning":"① 타당하다 ② 이해가 되다","example":"All those reasons make sense.","translation":"이 모든 이유들은 이해가 된다.","sourcePage":442,"pdfPage":290},{"id":2425,"source":"MAIN","day":"49","word":"make sure","entryType":"MULTIWORD","meaning":"① 반드시 -하다, -을 확실히 하다 ② -을 확인하다","example":"Make sure the TV is off.","translation":"TV가 꺼져 있는지 꼭 확인해라.","sourcePage":442,"pdfPage":290},{"id":2426,"source":"MAIN","day":"49","word":"make up","entryType":"MULTIWORD","meaning":"① -을 구성하다 ② -을 만들다 ③ -을 거짓말하다, 꾸미다 ④ 화장하다","example":"They make up about one-tenth of all galaxies.","translation":"그들은 전 우주의 약 10분의 1을 구성한다.","sourcePage":442,"pdfPage":290},{"id":2427,"source":"MAIN","day":"49","word":"make up for","entryType":"MULTIWORD","meaning":"-을 보상하다, 만회하다","example":"They will make up for everything.","translation":"그들이 모든 것을 보상할 것이다.","sourcePage":442,"pdfPage":290},{"id":2428,"source":"MAIN","day":"49","word":"net worth","entryType":"MULTIWORD","meaning":"순자산","example":"It was almost half my net worth.","translation":"그것은 내 전 재산 가운데 거의 절반이었다.","sourcePage":442,"pdfPage":290},{"id":2429,"source":"MAIN","day":"49","word":"on account of","entryType":"MULTIWORD","meaning":"때문에","example":"He received a speeding ticket on account of exceeding the limit.","translation":"그는 과속을 해서 속도 위반 딱지를 받았다.","sourcePage":442,"pdfPage":290},{"id":2430,"source":"MAIN","day":"49","word":"on behalf of","entryType":"MULTIWORD","meaning":"① -을 대신하여 ② -을 위해","example":"I signed the contract on behalf of my client.","translation":"나는 내 고객을 대신하여 계약서에 서명했다.","sourcePage":442,"pdfPage":290},{"id":2431,"source":"MAIN","day":"49","word":"on the contrary","entryType":"MULTIWORD","meaning":"그와 반대로","example":"On the contrary, the price of gold has doubled.","translation":"그와 반대로, 금값은 두 배로 뛰었다.","sourcePage":443,"pdfPage":291},{"id":2432,"source":"MAIN","day":"49","word":"out of date","entryType":"MULTIWORD","meaning":"구식의","example":"That radio looks so out of date.","translation":"저 라디오는 되게 구식인 것 같다.","sourcePage":443,"pdfPage":291},{"id":2433,"source":"MAIN","day":"49","word":"out of order","entryType":"MULTIWORD","meaning":"① 고장 난 ② (행동이) 제멋대로인","example":"His behavior in the meeting was out of order.","translation":"그 회의에서 그의 행동은 적절하지 못했다.","sourcePage":443,"pdfPage":291},{"id":2434,"source":"MAIN","day":"49","word":"out of stock","entryType":"MULTIWORD","meaning":"재고가 떨어진","example":"The store was out of stock of my favorite cereal.","translation":"그 매장에는 내가 좋아하는 시리얼의 재고가 없었다.","sourcePage":443,"pdfPage":291},{"id":2435,"source":"MAIN","day":"49","word":"out of the question","entryType":"MULTIWORD","meaning":"불가능한, 의논해 봐야 소용없는","example":"A trip to New Zealand is out of the question this year.","translation":"올해 뉴질랜드로 여행가는 것은 불가능하다.","sourcePage":443,"pdfPage":291},{"id":2436,"source":"MAIN","day":"49","word":"pass away","entryType":"MULTIWORD","meaning":"죽다","example":"He passed away peacefully in his sleep last night.","translation":"그는 어젯밤 잠자다가 평화롭게 세상을 떠났다.","sourcePage":443,"pdfPage":291},{"id":2437,"source":"MAIN","day":"49","word":"pass down","entryType":"MULTIWORD","meaning":"-을 물려주다","example":"The knowledge and skills were passed down through the years.","translation":"지식과 기술은 오랜 세월에 걸쳐 전수되었다.","sourcePage":444,"pdfPage":292},{"id":2438,"source":"MAIN","day":"49","word":"pass out","entryType":"MULTIWORD","meaning":"① 기절하다, 의식을 잃다 ② -를 나누어 주다","example":"The intense heat caused her to pass out during the marathon.","translation":"그녀는 마라톤 도중 극심한 더위로 인해 기절했다.","sourcePage":444,"pdfPage":292},{"id":2439,"source":"MAIN","day":"49","word":"pay attention to","entryType":"MULTIWORD","meaning":"-에 주목하다, 주의를 기울이다","example":"Please pay attention to what I am saying.","translation":"제 말에 주목해 주십시오.","sourcePage":444,"pdfPage":292},{"id":2440,"source":"MAIN","day":"49","word":"pay off","entryType":"MULTIWORD","meaning":"① -를 다 갚다, 청산하다 ② 성과를 내다, 이익이 되다","example":"Exercising regularly can pay off in the long run.","translation":"규칙적인 운동은 장기적으로 보면 이득이 될 수 있다.","sourcePage":444,"pdfPage":292},{"id":2441,"source":"MAIN","day":"49","word":"pick up","entryType":"MULTIWORD","meaning":"① -을 (차에) 태우다 ② -을 집어 올리다 ③ 개선되다","example":"The bus picks up passengers at the airport.","translation":"그 버스는 공항에서 승객들을 태운다.","sourcePage":444,"pdfPage":292},{"id":2442,"source":"MAIN","day":"49","word":"pros and cons","entryType":"MULTIWORD","meaning":"① 장단점 ② 찬반 양론","example":"We've been discussing the pros and cons of buying a house.","translation":"우리는 집을 구입하는 것의 장단점에 대해 토론해 왔다.","sourcePage":444,"pdfPage":292},{"id":2443,"source":"MAIN","day":"49","word":"put[lay] aside","entryType":"MULTIWORD","meaning":"① -을 무시하다, 제쳐 놓다 ② -을 따로 떼어 두다[비축하다]","example":"They decided to put aside their differences.","translation":"그들은 자신들의 차이점을 제쳐 놓기로 했다.","sourcePage":444,"pdfPage":292},{"id":2444,"source":"MAIN","day":"49","word":"put off","entryType":"MULTIWORD","meaning":"-을 미루다, 연기하다","example":"Never put off until tomorrow what you can do today.","translation":"오늘 할 수 있는 일을 내일로 미루지 마라.","sourcePage":445,"pdfPage":293},{"id":2445,"source":"MAIN","day":"49","word":"put on","entryType":"MULTIWORD","meaning":"① -를 착용하다 ② -을 공연[상연]하다","example":"I need to put on my glasses to see the screen clearly.","translation":"나는 화면을 선명하게 보려면 안경을 써야 한다.","sourcePage":445,"pdfPage":293},{"id":2446,"source":"MAIN","day":"49","word":"put up with","entryType":"MULTIWORD","meaning":"-을 참다, 견디다","example":"I'm not going to put up with your disrespect any longer.","translation":"나는 더 이상 당신의 무례함을 참지 않을 것이다.","sourcePage":445,"pdfPage":293},{"id":2447,"source":"MAIN","day":"49","word":"read between the lines","entryType":"MULTIWORD","meaning":"행간을 읽다","example":"When you try to read between the lines while reading a novel, you can understand characters’ feelings more deeply.","translation":"소설을 읽으면서 행간을 읽으려고 노력한다면, 등장인물들의 감정을 더 깊게 이해할 수 있다.","sourcePage":445,"pdfPage":293},{"id":2448,"source":"MAIN","day":"49","word":"refer to","entryType":"MULTIWORD","meaning":"① -을 언급하다 ② -을 참고하다 ③ -을 가리키다","example":"The article refers to the need for climate change action.","translation":"그 기사는 기후 변화 행동의 필요성을 언급한다.","sourcePage":445,"pdfPage":293},{"id":2449,"source":"MAIN","day":"49","word":"regardless of","entryType":"MULTIWORD","meaning":"-에 상관없이","example":"Every human being is equal regardless of religion, race, or creed.","translation":"모든 인간은 종교, 인종, 신념에 상관없이 평등하다.","sourcePage":445,"pdfPage":293},{"id":2450,"source":"MAIN","day":"49","word":"root out","entryType":"MULTIWORD","meaning":"-를 제거하다, 뿌리 뽑다[근절시키다]","example":"The government aims to root out corruption within its ranks.","translation":"정부는 관료들의 부패를 근절하는 것을 목표로 하고 있다.","sourcePage":445,"pdfPage":293},{"id":2451,"source":"MAIN","day":"50","word":"rule out","entryType":"MULTIWORD","meaning":"-을 제외시키다, 배제하다","example":"He didn’t rule out the possibility of traveling to Britain.","translation":"그는 영국 여행의 가능성을 배제하지 않았다.","sourcePage":446,"pdfPage":294},{"id":2452,"source":"MAIN","day":"50","word":"run across","entryType":"MULTIWORD","meaning":"-을 우연히 마주치다","example":"I ran across an old friend at the grocery store.","translation":"나는 마트에서 오랜 친구를 우연히 만났다.","sourcePage":446,"pdfPage":294},{"id":2453,"source":"MAIN","day":"50","word":"run for","entryType":"MULTIWORD","meaning":"-에 입후보하다","example":"Independent parties are also running for office in several districts.","translation":"무소속 후보자들도 여러 선거구에서 출마하고 있다.","sourcePage":446,"pdfPage":294},{"id":2454,"source":"MAIN","day":"50","word":"run out of","entryType":"MULTIWORD","meaning":"-을 다 써 버리다","example":"I ran out of time before solving all the questions.","translation":"모든 문제를 다 풀기도 전에 시간을 다 써 버렸다.","sourcePage":447,"pdfPage":295},{"id":2455,"source":"MAIN","day":"50","word":"second to none","entryType":"MULTIWORD","meaning":"누구에게도 뒤지지 않는","example":"As an ice skater, she is second to none.","translation":"아이스 스케이터로서, 그녀는 그 누구에게도 뒤지지 않는다.","sourcePage":447,"pdfPage":295},{"id":2456,"source":"MAIN","day":"50","word":"set apart","entryType":"MULTIWORD","meaning":"-을 떼어 놓다, -을 (-와) 구별하다 (from)","example":"What sets apart a diamond from other gemstones is its hardness.","translation":"다이아몬드가 다른 보석과 차별화되는 것은 바로 단단함이다.","sourcePage":447,"pdfPage":295},{"id":2457,"source":"MAIN","day":"50","word":"set back","entryType":"MULTIWORD","meaning":"-을 저지[방해]하다, 지연시키다","example":"Her illness set her back in her studies.","translation":"그녀는 병 때문에 학업에 차질이 생겼다.","sourcePage":447,"pdfPage":295},{"id":2458,"source":"MAIN","day":"50","word":"set off","entryType":"MULTIWORD","meaning":"① 출발하다, 시작하다 ② -을 유발[촉발]하다","example":"She carried her bag and set off home.","translation":"그녀는 가방을 메고 집으로 출발했다.","sourcePage":447,"pdfPage":295},{"id":2459,"source":"MAIN","day":"50","word":"set up","entryType":"MULTIWORD","meaning":"① -을 설립[설치]하다 ② -을 준비하다","example":"Most bookstores nationwide had set up special booths for her newest book.","translation":"전국 대부분의 서점이 그녀의 신간을 위해 특별 부스를 설치했다.","sourcePage":447,"pdfPage":295},{"id":2460,"source":"MAIN","day":"50","word":"show off","entryType":"MULTIWORD","meaning":"-을 과시하다, 자랑하다","example":"It’s better to show off your skills through your actions, not just words.","translation":"말로만 아니라 행동으로 실력을 과시하는 것이 좋다.","sourcePage":448,"pdfPage":296},{"id":2461,"source":"MAIN","day":"50","word":"side effect","entryType":"MULTIWORD","meaning":"부작용","example":"Before prescribing medicine, you must know about the side effects.","translation":"처방하기 전에, 당신은 반드시 부작용에 대해 알아야 한다.","sourcePage":448,"pdfPage":296},{"id":2462,"source":"MAIN","day":"50","word":"speak ill of","entryType":"MULTIWORD","meaning":"-을 나쁘게 말하다, 험담하다","example":"Don't speak ill of him. You are no better than him.","translation":"그를 나쁘게 말하지 마. 너도 그와 다를 것 없어.","sourcePage":448,"pdfPage":296},{"id":2463,"source":"MAIN","day":"50","word":"stand by","entryType":"MULTIWORD","meaning":"① -를 지지하다 ② 대기하다","example":"The team decided to stand by their coach despite the recent loss.","translation":"팀은 최근의 패배에도 불구하고 코치님의 편에 서기로 결심했다.","sourcePage":448,"pdfPage":296},{"id":2464,"source":"MAIN","day":"50","word":"stand for","entryType":"MULTIWORD","meaning":"① -을 나타내다, 상징하다 ② -을 지지[옹호]하다","example":"The abbreviation CC stands for “Carbon Copy.”","translation":"약어 CC는 'Carbon Copy'의 약자다.","sourcePage":448,"pdfPage":296},{"id":2465,"source":"MAIN","day":"50","word":"stand out","entryType":"MULTIWORD","meaning":"눈에 띄다, 두드러지다","example":"As an engineer, he stands out from his coworkers.","translation":"엔지니어로서 그는 동료들 사이에서 두드러진다.","sourcePage":448,"pdfPage":296},{"id":2466,"source":"MAIN","day":"50","word":"stand up for","entryType":"MULTIWORD","meaning":"-을 지지하다, 옹호하다","example":"If you see something wrong, you should stand up for what's right.","translation":"잘못된 것을 본다면 옳은 것을 위해 일어서야 한다.","sourcePage":449,"pdfPage":297},{"id":2467,"source":"MAIN","day":"50","word":"stand up to","entryType":"MULTIWORD","meaning":"-에 맞서다","example":"He bravely stood up to the bully despite feeling scared.","translation":"그는 겁이 났지만 용감하게 괴롭힘에 맞섰다.","sourcePage":449,"pdfPage":297},{"id":2468,"source":"MAIN","day":"50","word":"steer clear of","entryType":"MULTIWORD","meaning":"-을 피하다","example":"Steer clear of chickens and eggs during the treatment period.","translation":"치료 기간엔 닭고기와 달걀을 피하세요.","sourcePage":449,"pdfPage":297},{"id":2469,"source":"MAIN","day":"50","word":"stick to","entryType":"MULTIWORD","meaning":"-을 고수하다","example":"They stuck to their decision even though it was unpopular.","translation":"그들은 반응이 좋지 않음에도 불구하고 자신들의 결정을 고수했다.","sourcePage":449,"pdfPage":297},{"id":2470,"source":"MAIN","day":"50","word":"struggle to RV","entryType":"MULTIWORD","meaning":"-하려고 고군분투하다[애쓰다]","example":"Many people struggle to afford basic necessities today.","translation":"오늘날 많은 사람들이 기본 생필품을 감당하기 위해 고군분투한다.","sourcePage":449,"pdfPage":297},{"id":2471,"source":"MAIN","day":"50","word":"take advantage of","entryType":"MULTIWORD","meaning":"-을 (기회로) 이용하다","example":"He wanted to take advantage of the lower labor costs.","translation":"그는 더 낮은 인건비를 기회로 이용하기를 원했다.","sourcePage":449,"pdfPage":297},{"id":2472,"source":"MAIN","day":"50","word":"take after","entryType":"MULTIWORD","meaning":"-을 닮다","example":"Many leaders take after historical figures they admire.","translation":"많은 지도자들이 자신이 존경하는 역사적 인물을 닮는다.","sourcePage":449,"pdfPage":297},{"id":2473,"source":"MAIN","day":"50","word":"take apart","entryType":"MULTIWORD","meaning":"① -을 분해하다 ② -을 쉽게 이해하다","example":"The child took apart her toy car out of curiosity.","translation":"그 아이는 호기심에 장난감 자동차를 분해했다.","sourcePage":450,"pdfPage":298},{"id":2474,"source":"MAIN","day":"50","word":"take care of","entryType":"MULTIWORD","meaning":"① -을 돌보다 ② -를 처리하다","example":"His aunts expected me to take care of him.","translation":"그의 숙모들은 내가 그를 돌볼 거라고 기대했다.","sourcePage":450,"pdfPage":298},{"id":2475,"source":"MAIN","day":"50","word":"take down","entryType":"MULTIWORD","meaning":"① -을 적어 두다 ② -을 해체하다, 철거하다 ③ -을 끌어 내리다","example":"Take down the key points from the presentation.","translation":"프레젠테이션의 핵심 사항을 적어 두어라.","sourcePage":450,"pdfPage":298},{"id":2476,"source":"MAIN","day":"50","word":"take for granted","entryType":"MULTIWORD","meaning":"-을 당연시하다","example":"If favors continue, people take them for granted.","translation":"호의가 계속되면 사람들은 그것을 당연하게 여긴다.","sourcePage":450,"pdfPage":298},{"id":2477,"source":"MAIN","day":"50","word":"take in","entryType":"MULTIWORD","meaning":"① -을 받아들이다, 이해하다 ② -을 섭취[흡수]하다 ③ (주로 수동태로) -을 속이다","example":"The athlete needs to take in more protein to build muscle.","translation":"운동선수는 근육을 만들기 위해 더 많은 단백질을 섭취해야 한다.","sourcePage":450,"pdfPage":298},{"id":2478,"source":"MAIN","day":"50","word":"take into account [consideration]","entryType":"MULTIWORD","meaning":"-을 고려하다","example":"The company will take your personal aptitudes and abilities into account.","translation":"그 회사는 개인별 적성과 능력을 고려할 것이다.","sourcePage":450,"pdfPage":298},{"id":2479,"source":"MAIN","day":"50","word":"take off","entryType":"MULTIWORD","meaning":"① -을 벗다 ② 이륙하다","example":"The rocket took off into space successfully.","translation":"로켓이 우주로 성공적으로 이륙했다.","sourcePage":450,"pdfPage":298},{"id":2480,"source":"MAIN","day":"50","word":"take on","entryType":"MULTIWORD","meaning":"① -을 떠맡다 ② (4-2S) 띠다","example":"The lawyer took on the case pro bono.","translation":"그 변호사는 이 사건을 무료로 맡았다.","sourcePage":451,"pdfPage":299},{"id":2481,"source":"MAIN","day":"50","word":"take over","entryType":"MULTIWORD","meaning":"① 인수하다, 물려받다 ② -을 장악하다","example":"In 1814, Russia tried to take over the city.","translation":"1814년에 러시아는 그 도시를 장악하려고 했다.","sourcePage":451,"pdfPage":299},{"id":2482,"source":"MAIN","day":"50","word":"take part in","entryType":"MULTIWORD","meaning":"-에 참여하다, 가담하다","example":"Artists in this country will take part in the exposition.","translation":"이 나라의 예술가들이 전시회에 참여할 것이다.","sourcePage":451,"pdfPage":299},{"id":2483,"source":"MAIN","day":"50","word":"take place","entryType":"MULTIWORD","meaning":"① 발생하다 ② 개최되다","example":"The film festival takes place in two weeks.","translation":"그 영화제는 2주 후에 개최된다.","sourcePage":451,"pdfPage":299},{"id":2484,"source":"MAIN","day":"50","word":"take up","entryType":"MULTIWORD","meaning":"① (시간·공간 등을) 차지하다, 쓰다 ② (취미·일을) 시작하다","example":"The table takes up too much room.","translation":"그 탁자는 너무 많은 공간을 차지한다.","sourcePage":451,"pdfPage":299},{"id":2485,"source":"MAIN","day":"50","word":"touch off","entryType":"MULTIWORD","meaning":"-을 유발[촉발]하다","example":"The economic crisis touched off widespread unemployment and hardship.","translation":"경제 위기는 광범위한 실업과 고난을 촉발했다.","sourcePage":451,"pdfPage":299},{"id":2486,"source":"MAIN","day":"50","word":"turn down","entryType":"MULTIWORD","meaning":"① -을 거절하다 ② (소리·온도 등을) 낮추다, 줄이다","example":"She turned down the job offer because of the long commute.","translation":"그녀는 출퇴근 시간이 긴 이유로 채용 제안을 거절했다.","sourcePage":451,"pdfPage":299},{"id":2487,"source":"MAIN","day":"50","word":"turn in","entryType":"MULTIWORD","meaning":"① -을 돌려주다[반납하다] ② -을 제출하다","example":"Make sure to turn in your pass before leaving the event.","translation":"행사장을 떠나기 전에 반드시 출입증을 반납해라.","sourcePage":452,"pdfPage":300},{"id":2488,"source":"MAIN","day":"50","word":"turn on","entryType":"MULTIWORD","meaning":"(TV·전기·가스·수도 등을) 켜다","example":"He turned on the engine and started driving.","translation":"그는 엔진을 켜고 운전을 시작했다.","sourcePage":452,"pdfPage":300},{"id":2489,"source":"MAIN","day":"50","word":"turn out","entryType":"MULTIWORD","meaning":"① (일·결과가) -으로 되다 ② -으로 판명되다","example":"That didn’t turn out like we intended.","translation":"그것은 우리가 의도한 대로 되지 않았다.","sourcePage":452,"pdfPage":300},{"id":2490,"source":"MAIN","day":"50","word":"turn to","entryType":"MULTIWORD","meaning":"-에 의지하다","example":"In times of crisis, many people turn to their faith for strength.","translation":"위기가 닥쳤을 때 많은 사람들은 힘을 얻기 위해 자신의 믿음에 의지한다.","sourcePage":452,"pdfPage":300},{"id":2491,"source":"MAIN","day":"50","word":"use up","entryType":"MULTIWORD","meaning":"-을 다 써 버리다","example":"Making soup is a good way of using up leftover vegetables.","translation":"수프를 만드는 것은 남은 채소를 다 써 버릴 수 있는 하나의 좋은 방법이다.","sourcePage":452,"pdfPage":300},{"id":2492,"source":"MAIN","day":"50","word":"vice versa","entryType":"MULTIWORD","meaning":"반대의 경우도 마찬가지로","example":"A husband is wife's best friend and vice versa.","translation":"남편은 아내의 가장 좋은 친구이고, 그 반대로도 그렇다.","sourcePage":452,"pdfPage":300},{"id":2493,"source":"MAIN","day":"50","word":"wear out","entryType":"MULTIWORD","meaning":"① 닳다, 점점 없어지다 ② (주로 수동태로) -을 지치게 하다","example":"It’s normal for things to wear out with long use.","translation":"물건이란 오래 쓰면 닳기 마련이다.","sourcePage":452,"pdfPage":300},{"id":2494,"source":"MAIN","day":"50","word":"weed out","entryType":"MULTIWORD","meaning":"-을 솎아내다, 제거하다","example":"The algorithm is designed to weed out spam emails before they reach your inbox.","translation":"이 알고리즘은 스팸 메일이 받은 편지함에 도착하기 전에 제거하도록 설계되었다.","sourcePage":453,"pdfPage":301},{"id":2495,"source":"MAIN","day":"50","word":"well off","entryType":"MULTIWORD","meaning":"유복한","example":"Some people don't know that they're well off.","translation":"몇몇 사람들은 그들이 유복한 줄 모른다.","sourcePage":453,"pdfPage":301},{"id":2496,"source":"MAIN","day":"50","word":"when it comes to","entryType":"MULTIWORD","meaning":"-에 관한 한, -라면","example":"When it comes to liquor, beer is the best.","translation":"술이라면 맥주가 최고다.","sourcePage":453,"pdfPage":301},{"id":2497,"source":"MAIN","day":"50","word":"wind up","entryType":"MULTIWORD","meaning":"① -을 끝내다, 마무리 짓다 ② 결국 -에 처하게 되다","example":"The lost dog eventually wound up at the animal shelter.","translation":"실종견은 결국 동물 보호소에 맡겨졌다.","sourcePage":453,"pdfPage":301},{"id":2498,"source":"MAIN","day":"50","word":"with regard[respect] to","entryType":"MULTIWORD","meaning":"-에 관해서(는)","example":"You don’t need to worry about it with regard to its cost.","translation":"그것의 비용에 관해서는 걱정할 필요가 없다.","sourcePage":453,"pdfPage":301},{"id":2499,"source":"MAIN","day":"50","word":"work on","entryType":"MULTIWORD","meaning":"-에 전념하다, -을 연구하다","example":"If you work on something you are passionate about, it won't feel like work.","translation":"당신이 열정을 쏟는 일에 전념하면 그것은 일처럼 느껴지지 않을 것이다.","sourcePage":453,"pdfPage":301},{"id":2500,"source":"MAIN","day":"50","word":"work out","entryType":"MULTIWORD","meaning":"① -을 생각해 내다 ② -을 해결하다[알아내다] ③ -을 계산[산출]하다 ④ 운동하다 ⑤ (일이) 잘 풀리다","example":"I work out regularly to keep fit.","translation":"나는 건강을 유지하기 위해 규칙적으로 운동한다.","sourcePage":453,"pdfPage":301},{"id":2501,"source":"SUP","sup":"SUP01","day":"","word":"annoy","entryType":"v.","pos":"v.","pronunciation":"[ənɔ́i]","meaning":"동 귀찮게 하다","example":"","translation":"","sourcePage":464,"pdfPage":3},{"id":2502,"source":"SUP","sup":"SUP01","day":"","word":"accept","entryType":"v.","pos":"v.","pronunciation":"[əksépt]","meaning":"동 받아들이다; 인정하다","example":"","translation":"","sourcePage":464,"pdfPage":3},{"id":2503,"source":"SUP","sup":"SUP01","day":"","word":"add","entryType":"v.","pos":"v.","pronunciation":"[æd]","meaning":"동 더하다","example":"","translation":"","sourcePage":464,"pdfPage":3},{"id":2504,"source":"SUP","sup":"SUP01","day":"","word":"advance","entryType":"v.","pos":"v.","pronunciation":"[ədvǽns]","meaning":"동 전진하다; 진전되다","example":"","translation":"","sourcePage":464,"pdfPage":3},{"id":2505,"source":"SUP","sup":"SUP01","day":"","word":"advertise","entryType":"v.","pos":"v.","pronunciation":"[ǽdvərtàiz]","meaning":"동 광고하다","example":"","translation":"","sourcePage":464,"pdfPage":3},{"id":2506,"source":"SUP","sup":"SUP01","day":"","word":"advise","entryType":"v.","pos":"v.","pron function todayKey(){return new Date().toLocaleDateString("sv-SE")}
function getStats(id){if(!stats[id])stats[id]={total:0,correct:0,wrong:0,timeout:0,streak:0,last:null};return stats[id]}
function getStudy(id){if(!study[id])study[id]={chunks:[],notes:""};return study[id]}
function save(){localStorage.setItem("pe10_stats",JSON.stringify(stats));localStorage.setItem("pe10_wrong",JSON.stringify(wrong));localStorage.setItem("pe10_daily",JSON.stringify(daily));localStorage.setItem("pe10_study",JSON.stringify(study));localStorage.setItem("pe10_sessions",JSON.stringify(sessions))}
function normalizeSessionMode(mode){
  const m=String(mode||"all");
  if(["wrong","wrong_session","interrupted_wrong","day","all"].includes(m))return m;
  return "all";
}
function startSession(mode,count,poolLength,day=null,meta={}){
  const normalized=normalizeSessionMode(mode);
  return {
    id:Date.now()+"_"+Math.random().toString(36).slice(2),
    startedAt:new Date().toISOString(),
    updatedAt:new Date().toISOString(),
    endedAt:null,
    interruptedAt:null,
    resumedAt:null,
    mode:normalized,
    day:day,
    requestedCount:count==="all"?poolLength:Number(count),
    poolLength:poolLength,
    answers:[],
    status:"active",
    parentSessionId:meta.parentSessionId||null
  };
}
function recordSession(status,finalize=true){
  if(!quiz)return;
  if(finalize && quiz.sessionRecorded)return;

  const attempted=quiz.answers.length;
  const correct=quiz.answers.filter(a=>a.ok).length;
  const wrongCount=quiz.answers.filter(a=>!a.ok).length;
  const entry=quiz.session||startSession(selectedMode,quiz.pool.length,quiz.pool.length);

  entry.updatedAt=new Date().toISOString();
  entry.status=status;
  entry.attempted=attempted;
  entry.correct=correct;
  entry.wrong=wrongCount;
  entry.timeout=quiz.answers.filter(a=>a.timeout).length;
  entry.accuracy=attempted?Math.round(correct/attempted*100):0;
  entry.answers=quiz.answers.map(a=>({
    id:a.w.id,
    word:a.w.word,
    ok:a.ok,
    timeout:!!a.timeout,
    selected:a.selected||"",
    meaning:a.w.meaning
  }));

  if(status==="completed"){
    entry.endedAt=entry.updatedAt;
    entry.interruptedAt=null;
  }else if(status==="interrupted"){
    entry.interruptedAt=entry.updatedAt;
    // 중단은 세션 종료가 아니다. 이어서 풀기를 위해 endedAt은 비워둔다.
    entry.endedAt=null;
  }

  const existing=sessions.findIndex(s=>s.id===entry.id);
  if(existing>=0)sessions[existing]=entry;
  else sessions.unshift(entry);

  if(sessions.length>200)sessions=sessions.slice(0,200);
  quiz.sessionRecorded=!!finalize;
  save();
}

function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function parseMeaning(raw,quizMode=false){
  const map={"명":"n","동":"v","형":"adj","부":"adv","전":"prep","접":"conj","대":"pron","감":"interj","관":"art","조":"aux","한":"det","숙":"idiom",
             "n.":"n","v.":"v","adj.":"adj","adv.":"adv","prep.":"prep","conj.":"conj","pron.":"pron","interj.":"interj","art.":"art","aux.":"aux","det.":"det","idiom":"idiom"};
  const marker=/^(명|동|형|부|전|접|대|감|관|조|한|숙|n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|interj\.|art\.|aux\.|det\.|idiom)\s*(.*)$/;
  const parts=String(raw||"").split(/\s*\/\s*/);
  const pending=[],out=[];
  let lastPos="";

  for(const p0 of parts){
    const p=p0.trim();
    if(!p)continue;
    const m=p.match(marker);
    const explicit=m?(map[m[1]]||m[1]):"";
    const text=(m?(m[2]||""):p).trim();

    if(!text){
      if(explicit)pending.push(explicit);
      continue;
    }

    let pos="";
    if(pending.length){
      pos=pending.shift();
      // 원문에서 뒤늦게 등장한 품사 표기는 다음 의미에 적용한다.
      if(explicit && explicit!==pos)pending.push(explicit);
    }else if(explicit){
      pos=explicit;
    }else{
      pos=lastPos;
    }

    if(!pos)pos="";
    if(quizMode && !/[가-힣]/.test(text) && /[A-Za-z]/.test(text))continue;
    out.push({pos,text});
    if(pos)lastPos=pos;
  }

  // 같은 품사가 연속되는 경우 한 줄로 합친다.
  const merged=[];
  for(const row of out){
    const prev=merged[merged.length-1];
    if(prev && prev.pos===row.pos){
      prev.text += "; " + row.text;
    }else{
      merged.push({...row});
    }
  }
  return merged;
}

function renderMeaning(raw,quizMode=false){
  const arr=parseMeaning(raw,quizMode);
  return `<div class="meaningBlock">${arr.map(x=>`<div class="posLine">${x.pos?`<span class="posTag">${esc(x.pos)}.</span>`:""}<span>${esc(x.text)}</span></div>`).join("")}</div>`;
}

function recordAnswer(w,ok,timeout=false){
  let s=getStats(w.id);s.total++;if(ok){s.correct++;s.streak=Math.min(3,s.streak+1)}else{s.wrong++;s.streak=0}if(timeout)s.timeout++;s.last=new Date().toISOString();
  if(s.streak>=3)delete wrong[w.id];else wrong[w.id]=true;
  const k=todayKey(); if(!daily[k])daily[k]={quiz:0,correct:0,wrong:0,timeout:0};
  daily[k].quiz++; if(ok)daily[k].correct++; else daily[k].wrong++; if(timeout)daily[k].timeout++;
  save()
}
function openDetail(id){
  const w=words.find(x=>x.id===Number(id)); if(!w)return;
  const st=getStats(w.id), me=getStudy(w.id);
  const fromQuiz = !!quiz;
  // 퀴즈에서 진입했다는 사실은 타이머의 실행 여부와 무관하게 보존한다.
  // 정답/오답 팝업에서는 이미 타이머가 멈춰 있으므로 기존 코드처럼
  // timer가 있을 때만 pausedForDetail을 설정하면 '퀴즈로 돌아가기'가
  // 다음 문제로 이동하지 못한다.
  if(quiz){
    quiz.pausedForDetail=true;
    if(quiz.timer){ clearInterval(quiz.timer); quiz.timer=null; }
  }

  document.getElementById("app").innerHTML=`<div class="card">
    <div class="detailWord">${esc(w.word)}</div>
    <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 발음 듣기</button>
    ${renderMeaning(w.meaning,true)}
    ${w.example?`<div class="example"><b>Example</b><div>${esc(w.example)}</div><div class="translation">${esc(w.translation)}</div></div>`:""}
    <div class="studyBox"><h3>📝 My Study</h3><p><small>원본 단어 데이터는 수정하지 않으며, 아래 내용은 개인 학습 데이터로만 저장됩니다.</small></p>
      <div class="studyItem"><div class="studyLabel">CHUNK</div>${me.chunks.length?me.chunks.map((c,i)=>`<div style="margin-top:7px">${esc(c)} <button class="miniBtn" onclick="removeChunk(${w.id},${i})">삭제</button></div>`).join(""):"<small>공부하면서 필요한 Chunk를 직접 추가하세요.</small>"}
      <div class="studyActions"><input id="chunkInput" placeholder="예: refer to A as B"><button class="miniBtn" onclick="addChunk(${w.id})">추가</button></div></div>
      <div class="studyItem"><div class="studyLabel">MEMO</div><textarea id="noteInput" rows="3" placeholder="나만의 메모">${esc(me.notes||"")}</textarea><button class="miniBtn" style="margin-top:8px" onclick="saveNote(${w.id})">메모 저장</button></div>
    </div>
    ${fromQuiz
      ? `<button class="btn" onclick="returnToQuizFromDetail()">퀴즈로 돌아가기</button>`
      : `<button class="btn secondary" onclick="renderHome()">홈으로</button>`}
  </div>
  <div class="card"><h3>학습 기록</h3><div class="grid">
    <div class="stat"><div class="num">${st.total}</div><div class="label">출제</div></div>
    <div class="stat"><div class="num">${st.correct}</div><div class="label">정답</div></div>
    <div class="stat"><div class="num">${st.wrong}</div><div class="label">오답</div></div>
    <div class="stat"><div class="num">${st.timeout}</div><div class="label">시간초과</div></div>
  </div><p><small>마지막 학습: ${st.last?new Date(st.last).toLocaleString("ko-KR"):"없음"} · 연속 정답: ${st.streak}</small></p></div>`;
}

function returnToQuizFromDetail(){
  if(!quiz) return renderHome();

  const wasPaused=!!quiz.pausedForDetail;
  const answered=!!(quiz.locked && quiz.current);

  quiz.pausedForDetail=false;

  // 정답/오답 팝업에서 단어 상세로 들어온 경우:
  // 해당 문제는 이미 답변을 완료했으므로 '퀴즈로 돌아가기'는
  // 별도의 답변 결과 화면을 다시 보여주지 않고 바로 다음 문제로 이동한다.
  if(wasPaused && answered){
    quiz.locked=false;
    quiz.current=null;
    quiz.index++;
    if(quiz.timer){clearInterval(quiz.timer);quiz.timer=null;}
    if(quiz.index>=quiz.pool.length)return showResult();
    showQuestion();
    return;
  }

  // 아직 답하지 않은 문제에서 상세로 들어온 경우에는 현재 문제를 유지한다.
  showQuestion();
}

function renderAnsweredQuestion(){
  const w=quiz.current.w, selected=quiz.current.selected, ok=quiz.current.ok, timeout=quiz.current.timeout;
  document.getElementById("app").innerHTML=`<div class="progress">${quiz.index+1} / ${quiz.pool.length}</div>
  <div class="quizword"><div class="word">${esc(w.word)}</div><button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 발음 듣기</button></div>
  <div class="card">
    ${ok
      ? `<div class="correctAnswer"><span>✓ 정답</span><strong>${esc(w.meaning)}</strong></div>`
      : timeout
        ? `<div class="timeoutMsg">제한 시간 안에 답을 선택하지 못했어요.</div>
           <div class="correctAnswer"><span>✓ 정답</span><strong>${esc(w.meaning)}</strong></div>`
        : `<div class="myAnswer">내 선택: ${esc(selected)}</div>
           <div class="correctAnswer"><span>✓ 정답</span><strong>${esc(w.meaning)}</strong></div>`}
    <button class="btn" onclick="continueQuizAfterDetail()">다음 문제</button>
    <button class="btn secondary" onclick="openDetail(${w.id})">단어 상세 보기</button>
  </div>`;
}

function continueQuizAfterDetail(){
  if(!quiz) return renderHome();
  quiz.locked=false;
  quiz.index++;
  showQuestion();
}

function addChunk(id){const v=document.getElementById("chunkInput").value.trim();if(!v)return;getStudy(id).chunks.push(v);save();openDetail(id)}
function removeChunk(id,i){getStudy(id).chunks.splice(i,1);save();openDetail(id)}
function saveNote(id){getStudy(id).notes=document.getElementById("noteInput").value;save();toast("메모를 저장했어요.")}

  document.getElementById("app").innerHTML=`<div class="card"><h2>오늘의 학습</h2><div class="grid">
    <div class="stat"><div class="num">${words.length}</div><div class="label">전체 단어</div></div>
    <div class="stat"><div class="num">${d.quiz}</div><div class="label">오늘 학습량</div></div>
    <div class="stat"><div class="num">${pct}%</div><div class="label">오늘 정답률</div></div>
  </div>
  <button class="btn" onclick="openQuizSetup('all')">전체 랜덤 퀴즈</button>
  <button class="btn secondary" onclick="openQuizSetup('wrong')">틀린 단어 다시 풀기</button></div>

  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleWordbook()">
      <div><h2 style="margin:0">📚 단어장</h2><small>MAIN 2,500 · Supplement ${supCount}</small></div>
      <span id="wordbookArrow" style="font-size:22px">▸</span>
    </div>
    <div id="wordbookBody" style="display:none;margin-top:14px">
      <div class="subsectionTitle">MAIN · DAY 01~50</div>
      ${days.map(d=>`<div class="day"><div><b>DAY ${d}</b><br><small>${words.filter(w=>w.source==="MAIN"&&w.day===d).length} 단어</small></div><button class="btn" style="width:auto;margin:0;padding:10px 14px" onclick="openQuizSetup('day','${d}')">퀴즈</button></div>`).join("")}
      <div class="subsectionTitle" style="margin-top:18px">SUPPLEMENT</div>
      <div class="day"><div><b>부록</b><br><small>· ${supCount} 단어</small></div><button class="btn" style="width:auto;margin:0;padding:10px 14px" onclick="openQuizSetup('all')">전체 퀴즈에서 학습</button></div>
